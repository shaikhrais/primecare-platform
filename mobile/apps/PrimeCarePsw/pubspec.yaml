name: primecare_psw
description: "PrimeCare PSW — Cross-platform field worker app for Personal Support Workers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Navigation
  go_router: ^14.8.0
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Networking
  dio: ^5.7.0
  # Local Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4
  # Location & Maps
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  # Biometric Auth
  local_auth: ^2.3.0
  # Camera & Images
  image_picker: ^1.1.2
  # Push Notifications
  firebase_core: ^3.9.0
  firebase_messaging: ^15.2.0
  # UI Helpers
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  intl: ^0.19.0
  # Haptics
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
