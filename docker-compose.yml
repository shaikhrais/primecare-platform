version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: primecare-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: primecare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api_gateway:
    build:
      context: .
      dockerfile: services/service.Dockerfile
      args:
        SERVICE_PATH: services/api_gateway
    container_name: primecare-gateway
    ports:
      - "8700:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: primecare
      DB_USER: postgres
      DB_PASSWORD: password
      AUTH_SERVICE_URL: http://auth_api:8080
      VERIFICATION_SERVICE_URL: http://verification_api:8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  verification_api:
    build:
      context: .
      dockerfile: services/service.Dockerfile
      args:
        SERVICE_PATH: services/verification_api
    container_name: primecare-verification
    ports:
      - "8800:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: primecare
      DB_USER: postgres
      DB_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  auth_api:
    build:
      context: .
      dockerfile: services/service.Dockerfile
      args:
        SERVICE_PATH: services/auth_api
    container_name: primecare-auth
    ports:
      - "8081:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: primecare
      DB_USER: postgres
      DB_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  governance_api:
    build:
      context: .
      dockerfile: services/service.Dockerfile
      args:
        SERVICE_PATH: services/governance_api
    container_name: primecare-governance
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: primecare
      DB_USER: postgres
      DB_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  billing_api:
    build:
      context: .
      dockerfile: services/service.Dockerfile
      args:
        SERVICE_PATH: services/billing_api
    container_name: primecare-billing
    ports:
      - "8082:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: primecare
      DB_USER: postgres
      DB_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client_api:
    build:
      context: .
      dockerfile: services/service.Dockerfile
      args:
        SERVICE_PATH: services/client_api
    container_name: primecare-client
    ports:
      - "8083:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: primecare
      DB_USER: postgres
      DB_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  provider_api:
    build:
      context: .
      dockerfile: services/service.Dockerfile
      args:
        SERVICE_PATH: services/provider_api
    container_name: primecare-provider
    ports:
      - "8088:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: primecare
      DB_USER: postgres
      DB_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
