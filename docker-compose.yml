version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: primecare-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: primecare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-api:
    build:
      context: ./apps/worker-api
      dockerfile: Dockerfile
    container_name: primecare-api
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/primecare
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web-admin:
    build:
      context: ./apps/web-admin
      dockerfile: Dockerfile
    container_name: primecare-admin
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8787
    depends_on:
      - worker-api
    restart: unless-stopped

volumes:
  pgdata:
