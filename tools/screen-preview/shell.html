</style></head><body><header class="preview-toolbar"><strong>PrimeCare Preview</strong><label>Role<select id="role"><option value="">All roles</option></select></label><label>Find a screen<input id="find" type="search" placeholder="Name, route or code"></label><label>Screen<select id="screen"></select></label><label>Scenario<select id="scenario"><option value="populated">Populated demo</option><option value="empty">Empty</option><option value="loading">Slow response</option><option value="error">Service error</option><option value="denied">Access denied</option></select></label><button id="previous">←</button><button id="next">→</button><button id="gallery-open">All screens</button><button id="advance">Next traffic window</button><button id="reset">Reset demo</button><button id="export">Export coverage</button></header><div class="preview-banner"><span><strong>ISOLATED PREVIEW</strong> · Synthetic data only · No production connection · Changes stay in memory</span><span id="coverage"></span><span id="notice" role="status"></span></div><iframe id="frame" title="PrimeCare isolated screen preview" sandbox="allow-scripts allow-same-origin allow-downloads"></iframe><dialog id="gallery"><h2>All registered screen previews</h2><p>Actual renderer views and registry-based structural previews are labelled separately.</p><button id="gallery-close">Close</button><div class="catalog-scroll"><table><thead><tr><th>Screen</th><th>Role</th><th>Coverage</th><th>Route</th></tr></thead><tbody id="catalog"></tbody></table></div></dialog><script>

selector.onchange=()=>openScreen(selector.value);role.onchange=find.oninput=choices;scenario.onchange=()=>openScreen(active.code,true);document.querySelector('#previous').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#advance').onclick=()=>frame.contentWindow.PreviewFrame?.advance();document.querySelector('#reset').onclick=()=>frame.contentWindow.PreviewFrame?.reset();document.querySelector('#export').onclick=exportCoverage;document.querySelector('#gallery-close').onclick=()=>document.querySelector('#gallery').close();document.querySelector('#gallery-open').onclick=()=>{const body=document.querySelector('#catalog');body.replaceChildren();for(const s of filtered()){const tr=body.insertRow(),button=document.createElement('button');button.textContent=s.name;button.onclick=()=>{document.querySelector('#gallery').close();openScreen(s.code);};tr.insertCell().append(button);for(const value of [s.role,s.kind==='admin'?'Actual renderer':'Registry template',s.route])tr.insertCell().textContent=value;}document.querySelector('#gallery').showModal();};globalThis.addEventListener('popstate',()=>{const code=new URLSearchParams(globalThis.location.hash.slice(1)).get('screen');if(byCode.has(code))openScreen(code,true);});
