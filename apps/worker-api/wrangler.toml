name = "primecare-api"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = [ "nodejs_compat" ]

[vars]
ENVIRONMENT = "production"
# DATABASE_URL = "" (Set via secrets)

[env.staging]
name = "primecare-api-staging"
r2_buckets = [
  { binding = "DOCS_BUCKET", bucket_name = "primecare-docs-staging" }
]
[env.staging.vars]
ENVIRONMENT = "staging"

[env.testing]
name = "primecare-api-testing"
[env.testing.vars]
ENVIRONMENT = "testing"

[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "primecare-docs"

[durable_objects]
bindings = [
  { name = "CHAT_SERVER", class_name = "ChatServer" },
  { name = "REALTIME_SYNC", class_name = "RealtimeSync" }
]

[[migrations]]
tag = "v1"
new_classes = ["ChatServer"]

[[migrations]]
tag = "v2"
new_classes = ["RealtimeSync"]

# Keep worker warm — prevent Prisma cold start crashes
[triggers]
crons = ["* * * * *"]
