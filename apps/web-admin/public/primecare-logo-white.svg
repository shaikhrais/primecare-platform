<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <!-- PrimeCare Logo - White version for dark backgrounds -->
  <!-- Heart + Cross Icon -->
  <g transform="translate(5, 5)">
    <!-- Heart shape -->
    <path d="M20 35 C20 35, 5 25, 5 15 C5 8, 10 5, 15 5 C18 5, 20 8, 20 11 C20 8, 22 5, 25 5 C30 5, 35 8, 35 15 C35 25, 20 35, 20 35Z" fill="white" opacity="0.9"/>
    <!-- Medical cross -->
    <rect x="16" y="12" width="8" height="18" rx="1.5" fill="#3B82F6"/>
    <rect x="11" y="17" width="18" height="8" rx="1.5" fill="#3B82F6"/>
  </g>
  <!-- PrimeCare Text -->
  <text x="48" y="33" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="white">
    <tspan fill="white">Prime</tspan><tspan fill="#3B82F6">Care</tspan>
  </text>
</svg>
