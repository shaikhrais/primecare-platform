<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PrimeCare Corporate Portal">
  <title>PrimeCare Corporate</title>
  <style>
    body { background-color: #0F172A; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; }
    #loading { text-align: center; transition: opacity 0.5s ease-out; }
    .spinner { border: 4px solid rgba(255, 255, 255, 0.1); border-top: 4px solid #3B82F6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .brand { font-weight: 900; letter-spacing: 4px; font-size: 24px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="brand">PRIMECARE</div>
    <div style="margin-top: 10px; color: #64748B; font-size: 12px; letter-spacing: 2px;">INITIALIZING SECURE SESSION...</div>
  </div>
  <script>
    // Enforce HTML renderer for Cloudflare compatibility
    window.flutterWebRenderer = "html";
    
    // Auto-remove loading screen after app loads
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(function() { loading.remove(); }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
