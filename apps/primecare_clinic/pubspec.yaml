name: primecare_clinic
description: "PrimeCare App"
publish_to: 'none'
version: 1.0.2+3
environment:
  sdk: ^3.11.3
dependencies:
  primecare_models:
    path: ../../packages/primecare_models
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  go_router: ^17.1.0
  shared_preferences: ^2.5.5
  flutter_riverpod: ^3.3.1
  flutter_dotenv: ^6.0.0
  google_fonts: ^8.0.2
  dio: ^5.9.2
  easy_localization: ^3.0.8
  lucide_icons_flutter: ^3.1.14+2
  fl_chart: ^1.2.0
  flutter_core:
    path: ../../packages/flutter_core
  primecare_ui:
    path: ../../packages/primecare_ui
  freezed_annotation: 3.1.0
  flutter_driver:
    sdk: flutter
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: 3.2.5
  build_runner: ^2.15.0
flutter:
