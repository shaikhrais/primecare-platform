pages:
  - id: "create_user_form"
    route: "/admin/create-user"
    name: "CreateUserForm"
    role_allowed: ["admin_portal"]
    actions: ["submit", "cancel"]
    linked_intent: "user_management.create_user"

  - id: "password_reset_form"
    route: "/admin/reset-password"
    name: "PasswordResetForm"
    role_allowed: ["admin_portal"]
    actions: ["submit", "cancel"]
    linked_intent: "user_management.reset_password"

  - id: "live_dispatch_map"
