blueprints:
  - id: "blueprint.dashboard.standard"
    name: "Standard Institutional Dashboard"
    description: "A high-fidelity layout for institutional oversight, featuring KPI grids and role-based navigation."
    required_components:
      - id: "shell.responsive_sidebar"
        contract: "must_provide_navigation_links"
      - id: "shell.app_bar"
        contract: "must_provide_identity_and_search"
      - id: "layout.kpi_grid"
        contract: "must_scale_to_resolution_tier"
      - id: "hud.telemetry_overlay"
        contract: "must_report_behavioral_telemetry"
    scaling_rules:
      mobile: "1-column KPI, minimized sidebar"
      desktop: "4-column KPI, fixed sidebar"
      mega: "6-column KPI, density-optimized sidebar"

  - id: "blueprint.form.clinical"
    name: "Standard Clinical Data Entry"
    description: "A validation-heavy form layout for patient and medical record intake."
    required_components:
      - id: "form.header"
        contract: "must_show_patient_context"
      - id: "form.grid"
        contract: "must_use_responsive_row_logic"
      - id: "form.actions"
        contract: "must_provide_save_and_cancel_with_audit"
    audit_requirements:
      - "capture_field_delta_on_save"
      - "report_form_abandonment"

  - id: "blueprint.list.audit"
    name: "Audit-Ready Tabular List"
    description: "A sortable, searchable list optimized for compliance review."
    required_components:
      - id: "list.filters"
        contract: "must_support_date_and_role_filtering"
      - id: "list.table"
        contract: "must_enforce_column_parity_with_registry"
      - id: "list.pagination"
        contract: "must_use_infinite_scroll_adapter"

registries:
  - id: "registry.auditor"
    description: "Global registry for mapping screens to blueprints."
    mapped_blueprints:
      - screen_id: "clinical.clinical_director.dashboard"
        blueprint_id: "blueprint.dashboard.standard"
        completion_percent: 100
        office: "Clinical Governance"
      - screen_id: "clinical.clinical_director.reports"
        blueprint_id: "blueprint.list.audit"
        completion_percent: 45
        office: "Clinical Analytics"
      - screen_id: "corporate.ceo.dashboard"
        blueprint_id: "blueprint.dashboard.standard"
        completion_percent: 85
        office: "Executive Office"
      - screen_id: "clinical.psw.dashboard"
        blueprint_id: "blueprint.dashboard.standard"
        completion_percent: 92
        office: "Frontline Operations"
      - screen_id: "clinical.psw.shift_tracker"
        blueprint_id: "blueprint.dashboard.standard"
        completion_percent: 15
        office: "Frontline Operations"
      - screen_id: "clinical.psw.tasks"
        blueprint_id: "blueprint.list.audit"
        completion_percent: 65
        office: "Frontline Operations"
      - screen_id: "clinical.intake.patient_intake_form"
        blueprint_id: "blueprint.form.clinical"
        completion_percent: 75
        office: "Admissions"
      - screen_id: "corporate.cfo.dashboard"
        blueprint_id: "blueprint.dashboard.standard"
        completion_percent: 25
        office: "Executive Office"
      - screen_id: "corporate.cto.dashboard"
        blueprint_id: "blueprint.dashboard.standard"
        completion_percent: 30
        office: "Executive Office"
