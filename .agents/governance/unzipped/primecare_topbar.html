<header class="pc-topbar" data-testid="app-topbar">
  <div class="pc-topbar-left">
    <div class="pc-breadcrumb" data-testid="breadcrumb">{{breadcrumb_path}}</div>
    <div class="pc-topbar-title-row">
      <h1 class="pc-screen-title" data-testid="screen-title">{{screen_title}}</h1>
      <span class="pc-role-badge" data-testid="role-badge">{{role_name}}</span>
    </div>
  </div>

  <div class="pc-topbar-actions">
    {{#topbar_items}}
    {{#is_search}}
    <div class="pc-global-search" data-testid="topbar-global-search" data-feature="global_search">🔎 {{placeholder_text}}</div>
    {{/is_search}}
    {{^is_search}}
    <button class="pc-topbar-button" data-testid="topbar-{{item_code}}" data-action="{{action_type}}" data-feature="{{feature_code}}">
      {{item_icon}} {{item_label}}
    </button>
    {{/is_search}}
    {{/topbar_items}}
    <div class="pc-profile-avatar" data-testid="topbar-profile-avatar">{{user_initials}}</div>
  </div>
</header>
