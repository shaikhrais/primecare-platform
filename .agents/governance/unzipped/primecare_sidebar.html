<aside class="pc-sidebar" data-testid="app-sidebar">
  <div class="pc-sidebar-brand">
    <div class="pc-brand-logo">{{app_short_code}}</div>
    <div>
      <div class="pc-brand-title">{{app_name}}</div>
      <div class="pc-brand-subtitle">{{role_name}}</div>
    </div>
  </div>

  {{#sidebar_groups}}
  <div class="pc-sidebar-group">
    <div class="pc-sidebar-group-title">{{group_label}}</div>
    {{#items}}
    <a href="{{route_path}}" class="pc-sidebar-link {{active_class}}" data-testid="sidebar-link-{{item_code}}" data-route="{{route_path}}" data-screen="{{screen_code}}">
      <span class="pc-sidebar-icon">{{item_icon}}</span>
      <span class="pc-sidebar-label">{{item_label}}</span>
    </a>
    {{/items}}
  </div>
  {{/sidebar_groups}}

  <div class="pc-sidebar-footer">
    <span class="pc-shell-status-dot"></span>
    <span>Shell loaded</span>
  </div>
</aside>
