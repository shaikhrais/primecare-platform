name = "primecare-api-gateway"
main = "src/index.ts"
compatibility_date = "2024-03-20"
compatibility_flags = [ "nodejs_compat" ]

# Service Bindings linking to internal Microservices
services = [
  { binding = "AUTH_SERVICE", service = "primecare-auth-service" },
  { binding = "PROVIDER_SERVICE", service = "primecare-provider-service" },
  { binding = "CLIENT_SERVICE", service = "primecare-client-service" },
  { binding = "SCHEDULING_SERVICE", service = "primecare-scheduling-service" },
  { binding = "VISIT_SERVICE", service = "primecare-visit-service" },
  { binding = "NOTES_SERVICE", service = "primecare-notes-service" },
  { binding = "BILLING_SERVICE", service = "primecare-billing-service" },
  { binding = "NOTIFICATION_SERVICE", service = "primecare-notification-service" },
  { binding = "COMPLIANCE_SERVICE", service = "primecare-compliance-service" },
  { binding = "FRANCHISE_REPORTING_SERVICE", service = "primecare-franchise-reporting-service" },
]

[dev]
port = 8700

