name: flutter_core
description: "PrimeCare App"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.11.3
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  go_router: ^17.1.0
  shared_preferences: ^2.5.5
  flutter_riverpod: ^3.3.1
  flutter_dotenv: ^6.0.0
  google_fonts: ^8.0.2
  dio: ^5.9.2
  easy_localization: ^3.0.8
  lucide_icons: ^0.257.0
  connectivity_plus: ^6.1.4
  fl_chart: ^1.2.0
  equatable: ^2.0.5
  riverpod_annotation: any
  primecare_ui:
    path: ../factory_system/primecare_ui
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  intl: ^0.20.2
dev_dependencies:
  build_runner: any
  riverpod_generator: any
  go_router_builder: any
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0
flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/data/
