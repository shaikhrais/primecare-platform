name: primecare_device_security
description: Existing on-device security services and protective action checks.
version: 1.0.0
publish_to: none
environment:
  sdk: ^3.11.3
dependencies:
  primecare_auth_storage:
    path: ../primecare_auth_storage
  primecare_logging:
    path: ../primecare_logging
  primecare_security_models:
    path: ../primecare_security_models
  primecare_session_watchdog:
    path: ../primecare_session_watchdog
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  safe_device: ^1.3.10
  local_auth: ^3.0.1
  local_auth_android: any
  local_auth_darwin: any
  screen_protector: ^1.5.1
  device_info_plus: any
dev_dependencies:
  flutter_test:
    sdk: flutter
