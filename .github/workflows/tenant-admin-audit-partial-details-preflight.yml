name: Tenant administration audit partial-detail prototype preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tenant-admin-audit-partial-details-preflight.yml
      - tests/fixtures/tenant-admin-audit-partial-details/partial-details.patch
      - scripts/test-tenant-administration-audit-partial-postgres.mjs
      - scripts/test-tenant-administration-audit-partial-view.mjs
      - scripts/test-tenant-administration-audit-partial-chromium.mjs
permissions: {contents: read}
concurrency:
  group: tenant-admin-audit-partial-details-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: platform_audit_test, POSTGRES_USER: fixture, POSTGRES_PASSWORD: fixture-only}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U fixture" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Apply held candidates only in disposable checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git apply --check --whitespace=error-all tests/fixtures/tenant-admin-audit-safe-details/projection-and-view.patch
          git apply --whitespace=error-all tests/fixtures/tenant-admin-audit-safe-details/projection-and-view.patch
          git apply --check --whitespace=error-all tests/fixtures/tenant-admin-audit-partial-details/partial-details.patch
          git apply --whitespace=error-all tests/fixtures/tenant-admin-audit-partial-details/partial-details.patch
          git diff --check
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/audit-prototype-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 pg@8.16.3 bcryptjs@3.0.2
          ln -s "$RUNNER_TEMP/audit-prototype-tools/node_modules" node_modules
      - name: Preserve strict regressions and test explicit legacy detail
        run: |
          env -i PATH="$PATH" HOME="$HOME" GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" PLATFORM_TEST_DATABASE_URL=postgresql://fixture:fixture-only@127.0.0.1:5432/platform_audit_test node --test scripts/test-tenant-administration-audit-safe-projection-postgres.mjs
          env -i PATH="$PATH" HOME="$HOME" GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" PLATFORM_TEST_DATABASE_URL=postgresql://fixture:fixture-only@127.0.0.1:5432/platform_audit_test node --test scripts/test-tenant-administration-audit-partial-postgres.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-admin-audit-partial-native-postgres-summary
          path: |
            test-results/tenant-administration-audit/safe-api-summary.json
            test-results/tenant-administration-audit-partial-details/summary.json
          if-no-files-found: error
          retention-days: 7
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Apply held candidates only in disposable checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git apply --check --whitespace=error-all tests/fixtures/tenant-admin-audit-safe-details/projection-and-view.patch
          git apply --whitespace=error-all tests/fixtures/tenant-admin-audit-safe-details/projection-and-view.patch
          git apply --check --whitespace=error-all tests/fixtures/tenant-admin-audit-partial-details/partial-details.patch
          git apply --whitespace=error-all tests/fixtures/tenant-admin-audit-partial-details/partial-details.patch
          git diff --check
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/audit-prototype-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2
          ln -s "$RUNNER_TEMP/audit-prototype-tools/node_modules" node_modules
      - name: Preserve strict regressions and test explicit legacy detail
        run: |
          env -i PATH="$PATH" HOME="$HOME" GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" node --test scripts/test-tenant-administration-audit-presentation-diagnostic.mjs scripts/test-tenant-administration-audit-safe-details.mjs scripts/test-tenant-administration-audit-partial-view.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-admin-audit-partial-renderer-summary
          path: |
            test-results/tenant-administration-audit/presentation-summary.json
            test-results/tenant-administration-audit/safe-presentation-summary.json
            test-results/tenant-administration-audit-partial-details/view-summary.json
          if-no-files-found: error
          retention-days: 7
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: platform_audit_browser_test, POSTGRES_USER: fixture, POSTGRES_PASSWORD: fixture-only}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U fixture" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Apply held candidates only in disposable checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git apply --check --whitespace=error-all tests/fixtures/tenant-admin-audit-safe-details/projection-and-view.patch
          git apply --whitespace=error-all tests/fixtures/tenant-admin-audit-safe-details/projection-and-view.patch
          git apply --check --whitespace=error-all tests/fixtures/tenant-admin-audit-partial-details/partial-details.patch
          git apply --whitespace=error-all tests/fixtures/tenant-admin-audit-partial-details/partial-details.patch
          git diff --check
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/audit-prototype-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 pg@8.16.3 bcryptjs@3.0.2 playwright@1.60.0 @twilio/voice-sdk@2.18.5
          ln -s "$RUNNER_TEMP/audit-prototype-tools/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Preserve strict regressions and test explicit legacy detail
        run: |
          env -i PATH="$PATH" HOME="$HOME" GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" PLATFORM_TEST_DATABASE_URL=postgresql://fixture:fixture-only@127.0.0.1:5432/platform_audit_browser_test node scripts/test-tenant-administration-audit-chromium.mjs
          env -i PATH="$PATH" HOME="$HOME" GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" PLATFORM_TEST_DATABASE_URL=postgresql://fixture:fixture-only@127.0.0.1:5432/platform_audit_browser_test node scripts/test-tenant-administration-audit-partial-chromium.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-admin-audit-partial-chromium-summary
          path: |
            test-results/tenant-administration-audit-chromium/summary.json
            test-results/tenant-administration-audit-partial-chromium/summary.json
          if-no-files-found: error
          retention-days: 7
