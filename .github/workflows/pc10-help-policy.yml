name: Register approved Help quota and audit definitions
on:
  push:
    branches: [main]
    paths:
      - 'tools/governance-production/pc10-help-policy*'
      - 'scripts/test-pc10-help-policy.mjs'
      - '.github/workflows/pc10-help-policy.yml'
permissions: {contents: read}
concurrency:
  group: pc10-help-operational-policy-registration
  cancel-in-progress: false
jobs:
  postgres-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: help_policy, POSTGRES_USER: postgres, POSTGRES_PASSWORD: fixture}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/help-policy-tools --ignore-scripts --no-audit --no-fund pg@8.16.3 @electric-sql/pglite@0.3.14
          ln -s /tmp/help-policy-tools/node_modules node_modules
          node --test scripts/test-pc10-help-policy.mjs
      - name: Repeat exact policy registration against PostgreSQL 16
        run: node --test scripts/test-pc10-help-policy.mjs
        env:
          HELP_POLICY_TEST_DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/help_policy
  production-registration:
    needs: postgres-proof
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/help-policy-tools --ignore-scripts --no-audit --no-fund pg@8.16.3
          ln -s /tmp/help-policy-tools/node_modules node_modules
      - name: Register exact approved definitions and independently read them back
        run: |
          node tools/governance-production/pc10-help-policy.mjs --plan
          node tools/governance-production/pc10-help-policy.mjs --apply
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTER_PC10_HELP_POLICY: '1'
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
