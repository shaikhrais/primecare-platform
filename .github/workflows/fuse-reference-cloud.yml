name: Render original Fuse skeleton reference in cloud
on:
  push:
    branches: [main]
    paths: ['tools/fuse-reference-cloud/**', '.github/workflows/fuse-reference-cloud.yml', 'packages/flutter_core/lib/theme/prime_theme_center.dart', 'packages/flutter_core/test/theme_center_number_test.dart', 'packages/flutter_core/lib/theme/theme_center_options_generated.dart', 'packages/flutter_core/lib/registry/widgets/theme_center_panel.dart', 'packages/flutter_core/test/theme_center_option_render_test.dart', 'packages/flutter_core/test/theme_center_options_test.dart', 'packages/flutter_core/test/screenshots/theme_center_capture_test.dart', 'packages/flutter_core/test/screenshots/skeleton_shell_capture_test.dart', 'packages/flutter_core/test/screenshots/sidebar_state_capture_test.dart', 'packages/flutter_core/lib/theme/prime_shell_metrics.dart', 'packages/flutter_core/lib/registry/widgets/governance_master_layout.dart', 'packages/flutter_core/test/presentation_palette_test.dart', 'packages/primecare_ui_foundation/lib/src/prime_settings_controls.dart', 'packages/primecare_ui_foundation/test/prime_settings_radio_test.dart']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read current portal stamps and verify static assets
        run: python tools/fuse-reference-cloud/live_manifest.py artifacts/live-portals.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-live-portal-integrity
          path: artifacts/live-portals.json
          retention-days: 30
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Extract supplied skeleton into temporary reference environment
        run: python3 tools/fuse-reference-cloud/prepare.py "$RUNNER_TEMP/fuse-reference"
      - name: Install original reference dependencies
        run: npm install --prefix "$RUNNER_TEMP/fuse-reference" --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Install capture browser
        run: |
          npm install --prefix "$RUNNER_TEMP/reference-capture" --ignore-scripts --no-audit --no-fund playwright@1.60.0
          ln -s "$RUNNER_TEMP/reference-capture/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Run original skeleton settings and capture real styles
        run: |
          cd "$RUNNER_TEMP/fuse-reference"
          node_modules/.bin/vite --config vite-reference.mts > "$GITHUB_WORKSPACE/reference-vite.log" 2>&1 &
          cd "$GITHUB_WORKSPACE"
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:4317/ > /dev/null && break || sleep 1; done
          node tools/fuse-reference-cloud/capture.mjs "$GITHUB_WORKSPACE/artifacts/fuse-reference"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-fuse-cloud-reference
          path: |
            artifacts/fuse-reference
            reference-vite.log
          retention-days: 14
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - name: Verify shared settings controls including enlarged text
        run: |
          flutter pub get
          flutter test --reporter expanded
        working-directory: packages/primecare_ui_foundation
      - run: flutter pub get
        working-directory: packages/flutter_core
      - name: Verify validation recovery and saved Theme Center behavior
        run: flutter test test/presentation_palette_test.dart test/theme_palette_parity_test.dart test/theme_center_options_test.dart test/theme_center_option_render_test.dart test/theme_center_number_test.dart test/theme_center_reference_test.dart test/theme_center_settings_file_test.dart test/theme_center_test.dart --reporter expanded
        working-directory: packages/flutter_core
      - name: Prepare all three native layout families
        run: python3 tools/fuse-reference-cloud/prepare_layout_capture.py packages/flutter_core/test/screenshots/generated_layout_capture_test.dart
      - name: Render PrimeCare shared Dart panels for direct comparison
        run: flutter test --update-goldens test/screenshots/generated_layout_capture_test.dart --reporter expanded
        working-directory: packages/flutter_core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primecare-theme-cloud-comparison
          path: packages/flutter_core/test/screenshots/captures
          retention-days: 14
      - name: Capture actual native host fixture separately from matched-state acceptance
        run: flutter test --update-goldens test/screenshots/skeleton_shell_capture_test.dart test/screenshots/sidebar_state_capture_test.dart --reporter expanded
        working-directory: packages/flutter_core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primecare-full-shell-fixture
          path: |
            packages/flutter_core/test/screenshots/shell-captures
            packages/flutter_core/test/screenshots/sidebar-state-captures
          retention-days: 14
      - name: Capture original full-shell reference separately from settings
        run: node tools/fuse-reference-cloud/shell-capture.mjs "$GITHUB_WORKSPACE/artifacts/fuse-shell-reference"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-fuse-full-shell-reference
          path: artifacts/fuse-shell-reference
          retention-days: 14
