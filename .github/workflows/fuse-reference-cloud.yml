name: Render original Fuse skeleton reference in cloud
on:
  push:
    branches: [main]
    paths: ['tools/fuse-reference-cloud/**', '.github/workflows/fuse-reference-cloud.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Extract supplied skeleton into temporary reference environment
        run: python3 tools/fuse-reference-cloud/prepare.py "$RUNNER_TEMP/fuse-reference"
      - name: Install original reference dependencies
        run: npm install --prefix "$RUNNER_TEMP/fuse-reference" --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Install capture browser
        run: |
          npm install --prefix "$RUNNER_TEMP/reference-capture" --ignore-scripts --no-audit --no-fund playwright@1.60.0
          ln -s "$RUNNER_TEMP/reference-capture/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Run original skeleton settings and capture real styles
        run: |
          cd "$RUNNER_TEMP/fuse-reference"
          node_modules/.bin/vite --config vite-reference.mts > "$GITHUB_WORKSPACE/reference-vite.log" 2>&1 &
          cd "$GITHUB_WORKSPACE"
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:4317/ > /dev/null && break || sleep 1; done
          node tools/fuse-reference-cloud/capture.mjs "$GITHUB_WORKSPACE/artifacts/fuse-reference"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-fuse-cloud-reference
          path: |
            artifacts/fuse-reference
            reference-vite.log
          retention-days: 14
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/flutter_core
      - name: Render PrimeCare shared Dart panel for direct comparison
        run: flutter test --update-goldens test/screenshots/theme_center_capture_test.dart --reporter expanded
        working-directory: packages/flutter_core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primecare-theme-cloud-comparison
          path: packages/flutter_core/test/screenshots/captures
          retention-days: 14
