name: Architecture visuals
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'websites/**'
      - 'cloudflare/**'
      - '.agents/governance/governance.db'
      - 'tools/architecture/**'
      - '.github/workflows/architecture-visuals.yml'
permissions:
  contents: read
jobs:
  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated historical governance test fixture
        env:
          GOVERNANCE_ALLOW_SQLITE_FIXTURES: '1'
        run: python3 tools/governance-production/prepare-ci-fixture.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/architecture/requirements.txt
      - name: Build and validate architecture explorer
        env:
          ARCHIFY_CHROME: /usr/bin/google-chrome
        run: python tools/architecture/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primecare-architecture
          path: docs/architecture/generated/
          if-no-files-found: error
