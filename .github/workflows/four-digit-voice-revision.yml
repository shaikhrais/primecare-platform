name: Reconcile four-digit voice metadata without activation
on:
  push:
    branches: [main]
    paths:
      - 'tools/governance-production/four-digit-voice-revision.json'
      - 'tools/governance-production/four_digit_voice_revision.py'
      - 'tools/governance-production/test-four-digit-voice-revision.py'
      - '.github/workflows/four-digit-voice-revision.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: four-digit-voice-revision
  cancel-in-progress: false
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: communication_fixture
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: communication_registration_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U communication_fixture -d communication_registration_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Prove rollback, exact changes and grant preservation
        env:
          WORKFLOW_TEST_DATABASE_URL: postgres://communication_fixture:disposable-only@localhost:5432/communication_registration_test
        run: python tools/governance-production/test-four-digit-voice-revision.py
  reconcile:
    needs: isolated
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix "$RUNNER_TEMP/four-digit-reader" --ignore-scripts pg@8.16.3
          ln -s "$RUNNER_TEMP/four-digit-reader/node_modules" node_modules
      - name: Exact metadata revision and independent readback
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_TWILIO_CONTRACT_REGISTRATION: '1'
          GOVERNANCE_FOUR_DIGIT_VOICE_REVISION: '1'
        run: |
          python tools/governance-production/four_digit_voice_revision.py --dry-run
          python tools/governance-production/four_digit_voice_revision.py --apply
          python tools/governance-production/four_digit_voice_revision.py --verify
