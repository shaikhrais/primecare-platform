name: Check existing workspace resource authority
on:
  push:
    branches: [main]
    paths: [.github/workflows/workspace-resource-authority.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
        run: |
          python -u - <<'PY'
          import sys,json,pathlib
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          out=pathlib.Path('test-results/workspace-authority');out.mkdir(parents=True,exist_ok=True)
          with ProductionWorkflowStore() as db:
           rows=db.execute("SELECT r.resource_key,l.language_code,v.translated_text,v.approved,v.reviewed FROM language_resources r JOIN language_resource_values v USING(resource_id) JOIN languages l USING(language_id) WHERE r.resource_key LIKE ? ORDER BY r.resource_key,l.language_code",('screenText.workspace.%',)).fetchall()
           expected=json.loads(pathlib.Path('packages/primecare_ui/lib/src/localization/screens/workspace.json').read_text())['locales']
           actual={locale:{} for locale in ['en','fr','es']}
           for key,locale,value,approved,reviewed in rows:
            if locale in actual:actual[locale][key.removeprefix('screenText.workspace.')]=value
           report={'registered_values':len(rows),'source_parity':actual==expected,'expected_values':sum(map(len,expected.values())),'approved_values':sum(v[3]==1 for v in rows),'reviewed_values':sum(v[4]==1 for v in rows),'rows':rows,'actor_grants_changed':False}
           (out/'workspace-resource-authority.json').write_text(json.dumps(report,indent=2))
          print('WORKSPACE_RESOURCE_AUTHORITY '+json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-resource-authority
          path: test-results/workspace-authority
      - name: Remove completed resource reader
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const {data:ref}=await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            const {data:commit}=await github.rest.git.getCommit({owner,repo,commit_sha:ref.object.sha});
            const {data:tree}=await github.rest.git.createTree({owner,repo,base_tree:commit.tree.sha,tree:[{path:'.github/workflows/workspace-resource-authority.yml',mode:'100644',type:'blob',sha:null}]});
            const {data:clean}=await github.rest.git.createCommit({owner,repo,message:'ops: remove completed workspace resource reader',tree:tree.sha,parents:[ref.object.sha]});
            await github.rest.git.updateRef({owner,repo,ref:'heads/main',sha:clean.sha,force:false});core.info('FINAL_MAIN_SHA '+clean.sha);
