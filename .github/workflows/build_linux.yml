name: Build Linux Distributions

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/**'
      - 'packages/**/lib/**'
      - 'packages/**/assets/**'
      - 'packages/**/pubspec*'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'melos.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/build_linux.yml'
  workflow_dispatch:

concurrency:
  group: native-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_linux:
    runs-on: ubuntu-22.04

    timeout-minutes: 45
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        app: 
          - primecare_business_development
          - primecare_client
          - primecare_clinic
          - primecare_corporate
          - primecare_franchise
          - primecare_marketing
          - primecare_support
          - primecare_governance
          - primecare_enterprise_blueprint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux Release for ${{ matrix.app }}
        run: |
          cd apps/${{ matrix.app }}
          flutter pub get
          flutter build linux --release

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/linux/x64/release/bundle/
