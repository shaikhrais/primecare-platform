name: Deploy PrimeCare Websites to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/flutter_core/**'
      - 'packages/primecare_ui/**'
      - '.github/workflows/cloudflare-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: primecare-cloudflare-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - primecare_business_development
          - primecare_client
          - primecare_clinic
          - primecare_corporate
          - primecare_franchise
          - primecare_marketing
          - primecare_support
          - primecare_governance
          - primecare_enterprise_blueprint
          - primecare_auth
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Verify Cloudflare configuration
        shell: bash
        run: |
          test -n "${CF_TOKEN}" || { echo "::error::Cloudflare API token is missing"; exit 1; }
          test -n "${CF_ACCOUNT}" || { echo "::error::Cloudflare account ID is missing"; exit 1; }

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Derive project name
        shell: bash
        run: |
          app="${{ matrix.app }}"
          echo "project_name=${app//_/-}" >> "${GITHUB_ENV}"

      - name: Build website
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons \
            --dart-define=SSO_PORTAL_URL=https://primecare-auth.pages.dev \
            --dart-define=APP_BASE_URL="https://${{ env.project_name }}.pages.dev"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          command: pages deploy apps/${{ matrix.app }}/build/web --project-name=${{ env.project_name }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
