name: Bootstrap first Code administrator
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CREATE_FIRST_CODE_ADMIN for the configured root tenant
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: primecare-code-admin-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/bootstrap-dependencies"
          npm install --prefix "$RUNNER_TEMP/bootstrap-dependencies" --ignore-scripts pg@8.16.3 bcryptjs@3.0.2
          ln -s "$RUNNER_TEMP/bootstrap-dependencies/node_modules" node_modules
      - name: Create first Code administrator without overwriting accounts
        env:
          CONFIRM_BOOTSTRAP: ${{ inputs.confirm }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BOOTSTRAP_CODE_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_CODE_ADMIN_EMAIL }}
          BOOTSTRAP_CODE_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_CODE_ADMIN_PASSWORD }}
          BOOTSTRAP_TENANT_ID: ${{ secrets.BOOTSTRAP_TENANT_ID }}
        run: node scripts/bootstrap-first-code-admin.mjs
