name: Inspect Clinic branch authority metadata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clinical-branch-authority-metadata.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-only:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.13'
      - name: Check schema shape without reading business records
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import json, os
          import psycopg

          dsn = os.environ.get("PRODUCTION_DATABASE_URL")
          if not dsn:
              raise SystemExit("Production secret not available to this protected job.")
          try:
              with psycopg.connect(dsn, connect_timeout=8) as conn:
                  conn.read_only = True
                  with conn.cursor() as cur:
                      cur.execute("SET LOCAL statement_timeout = '5000ms'")
                      cur.execute("SHOW transaction_read_only")
                      if cur.fetchone() != ("on",):
                          raise RuntimeError("read-only guard is not active")
                      cur.execute("""
                          WITH objects AS (
                            SELECT table_schema,table_name,
                              array_agg(column_name::text) AS cols
                            FROM information_schema.columns
                            WHERE table_schema NOT IN ('pg_catalog','information_schema')
                              AND table_schema NOT LIKE 'pg_temp%'
                            GROUP BY table_schema,table_name
                          ), likely AS (
                            SELECT *,
                              cols && ARRAY['branch_id','clinic_id','location_id','office_id'] AS has_location,
                              cols && ARRAY['user_id','staff_id','director_user_id','employee_id','provider_id'] AS has_actor
                            FROM objects
                          )
                          SELECT
                            count(*) FILTER (WHERE table_name IN ('branches','clinics','locations','offices') AND cols @> ARRAY['id','tenant_id']),
                            count(*) FILTER (WHERE has_location AND has_actor AND cols @> ARRAY['tenant_id']),
                            count(*) FILTER (WHERE table_name ~ '(branch|clinic|location|office)' AND has_location AND has_actor AND cols @> ARRAY['tenant_id']),
                            coalesce(bool_or(table_name='bookings' AND cols @> ARRAY['branch_id','tenant_id']),false),
                            coalesce(bool_or(table_name='users' AND cols @> ARRAY['id','roles','tenant_id']),false)
                          FROM likely
                      """)
                      result=cur.fetchone()
                      cur.execute("""
                          WITH columns AS (
                            SELECT table_name,column_name,data_type,is_nullable
                            FROM information_schema.columns WHERE table_schema='public'
                          ), primary_keys AS (
                            SELECT c.table_name,array_agg(k.column_name::text ORDER BY k.ordinal_position) AS cols
                            FROM information_schema.table_constraints c
                            JOIN information_schema.key_column_usage k
                              ON k.constraint_catalog=c.constraint_catalog AND k.constraint_schema=c.constraint_schema
                              AND k.constraint_name=c.constraint_name AND k.table_schema=c.table_schema AND k.table_name=c.table_name
                            WHERE c.table_schema='public' AND c.constraint_type='PRIMARY KEY'
                              AND c.table_name IN ('users','tenants')
                            GROUP BY c.table_name
                          )
                          SELECT
                            (SELECT count(*)=3 FROM columns WHERE (table_name,column_name)
                              IN (('users','id'),('users','tenant_id'),('tenants','id')) AND data_type='text' AND is_nullable='NO'),
                            (SELECT count(*)=2 FROM primary_keys WHERE cols=ARRAY['id']),
                            (SELECT count(*)=3 FROM columns WHERE (table_name,column_name) IN
                              (('users','status'),('users','roles'),('tenants','status'))),
                            (SELECT count(*)=3 FROM columns WHERE (table_name,column_name) IN
                              (('bookings','tenant_id'),('bookings','branch_id'),('bookings','start_at'))),
                            (SELECT count(DISTINCT table_name) FROM columns WHERE table_name IN
                              ('clinical_verified_branches','clinical_branch_grant_admins','clinical_branch_director_grants',
                               'clinical_branch_access_audit','clinical_branch_director_effective_scope'))
                      """)
                      compatibility = cur.fetchone()
                      conn.rollback()
              print(json.dumps(dict(zip(
                  ('visible_tenant_directory_candidates','visible_staff_location_candidates','visible_named_assignment_candidates','booking_branch_columns_visible','user_tenant_role_columns_visible'),
                  result
              )), sort_keys=True))
              print(json.dumps(dict(zip(
                  ('expected_text_identity_columns','required_primary_keys','identity_status_role_columns',
                   'booking_source_columns','existing_candidate_objects_visible'), compatibility
              )), sort_keys=True))
          except Exception:
              raise SystemExit("Metadata inspection failed; connection details and server messages suppressed.") from None
          PY
