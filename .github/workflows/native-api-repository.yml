name: Verify named repository forwarding
on:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_api_repository/**'
      - 'packages/flutter_core/lib/src/infrastructure/repositories/base_api_repository.dart'
      - '.github/workflows/native-api-repository.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - working-directory: packages/primecare_api_repository
        run: dart pub get
      - working-directory: packages/primecare_api_repository
        run: dart analyze
      - working-directory: packages/primecare_api_repository
        run: dart test
      - working-directory: packages/flutter_core
        run: flutter pub get
      - working-directory: packages/flutter_core
        run: flutter analyze --no-fatal-infos lib/src/infrastructure/repositories/base_api_repository.dart
