name: Register and migrate shared communication storage
on:
  push:
    branches: [main]
    paths:
      - 'tools/governance-production/communication-storage-registration.json'
      - 'tools/governance-production/communication_storage.py'
      - 'tools/governance-production/test-communication-storage.py'
      - 'packages/database/migrations/20261022_business_communications.sql'
      - '.github/workflows/communication-storage-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: communication-storage-production
  cancel-in-progress: false
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: communication_fixture
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: communication_registration_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U communication_fixture -d communication_registration_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Native registration, rollback, schema drift, tenant keys and grant preservation
        env:
          WORKFLOW_TEST_DATABASE_URL: postgres://communication_fixture:disposable-only@localhost:5432/communication_registration_test
        run: python tools/governance-production/test-communication-storage.py
  production:
    needs: isolated
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Validate and roll back exact metadata registration
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_COMMUNICATION_STORAGE_WRITES: '1'
        run: python tools/governance-production/communication_storage.py --register-dry-run
      - name: Commit exact schema design before creating business tables
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_COMMUNICATION_STORAGE_WRITES: '1'
        run: python tools/governance-production/communication_storage.py --register
      - name: Validate native DDL against committed registration and roll back
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_COMMUNICATION_STORAGE_WRITES: '1'
          GOVERNANCE_COMMUNICATION_STORAGE_MIGRATION: '1'
        run: python tools/governance-production/communication_storage.py --migrate-dry-run
      - name: Create and verify registered native storage without grants or content writes
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_COMMUNICATION_STORAGE_WRITES: '1'
          GOVERNANCE_COMMUNICATION_STORAGE_MIGRATION: '1'
        run: python tools/governance-production/communication_storage.py --migrate
      - name: Reread native schema in a fresh rolled-back transaction
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_COMMUNICATION_STORAGE_WRITES: '1'
          GOVERNANCE_COMMUNICATION_STORAGE_MIGRATION: '1'
        run: python tools/governance-production/communication_storage.py --migrate-dry-run
