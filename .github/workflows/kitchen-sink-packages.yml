name: Kitchen sink packages and master preview
on:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_kitchen_sink*/**'
      - 'packages/primecare_master/**'
      - 'tools/kitchen_sink/**'
      - 'examples/kitchen_sink_flutter/**'
      - '.github/workflows/kitchen-sink-packages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          pip install PyYAML==6.0.3
          python tools/kitchen_sink/generate.py --check
          python tools/package_master/catalog.py --check
          node --test tools/kitchen_sink/test_catalog.mjs tools/package_master/test_web_boundary.mjs packages/primecare_package_base/test/registry.test.mjs
          node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --resolveJsonModule --lib ES2022,DOM,DOM.Iterable packages/primecare_master/web/kitchen-sink.ts
          node tools/kitchen_sink/build.mjs
          node_modules/.bin/playwright install --with-deps chromium
          node tools/kitchen_sink/test_browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-sink-web-preview
          path: packages/primecare_kitchen_sink_web/dist
          if-no-files-found: error
          retention-days: 30
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - working-directory: packages/primecare_kitchen_sink
        run: |
          flutter pub get
          flutter analyze --fatal-infos lib test
          flutter test test/gallery_test.dart --reporter expanded
      - working-directory: examples/kitchen_sink_flutter
        run: |
          flutter pub get
          flutter analyze --fatal-infos lib
          flutter build web --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-sink-flutter-web-preview
          path: examples/kitchen_sink_flutter/build/web
          if-no-files-found: error
          retention-days: 30
