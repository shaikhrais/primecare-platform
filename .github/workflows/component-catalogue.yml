name: Shared component and feedback catalogue
on:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_ui/web/theme-control-base.ts'
      - 'packages/domain/src/component_catalogue.ts'
      - 'packages/shared/src/component-catalogue/**'
      - 'packages/primecare_ui/web/component-catalogue.ts'
      - 'packages/primecare_ui/catalogs/component-catalogue.registration.json'
      - 'packages/flutter_core/lib/component_catalogue*'
      - 'packages/flutter_core/lib/component_catalogue/**'
      - 'packages/flutter_core/test/component_catalogue/**'
      - 'packages/primecare_ui/lib/component_catalogue.dart'
      - 'scripts/*component-catalogue*.mjs'
      - 'scripts/audit-shared-skeleton-equivalents.py'
      - 'docs/appearance/shared-skeleton-equivalents.md'
      - 'tools/governance-production/test-metadata-store.py'
      - '.github/workflows/component-catalogue.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: component-catalogue-tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/catalogue-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 playwright@1.60.0
          ln -s /tmp/catalogue-tools/node_modules node_modules
          npx playwright install --with-deps chromium
          node scripts/test-component-catalogue-model.mjs
          node scripts/test-component-catalogue-browser.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable --resolveJsonModule packages/primecare_ui/web/component-catalogue.ts
      - run: |
          pip install -r tools/governance-production/requirements.txt
          python3 tools/governance-production/test-component-catalogue-registration.py
          python3 tools/governance-production/test-metadata-store.py
  native:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/flutter_core
      - run: flutter analyze --no-fatal-infos lib/component_catalogue lib/component_catalogue.dart test/component_catalogue
        working-directory: packages/flutter_core
      - run: flutter test test/component_catalogue --reporter expanded
        working-directory: packages/flutter_core
