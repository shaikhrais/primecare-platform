# Optional preview harness for the shared package; not a production auth dependency.
name: Preview Shared Auth (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-web.yml
    with:
      app: primecare_auth
      project: primecare-auth
    secrets: inherit
