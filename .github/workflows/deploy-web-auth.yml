name: Deploy Web - primecare-auth

on:
  push:
    branches: [main]
    paths:
      - 'apps/primecare_auth/**'
      - 'packages/flutter_core/**'
      - 'packages/primecare_ui/**'
      - '.github/workflows/deploy-web-auth.yml'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-web.yml
    with:
      app: primecare_auth
      project: primecare-auth
    secrets: inherit
