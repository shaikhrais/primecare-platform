name: Preview theme reconnect recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/theme-reconnect-preview.yml', '.github/fixtures/theme-reconnect.patch']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: psw_test, POSTGRES_PASSWORD: fixture-only, POSTGRES_DB: psw_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U psw_test -d psw_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PSW_TEST_DATABASE_URL: 'postgres://psw_test:fixture-only@127.0.0.1:5432/psw_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: git apply --check .github/fixtures/theme-reconnect.patch && git apply .github/fixtures/theme-reconnect.patch
      - run: npm ci --ignore-scripts
      - run: npm install --prefix /tmp/psw-tools --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14 bcryptjs@3.0.2
      - run: |
          test -e node_modules/bcryptjs || ln -s /tmp/psw-tools/node_modules/bcryptjs node_modules/bcryptjs
          mkdir -p node_modules/@electric-sql
          test -e node_modules/@electric-sql/pglite || ln -s /tmp/psw-tools/node_modules/@electric-sql/pglite node_modules/@electric-sql/pglite
          npx playwright install --with-deps chromium
      - run: node scripts/test-tenant-dashboard-theme-migration.mjs
