name: Build Android Distributions

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'cloudflare/**'
      - 'websites/typescript/**'
      - 'scripts/test-auth-*.mjs'
      - 'scripts/*auth*'
      - 'scripts/bootstrap-first-ceo.mjs'
      - '.github/workflows/verify-production-auth.yml'
      - 'scripts/check-auth-schema.mjs'
      - 'scripts/export-auth-openapi.py'
      - '.github/workflows/auth-worker-tests.yml'
      - '.github/workflows/auth-counter-cleanup.yml'
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: 
          - primecare_business_development
          - primecare_client
          - primecare_clinic
          - primecare_corporate
          - primecare_franchise
          - primecare_marketing
          - primecare_support
          - primecare_governance
          - primecare_enterprise_blueprint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android App Bundle (AAB)
        run: |
          cd apps/${{ matrix.app }}
          flutter pub get
          flutter build appbundle --release --dart-define=API_BASE_URL=https://primecare-api-gateway.itpro-mohammed.workers.dev

      - name: Build Android APK
        run: |
          cd apps/${{ matrix.app }}
          flutter build apk --release --dart-define=API_BASE_URL=https://primecare-api-gateway.itpro-mohammed.workers.dev

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
