name: Verify Aura and governed hierarchy packages
on:
  push:
    branches: [main]
    paths:
      - packages/primecare_governed_hierarchy/**
      - packages/primecare_aura/**
      - packages/primecare_screen_intents/**
      - .github/workflows/verify-governed-hierarchy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        pkg: [primecare_aura, primecare_governed_hierarchy, primecare_screen_intents]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/${{ matrix.pkg }}
      - run: flutter analyze --no-fatal-infos lib test
        working-directory: packages/${{ matrix.pkg }}
      - run: flutter test
        working-directory: packages/${{ matrix.pkg }}
