name: Prepare reconciled source objects for remaining PRs
on:
  push:
    branches: ['codex/central-worker-classes']
    paths: ['.github/workflows/prepare-combined-source-20261019.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'shaikhrais/primecare-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact input and output hashes and prepare Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY_PREPARE'
          import os,subprocess,base64,gzip,urllib.request,concurrent.futures
          import hashlib,json,pathlib
          
          def blob(data):
           return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          
          def apply(root, entries):
           root=root.resolve()
           for entry in entries:
            relative=pathlib.Path(entry['path'])
            assert not relative.is_absolute() and '..' not in relative.parts and '.git' not in relative.parts
            target=root/relative
            assert target.resolve().is_relative_to(root) and not target.is_symlink()
            if 'oldSha' in entry:
             assert target.is_file() and blob(target.read_bytes())==entry['oldSha'], 'Baseline changed: '+str(relative)
            else:assert not target.exists(), 'Unexpected new file: '+str(relative)
            if 'content' in entry:data=entry['content'].encode()
            elif 'jsonOps' in entry:
             obj=json.loads(target.read_text())
             for operation in entry['jsonOps']:
              path=operation['path'];parent=obj
              for part in path[:-1]:parent=parent[part]
              if not path:obj=operation['value']
              elif operation.get('delete'):del parent[path[-1]]
              else:parent[path[-1]]=operation['value']
             candidates=[(json.dumps(obj,sort_keys=sort,separators=(',',':'),ensure_ascii=ascii)+newline).encode() for sort in (True,False) for ascii in (True,False) for newline in ('\n','')]
             data=next((b for b in candidates if blob(b)==entry['newSha']),None)
             assert data is not None, 'JSON serialization mismatch: '+str(relative)
            else:
             lines=target.read_text().splitlines(True)
             for hunk in reversed(entry['hunks']):
              start=hunk['start']-1 if hunk['count'] else hunk['start']
              lines[start:start+hunk['count']]=hunk['add']
             data=''.join(lines).encode()
            assert blob(data)==entry['newSha'], 'Output hash mismatch: '+str(relative)
            target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
           return len(entries)
          
          entries=json.loads(gzip.decompress(base64.b64decode('')))
          assert len(entries)==72
          root=pathlib.Path.cwd()
          assert subprocess.check_output(['git','remote','get-url','origin'],text=True).strip()=='https://github.com/shaikhrais/primecare-platform'
          parents=[line.split()[1] for line in subprocess.check_output(['git','cat-file','-p','HEAD'],text=True).splitlines() if line.startswith('parent ')]
          assert parents==['bd0f4902ac35f4402b0afeda28be95db885ce6c5'], 'PR baseline moved'
          apply(root,entries)
          base='https://api.github.com/repos/shaikhrais/primecare-platform'
          def request(path,data,method='POST'):
           req=urllib.request.Request(base+path,data=json.dumps(data).encode(),method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
           with urllib.request.urlopen(req,timeout=120) as response:return json.load(response)
          def upload(entry):
           data=(root/entry['path']).read_bytes()
           result=request('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
           assert result['sha']==entry['newSha'], 'Uploaded object mismatch'
           return {'path':entry['path'],'sha':result['sha'],'mode':'100644','type':'blob'}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
           objects=list(pool.map(upload,entries))
          marker={'status':'verified_combined_objects_ready','base':'bd0f4902ac35f4402b0afeda28be95db885ce6c5','main':'56a0adcd646846cab3baffff7b82967d593806b2','objects':objects}
          result=request('/contents/docs/task-progress/combined-source-ready-20261019.json',{'message':'Record verified combined-source objects for the three remaining PRs','branch':'codex/central-worker-classes','content':base64.b64encode((json.dumps(marker,indent=2)+'\n').encode()).decode()},'PUT')
          print('Verified and uploaded '+str(len(objects))+' exact source objects; marker commit '+result['commit']['sha'])
          PY_PREPARE
