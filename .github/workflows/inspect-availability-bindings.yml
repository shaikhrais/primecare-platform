name: Inspect live availability workflow bindings
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-availability-bindings.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix /tmp/govt-reader --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/govt-reader/node_modules node_modules
          pip install -r tools/governance-production/requirements.txt
      - name: Inspect exact registered requirements and permissions without writes
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import sys,json,hashlib,pathlib
          sys.path.insert(0,'tools/governance-production')
          from production_reader import connect
          flow='care.psw.submit-availability'
          with connect() as db:
              c=db.execute('SELECT flow_kind,definition_json,definition_sha256,verification_status,test_status,blocker_json FROM virtual_workflow_definitions WHERE flow_id=?',(flow,))
              row=c.fetchone()
              assert row and row[0]=='business_process'
              assert hashlib.sha256(row[1].encode()).hexdigest()==row[2]
              definition=json.loads(row[1])
              print('LIVE_DEFINITION',json.dumps(definition))
              print('CURRENT_STATE',json.dumps(row[3:]))
              print('STEPS',json.dumps(db.execute('SELECT step_order,action_text,expected_text,api_method,api_path,actor_roles_json FROM virtual_workflow_steps WHERE flow_id=? ORDER BY step_order',(flow,)).fetchall()))
              print('SOURCE_LINKS',json.dumps(db.execute('SELECT source_table,source_key,source_key_columns,reference_status FROM virtual_workflow_source_links WHERE flow_id=?',(flow,)).fetchall()))
              policy=json.loads(db.execute('SELECT definition FROM care_delivery_policy WHERE id=?',('care-v1',)).fetchone()[0])
              source=json.loads(pathlib.Path('packages/shared/src/care/registry.json').read_text())
              keys=['roles','supportRoles','operationsRoles','staffingPolicy','endpoint','route']
              for key in keys:assert policy[key]==source[key], 'Runtime/governance policy mismatch: '+key
              print('GOVERNED_POLICY',json.dumps({key:policy[key] for key in keys}))
              print('APIS',json.dumps(db.execute('SELECT id,endpoint_code,http_method,route_path,auth_required,permission_key FROM api_endpoints WHERE route_path IN (?,?,?)',('/v1/auth/login','/v1/governance/care','/v1/governance/care/staffing')).fetchall()))
              print('SCREEN_GRANTS',json.dumps(db.execute('SELECT r.role_code,p.can_view,p.can_create,p.can_edit,p.can_delete,p.can_export FROM role_screen_permissions p JOIN roles r ON r.id=p.role_id WHERE p.screen_id=? AND r.active=1',(2517,)).fetchall()))
              print('LIVE_COUNTS',json.dumps(db.execute("SELECT verification_status,COUNT(*) FROM virtual_workflow_definitions WHERE flow_kind='business_process' GROUP BY verification_status").fetchall()))
          PY
