name: Verify or create PrimeCare QA email forward
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight only, or create the fixed QA email forward
        type: choice
        options: [verify-only, apply]
        default: verify-only
        required: true
      confirmation:
        description: For apply, enter CREATE primecare-qa@15minutes-email.com TO itpro.mohammed@gmail.com
        type: string
        required: false
      allow_existing_api_token:
        description: Permit fallback to existing API token only if dedicated token is absent
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: primecare-qa-email-routing-15minutes-email-com
  cancel-in-progress: false
jobs:
  qa-email:
    if: github.repository == 'shaikhrais/primecare-platform' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate narrow write guards locally
        run: python -m unittest tools.deployment.test_qa_email_route
      - name: Verify or apply only the approved exact routing rule
        env:
          QA_EMAIL_ZONE_ID: ${{ vars.PRIMECARE_QA_CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_ROUTING_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.allow_existing_api_token && secrets.CLOUDFLARE_API_TOKEN || '' }}
          QA_EMAIL_MODE: ${{ inputs.mode }}
          QA_EMAIL_CONFIRM: ${{ inputs.confirmation }}
          QA_EMAIL_ALLOW_API_FALLBACK: ${{ inputs.allow_existing_api_token }}
        run: python -m tools.deployment.qa_email_route
