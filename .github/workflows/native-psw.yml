name: Verify named PSW dashboard orchestration
on:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_psw/**'
      - 'packages/primecare_runtime/lib/src/providers/psw_providers.dart'
      - 'packages/primecare_runtime/lib/src/services/psw_service.dart'
      - '.github/workflows/native-psw.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - working-directory: packages/primecare_psw
        run: flutter pub get
      - working-directory: packages/primecare_psw
        run: flutter analyze --no-fatal-infos lib test
      - working-directory: packages/primecare_psw
        run: flutter test --reporter expanded
      - working-directory: packages/primecare_runtime
        run: flutter pub get
      - working-directory: packages/primecare_runtime
        run: flutter analyze --no-fatal-infos lib/src/providers/psw_providers.dart lib/src/services/psw_service.dart
