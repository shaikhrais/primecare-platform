name: Verify native layout and utility packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_layout/**'
      - 'packages/primecare_logging/**'
      - 'packages/primecare_api_errors/**'
      - 'packages/primecare_network_status/**'
      - '.github/workflows/native-utility-packages.yml'
permissions: {contents: read}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        package: [primecare_layout, primecare_logging, primecare_api_errors, primecare_network_status]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      # Workspace contract fixtures are generated and tested separately by native-workspace-layout.yml.
      - if: matrix.package == 'primecare_layout'
        run: flutter test test/responsive_breakpoints_test.dart --reporter expanded
      - if: matrix.package != 'primecare_layout'
        run: flutter test --reporter expanded
