name: Record deployed MFA scoped evidence
on:
  workflow_run:
    workflows: ['Release and verify complete Code Admin MFA journey']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  record:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Require exact successful producer and unchanged MFA runtime sources
        uses: actions/github-script@v7
        with:
          script: |
            const run=context.payload.workflow_run;
            if(run.path!=='.github/workflows/release-auth-mfa.yml'||run.head_branch!=='main'||run.conclusion!=='success')throw Error('Exact MFA producer required');
            const comparison=(await github.rest.repos.compareCommits({...context.repo,base:run.head_sha,head:context.sha})).data;
            if(comparison.files.some(f=>f.filename.startsWith('cloudflare/workers/')||f.filename.startsWith('websites/typescript/')||f.filename.startsWith('packages/shared/')||f.filename==='packages/database/migrations/20261025_auth_mfa.sql'))throw Error('MFA runtime changed after live proof');
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: live-mfa-acceptance
          path: test-results/live-mfa
      - run: |
          npm install --prefix /tmp/mfa-evidence --ignore-scripts --no-audit --no-fund pg@8.16.3
          ln -s /tmp/mfa-evidence/node_modules node_modules
      - name: Record scoped tested tags without independent approval or whole-auth credit
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RECORD_MFA_EVIDENCE: '1'
          MFA_PRODUCER_SHA: ${{ github.event.workflow_run.head_sha }}
          MFA_PRODUCER_RUN: ${{ github.event.workflow_run.id }}
        run: node scripts/record-mfa-evidence.mjs
