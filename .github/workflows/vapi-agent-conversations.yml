name: Verify eight saved Vapi agent conversations
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-vapi-agent-conversations.mjs'
      - 'scripts/test-vapi-public-knowledge.mjs'
      - 'packages/shared/src/communications/vapi-public-knowledge.mjs'
      - '.github/workflows/vapi-agent-conversations.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: primecare-vapi-agent-conversations, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test scripts/test-vapi-public-knowledge.mjs
  conversations:
    if: ${{ !contains(github.event.head_commit.message, 'VAPI_CLIENT_INFORMATION_RELEASE') }}
    needs: verify
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify pinned saved scripts and synthetic live chat behavior
        run: |
          if [ "$REPLAY_RECORDED_CHATS" = "true" ]; then
            node scripts/verify-vapi-agent-conversations.mjs --replay docs/business/evidence/vapi-client-information-conversations-recorded-20261027.json
          else
            node scripts/verify-vapi-agent-conversations.mjs
          fi
        env:
          REPLAY_RECORDED_CHATS: ${{ contains(github.event.head_commit.message, 'VAPI_REVIEW_RECORDED_CONVERSATIONS') }}
          VAPI_PRIVATE_API_KEY: ${{ secrets.VAPI_PRIVATE_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: vapi-agent-conversations, path: test-results/vapi/agent-conversations.json, retention-days: 30}
