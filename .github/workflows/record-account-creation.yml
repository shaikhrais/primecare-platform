name: Record account creation and inspect password recovery
on:
  push:
    branches: [main]
    paths: [.github/workflows/record-account-creation.yml]
permissions:
  contents: read
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          run-id: 39337979328
          github-token: ${{ github.token }}
          name: create-account-native-evidence
          path: test-results
      - name: Commit completed attempt and read next live definition
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: '39337979328'
        run: |
          python -u - <<'PY'
          import sys,os,json,pathlib,hashlib,urllib.request
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt,summary,_bindings_current,_open_issues
          root=pathlib.Path.cwd();base='test-results/create-tenant-account';receipt=json.loads((root/base/'results.json').read_text());policy=json.loads((root/base/'governance.json').read_text());flow='auth.create-tenant-account'
          assert receipt['passed'] is True and receipt['wholeTaskVerified'] is False and len(receipt['cases'])==2 and len(receipt['apiChecks'])==6
          assert _bindings_current(receipt['source_bindings'],root)
          assert not [r for r in policy['screen_links'] if r['api_id']==1]
          registered={}
          for row in policy['policy_roles']:
              assert row['scope']=='same_tenant'
              registered.setdefault(row['actor_role'],[]).append(row['target_role'])
          code=json.loads((root/'cloudflare/workers/src/account-policy.json').read_text());assert {k:sorted(v) for k,v in code.items()}=={k:sorted(v) for k,v in registered.items()}
          api=next(a for a in policy['apis'] if a['id']==1);enum=json.loads(api['request_schema'])['properties']['role']['enum'];drift=sorted(set(t for v in registered.values() for t in v)-set(enum))
          assert drift==sorted(['growth_caller','growth_google','growth_meta','growth_seo','growth_offline','growth_coordinator','maintenance'])
          def request(path):return json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/shaikhrais/primecare-platform/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})))
          run=request('actions/runs/'+os.environ['EVIDENCE_RUN']);assert run['conclusion']=='success' and run['head_sha']==receipt['commit']
          artifact=next(a for a in request('actions/runs/'+os.environ['EVIDENCE_RUN']+'/artifacts')['artifacts'] if a['name']=='create-account-native-evidence' and not a['expired']);url=run['html_url']+'/artifacts/'+str(artifact['id'])
          sources=dict(receipt['source_bindings'])
          reviewed=['websites/typescript/src/auth-screen.ts','websites/typescript/src/account.ts','websites/typescript/src/maintenance.ts','packages/primecare_ui/lib/src/features/maintenance/maintenance_configuration_screen.dart','tools/governance-production/production-pin.json']
          for path in reviewed:sources[path]=hashlib.sha256((root/path).read_bytes()).hexdigest()
          audit=dict(workflow_id=flow,browser_executed=False,missing_acceptance=['step:1','step:2'],registered_creation_links=[],reviewed_source_bindings={p:sources[p] for p in reviewed},policy_rows=len(policy['policy_roles']),policy_matches_source=True,api_role_enum_drift=drift,conclusion='General actor-specific creation UI is absent. Maintenance-only create form hardcodes maintenance; Platform Administration uses a separate tenant API and authority. No new registration or grant inferred.')
          (root/base/'source-audit.json').write_text(json.dumps(audit,indent=2))
          files=[('results.json','api-database'),('governance.json','specification'),('run.mjs','test'),('source-audit.json','source-review')]
          evidence=[dict(path=base+'/'+name,sha256=hashlib.sha256((root/base/name).read_bytes()).hexdigest(),kind=kind,url=('https://github.com/shaikhrais/primecare-platform/actions/runs/'+os.environ['GITHUB_RUN_ID'] if name=='source-audit.json' else url)) for name,kind in files]
          blockers=['Missing required CEO/HR general target-role account creation UI; POST API 1 has no screen_api_links. Existing screens 705/903/935/39/314 provide only generic/placeholder controls and no registered email/password/actor-specific role-selection creation component. Register exact sections/elements/test IDs/EN-FR-ES resources before implementation.','Definition is virtual_draft with no resolved composite policy-row source links, despite 109 existing same_tenant policy rows (CEO71/HR38). Rebind exact rows via a production-compatible metadata writer; do not execute legacy SQLite registration writers.','API request schema excludes seven approved policy targets: '+', '.join(drift)+'. Response schema is null; legacy api_permissions for API1 carry an unrelated RMT-list key, while endpoint permission_key is auth_account_creation_policy. Reconcile registered contracts without changing actor grants.']+receipt['limitations']
          with ProductionWorkflowStore() as db:
              assert db.execute('SELECT definition_sha256 FROM virtual_workflow_definitions WHERE flow_id=?',(flow,)).fetchone()[0]==receipt['definition_sha256']
              existing=_open_issues(db,flow,root)
              result=dict(status='missing',test_status='scoped_pass',scope='scoped',source_bindings=sources,evidence=evidence,blockers=blockers,next_action='Resolve approved CEO/HR creation UI registration and production metadata writer/spec/contract blockers. Continue auth.forgot-password now; do not broaden Platform Admin or other role grants.')
              if existing:
                  for issue_id in existing:
                      for path in json.loads(db.execute('SELECT affected_sources_json FROM virtual_workflow_issues WHERE issue_id=?',(issue_id,)).fetchone()[0]):sources[path]=hashlib.sha256((root/path).read_bytes()).hexdigest()
                  result['existing_issue_ids']=existing
              else:result['issues']=[dict(criterion_id='step:1',reproduction='Open the CEO/HR account surface and attempt the required general target-role creation flow; inspect API1 screen links and registered screen controls.',expected='Registered actor-specific role/email/password creation controls invoke POST /v1/auth/register and show the persisted result.',actual=audit['conclusion'],affected_sources=['websites/typescript/src/auth-screen.ts','websites/typescript/src/maintenance.ts'])]
              output=record_attempt(db,flow,result,root)
          print('CREATE_ACCOUNT_ATTEMPT_COMMITTED '+json.dumps(dict(attempt=output,evidence_url=url,blockers=blockers)))
          # Continue with the next process only after the completed attempt commits.
          with ProductionWorkflowStore() as db:
              flow='auth.forgot-password'
              fields=['flow_id','definition_json','definition_sha256','verification_status','test_status','blocker_json','title']
              row=db.execute('SELECT '+','.join(fields)+' FROM virtual_workflow_definitions WHERE flow_id=?',(flow,)).fetchone();definition=dict(zip(fields,row))
              step_fields=['step_order','action_text','expected_text','api_method','api_path','database_effect_json']
              steps=[dict(zip(step_fields,r)) for r in db.execute('SELECT '+','.join(step_fields)+' FROM virtual_workflow_steps WHERE flow_id=?',(flow,))]
              api_fields=['id','http_method','route_path','request_schema','response_schema','auth_required','permission_key','service_name','rate_limit_key']
              routes=list(set(r['api_path'] for r in steps if r['api_path']))
              apis=[dict(zip(api_fields,r)) for r in db.execute('SELECT '+','.join(api_fields)+' FROM api_endpoints WHERE route_path IN ('+','.join('?' for _ in routes)+')',routes)]
              theme=dict(db.execute('SELECT css_variable_name,token_value FROM theme_design_tokens WHERE theme_id=1 AND active=1'))
              result=dict(definition=definition,steps=steps,apis=apis,theme=theme)
              out=root/'next-workflow/forgot-password';out.mkdir(parents=True,exist_ok=True);(out/'governance.json').write_text(json.dumps(result,indent=2))
              print('FORGOT_PASSWORD_LIVE_REQUIREMENTS '+json.dumps(dict(definition=definition,steps=steps,apis=apis)))
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: create-account-recorded-review
          path: test-results
      - uses: actions/upload-artifact@v4
        with:
          name: next-forgot-password-requirements
          path: next-workflow
