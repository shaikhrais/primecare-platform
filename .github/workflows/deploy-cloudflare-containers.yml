name: Deploy All APIs to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to authorize production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: primecare-cloudflare-api-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

jobs:
  deploy:
    name: Deploy API containers and gateway
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    steps:
      - name: Require confirmation and secrets
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "DEPLOY"
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PRODUCTION_DATABASE_URL; do
            test -n "${!name}" || { echo "::error::Missing GitHub secret: ${name}"; exit 1; }
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deployment tools
        run: npm install --no-save --ignore-scripts wrangler@4.68.1 @cloudflare/containers

      - name: Generate deterministic Worker configurations
        run: node scripts/generate-cloudflare-container-config.mjs

      - name: Resolve workers.dev domain
        id: domain
        run: |
          set -euo pipefail
          subdomain="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" | jq -r '.result.subdomain')"
          test -n "${subdomain}" && test "${subdomain}" != "null"
          echo "subdomain=${subdomain}" >> "${GITHUB_OUTPUT}"

      - name: Deploy every API Worker and container
        run: |
          set -euo pipefail
          services=(auth client provider visit notes billing scheduling notification verification compliance governance franchise-reporting)
          for service in "${services[@]}"; do
            config=".cloudflare-generated/${service}.jsonc"
            printf '%s' "${PRODUCTION_DATABASE_URL}" | npx wrangler secret put DATABASE_URL --config "${config}"
            npx wrangler deploy --config "${config}" --containers-rollout=immediate
          done

      - name: Wait for and verify all public API URLs
        env:
          SUBDOMAIN: ${{ steps.domain.outputs.subdomain }}
        run: |
          set -euo pipefail
          : > worker-urls.txt
          services=(auth client provider visit notes billing scheduling notification verification compliance governance franchise-reporting)
          for service in "${services[@]}"; do
            url="https://primecare-${service}-api.${SUBDOMAIN}.workers.dev"
            curl --fail --show-error --retry 20 --retry-all-errors --retry-delay 10 "${url}/health"
            printf '%s=%s\n' "${service}" "${url}" | tee -a worker-urls.txt
          done

      - name: Deploy service-bound API gateway Worker
        run: npx wrangler deploy --config .cloudflare-generated/gateway.jsonc

      - name: Verify gateway and publish URLs
        env:
          SUBDOMAIN: ${{ steps.domain.outputs.subdomain }}
        run: |
          set -euo pipefail
          gateway="https://primecare-api-gateway.${SUBDOMAIN}.workers.dev"
          curl --fail --show-error --retry 20 --retry-all-errors --retry-delay 10 "${gateway}/health"
          for route in auth client provider visit notes billing scheduling notification verification compliance governance franchise-reporting; do
            curl --fail --show-error --retry 5 --retry-all-errors "${gateway}/v1/${route}/health"
          done
          {
            echo '## Cloudflare API deployment'
            echo
            echo "Gateway: ${gateway}"
            echo
            echo '```text'
            cat worker-urls.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-urls
          path: worker-urls.txt
