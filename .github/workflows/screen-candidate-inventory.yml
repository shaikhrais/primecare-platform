name: Screen candidate inventory
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -p 'test_screen_inheritance_scan.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_route_sites.py'
      - run: python3 scripts/check_screen_inheritance.py
      - run: python3 scripts/check_route_sites.py
