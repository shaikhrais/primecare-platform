name: Verify registered password recovery
on:
  push:
    branches: [main]
    paths: [.github/workflows/forgot-password-recovery.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  requirements:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix /tmp/govt-reader --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/govt-reader/node_modules node_modules
          pip install -r tools/governance-production/requirements.txt
      - name: Load live specifications and theme after merge
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import sys,json,pathlib,sqlite3
          sys.path.insert(0,'tools/governance-production')
          from production_reader import connect
          flow='auth.forgot-password'
          with connect() as db:
              db.row_factory=sqlite3.Row
              definition=dict(db.execute('SELECT * FROM virtual_workflow_definitions WHERE flow_id=?',(flow,)).fetchone())
              result=dict(definition=definition,steps=[dict(r) for r in db.execute('SELECT * FROM virtual_workflow_steps WHERE flow_id=?',(flow,))],links=[dict(r) for r in db.execute('SELECT * FROM virtual_workflow_source_links WHERE flow_id=?',(flow,))],checkpoint=[dict(r) for r in db.execute('SELECT * FROM virtual_workflow_checkpoints WHERE flow_id=?',(flow,))],apis=[dict(r) for r in db.execute("SELECT * FROM api_endpoints WHERE route_path='/v1/auth/forgot-password'")],registry=[dict(r) for r in db.execute('SELECT * FROM auth_route_registry WHERE id=3')],screen_links=[dict(r) for r in db.execute('SELECT * FROM screen_api_links WHERE api_id=395')],screens=[dict(r) for r in db.execute("SELECT * FROM screens WHERE route_path LIKE '%forgot-password%'")],theme=dict(db.execute('SELECT css_variable_name,token_value FROM theme_design_tokens WHERE theme_id=1 AND active=1')))
              result['required_elements']=[dict(r) for r in db.execute('SELECT * FROM screen_required_elements WHERE screen_id=947')]
              result['section_elements']=[dict(r) for r in db.execute('SELECT * FROM screen_section_elements WHERE screen_id=947')]
              result['guides']=[dict(r) for r in db.execute("SELECT * FROM virtual_role_flow_guides WHERE guide_json LIKE '%forgot-password%'")]
              path=pathlib.Path('test-results/forgot-password');path.mkdir(parents=True,exist_ok=True);(path/'governance.json').write_text(json.dumps(result,indent=2))
              print('FORGOT_PASSWORD_REQUIREMENTS '+json.dumps({k:v for k,v in result.items() if k not in ['theme','guides']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forgot-password-live-requirements
          path: test-results/
  browser:
    needs: requirements
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: login_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U primecare -d login_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: forgot-password-live-requirements
          path: test-results
      - run: |
          npm install --prefix /tmp/forgot-recovery --ignore-scripts --no-audit --no-fund pg@8.16.3 bcryptjs@3 esbuild@0.27.2 playwright@1.60.0
          ln -s /tmp/forgot-recovery/node_modules node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Execute recovery UI, native reset store and isolated mail acceptance
        env:
          LOGIN_BROWSER_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/login_browser
        run: |
          cat > test-results/forgot-password/run.mjs <<'BROWSER'
          import assert from 'node:assert/strict';
          import pg from 'pg';import bcrypt from 'bcryptjs';import {build} from 'esbuild';import {chromium} from 'playwright';
          import {readFile,writeFile,mkdir,mkdtemp} from 'node:fs/promises';import {createRequire} from 'node:module';import {createServer} from 'node:http';import {createHash,randomUUID} from 'node:crypto';import {tmpdir} from 'node:os';import {join} from 'node:path';
          const out='test-results/forgot-password';await mkdir(out,{recursive:true});
          if(process.env.PRODUCTION_DATABASE_URL||process.env.GOVERNANCE_DATABASE_URL)throw Error('Production credentials forbidden in browser fixture');
          const connection=process.env.LOGIN_BROWSER_DATABASE_URL,url=new URL(connection);if(!['localhost','127.0.0.1'].includes(url.hostname)||url.pathname!='/login_browser')throw Error('Loopback login_browser database required');
          const db=new pg.Client({connectionString:connection});await db.connect();const schema='login_'+randomUUID().replaceAll('-','');await db.query('CREATE SCHEMA '+schema);await db.query('SET search_path TO '+schema);url.searchParams.set('options','-c search_path='+schema);
          const dir=await mkdtemp(join(tmpdir(),'primecare-login-main-')),require=createRequire(import.meta.url),digest=v=>createHash('sha256').update(v).digest('hex');
          const receipt={workflow_id:'auth.forgot-password',passed:false,wholeTaskVerified:false,commit:process.env.GITHUB_SHA,cases:[],apiChecks:[],trace:[],navigation:[],source_bindings:{},limitations:['Loopback hosting with production source; not a deployed Cloudflare execution.','Cloudflare source limiter is a controlled synthetic binding; trusted source/origin headers are supplied by the harness.','Portal manifest only transports production theme plus fixture origin/name; no production business records.','Platform-admin landing only; all registered role destinations, full accessibility/PWA and independent review gates remain pending.']};
          let server,browser,bridgeFailure;const password='Synthetic-only!Login-2026',actor=randomUUID(),tenant=randomUUID(),foreign=randomUUID(),admin=randomUUID(),denied=randomUUID();
          const policy=JSON.parse(await readFile(out+'/governance.json','utf8'));assert.equal(policy.definition.definition_sha256,'c0640de45987b47ffad64d12487f37bbc2d5176d8f66a7bfbcbe93956a4ca76f');receipt.definition_sha256=policy.definition.definition_sha256;receipt.limitations=['Actual main browser/gateway/service with native PostgreSQL; native Cloudflare email is an isolated acceptance/failure fixture, not actual inbox delivery.','Trusted origin/IP and controlled Cloudflare source limiter; deployed edge/cookie policy remains unproven.','EN/FR/ES recovery UI demonstrated; full accessibility/PWA, production evidence playback and independent reviews remain pending.'];
          try{
           await db.query('CREATE TABLE tenants(id uuid PRIMARY KEY,name text,slug text UNIQUE,status text,created_at timestamptz DEFAULT NOW(),updated_at timestamptz DEFAULT NOW());CREATE TABLE users(id uuid PRIMARY KEY,tenant_id uuid REFERENCES tenants(id),email text UNIQUE,roles text,password_hash text,status text,updated_at timestamptz DEFAULT NOW());CREATE TABLE auth_sessions(user_id uuid REFERENCES users(id),token_hash text,expires_at timestamptz)');
           for(const file of ['20260928_auth_rate_limits.sql','20261003_auth_password_resets.sql','20261003_maintenance_configuration.sql','20261011_platform_administration.sql','20261013_screen_text.sql'])await db.query(await readFile('packages/database/migrations/'+file,'utf8'));
           await db.query("INSERT INTO tenants(id,name,slug,status) VALUES($1,'Synthetic Primary','synthetic-primary','active'),($2,'Synthetic Foreign','synthetic-foreign','active')",[tenant,foreign]);const hash=await bcrypt.hash(password,12);
           for(const [id,t,email,role]of [[actor,tenant,'platform@example.invalid','platform_admin'],[admin,foreign,'tenant-admin@example.invalid','tenant_admin'],[denied,tenant,'psw@example.invalid','psw']])await db.query("INSERT INTO users(id,tenant_id,email,roles,password_hash,status) VALUES($1,$2,$3,$4,$5,'active')",[id,t,email,role,hash]);
           const front=await build({entryPoints:['websites/typescript/src/main.ts'],bundle:true,write:false,metafile:true,platform:'browser',format:'iife'});
           const back=await build({stdin:{contents:"export {default as gateway} from './cloudflare/workers/src/gateway';export {default as service} from './cloudflare/workers/src/service';",resolveDir:process.cwd()},bundle:true,platform:'node',format:'cjs',write:false,metafile:true,external:['pg']});
           const backend=join(dir,'backend.cjs');await writeFile(backend,back.outputFiles[0].text.replaceAll('require("pg")',`require(${JSON.stringify(join(process.cwd(),'node_modules/pg'))})`));const {gateway,service}=require(backend);
           const paths=[...Object.keys(front.metafile.inputs),...Object.keys(back.metafile.inputs),'websites/typescript/src/styles.css',...['20260928_auth_rate_limits.sql','20261003_auth_password_resets.sql','20261003_maintenance_configuration.sql','20261011_platform_administration.sql','20261013_screen_text.sql'].map(f=>'packages/database/migrations/'+f)];for(const path of paths)if(path!=='<stdin>'&&!path.includes('node_modules/'))receipt.source_bindings[path]=digest(await readFile(path));
           let mailMode='accept';const accepted=[],attempts=[];const mail={send:async message=>{attempts.push({to:message.to});if(mailMode==='reject')throw Error('Synthetic mail failure');if(mailMode==='bad-ack')return {};accepted.push(message);return {messageId:'synthetic-'+randomUUID()};}};
           const env={EMAIL:mail,EMAIL_FROM:'PrimeCare <recovery@example.invalid>',EMAIL_ALLOWED_SENDER:'recovery@example.invalid',DB_URL:url.toString(),AUTH_SOURCE_LIMIT:{limit:async()=>({success:true})}},css=await readFile('websites/typescript/src/styles.css','utf8');
           server=createServer(async(req,res)=>{try{const requestUrl=new URL(req.url,'http://fixture');
            if(requestUrl.pathname==='/app.js'){res.setHeader('content-type','text/javascript');res.end(front.outputFiles[0].text);return;}
            if(requestUrl.pathname==='/portal.json'){res.setHeader('content-type','application/json');res.end(JSON.stringify({project:'PrimeCare',appCode:'pc',name:'PrimeCare',apiGateway:origin,theme:policy.theme}));return;}
            if(['/login','/forgot-password','/reset-password','/platform/administration','/'].includes(requestUrl.pathname)){const locale=requestUrl.searchParams.get('locale')||'en';res.setHeader('content-type','text/html');res.end(`<!doctype html><html lang="${['en','fr','es'].includes(locale)?locale:'en'}"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeCare synthetic login</title><style>${css}</style></head><body><div id="app"></div><script src="/app.js"></script></body></html>`);return;}
            if(requestUrl.pathname.startsWith('/v1/')){let body='';for await(const part of req)body+=part;const headers=new Headers(req.headers);headers.delete('accept-encoding');headers.set('origin','https://primecare-clinic.pages.dev');headers.set('cf-connecting-ip','192.0.2.1');
             const request=new Request(origin+req.url,{method:req.method,headers,...(body?{body}:{})});const bindings={AUTH:{fetch:r=>service.fetch(r,{...env,SERVICE_NAME:'auth'})},GOVERNANCE:{fetch:r=>service.fetch(r,{...env,SERVICE_NAME:'governance'})}};
             const response=await gateway.fetch(request,bindings);receipt.trace.push({path:requestUrl.pathname,method:req.method,status:response.status});res.writeHead(response.status,Object.fromEntries(response.headers));res.end(await response.text());return;}
            res.writeHead(404);res.end();
           }catch(error){bridgeFailure=error;res.writeHead(500);res.end('Synthetic bridge failure');}});await new Promise(r=>server.listen(0,'127.0.0.1',r));const origin='http://127.0.0.1:'+server.address().port;
           browser=await chromium.launch({headless:true});const cy=(page,id)=>page.locator('[data-cy="'+id+'"]');const waitLogin=async(page)=>{await cy(page,'login-submit').waitFor();};
           const submit=async(page,value=password)=>{await cy(page,'login-email').fill('platform@example.invalid');await cy(page,'login-password').fill(value);await cy(page,'login-submit').click();};
           const token=page=>page.evaluate(()=>sessionStorage.getItem('primecare_session'));
           const sessions=async()=>Number((await db.query('SELECT count(*) n FROM auth_sessions WHERE user_id=$1',[actor])).rows[0].n);
          
           const resources=JSON.parse(await readFile('packages/shared/src/auth-recovery.json','utf8'));const catalog=JSON.parse(await readFile('packages/primecare_ui/lib/src/localization/screens/auth.json','utf8'));
           const count=async()=>Number((await db.query('SELECT count(*) n FROM auth_password_resets')).rows[0].n);
           const domain=async()=>({users:(await db.query('SELECT id,password_hash,status,tenant_id FROM users ORDER BY id')).rows,sessions:(await db.query('SELECT user_id,token_hash,expires_at FROM auth_sessions ORDER BY token_hash')).rows});
           const call=(email,extra={},headers={})=>fetch(origin+'/v1/auth/forgot-password',{method:'POST',headers:{'content-type':'application/json',...headers},body:JSON.stringify({email,...extra})});
           let generic;
           for(const[locale,width]of [['en',320],['fr',1440],['es',768]]){
            await db.query('DELETE FROM auth_password_resets;DELETE FROM auth_sessions;DELETE FROM auth_rate_limits');accepted.length=0;attempts.length=0;mailMode='accept';env.EMAIL=mail;
            const context=await browser.newContext({viewport:{width,height:1000},recordVideo:{dir:out+'/video',size:{width,height:1000}}}),page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
            try{
             await page.goto(origin+'/login?locale='+locale+'&enable-semantics=true');await waitLogin(page);await submit(page);await cy(page,'platform-topbar-tenant').waitFor();const old=await token(page);assert.ok(old);await cy(page,'platform-logout').click();await waitLogin(page);assert.equal(await token(page),null);await cy(page,'login-forgot').click();await cy(page,'recovery-form').waitFor();
             await page.goto(origin+'/forgot-password?locale='+locale+'&enable-semantics=true');await cy(page,'recovery-form').waitFor();assert.equal(await cy(page,'recovery-submit').innerText(),catalog.locales[locale].recovery_action);
             await cy(page,'recovery-email').fill('invalid');const beforeTrace=receipt.trace.filter(r=>r.path==='/v1/auth/forgot-password'&&r.method==='POST').length;await cy(page,'recovery-submit').click();assert.equal(await cy(page,'recovery-form').evaluate(e=>e.checkValidity()),false);assert.equal(receipt.trace.filter(r=>r.path==='/v1/auth/forgot-password'&&r.method==='POST').length,beforeTrace);assert.equal(await count(),0);
             await cy(page,'recovery-email').fill('PLATFORM@EXAMPLE.INVALID');const initial=await domain();
             await context.setOffline(true);await cy(page,'recovery-submit').click();await page.waitForFunction(message=>document.querySelector('[data-cy=recovery-status]')?.textContent===message,resources.locales[locale].recovery_error);await context.setOffline(false);assert.equal(await count(),0);assert.equal(accepted.length,0);assert.deepEqual(await domain(),initial);
             const send=async(status,message)=>{const pending=page.waitForResponse(r=>new URL(r.url()).pathname==='/v1/auth/forgot-password');await cy(page,'recovery-submit').click();const response=await pending;assert.equal(response.status(),status);const body=await response.json();await page.waitForFunction(value=>document.querySelector('[data-cy=recovery-status]')?.textContent===value,message);await page.waitForFunction(()=>!document.querySelector('[data-cy=recovery-submit]').disabled);return body;};
             mailMode='reject';await send(503,resources.locales[locale].recovery_unavailable);assert.equal(await count(),0);assert.equal(accepted.length,0);assert.deepEqual(await domain(),initial);
             env.EMAIL=undefined;await send(503,resources.locales[locale].recovery_unavailable);assert.equal(await count(),0);assert.equal(accepted.length,0);env.EMAIL=mail;mailMode='accept';
             const body=await send(200,catalog.locales[locale].recovery_sent);assert.deepEqual(Object.keys(body),['message']);generic=body;assert.equal(accepted.length,1);assert.equal(accepted[0].to,'platform@example.invalid');const code=accepted[0].text.match(/\b[A-F0-9]{12}\b/)?.[0];assert.ok(code);const rows=(await db.query('SELECT token_hash,user_id,expires_at FROM auth_password_resets')).rows;assert.equal(rows.length,1);assert.equal(rows[0].user_id,actor);assert.equal(rows[0].token_hash,digest('platform@example.invalid:'+code));assert.ok(new Date(rows[0].expires_at)>new Date(Date.now()+14*60*1000));assert.ok(new Date(rows[0].expires_at)<=new Date(Date.now()+15*60*1000+1000));assert.ok(!JSON.stringify(body).includes(code));assert.deepEqual(await domain(),initial);assert.equal((await fetch(origin+'/v1/auth/me',{headers:{authorization:'Bearer '+old}})).status,401);
             await page.screenshot({path:out+'/recovery-'+locale+'.png',fullPage:true});await page.reload();await cy(page,'recovery-form').waitFor();assert.equal(await count(),1);assert.equal(accepted.length,1);assert.deepEqual(await domain(),initial);assert.deepEqual(errors,[]);
             receipt.cases.push({locale,width,realCredentialLoginThenLogout:true,registeredRecoveryUI:true,localizedCopy:true,invalidHtmlEmailPrevented:true,offlineRetry:true,missingMailDenied:true,providerFailureDeletesUnsentCode:true,successfulRetry:true,genericResponse:true,codeOnlyInFixtureMail:true,hashedFifteenMinuteCode:true,reloadDoesNotResend:true,passwordAndSessionsUnchanged:true,oldRevokedTokenRemainsDenied:true});
            }finally{const video=page.video();await context.close();if(video)await video.saveAs(out+'/recovery-'+locale+'.webm');}
           }
           receipt.apiChecks.push('Credential login/logout and EN/FR/ES actual-main recovery, provider failure, offline retry, hashed code and reload');
           await db.query('DELETE FROM auth_rate_limits');const before=await domain(),beforeResets=await count(),beforeMail=accepted.length;
           await db.query("UPDATE users SET status='inactive' WHERE id=$1",[denied]);
           for(const email of ['unknown@example.invalid','psw@example.invalid']){const response=await call(email);assert.equal(response.status,200);assert.deepEqual(await response.json(),generic);assert.equal(await count(),beforeResets);assert.equal(accepted.length,beforeMail);}
           for(const[id,email]of [[randomUUID(),'ambiguous@example.invalid'],[randomUUID(),'AMBIGUOUS@EXAMPLE.INVALID']])await db.query("INSERT INTO users(id,tenant_id,email,roles,password_hash,status) VALUES($1,$2,$3,'psw',$4,'active')",[id,tenant,email,hash]);
           const ambiguous=await call('ambiguous@example.invalid');assert.equal(ambiguous.status,200);assert.deepEqual(await ambiguous.json(),generic);assert.equal(await count(),beforeResets);assert.equal(accepted.length,beforeMail);receipt.apiChecks.push('Unknown, inactive and ambiguous emails return the same generic response without code or mail');
           const invalidBefore=await domain();for(const[mailAddress,extra]of [['platform@example.invalid',{userId:admin,tenantId:foreign}],['invalid',{}]]){assert.equal((await call(mailAddress,extra)).status,400);assert.equal(await count(),beforeResets);assert.equal(accepted.length,beforeMail);assert.deepEqual(await domain(),invalidBefore);}receipt.apiChecks.push('Invalid email and identity/tenant field injection rejected without domain changes');
           await db.query('DELETE FROM auth_rate_limits');mailMode='bad-ack';const snapshot=(await db.query('SELECT * FROM auth_password_resets ORDER BY token_hash')).rows;const bad=await call('platform@example.invalid');assert.equal(bad.status,503);assert.deepEqual((await db.query('SELECT * FROM auth_password_resets ORDER BY token_hash')).rows,snapshot);assert.deepEqual(await domain(),invalidBefore);mailMode='accept';receipt.apiChecks.push('Invalid provider acknowledgement removes only the new unsent token and preserves existing codes');
           await db.query("CREATE FUNCTION fixture_reset_failure() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NULL; END $$;CREATE TRIGGER fixture_reset_failure BEFORE INSERT ON auth_password_resets FOR EACH ROW EXECUTE FUNCTION fixture_reset_failure()");
           const mailBeforeFailure=accepted.length;try{const failure=await call('platform@example.invalid');assert.equal(failure.status,503);assert.deepEqual((await db.query('SELECT * FROM auth_password_resets ORDER BY token_hash')).rows,snapshot);assert.equal(accepted.length,mailBeforeFailure);}finally{await db.query('DROP TRIGGER fixture_reset_failure ON auth_password_resets;DROP FUNCTION fixture_reset_failure()');}receipt.apiChecks.push('Suppressed native reset insert rolls back and sends no email');
           await db.query('DELETE FROM auth_rate_limits');const limitBefore=await count(),limitMail=accepted.length;
           for(let i=0;i<3;i++){const response=await call('platform@example.invalid');assert.equal(response.status,200);assert.deepEqual(await response.json(),generic);}
           const limited=await call('platform@example.invalid');assert.equal(limited.status,429);assert.ok(Number(limited.headers.get('retry-after'))>=1&&Number(limited.headers.get('retry-after'))<=900);assert.equal(await count(),limitBefore+3);assert.equal(accepted.length,limitMail+3);receipt.apiChecks.push('Three accepted requests per 900-second budget; fourth denied without code or email');
           await db.query('DELETE FROM auth_rate_limits');const concurrentBefore=await count(),concurrentMail=accepted.length;const concurrent=await Promise.all([call('platform@example.invalid'),call('PLATFORM@EXAMPLE.INVALID')]);assert.deepEqual(concurrent.map(r=>r.status),[200,200]);assert.equal(await count(),concurrentBefore+2);assert.equal(accepted.length,concurrentMail+2);assert.deepEqual(await domain(),invalidBefore);receipt.apiChecks.push('Concurrent accepted requests each produce a unique hashed code and one fixture email without account/session mutations');
           const foreignBefore=await count();const foreignResult=await call('tenant-admin@example.invalid',{}, {'x-tenant-id':tenant,'x-user-id':actor});assert.equal(foreignResult.status,200);assert.deepEqual(await foreignResult.json(),generic);assert.equal(await count(),foreignBefore+1);assert.equal(accepted.at(-1).to,'tenant-admin@example.invalid');const foreignCode=accepted.at(-1).text.match(/\b[A-F0-9]{12}\b/)?.[0];assert.ok(foreignCode);assert.equal((await db.query('SELECT user_id FROM auth_password_resets WHERE token_hash=$1',[digest('tenant-admin@example.invalid:'+foreignCode)])).rows[0].user_id,admin);receipt.apiChecks.push('Forged identity/tenant headers cannot redirect a foreign email code to the requester or expose it in HTTP');
           if(bridgeFailure)throw bridgeFailure;for(const[path,sha]of Object.entries(receipt.source_bindings))assert.equal(digest(await readFile(path)),sha);receipt.passed=true;
          }catch(error){receipt.error=error.message;console.error(error);process.exitCode=1;}
          finally{if(browser)await browser.close();if(server)await new Promise(r=>server.close(r));await db.query('DROP SCHEMA '+schema+' CASCADE');await db.end();receipt.cleanup='Isolated synthetic schema dropped; all email captured by a local synthetic binding; no real email or production business data changed';await writeFile(out+'/results.json',JSON.stringify(receipt,null,2));console.log(JSON.stringify({passed:receipt.passed,browserCases:receipt.cases.length,apiGroups:receipt.apiChecks.length,wholeTaskVerified:false,error:receipt.error}));}
          
          BROWSER
          node test-results/forgot-password/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forgot-password-native-browser-evidence
          path: test-results
