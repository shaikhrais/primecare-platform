name: Verify deployed own-session controls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/auth-verification/test-live-sessions.py']
  workflow_run:
    workflows: ['Release confirmed self-session revocation', 'Release registered account session controls', 'Verify deployed account creation editing revocation and email recovery']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: auth-owned-live-sessions
  cancel-in-progress: false
jobs:
  deployment:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const candidates=[];
            for(const workflow_id of ['release-account-sessions.yml','release-screen-text.yml','verify-account-mutations.yml']){
              candidates.push(...(await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id,branch:'main',status:'success',per_page:10})).data.workflow_runs);
            }
            candidates.sort((a,b)=>b.id-a.id);
            const portals=['primecare-business-development','primecare-client','primecare-clinic','primecare-corporate','primecare-franchise','primecare-marketing','primecare-support','primecare-governance','primecare-enterprise-blueprint'];
            let deployment;
            for(const candidate of candidates){
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:candidate.id,per_page:100});
              if(!portals.every(p=>jobs.some(j=>j.name.endsWith(' / deploy ('+p+')')&&j.conclusion==='success')))continue;
              if(![' / build',' / verify_gateway'].every(suffix=>jobs.some(j=>j.name.endsWith(suffix)&&j.conclusion==='success')))continue;
              const comparison=(await github.rest.repos.compareCommits({owner,repo,base:candidate.head_sha,head:context.sha})).data;
              if(comparison.files.some(f=>f.filename.startsWith('websites/typescript/')||f.filename.startsWith('packages/shared/')||['scripts/build-typescript-websites.mjs','scripts/export-typescript-websites.py','scripts/theme_manifest.py'].includes(f.filename)))continue;
              deployment=candidate;break;
            }
            if(!deployment)throw Error('Successful current-source deployment of all nine portals required');
            core.info('Current runtime matches successful nine-portal deployment '+deployment.id);
            let authRunId=context.payload.workflow_run?.name==='Release confirmed self-session revocation'?context.payload.workflow_run.id:undefined;
            if(!authRunId){
              const recent=(await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'release-session-revocation-fix.yml',branch:'main',status:'success',per_page:10})).data.workflow_runs;
              for(const candidate of recent){
                const jobs=(await github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id:candidate.id})).data.jobs;
                if(jobs.some(j=>j.name==='deploy-auth'&&j.conclusion==='success')){authRunId=candidate.id;break;}
              }
            }
            if(!authRunId)throw Error('No successful targeted auth deployment exists');
            let authRun;
            for(let i=0;i<48;i++){
              authRun=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:authRunId})).data;
              if(authRun.status==='completed')break;
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            if(authRun.conclusion!=='success')throw Error('Required auth revocation fix deployment not successful: '+authRun.conclusion);
            const authComparison=(await github.rest.repos.compareCommits({owner,repo,base:authRun.head_sha,head:context.sha})).data;
            if(authComparison.files.some(f=>f.filename.startsWith('cloudflare/workers/')))throw Error('Auth runtime changed after required fix deployment');
            core.info('Auth runtime matches successful targeted revocation fix '+authRunId);
  proof:
    needs: deployment
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - {locale: en, width: 320}
          - {locale: fr, width: 768}
          - {locale: es, width: 1440}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install psycopg[binary]==3.2.13 bcrypt==4.3.0 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Compare deployed account session behavior with native database records
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          TEST_LOCALE: ${{ matrix.locale }}
          TEST_WIDTH: ${{ matrix.width }}
        run: python tools/auth-verification/test-live-sessions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-own-sessions-${{ matrix.locale }}-${{ matrix.width }}
          path: test-results/live-sessions
