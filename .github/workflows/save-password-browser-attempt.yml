name: Save Platform Admin password workflow attempt
on:
  push:
    branches: [main]
    paths: [.github/workflows/save-password-browser-attempt.yml]
permissions:
  contents: read
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 39320224699
          github-token: ${{ github.token }}
          name: password-change-current-main-browser
          path: test-results/password-workflow-browser
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Record native browser password attempt atomically
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
        run: |
          python - <<'PY'
          import sys,os,json,pathlib,hashlib
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt,summary
          root=pathlib.Path.cwd();base='test-results/password-workflow-browser';flow='auth.change-password'
          receipt=json.loads((root/base/'results.json').read_text())
          assert receipt['workflow_id']==flow and receipt['passed'] is True and receipt['wholeTaskVerified'] is False and receipt['commit']=='a962ba137cdc324261839a1b4895b8b7ee3fd292'
          assert len(receipt['cases'])==3 and {c['locale'] for c in receipt['cases']}=={'en','fr','es'} and len(receipt['apiChecks'])==3
          for case in receipt['cases']:
              assert case['actorRole']=='platform_admin'
              for flag in ['actualMainEntry','credentialLogin','accountUI','wrongPasswordDenied','offlineRetry','forgedIdentityRejected','auditRollback','successfulRetry','passwordHashVerified','allSessionsRevoked','resetsDeleted','singleAudit','oldPasswordDenied','newPasswordReauthentication','reload']:assert case[flag] is True
          sources=receipt['source_bindings']
          for path,sha in sources.items():assert hashlib.sha256((root/path).read_bytes()).hexdigest()==sha
          url='https://github.com/shaikhrais/primecare-platform/actions/runs/39320224699/artifacts/12219189901'
          names=[('results.json','browser'),('governance.json','specification'),('run.mjs','test')]
          names += [('password-reauth-'+locale+'.webm','video') for locale in ['en','fr','es']]
          names += [('password-reauth-'+locale+'.png','screenshot') for locale in ['en','fr','es']]
          evidence=[dict(path=base+'/'+name,sha256=hashlib.sha256((root/base/name).read_bytes()).hexdigest(),kind=kind,url=url) for name,kind in names]
          blockers=['Only the Platform Admin account UI path is demonstrated in EN/FR/ES; all other registered role surfaces and a deployed Cloudflare execution remain unproven.','Native browser fixtures prove rollback, retry and revocation, but this attempt does not independently rerun all rate-limit/concurrency permutations or full accessibility/PWA acceptance.','Full current acceptance review, governed recording playback delivery and required independent review gates remain pending.']
          handoff=dict(workflow_id=flow,main_sha=os.environ['GITHUB_SHA'],tested_main_sha=receipt['commit'],active_branch='main',work_branch=None,pr=None,verification_status='implemented-unverified',test_status='scoped_pass',actor_role='platform_admin',blockers=blockers,evidence_url=url,browser_cases=3,api_check_groups=3,synthetic_data_cleanup=receipt['cleanup'],cleanup_required=['Remove temporary login/password browser and recording workflows after final handoff'],attempted_workflows={'auth.credential-login':316,flow:'this attempt'},next_workflow='auth.inspect-own-sessions',next_action='Inspect auth.inspect-own-sessions live definition, source links, registered API/permissions and existing checkpoint. Reuse current real-credential/native-browser infrastructure for its own-session UI, API/database comparison, reload, denied identity and foreign-session checks. Login and password change remain implemented-unverified pending their exact recorded full-role/deployment/evidence/review gaps; do not repeat current passing checks unless bindings become stale.')
          with ProductionWorkflowStore() as db:
              assert db.execute('SELECT definition_sha256 FROM virtual_workflow_definitions WHERE flow_id=?',(flow,)).fetchone()[0]==receipt['definition_sha256']=='9a459ca1184488951c65fb9e083d4ad881f3bda6647f2e0fa3c8347c7f61e876'
              output=record_attempt(db,flow,dict(status='implemented-unverified',test_status='scoped_pass',scope='scoped',source_bindings=sources,evidence=evidence,blockers=blockers,next_action=json.dumps(handoff,sort_keys=True)),root)
              counts=summary(db)
              tested=list(db.execute("SELECT test_status,COUNT(*) FROM virtual_workflow_definitions WHERE flow_kind='business_process' GROUP BY test_status"))
              api=list(db.execute('SELECT id,http_method,route_path,auth_required,permission_key FROM api_endpoints WHERE id=?',(277,)))
              security=list(db.execute('SELECT * FROM auth_security_policy WHERE operation=?',('changePassword',)))
          print('PASSWORD_BROWSER_COMMITTED '+json.dumps(dict(attempt=output,summary=counts,test_status_counts=tested,registered_api=api,security_policy=security),default=str))
          PY
