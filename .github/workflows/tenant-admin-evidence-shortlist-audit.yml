name: Audit Tenant Admin evidence shortlist
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tenant-admin-evidence-shortlist-audit.yml
      - tools/governance-production/audit-tenant-admin-evidence-reuse.py
permissions:
  contents: read
jobs:
  shortlist:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned read-only adapter dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm install --prefix "$RUNNER_TEMP/tenant-evidence-reader" --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s "$RUNNER_TEMP/tenant-evidence-reader/node_modules" node_modules
          python -m pip install -r tools/governance-production/requirements.txt
      - name: Read redacted shortlist from pinned production governance
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python tools/governance-production/audit-tenant-admin-evidence-reuse.py > "$RUNNER_TEMP/tenant-admin-evidence-shortlist.json"
      - uses: actions/upload-artifact@v4
        with:
          name: tenant-admin-evidence-shortlist
          path: ${{ runner.temp }}/tenant-admin-evidence-shortlist.json
          if-no-files-found: error
          retention-days: 7
