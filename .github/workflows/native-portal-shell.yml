name: Verify named portal shell presentation
on:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_portal_shell/**'
      - 'packages/primecare_runtime/lib/registry/widgets/governance_master_layout.dart'
      - '.github/workflows/native-portal-shell.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - working-directory: packages/primecare_portal_shell
        run: flutter pub get
      - working-directory: packages/primecare_portal_shell
        run: flutter analyze --no-fatal-infos lib
      - working-directory: packages/primecare_runtime
        run: flutter pub get
      - working-directory: packages/primecare_runtime
        run: flutter test test/navbar_style_test.dart test/theme_center_test.dart --reporter expanded
