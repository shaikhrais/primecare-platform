name: Shared navigation and layout families
on:
  push:
    branches: [main]
    paths:
      - 'packages/domain/src/workspace_navigation.ts'
      - 'packages/primecare_ui/web/navigation.ts'
      - 'packages/primecare_ui/web/workspace-navigation*.ts'
      - 'packages/flutter_core/lib/navigation/**'
      - 'packages/flutter_core/lib/workspace_navigation.dart'
      - 'packages/primecare_ui/lib/workspace_navigation.dart'
      - 'packages/flutter_core/test/navigation/**'
      - 'scripts/*workspace-navigation*.mjs'
      - '.github/workflows/workspace-navigation.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/nav-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 playwright@1.60.0 linkedom@0.18.12
          ln -s /tmp/nav-tools/node_modules node_modules
          npx playwright install --with-deps chromium
          node scripts/test-workspace-navigation-model.mjs
          node --test scripts/test-workspace-navigation-search.mjs
          node scripts/test-workspace-navigation-browser.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable --resolveJsonModule packages/primecare_ui/web/workspace-navigation.ts packages/primecare_ui/web/navigation.ts
      - uses: actions/upload-artifact@v4
        with: {name: web-navigation-oracle, path: packages/flutter_core/test/navigation/fixtures/web.json}
  native:
    needs: web
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - uses: actions/download-artifact@v4
        with: {name: web-navigation-oracle, path: packages/flutter_core/test/navigation/fixtures}
      - run: flutter pub get
        working-directory: packages/flutter_core
      - run: flutter analyze --no-fatal-infos lib/navigation lib/workspace_navigation.dart test/navigation
        working-directory: packages/flutter_core
      - run: flutter test test/navigation --reporter expanded
        working-directory: packages/flutter_core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-navigation-${{ matrix.os }}
          path: packages/flutter_core/test/navigation/fixtures/native.json
  parity:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        with: {pattern: native-navigation-*, path: artifacts/navigation}
      - run: |
          npm install --prefix /tmp/nav-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2
          ln -s /tmp/nav-tools/node_modules node_modules
          for file in artifacts/navigation/*/native.json; do node scripts/workspace-navigation-fixtures.mjs --verify-native "$file"; done
