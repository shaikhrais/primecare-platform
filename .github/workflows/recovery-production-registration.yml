name: Register existing recovery views in production governance
on:
  push:
    branches: [main]
    paths:
      - tools/governance-production/recovery-registration.json
      - tools/governance-production/production-pin.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-production-registration
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recovery
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: recovery_metadata_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U recovery -d recovery_metadata_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Check rollback idempotence exact bindings and unchanged native/grant metadata
        env:
          WORKFLOW_TEST_DATABASE_URL: postgres://recovery:fixture-only@127.0.0.1:5432/recovery_metadata_test
        run: python tools/governance-production/test-recovery-registration.py
  apply:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix /tmp/recovery-reader --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/recovery-reader/node_modules node_modules
      - name: Register existing views through pinned production metadata
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_RECOVERY_REGISTRATION_WRITES: '1'
        run: python tools/governance-production/recovery_registration.py --apply
      - name: Save generated catalog to current main
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),owner=context.repo.owner,repo=context.repo.repo;
            const {data:main}=await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            const path='packages/shared/src/auth-recovery.json',content=fs.readFileSync('test-results/recovery-registration/catalog.json');
            const {data:existing}=await github.rest.repos.getContent({owner,repo,path,ref:context.sha});
            if(Buffer.from(existing.content,'base64').equals(content)){core.info('Recovery catalog already matches production');return;}
            if(main.object.sha!==context.sha)throw Error('Main moved; preserve generated artifact and recheck before publication');
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',sha:existing.sha,message:'chore: generate recovery web catalog from pinned production metadata',content:content.toString('base64')});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-production-registration
          path: test-results/recovery-registration
          retention-days: 90
