name: Close central bootstrap verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/close-central-bootstrap.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  close:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Verify merge, remove only its exact work ref, and save handoff
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: 2030c4d8c0d26ee84a87d717d661c553248f145b
        run: |
          python - <<'PY'
          import os,sys,json,subprocess,urllib.request
          repo='shaikhrais/primecare-platform'
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              return json.load(urllib.request.urlopen(req))
          pr=api('pulls/211')
          if not pr['merged'] or pr['state']!='closed' or pr['head']['sha']!=os.environ['EXPECTED_HEAD']:
              raise RuntimeError('PR merge or expected head mismatch; preserve branch')
          refs=subprocess.check_output(['git','ls-remote','--heads','origin'],text=True)
          expected=os.environ['EXPECTED_HEAD'];branch='work/central-bootstrap-verification'
          if expected+'\trefs/heads/'+branch not in refs:raise RuntimeError('Work branch head changed; preserve branch')
          subprocess.run(['git','fetch','origin','main'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',expected,'origin/main'],check=True)
          subprocess.run(['git','push','--force-with-lease=refs/heads/'+branch+':'+expected,'origin',':refs/heads/'+branch],check=True)
          branches=api('branches?per_page=100');prs=api('pulls?state=open&per_page=100')
          if [b['name'] for b in branches]!=['main'] or prs:raise RuntimeError('Branch/PR cleanup requires inspection')
          main=branches[0]['commit']['sha']
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import summary
          with ProductionWorkflowStore() as db:
              flow='auth.bootstrap-first-central-admin'
              row=db.execute('SELECT attempt_id,next_action FROM virtual_workflow_checkpoints WHERE flow_id=?',(flow,)).fetchone()
              if not row:raise RuntimeError('Production attempt checkpoint missing')
              handoff=json.loads(row[1])
              if handoff.get('workflow_id')!=flow:raise RuntimeError('Wrong checkpoint')
              handoff.update(main_sha=main,work_branch=None,work_branch_sha=None,remote_branches=['main'],open_prs=0,pr=211,merge_state='merged and closed; merged work ref deleted; no local work branch was created',ci_status='All required PR checks and post-merge native/production tracking jobs passed',live_counts=summary(db))
              next_row=db.execute("SELECT flow_id,title FROM virtual_workflow_definitions WHERE flow_kind='business_process' AND verification_status!='blocked' AND flow_id!=? ORDER BY flow_id LIMIT 1",(flow,)).fetchone()
              handoff['next_workflow']=list(next_row) if next_row else None
              handoff['next_action']='Inspect the next workflow definition, source links, role/API registrations and existing checkpoint from pinned production before isolated acceptance. Central bootstrap remains blocked on governed operator/environment binding; do not repeat its passing native cases unless source/spec/evidence changes.'
              payload=json.dumps(handoff,sort_keys=True)
              db.execute("INSERT INTO virtual_workflow_checkpoints(flow_id,attempt_id,next_action) VALUES(?,?,?) ON CONFLICT(flow_id) DO UPDATE SET attempt_id=excluded.attempt_id, next_action=excluded.next_action,invalidation_json='[]',updated_at=CURRENT_TIMESTAMP",(flow,row[0],payload))
              db.execute("INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP",('recovery-handoff-current',payload))
          print('CENTRAL_BOOTSTRAP_CLEANUP_COMMITTED '+payload)
          PY
