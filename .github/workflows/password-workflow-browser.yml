name: Password change current-main browser attempt
on:
  push:
    branches: [main]
    paths: [.github/workflows/password-workflow-browser.yml]
permissions:
  contents: read
jobs:
  requirements:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix /tmp/govt-reader --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/govt-reader/node_modules node_modules
          pip install -r tools/governance-production/requirements.txt
      - name: Read live checkpoint, registered requirements and theme
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import sys,json,sqlite3,pathlib
          sys.path.insert(0,'tools/governance-production')
          from production_reader import connect
          with connect() as db:
              db.row_factory=sqlite3.Row
              flow='auth.change-password'
              def rows(sql,params=()):return [dict(r) for r in db.execute(sql,params)]
              result=dict(definition=rows('SELECT * FROM virtual_workflow_definitions WHERE flow_id=?',(flow,))[0],steps=rows('SELECT * FROM virtual_workflow_steps WHERE flow_id=?',(flow,)),links=rows('SELECT * FROM virtual_workflow_source_links WHERE flow_id=?',(flow,)),checkpoint=rows('SELECT * FROM virtual_workflow_checkpoints WHERE flow_id=?',(flow,)),api=rows('SELECT * FROM api_endpoints WHERE route_path=?',('/v1/user/change-password',)),security_policy=rows('SELECT * FROM auth_security_policy WHERE operation=?',('changePassword',)),guides=rows('SELECT outline_id,title,role_id,app_id,definition_status FROM virtual_role_flow_guides WHERE guide_json LIKE ?',('%auth.change-password%',)),snapshots=rows('SELECT name,updated_at FROM virtual_flow_catalog_snapshots'),counts=rows("SELECT verification_status,COUNT(*) AS count FROM virtual_workflow_definitions WHERE flow_kind='business_process' GROUP BY verification_status"),theme=dict(db.execute('SELECT css_variable_name,token_value FROM theme_design_tokens WHERE theme_id=1 AND active=1')))
              assert result['definition']['definition_sha256']=='9a459ca1184488951c65fb9e083d4ad881f3bda6647f2e0fa3c8347c7f61e876'
          out=pathlib.Path('test-results/password-workflow-browser');out.mkdir(parents=True,exist_ok=True);(out/'governance.json').write_text(json.dumps(result,indent=2))
          print('LOGIN_LIVE_COUNTS '+json.dumps(result['counts']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: password-workflow-browser-governance
          path: test-results/password-workflow-browser/governance.json
  browser:
    needs: requirements
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: login_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U primecare -d login_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: password-workflow-browser-governance
          path: test-results/password-workflow-browser
      - run: |
          npm install --prefix /tmp/login-browser --ignore-scripts --no-audit --no-fund pg@8.16.3 bcryptjs@3 esbuild@0.27.2 playwright@1.60.0
          ln -s /tmp/login-browser/node_modules node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Real Platform Admin login, password UI, API, PostgreSQL, revocation and reload
        env:
          LOGIN_BROWSER_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/login_browser
        run: |
          cat > test-results/password-workflow-browser/run.mjs <<'BROWSER'
          import assert from 'node:assert/strict';
          import pg from 'pg';import bcrypt from 'bcryptjs';import {build} from 'esbuild';import {chromium} from 'playwright';
          import {readFile,writeFile,mkdir,mkdtemp} from 'node:fs/promises';import {createRequire} from 'node:module';import {createServer} from 'node:http';import {createHash,randomUUID} from 'node:crypto';import {tmpdir} from 'node:os';import {join} from 'node:path';
          const out='test-results/password-workflow-browser';await mkdir(out,{recursive:true});
          if(process.env.PRODUCTION_DATABASE_URL||process.env.GOVERNANCE_DATABASE_URL)throw Error('Production credentials forbidden in browser fixture');
          const connection=process.env.LOGIN_BROWSER_DATABASE_URL,url=new URL(connection);if(!['localhost','127.0.0.1'].includes(url.hostname)||url.pathname!='/login_browser')throw Error('Loopback login_browser database required');
          const db=new pg.Client({connectionString:connection});await db.connect();const schema='login_'+randomUUID().replaceAll('-','');await db.query('CREATE SCHEMA '+schema);await db.query('SET search_path TO '+schema);url.searchParams.set('options','-c search_path='+schema);
          const dir=await mkdtemp(join(tmpdir(),'primecare-login-main-')),require=createRequire(import.meta.url),digest=v=>createHash('sha256').update(v).digest('hex');
          const receipt={workflow_id:'auth.change-password',passed:false,wholeTaskVerified:false,commit:process.env.GITHUB_SHA,cases:[],apiChecks:[],trace:[],navigation:[],source_bindings:{},limitations:['Loopback hosting with production source; not a deployed Cloudflare execution.','Cloudflare source limiter is a controlled synthetic binding; trusted source/origin headers are supplied by the harness.','Portal manifest only transports production theme plus fixture origin/name; no production business records.','Platform-admin landing only; all registered role destinations, full accessibility/PWA and independent review gates remain pending.']};
          let server,browser,bridgeFailure;const password='Synthetic-only!Login-2026',actor=randomUUID(),tenant=randomUUID(),foreign=randomUUID(),admin=randomUUID(),denied=randomUUID();
          const policy=JSON.parse(await readFile(out+'/governance.json','utf8'));assert.equal(policy.definition.definition_sha256,'9a459ca1184488951c65fb9e083d4ad881f3bda6647f2e0fa3c8347c7f61e876');receipt.definition_sha256=policy.definition.definition_sha256;
          try{
           await db.query('CREATE TABLE tenants(id uuid PRIMARY KEY,name text,slug text UNIQUE,status text,created_at timestamptz DEFAULT NOW(),updated_at timestamptz DEFAULT NOW());CREATE TABLE users(id uuid PRIMARY KEY,tenant_id uuid REFERENCES tenants(id),email text UNIQUE,roles text,password_hash text,status text,updated_at timestamptz DEFAULT NOW());CREATE TABLE auth_sessions(user_id uuid REFERENCES users(id),token_hash text,expires_at timestamptz)');
           for(const file of ['20260928_auth_rate_limits.sql','20261011_platform_administration.sql','20261013_screen_text.sql','20260928_auth_password_audit.sql','20261003_auth_password_resets.sql'])await db.query(await readFile('packages/database/migrations/'+file,'utf8'));
           await db.query("INSERT INTO tenants(id,name,slug,status) VALUES($1,'Synthetic Primary','synthetic-primary','active'),($2,'Synthetic Foreign','synthetic-foreign','active')",[tenant,foreign]);const hash=await bcrypt.hash(password,12);
           for(const [id,t,email,role]of [[actor,tenant,'platform@example.invalid','platform_admin'],[admin,foreign,'tenant-admin@example.invalid','tenant_admin'],[denied,tenant,'psw@example.invalid','psw']])await db.query("INSERT INTO users(id,tenant_id,email,roles,password_hash,status) VALUES($1,$2,$3,$4,$5,'active')",[id,t,email,role,hash]);
           const front=await build({entryPoints:['websites/typescript/src/main.ts'],bundle:true,write:false,metafile:true,platform:'browser',format:'iife'});
           const back=await build({stdin:{contents:"export {default as gateway} from './cloudflare/workers/src/gateway';export {default as service} from './cloudflare/workers/src/service';",resolveDir:process.cwd()},bundle:true,platform:'node',format:'cjs',write:false,metafile:true,external:['pg']});
           const backend=join(dir,'backend.cjs');await writeFile(backend,back.outputFiles[0].text.replaceAll('require("pg")',`require(${JSON.stringify(join(process.cwd(),'node_modules/pg'))})`));const {gateway,service}=require(backend);
           const paths=[...Object.keys(front.metafile.inputs),...Object.keys(back.metafile.inputs),'websites/typescript/src/styles.css',...['20260928_auth_rate_limits.sql','20261011_platform_administration.sql','20261013_screen_text.sql','20260928_auth_password_audit.sql','20261003_auth_password_resets.sql'].map(f=>'packages/database/migrations/'+f)];for(const path of paths)if(path!=='<stdin>'&&!path.includes('node_modules/'))receipt.source_bindings[path]=digest(await readFile(path));
           const env={DB_URL:url.toString(),AUTH_SOURCE_LIMIT:{limit:async()=>({success:true})}},css=await readFile('websites/typescript/src/styles.css','utf8');
           server=createServer(async(req,res)=>{try{const requestUrl=new URL(req.url,'http://fixture');
            if(requestUrl.pathname==='/app.js'){res.setHeader('content-type','text/javascript');res.end(front.outputFiles[0].text);return;}
            if(requestUrl.pathname==='/portal.json'){res.setHeader('content-type','application/json');res.end(JSON.stringify({project:'PrimeCare',appCode:'pc',name:'PrimeCare',apiGateway:origin,theme:policy.theme}));return;}
            if(['/login','/platform/administration','/'].includes(requestUrl.pathname)){const locale=requestUrl.searchParams.get('locale')||'en';res.setHeader('content-type','text/html');res.end(`<!doctype html><html lang="${['en','fr','es'].includes(locale)?locale:'en'}"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeCare synthetic login</title><style>${css}</style></head><body><div id="app"></div><script src="/app.js"></script></body></html>`);return;}
            if(requestUrl.pathname.startsWith('/v1/')){let body='';for await(const part of req)body+=part;const headers=new Headers(req.headers);headers.delete('accept-encoding');headers.set('origin','https://primecare-clinic.pages.dev');headers.set('cf-connecting-ip','192.0.2.1');
             const request=new Request(origin+req.url,{method:req.method,headers,...(body?{body}:{})});const bindings={AUTH:{fetch:r=>service.fetch(r,{...env,SERVICE_NAME:'auth'})},GOVERNANCE:{fetch:r=>service.fetch(r,{...env,SERVICE_NAME:'governance'})}};
             const response=await gateway.fetch(request,bindings);receipt.trace.push({path:requestUrl.pathname,method:req.method,status:response.status});res.writeHead(response.status,Object.fromEntries(response.headers));res.end(await response.text());return;}
            res.writeHead(404);res.end();
           }catch(error){bridgeFailure=error;res.writeHead(500);res.end('Synthetic bridge failure');}});await new Promise(r=>server.listen(0,'127.0.0.1',r));const origin='http://127.0.0.1:'+server.address().port;
           browser=await chromium.launch({headless:true});const cy=(page,id)=>page.locator('[data-cy="'+id+'"]');const waitLogin=async(page)=>{await cy(page,'login-submit').waitFor();};
           const submit=async(page,value=password)=>{await cy(page,'login-email').fill('platform@example.invalid');await cy(page,'login-password').fill(value);await cy(page,'login-submit').click();};
           const token=page=>page.evaluate(()=>sessionStorage.getItem('primecare_session'));
           const sessions=async()=>Number((await db.query('SELECT count(*) n FROM auth_sessions WHERE user_id=$1',[actor])).rows[0].n);
           for(const [locale,width]of [['en',320],['fr',1440],['es',768]]){
            const nextPassword='Synthetic-New-Password-'+locale+'-2026!';
            await db.query('DELETE FROM auth_sessions;DELETE FROM auth_rate_limits;DELETE FROM auth_password_audit;DELETE FROM auth_password_resets');await db.query("UPDATE users SET password_hash=$1,status='active' WHERE id=$2",[hash,actor]);
            const context=await browser.newContext({viewport:{width,height:1000},recordVideo:{dir:out+'/video',size:{width,height:1000}}}),page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
            try{
             await page.goto(origin+'/login?locale='+locale+'&enable-semantics=true');await waitLogin(page);await submit(page);await cy(page,'platform-topbar-tenant').waitFor();const bearer=await token(page);assert.ok(bearer);
             const login=await fetch(origin+'/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:'platform@example.invalid',password})});assert.equal(login.status,200);const extra=(await login.json()).token;assert.equal(await sessions(),2);
             await db.query("INSERT INTO auth_password_resets(token_hash,user_id,expires_at) VALUES($1,$2,NOW()+INTERVAL '1 hour')",[digest('synthetic-reset-'+locale),actor]);
             const snapshot=async()=>({password:(await db.query('SELECT password_hash FROM users WHERE id=$1',[actor])).rows[0].password_hash,sessions:Number((await db.query('SELECT count(*) n FROM auth_sessions WHERE user_id=$1',[actor])).rows[0].n),resets:Number((await db.query('SELECT count(*) n FROM auth_password_resets WHERE user_id=$1',[actor])).rows[0].n),audit:Number((await db.query('SELECT count(*) n FROM auth_password_audit WHERE user_id=$1',[actor])).rows[0].n)});
             const before=await snapshot();await cy(page,'platform-language').selectOption(locale);await cy(page,'platform-account-link').click();await cy(page,'change-password-form').waitFor();
             const change=async current=>{await cy(page,'current-password').fill(current);await cy(page,'new-password').fill(nextPassword);await cy(page,'change-password-submit').click();};
             let response=page.waitForResponse(r=>r.url().endsWith('/v1/user/change-password'));await change('Wrong-Synthetic-Password');assert.equal((await response).status(),401);assert.deepEqual(await snapshot(),before);
             await page.waitForFunction(()=>!document.querySelector('[data-cy=change-password-submit]').disabled);
             await context.setOffline(true);await change(password);await page.waitForFunction(()=>!document.querySelector('[data-cy=change-password-submit]').disabled);assert.deepEqual(await snapshot(),before);await context.setOffline(false);
             const foreignHash=(await db.query('SELECT password_hash FROM users WHERE id=$1',[admin])).rows[0].password_hash;
             const invalid=await fetch(origin+'/v1/user/change-password',{method:'POST',headers:{authorization:'Bearer '+bearer,'content-type':'application/json'},body:JSON.stringify({currentPassword:password,newPassword:nextPassword,userId:admin,tenantId:foreign})});assert.equal(invalid.status,400);assert.deepEqual(await snapshot(),before);assert.equal((await db.query('SELECT password_hash FROM users WHERE id=$1',[admin])).rows[0].password_hash,foreignHash);
             await db.query("CREATE FUNCTION fixture_password_audit_failure() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RAISE EXCEPTION 'Synthetic audit failure'; END $$;CREATE TRIGGER fixture_password_audit_failure BEFORE INSERT ON auth_password_audit FOR EACH ROW EXECUTE FUNCTION fixture_password_audit_failure()");
             try{response=page.waitForResponse(r=>r.url().endsWith('/v1/user/change-password'));await change(password);assert.equal((await response).status(),503);assert.deepEqual(await snapshot(),before);await page.waitForFunction(()=>!document.querySelector('[data-cy=change-password-submit]').disabled);}
             finally{await db.query('DROP TRIGGER fixture_password_audit_failure ON auth_password_audit;DROP FUNCTION fixture_password_audit_failure()');}
             response=page.waitForResponse(r=>r.url().endsWith('/v1/user/change-password'));await change(password);assert.equal((await response).status(),200);await waitLogin(page);assert.equal(await token(page),null);
             const after=await snapshot();assert.equal(after.sessions,0);assert.equal(after.resets,0);assert.equal(after.audit,1);assert.notEqual(after.password,before.password);assert.equal(await bcrypt.compare(nextPassword,after.password),true);assert.equal(await bcrypt.compare(password,after.password),false);
             for(const old of [bearer,extra])assert.equal((await fetch(origin+'/v1/auth/me',{headers:{authorization:'Bearer '+old}})).status,401);
             response=page.waitForResponse(r=>r.url().endsWith('/v1/auth/login'));await submit(page);assert.equal((await response).status(),401);assert.equal(await token(page),null);
             await page.waitForFunction(()=>!document.querySelector('[data-cy=login-submit]').disabled);
             await submit(page,nextPassword);await cy(page,'platform-topbar-tenant').waitFor();assert.equal(await sessions(),1);await page.reload();await cy(page,'platform-topbar-tenant').waitFor();assert.equal(await sessions(),1);assert.deepEqual(errors,[]);await page.screenshot({path:out+'/password-reauth-'+locale+'.png',fullPage:true});
             receipt.cases.push({locale,width,actorRole:'platform_admin',actualMainEntry:true,credentialLogin:true,accountUI:true,wrongPasswordDenied:true,offlineRetry:true,forgedIdentityRejected:true,auditRollback:true,successfulRetry:true,passwordHashVerified:true,allSessionsRevoked:true,resetsDeleted:true,singleAudit:true,oldPasswordDenied:true,newPasswordReauthentication:true,reload:true});
            }finally{const video=page.video();await context.close();if(video)await video.saveAs(out+'/password-reauth-'+locale+'.webm');}
           }
           const unauthorized=await fetch(origin+'/v1/user/change-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({currentPassword:password,newPassword:'Synthetic-Unauthorized-2026!'})});assert.equal(unauthorized.status,401);receipt.apiChecks.push('Missing session denied');
           const session=await fetch(origin+'/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:'psw@example.invalid',password})});assert.equal(session.status,200);const expired=(await session.json()).token;await db.query("UPDATE auth_sessions SET expires_at=NOW()-INTERVAL '1 minute' WHERE user_id=$1",[denied]);const rejected=await fetch(origin+'/v1/user/change-password',{method:'POST',headers:{authorization:'Bearer '+expired,'content-type':'application/json'},body:JSON.stringify({currentPassword:password,newPassword:'Synthetic-Expired-2026!'})});assert.equal(rejected.status,401);receipt.apiChecks.push('Expired session denied');
           const active=await fetch(origin+'/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:'psw@example.invalid',password})});assert.equal(active.status,200);const inactive=(await active.json()).token;await db.query("UPDATE users SET status='inactive' WHERE id=$1",[denied]);const inactiveResult=await fetch(origin+'/v1/user/change-password',{method:'POST',headers:{authorization:'Bearer '+inactive,'content-type':'application/json'},body:JSON.stringify({currentPassword:password,newPassword:'Synthetic-Inactive-2026!'})});assert.equal(inactiveResult.status,401);receipt.apiChecks.push('Inactive account session denied');if(bridgeFailure)throw bridgeFailure;
           for(const[path,sha]of Object.entries(receipt.source_bindings))assert.equal(digest(await readFile(path)),sha);receipt.passed=true;
          }catch(error){receipt.error=error.message;console.error(error);process.exitCode=1;}
          finally{if(browser)await browser.close();if(server)await new Promise(r=>server.close(r));await db.query('DROP SCHEMA '+schema+' CASCADE');await db.end();receipt.cleanup='Isolated synthetic schema dropped; production business data untouched';await writeFile(out+'/results.json',JSON.stringify(receipt,null,2));console.log(JSON.stringify({passed:receipt.passed,browserCases:receipt.cases.length,apiChecks:receipt.apiChecks.length,wholeTaskVerified:false,error:receipt.error}));}
          
          BROWSER
          node test-results/password-workflow-browser/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-change-current-main-browser
          path: test-results/password-workflow-browser
