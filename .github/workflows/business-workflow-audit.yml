name: Business workflow continuation audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/business-workflow-audit.yml', 'scripts/run-business-workflow-audit.mjs', 'scripts/test-care*.mjs', 'scripts/test-growth*.mjs', 'scripts/test-workspace*.mjs', 'scripts/test-account-admin*.mjs', 'scripts/test-care-metadata*.mjs', 'scripts/test-screen-text*.mjs', 'cloudflare/workers/src/care/**', 'cloudflare/workers/src/growth/**', 'websites/typescript/src/growth/**', 'packages/shared/src/growth/**', 'scripts/fixtures/growth-read-model.mjs']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        domain: [account, care, growth, workspace]
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: audit, POSTGRES_PASSWORD: fixture-only, POSTGRES_DB: login_browser}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U audit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKFLOW_TEST_DATABASE_URL: postgres://audit:fixture-only@localhost:5432/login_browser
      CARE_TEST_DATABASE_URL: postgres://audit:fixture-only@localhost:5432/login_browser
      GROWTH_TEST_DATABASE_URL: postgres://audit:fixture-only@localhost:5432/login_browser
      SCREEN_TEXT_TEST_DATABASE_URL: postgres://audit:fixture-only@localhost:5432/login_browser
      LOGIN_BROWSER_DATABASE_URL: postgres://audit:fixture-only@127.0.0.1:5432/login_browser
      AUTH_TEST_DATABASE_URL: postgres://audit:fixture-only@127.0.0.1:5432/auth_test
      AUTH_WORKSPACE_TEST_FIXTURE: '1'
      GOVERNANCE_ALLOW_SQLITE_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Prepare explicit isolated metadata and workspace fixture
        env: {GOVERNANCE_ALLOW_SQLITE_FIXTURES: '1'}
        run: |
          python3 tools/governance-production/prepare-ci-fixture.py
          python3 scripts/prepare-code-admin-audit-fixture.py
          mkdir -p test-results/workspace-logout
          cp tools/workflow-verification/specs/auth.logout.fixture.json test-results/workspace-logout/governance.json
      - name: Install isolated browser and database tools
        run: |
          npm install --prefix "$RUNNER_TEMP/workflow-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 pg@8.16.3 bcryptjs@3 jsdom@26 jsqr@1.4.0 axe-core@4.10.3 @twilio/voice-sdk@2.18.5 @electric-sql/pglite@0.3.14
          ln -s "$RUNNER_TEMP/workflow-tools/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Run every group and retain failures
        run: node scripts/run-business-workflow-audit.mjs '${{ matrix.domain }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-workflows-${{ matrix.domain }}
          path: test-results/
          retention-days: 14
