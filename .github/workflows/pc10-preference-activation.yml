name: Activate and verify owned PC10 cloud settings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pc10-preference-activation.yml'
      - 'tools/governance-production/pc10-preference-activation.mjs'
      - 'tools/governance-production/pc10-preference-retry-baseline.json'
      - 'scripts/test-pc10-preference-activation.mjs'
      - 'tools/auth-verification/test-live-pc10-preferences.py'
permissions: {contents: read}
concurrency:
  group: pc10-preference-activation
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: preference_test, POSTGRES_PASSWORD: isolated, POSTGRES_DB: preference_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PREFERENCE_TEST_DATABASE_URL: postgresql://preference_test:isolated@127.0.0.1:5432/preference_test
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/pc10-activation-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 pg@8.16.3 @electric-sql/pglite@0.3.14 bcryptjs@3.0.3 playwright@1.60.0
          ln -s /tmp/pc10-activation-tools/node_modules node_modules
          node_modules/.bin/playwright install --with-deps chromium
          node --test scripts/test-pc10-preference-activation.mjs scripts/test-preference-client.mjs scripts/test-preference-recovery.mjs scripts/test-auth-reconciled-source.mjs
          node scripts/test-preference-registration.mjs
          node scripts/test-preference-service.mjs
          node scripts/test-preference-browser.mjs
  activate-and-prove:
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    concurrency: {group: primecare-cloudflare-typescript-production, cancel-in-progress: false}
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACTIVATE_PC10_PREFERENCES: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install scoped readback and browser tools
        run: |
          npm install --prefix /tmp/pc10-activation-tools --ignore-scripts --no-audit --no-fund pg@8.16.3
          ln -s /tmp/pc10-activation-tools/node_modules node_modules
          python -m pip install psycopg[binary]==3.2.6 bcrypt==4.3.0 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Check exact live activation plan without writes
        run: node tools/governance-production/pc10-preference-activation.mjs
      - name: Promote existing endpoint and activate only its runtime flag
        id: activate
        run: node tools/governance-production/pc10-preference-activation.mjs --apply
      - name: Verify deployed owned UI API SQL reload denial and receipt behavior
        run: python tools/auth-verification/test-live-pc10-preferences.py
      - name: Restore previous runtime and metadata on failure
        if: failure() && steps.activate.outcome != 'skipped'
        run: node tools/governance-production/pc10-preference-activation.mjs --rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc10-preferences-production
          path: test-results/pc10-preferences
