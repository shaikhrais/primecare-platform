name: PrimeCare production release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-primecare.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primecare-production-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 5
    steps:
      - name: Cancel superseded standalone builds and Flutter website deployments
        uses: actions/github-script@v7
        with:
          script: |
            const runs = [];
            for (let page = 1; page <= 3; page++) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner, repo: context.repo.repo, branch: 'main', per_page: 100, page
              });
              runs.push(...response.data.workflow_runs);
              if (response.data.workflow_runs.length < 100) break;
            }
            let cancelled = 0;
            for (const run of runs) {
              if (run.id === context.runId || !['queued','in_progress','waiting','pending','requested'].includes(run.status)) continue;
              if (!(run.name.startsWith('Build ') || run.name.startsWith('Deploy Web - '))) continue;
              if (run.path === '.github/workflows/release-primecare.yml') continue;
              try {
                await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: run.id});
                core.info('Cancelled superseded standalone run: ' + run.name + ' #' + run.id);
                cancelled++;
              } catch (error) {
                if (![404,409].includes(error.status)) throw error;
              }
            }
            await core.summary.addHeading('Release preparation').addRaw('Cancelled ' + cancelled + ' superseded standalone runs. This release builds Windows apps and deploys websites from one source version.').write();
  apis:
    needs: prepare
    uses: ./.github/workflows/deploy-cloudflare-workers.yml
    with:
      confirm: DEPLOY
    secrets: inherit
  websites:
    needs: apis
    uses: ./.github/workflows/deploy-typescript-websites.yml
    with:
      confirm: DEPLOY
    secrets: inherit
  windows:
    needs: apis
    uses: ./.github/workflows/build_windows.yml
    secrets: inherit
