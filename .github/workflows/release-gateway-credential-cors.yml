name: Verify and release gateway credential CORS repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-gateway-credential-cors.yml, scripts/test-gateway-credential-cors.mjs]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primecare-cloudflare-typescript-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated validation and deployment dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/gateway-repair" --ignore-scripts esbuild@0.27.2 wrangler@4.68.1 pg@8.16.3 typescript@5.9.3 @types/node@22.19.7 @cloudflare/workers-types@4.20260403.1
          ln -s "$RUNNER_TEMP/gateway-repair/node_modules" node_modules
      - name: Verify allowed and denied credentialed CORS, passthrough and source types
        run: |
          node scripts/test-gateway-credential-cors.mjs
          npx tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --types node,@cloudflare/workers-types cloudflare/workers/src/gateway.ts
      - name: Verify pinned production authority before release
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          pip install -r tools/governance-production/requirements.txt
          python3 tools/governance-production/verify-production-reader.py
          python3 scripts/check-api-catalog-identity.py
          node scripts/generate-cloudflare-worker-config.mjs
      - name: Publish only the tested gateway with existing service bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config .cloudflare-workers/gateway.jsonc
      - name: Verify live credential preflight and rejection of untrusted origins
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://primecare-api-gateway.itpro-mohammed.workers.dev';
          for(const origin of ['https://primecare-clinic.pages.dev','https://foreign.example']){
            for(const [path,method,names] of [['/v1/auth/login','POST','content-type,x-device-id,x-requested-with'],['/v1/auth/me','GET','authorization,cache-control,x-device-id,x-requested-with']]){
              const r=await fetch(base+path,{method:'OPTIONS',headers:{Origin:origin,'Access-Control-Request-Method':method,'Access-Control-Request-Headers':names}});
              if(origin.includes('primecare-clinic')){
                assert.equal(r.status,204);assert.equal(r.headers.get('access-control-allow-origin'),origin);assert.equal(r.headers.get('access-control-allow-credentials'),'true');
                const allowed=r.headers.get('access-control-allow-headers').toLowerCase().split(',').map(value=>value.trim());for(const name of names.split(','))assert.ok(allowed.includes(name));
              }else{assert.equal(r.status,403);assert.equal(r.headers.get('access-control-allow-origin'),null);assert.equal(r.headers.get('access-control-allow-credentials'),null);}
            }
          }
          console.log('Live login and MFA confirmation preflights passed; foreign origins denied');
          JS
