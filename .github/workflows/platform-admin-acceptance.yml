name: Platform admin database and browser acceptance
on:
  push:
    branches: [main]
    paths: ['scripts/test-tenant-operations.mjs', 'websites/typescript/src/layout-customizer.ts', 'scripts/test-layout-manager-browser.mjs', 'websites/typescript/src/styles.css', 'websites/typescript/src/platform-admin.ts', 'websites/typescript/src/code-admin-layout.ts', '.github/workflows/platform-admin-acceptance.yml', 'scripts/browser-accessibility.mjs', 'scripts/test-admin-growth-accessibility.mjs', 'scripts/test-platform-admin-browser.mjs']
  pull_request:
    paths: ['cloudflare/workers/**', 'websites/typescript/**', 'scripts/*platform*', 'scripts/*accessibility*', 'scripts/*contrast*', 'scripts/*media-look*', 'scripts/register-look-manager.py', 'packages/shared/src/media/**', 'packages/shared/src/growth/**', 'docs/appearance/media/**', 'scripts/*territor*', 'scripts/*tenant-operations*', 'docs/platform-operations/**', 'docs/platform-bundle/**', 'scripts/test-public-territory-intake.mjs', 'packages/database/migrations/20261016_territory_intake.sql', 'packages/shared/src/platform-bundle/**', 'packages/database/migrations/20261016_platform_bundle.sql', 'packages/database/migrations/20261017_growth_capacity.sql', 'packages/shared/src/tenant-operations.json', 'packages/database/migrations/*tenant_operations*', 'docs/territories/**', 'packages/shared/src/territories/**', 'packages/database/migrations/*territor*', 'packages/database/migrations/20261011_platform_administration.sql', '.github/workflows/platform-admin-acceptance.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: platform
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U platform" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLATFORM_TEST_DATABASE_URL: postgresql://platform:integration-only@localhost:5432/platform
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated historical governance test fixture
        env:
          GOVERNANCE_ALLOW_SQLITE_FIXTURES: '1'
        run: python3 tools/governance-production/prepare-ci-fixture.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/platform-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 typescript@5.9.3 @types/node@22 @types/pg@8 pg@8.16.3 bcryptjs@3 axe-core@4.10.3 @twilio/voice-sdk@2.18.5
          ln -s "$RUNNER_TEMP/platform-tools/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Validate authority, persistence, concurrency and rollback
        run: node --test scripts/test-platform-bootstrap.mjs scripts/test-platform-administration-postgres.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check territory geography export
        run: |
          python3 -m pip install shapely==2.2.0
          python3 scripts/register-territory-governance.py --check
      - name: Check tenant operations governance
        run: python3 scripts/register-tenant-operations.py --check
      - name: Register and verify the first platform bundle
        env: {GOVERNANCE_ALLOW_SQLITE_FIXTURES: '1'}
        run: |
          python3 scripts/prepare-code-admin-audit-fixture.py
          python3 scripts/register-platform-bundle.py
          python3 scripts/register-platform-bundle.py --check
          python3 scripts/register-media-look.py
          python3 scripts/register-media-look.py --check
          git restore --worktree -- .
      - name: Validate launch, renewals, support and routing in PostgreSQL and browsers
        run: node --test scripts/test-platform-bundle.mjs
      - name: Validate bounded histories, scope, keyboard navigation and accessibility
        env:
          ACCESSIBILITY_CONTRAST_REVIEW: '1'
        run: node --test scripts/test-platform-history.mjs
      - name: Validate scoped attention queue and workflow correction navigation
        run: node --test scripts/test-platform-attention.mjs
      - name: Validate public territory routing with UUID and text tenant identities
        run: |
          python3 scripts/register-territory-intake.py
          python3 scripts/register-territory-intake.py --check
          node --test scripts/test-public-territory-intake.mjs
          PLATFORM_TEST_IDENTITY=text node --test scripts/test-public-territory-intake.mjs
      - name: Validate tenant operations summaries, scope and fix navigation
        run: node --test scripts/test-tenant-operations.mjs
      - name: Validate territory allocation, duplicate-sale races and browser workflows
        run: node --test scripts/test-territory-allocation.mjs
      - name: Build actual website from governed metadata
        run: |
          python3 scripts/register-platform-admin-role.py
          python3 scripts/register-admin-reports.py
          GOVERNANCE_ALLOW_SQLITE_FIXTURES=1 python3 scripts/export-typescript-websites.py --output artifacts/admin-website/manifests --gateway http://127.0.0.1:4184/test-api
          mkdir -p artifacts/admin-website/site/assets
          git restore --worktree -- .
          node_modules/.bin/esbuild websites/typescript/src/main.ts --bundle --outfile=artifacts/admin-website/site/assets/app.js
          cp websites/typescript/src/styles.css artifacts/admin-website/site/assets/app.css
          cp websites/typescript/index.html artifacts/admin-website/site/index.html
          cp -R websites/typescript/public/. artifacts/admin-website/site/
          node_modules/.bin/tsc --noEmit --allowImportingTsExtensions --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --resolveJsonModule --esModuleInterop --lib ES2022,DOM,DOM.Iterable cloudflare/workers/src/platform-administration.ts websites/typescript/src/main.ts
      - name: Record real platform-admin browser workflows
        run: node scripts/test-platform-admin-browser.mjs
      - name: Scan administrative and growth role accessibility
        id: accessibility
        continue-on-error: true
        env:
          ACCESSIBILITY_CONTRAST_REVIEW: '1'
        run: node --test scripts/test-admin-growth-accessibility.mjs
      - name: Summarize visible-state contrast evidence
        run: node scripts/summarize-contrast-review.mjs
      - name: Require accessibility acceptance
        if: always()
        run: test "${{ steps.accessibility.outcome }}" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-admin-workflow-video
          path: |
            artifacts/platform-admin-browser/
            test-results/territories/
            test-results/tenant-operations/
            test-results/platform-bundle/
            test-results/platform-attention/
            test-results/platform-history/
            test-results/accessibility/
            test-results/contrast/
            test-results/territory-intake/

