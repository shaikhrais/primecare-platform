name: Release downloaded screen text
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RELEASE_CURRENT_MAIN to retry the ordered release
        required: true
        type: string
      expected_sha:
        description: Exact current main commit to release
        required: true
        type: string
  pull_request:
    paths: ['.github/workflows/release-screen-text.yml', 'scripts/check-screen-text-release.py', 'scripts/verify-screen-text-deployment.mjs', 'docs/ui/screen-text-release.md']
  push:
    branches: [main]
    paths: ['cloudflare/workers/src/screen-text*', 'packages/database/migrations/*screen_text*', 'packages/flutter_core/lib/src/localization/live_screen_text.dart', 'websites/typescript/src/**']
permissions:
  contents: read
concurrency:
  group: primecare-screen-text-release
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit current-main retry
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$RELEASE_CONFIRM" = RELEASE_CURRENT_MAIN
          test "$EXPECTED_RELEASE_SHA" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: python scripts/check-screen-text-release.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check scripts/verify-screen-text-deployment.mjs
  prepare_portals:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 5
    steps:
      - name: Stop competing Flutter Pages releases for this source commit
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              branch: 'main', head_sha: context.sha, event: 'push', per_page: 100
            });
            let cancelled = 0;
            for (const run of result.data.workflow_runs) {
              if (run.id === context.runId || run.head_sha !== context.sha) continue;
              if (!run.name.startsWith('Deploy Web - ')) continue;
              if (!['queued','in_progress','waiting','pending','requested'].includes(run.status)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: run.id});
                cancelled++;
              } catch (error) {
                if (![404,409].includes(error.status)) throw error;
              }
            }
            core.info('Stopped ' + cancelled + ' competing Flutter Pages workflows for this commit. Native builds and unrelated releases are preserved.');
  release_tests:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: prepare_portals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: screen_text}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCREEN_TEXT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/screen_text
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated historical governance test fixture
        env:
          GOVERNANCE_ALLOW_SQLITE_FIXTURES: '1'
        run: python3 tools/governance-production/prepare-ci-fixture.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/screen-text-release" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 pg@8.16.3 bcryptjs@3 playwright@1.60.0 @twilio/voice-sdk@2.18.5
          ln -s "$RUNNER_TEMP/screen-text-release/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - run: python3 scripts/register-live-screen-text.py --check
      - run: node --test scripts/test-screen-text.mjs scripts/test-screen-text-cache.mjs scripts/test-screen-text-postgres.mjs scripts/test-screen-text-browser.mjs scripts/test-admin-training.mjs scripts/test-admin-training-browser.mjs
  migration:
    needs: release_tests
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply the additive screen text migration
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_DATABASE_URL" || { echo '::error::Production database configuration is unavailable to this job'; exit 1; }
          psql "$PRODUCTION_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/migrations/20261013_screen_text.sql
  apis:
    needs: migration
    uses: ./.github/workflows/deploy-cloudflare-workers.yml
    with: {confirm: DEPLOY}
    secrets: inherit
  websites:
    needs: apis
    uses: ./.github/workflows/deploy-typescript-websites.yml
    with: {confirm: DEPLOY}
    secrets: inherit
  smoke:
    needs: websites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/verify-screen-text-deployment.mjs
