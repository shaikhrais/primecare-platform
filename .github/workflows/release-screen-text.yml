name: Release downloaded screen text
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RELEASE_CURRENT_MAIN to retry the ordered release
        required: true
        type: string
      expected_sha:
        description: Exact current main commit to release
        required: true
        type: string
  pull_request:
    paths: ['.github/workflows/release-screen-text.yml', 'scripts/check-screen-text-release.py', 'scripts/verify-screen-text-deployment.mjs', 'docs/ui/screen-text-release.md']
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-cloudflare-workers.yml', 'cloudflare/workers/src/screen-text*', 'packages/database/migrations/*screen_text*', 'packages/flutter_core/lib/src/localization/live_screen_text.dart', 'websites/typescript/src/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: primecare-screen-text-release
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit current-main retry
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$RELEASE_CONFIRM" = RELEASE_CURRENT_MAIN
          test "$EXPECTED_RELEASE_SHA" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: python scripts/check-screen-text-release.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check scripts/verify-screen-text-deployment.mjs
  prepare_portals:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Require selected TypeScript runtime while preserving build verification
        run: python3 -m tools.deployment.runtime_policy all typescript --require
  release_tests:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: prepare_portals
    outputs:
      allow_legacy_publish: ${{ steps.scope.outputs.allow_legacy_publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: screen_text}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCREEN_TEXT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/screen_text
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Check scope rules
        run: python3 -m unittest tools.deployment.test_dashboard_publish_scope tools.deployment.test_dashboard_release_intent
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(python3 -m tools.deployment.dashboard_publish_scope "$EVENT" "$BEFORE" "$GITHUB_SHA")"
          echo "$result" >> "$GITHUB_OUTPUT"
      - name: Prepare isolated historical governance test fixture
        env:
          GOVERNANCE_ALLOW_SQLITE_FIXTURES: '1'
        run: python3 tools/governance-production/prepare-ci-fixture.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/screen-text-release" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 pg@8.16.3 bcryptjs@3 playwright@1.60.0 @twilio/voice-sdk@2.18.5
          ln -s "$RUNNER_TEMP/screen-text-release/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - run: python3 scripts/register-live-screen-text.py --check
      - run: node --test scripts/test-screen-text.mjs scripts/test-screen-text-cache.mjs scripts/test-screen-text-postgres.mjs scripts/test-screen-text-browser.mjs scripts/test-admin-training.mjs scripts/test-admin-training-browser.mjs
  migration:
    needs: release_tests
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'RELEASE_CURRENT_MAIN' && inputs.expected_sha == github.sha && needs.release_tests.outputs.allow_legacy_publish == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply the additive screen text migration
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_DATABASE_URL" || { echo '::error::Production database configuration is unavailable to this job'; exit 1; }
          psql "$PRODUCTION_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/migrations/20261013_screen_text.sql
  apis:
    needs: migration
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'RELEASE_CURRENT_MAIN' && inputs.expected_sha == github.sha
    uses: ./.github/workflows/deploy-cloudflare-workers.yml
    with: {confirm: DEPLOY}
    secrets: inherit
  websites:
    needs: apis
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'RELEASE_CURRENT_MAIN' && inputs.expected_sha == github.sha
    uses: ./.github/workflows/deploy-typescript-websites.yml
    with: {confirm: DEPLOY}
    secrets: inherit
  smoke:
    needs: websites
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'RELEASE_CURRENT_MAIN' && inputs.expected_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/verify-screen-text-deployment.mjs
