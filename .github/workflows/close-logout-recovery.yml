name: Close logout recovery lifecycle
on:
  push:
    branches: [main]
    paths: [.github/workflows/close-logout-recovery.yml]
permissions:
  contents: write
  checks: read
  actions: read
  pull-requests: read
jobs:
  close:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Validate release and final main, delete only merged work ref, save handoff
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,sys,json,time,subprocess,hashlib,pathlib,urllib.request
          base='https://api.github.com/repos/shaikhrais/primecare-platform/'
          def api(path):return json.load(urllib.request.urlopen(urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})))
          prs=[api('pulls/'+str(number)) for number in [213,214]]
          expected=['67d47d59b001b3ab1939a8891b036ed624aada5e','f4b9b7521cd79fd1725223ffb3a9fea368b92aa3']
          for pr,sha in zip(prs,expected):assert pr['merged'] and pr['state']=='closed' and pr['head']['sha']==sha
          names=['inspect-own-sessions','save-own-session-blocker','logout-workflow','record-logout-baseline','post-logout-recovery','retry-current-main-release','close-logout-recovery']
          temporary={'.github/workflows/'+name+'.yml' for name in names}
          for poll in range(120):
              release=api('actions/runs/39325668523')
              assert release['head_sha']=='2103a241b1b62e5f520aa615e7d14139f9bd9574' and release['event']=='workflow_dispatch'
              if release['status']!='completed':
                  print('Waiting for ordered release before branch cleanup',flush=True);time.sleep(10);continue
              if release['conclusion']!='success':raise RuntimeError('Required ordered release failed; preserve branch and inspect run 39325668523')
              release_jobs=api('actions/runs/39325668523/jobs?per_page=100')['jobs']
              required={'contract','prepare_portals','release_tests','migration','smoke'}
              assert required.issubset({j['name'] for j in release_jobs if j['conclusion']=='success'})
              assert all(j['status']=='completed' and j['conclusion'] in ['success','skipped'] for j in release_jobs)
              regression=api('actions/runs/39324494858')
              assert regression['status']=='completed' and regression['conclusion']=='success'
              repair_checks=api('commits/f6404eae1d70edf5d7a07cd47225817b014b9fa0/check-runs?per_page=100')['check_runs']
              assert {'contract-plan','generated-code','compression'}.issubset({c['name'] for c in repair_checks if c['conclusion']=='success'})
              if any(c['status']!='completed' for c in repair_checks):time.sleep(10);continue
              assert all(c['conclusion'] in ['success','skipped'] for c in repair_checks)
              main=api('branches/main')['commit']['sha'];subprocess.run(['git','fetch','origin','main'],check=True,stdout=subprocess.DEVNULL)
              files=set(subprocess.check_output(['git','ls-tree','-r','--name-only',main],text=True).splitlines())
              checks=api('commits/'+main+'/check-runs?per_page=100')['check_runs']
              failed=[c['name'] for c in checks if c['status']=='completed' and c['conclusion'] not in ['success','skipped']]
              if failed:raise RuntimeError('Final main checks failed; preserve branch: '+str(failed))
              if main!=os.environ['GITHUB_SHA'] and not temporary.intersection(files) and {'contract-plan','generated-code','compression'}.issubset({c['name'] for c in checks}) and all(c['status']=='completed' and c['conclusion']=='success' for c in checks):break
              print('Waiting for final operational cleanup and main checks',flush=True);time.sleep(10)
          else:raise RuntimeError('Release/final main validation still pending; preserve branch')
          for pr,sha in zip(prs,expected):
              subprocess.run(['git','merge-base','--is-ancestor',sha,main],check=True)
              subprocess.run(['git','merge-base','--is-ancestor',pr['merge_commit_sha'],main],check=True)
          branch='work/logout-session-confirmation'
          refs=dict(line.split('\t',1)[::-1] for line in subprocess.check_output(['git','ls-remote','--heads','origin'],text=True).splitlines())
          current=refs.get('refs/heads/'+branch)
          if current is not None:
              if current!=expected[1]:raise RuntimeError('Work ref changed; preserve unmerged work')
              subprocess.run(['git','push','--force-with-lease=refs/heads/'+branch+':'+expected[1],'origin',':refs/heads/'+branch],check=True)
          branches=api('branches?per_page=100');open_prs=api('pulls?state=open&per_page=100')
          assert [b['name'] for b in branches]==['main'] and not open_prs
          assert branches[0]['commit']['sha']==main
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import summary
          flows=[('auth.inspect-own-sessions',318),('auth.credential-login',320),('auth.change-password',321),('auth.logout',322),('care.psw.submit-availability',323)]
          cache={};handoffs={}
          with ProductionWorkflowStore() as db:
              counts=summary(db)
              for flow,attempt in flows:
                  row=db.execute('SELECT c.attempt_id,c.next_action,d.verification_status,d.test_status,d.blocker_json,a.source_bindings_json FROM virtual_workflow_checkpoints c JOIN virtual_workflow_definitions d ON d.flow_id=c.flow_id JOIN virtual_workflow_attempts a ON a.attempt_id=c.attempt_id WHERE c.flow_id=?',(flow,)).fetchone()
                  assert row and row[0]==attempt
                  if flow!='auth.inspect-own-sessions':
                      for path,sha in json.loads(row[5]).items():
                          if pathlib.PurePosixPath(path).is_absolute() or '..' in pathlib.PurePosixPath(path).parts:raise RuntimeError('Unsafe source binding')
                          if path not in cache:cache[path]=hashlib.sha256(subprocess.check_output(['git','show',main+':'+path])).hexdigest()
                          if cache[path]!=sha:raise RuntimeError('Passing proof became stale: '+flow+' '+path)
                  try:handoff=json.loads(row[1])
                  except (ValueError,TypeError):handoff={'previous_next_action':row[1]}
                  handoff.update(workflow_id=flow,attempt_id=attempt,main_sha=main,work_branch=None,work_branch_sha=None,active_branch='main',pr=None,prs=[{'number':p['number'],'merge_sha':p['merge_commit_sha'],'state':'merged and closed'} for p in prs],remote_branches=['main'],open_prs=0,cleanup_required=[],merge_state='Both PRs merged/closed; exact merged work ref deleted; no local task branch was created',ci_state='Original repair: 16 PR checks passed. Release fixture repair: five checks passed, six main-only jobs skipped on PR as designed. Current-main ordered tests/migration/Workers/websites/smoke and refreshed native browser proofs passed. Final main checks passed.',verification_status=row[2],test_status=row[3],blockers=json.loads(row[4] or '[]'),actor_role='platform_admin' if flow.startswith('auth.') else 'psw regression',live_counts=counts,release_run='https://github.com/shaikhrais/primecare-platform/actions/runs/39325668523',release_source_sha='2103a241b1b62e5f520aa615e7d14139f9bd9574',auth_evidence='https://github.com/shaikhrais/primecare-platform/actions/runs/39324494858/artifacts/12221567044',baseline_attempt=319,resolved_issue_ids=[16],unresolved_own_session_issue=12,synthetic_data_cleanup='All auth native fixtures dropped their isolated schemas; care uses disposable CI embedded data. No production synthetic users or role migrations. Release applied the existing additive screen-text schema migration.',next_workflow='auth.read-current-session',next_action='Refresh auth.read-current-session first: its previous scoped proof was correctly invalidated because bound auth-client/care-test sources changed. Read the live definition, APIs/permissions and checkpoint, then exercise safe current-session identity projection from real credential login through UI/API/native database/reload and denials. Own-session inspection remains missing with unregistered authenticated UI controls and draft/canonical endpoint mismatch; reuse its exact blocker instead of repeating unchanged diagnosis. All business processes remain unverified until full acceptance/evidence/review gates pass.')
                  payload=json.dumps(handoff,sort_keys=True)
                  db.execute("INSERT INTO virtual_workflow_checkpoints(flow_id,attempt_id,next_action) VALUES(?,?,?) ON CONFLICT(flow_id) DO UPDATE SET attempt_id=excluded.attempt_id,next_action=excluded.next_action,invalidation_json='[]',updated_at=CURRENT_TIMESTAMP",(flow,attempt,payload))
                  handoffs[flow]=handoff
              current=handoffs['auth.logout'];current['attempted_workflows']={flow:{'attempt_id':value['attempt_id'],'verification_status':value['verification_status'],'test_status':value['test_status']} for flow,value in handoffs.items()}
              current['test_status_counts']=list(db.execute("SELECT test_status,COUNT(*) FROM virtual_workflow_definitions WHERE flow_kind='business_process' GROUP BY test_status"))
              payload=json.dumps(current,sort_keys=True)
              db.execute("INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP",('recovery-handoff-current',payload))
          print('LOGOUT_LIFECYCLE_CLOSED '+payload)
          PY
