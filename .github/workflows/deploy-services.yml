name: Microservices Deployment Pipeline (Cloudflare)

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'packages/**'

jobs:
  deploy-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Turbo Build & Typecheck
        run: npx turbo build typecheck

      - name: Deploy API Gateway
        run: npx wrangler deploy --name primecare-api-gateway
        working-directory: services/api-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy Microservices
        run: npx turbo run deploy --filter='./services/*'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
