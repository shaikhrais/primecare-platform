name: Microservices Deployment Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'packages/**'

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Architecture
        run: dart analyze . --fatal-warnings

      - name: Build Services (AOT)
        run: |
          for dir in services/*; do
            if [ -f "$dir/pubspec.yaml" ]; then
              echo "Building service: $dir"
              cd "$dir"
              dart pub get
              # Ensure the bin directory exists and has a main entry
              if [ -d "bin" ]; then
                dart compile exe bin/server.dart -o bin/server.exe || echo "No bin/server.dart found, skipping AOT compile"
              fi
              cd - > /dev/null
            fi
          done

      # Future: Add Docker build and push steps here
