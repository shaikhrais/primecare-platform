name: Governance application tests
on:
  pull_request:
    paths: ['apps/primecare_governance/**', 'packages/flutter_core/**', 'packages/primecare_ui/**', 'packages/primecare_models/**', '.agents/governance/blueprints.yaml', '.github/workflows/governance-app-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/primecare_governance
      - run: flutter test
        working-directory: apps/primecare_governance
