name: Verify shared business rules and candidate task flows
on:
  push:
    branches: [main]
    paths:
      - 'packages/shared/src/business/**'
      - 'packages/shared/test/business-*.test.mjs'
      - 'packages/domain/src/services/LedgerService.ts'
      - 'packages/domain/src/services/TrainingService.ts'
      - 'packages/domain/src/utils/Result.ts'
      - 'scripts/test-ledger-account-isolation.mjs'
      - 'scripts/test-ledger-reversal-atomicity.mjs'
      - 'scripts/test-ledger-seal-postgres.mjs'
      - 'packages/domain/src/services/__tests__/LedgerVoid.test.ts'
      - 'scripts/test-training-certificate-validity.mjs'
      - 'scripts/test-training-module-boundary.mjs'
      - 'scripts/test-training-assignment-boundary.mjs'
      - 'scripts/test-training-completion-boundary.mjs'
      - 'scripts/test-training-tenant-boundary.mjs'
      - 'scripts/test-training-completion-postgres.mjs'
      - 'packages/database/prisma/schema/06_extensions.prisma'
      - 'packages/database/prisma/schema/d_training.prisma'
      - '.github/workflows/verify-business-domain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check shared rules and candidate handoffs without production access
        run: node --test packages/shared/test/business-*.test.mjs
      - name: Reject foreign ledger accounts and invalid training certificates
        run: node --test scripts/test-ledger-account-isolation.mjs scripts/test-ledger-reversal-atomicity.mjs scripts/test-training-certificate-validity.mjs scripts/test-training-module-boundary.mjs scripts/test-training-assignment-boundary.mjs scripts/test-training-completion-boundary.mjs scripts/test-training-tenant-boundary.mjs
  ledger-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: ledger_seal_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: fixture}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install isolated PostgreSQL adapter
        run: |
          npm install --prefix /tmp/ledger-seal-tools --ignore-scripts --no-audit --no-fund pg@8.16.3
          ln -s /tmp/ledger-seal-tools/node_modules node_modules
      - name: Verify native row locking and actual audit rollback
        run: node --test scripts/test-ledger-seal-postgres.mjs
        env:
          LEDGER_SEAL_TEST_DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/ledger_seal_test
  training-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: training_completion_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: fixture}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d training_completion_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install pinned isolated Prisma tools
        run: |
          npm install --prefix /tmp/training-native-tools --ignore-scripts --no-audit --no-fund prisma@5.22.0 @prisma/client@5.22.0
          ln -s /tmp/training-native-tools/node_modules node_modules
      - name: Verify actual Prisma tenant-filtered training completion on PostgreSQL
        run: node --test scripts/test-training-completion-postgres.mjs
        env:
          TRAINING_TEST_DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/training_completion_test
