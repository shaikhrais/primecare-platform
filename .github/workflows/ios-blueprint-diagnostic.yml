name: Diagnose unsigned Blueprint iOS build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-blueprint-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ios-blueprint-diagnostic-${{ github.sha }}
  cancel-in-progress: false

jobs:
  unsigned_blueprint:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared artifact inspection fixtures
        run: python3 scripts/test-apple-artifact-scope.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Prepare existing Blueprint iOS project
        working-directory: apps/primecare_enterprise_blueprint
        run: |
          flutter pub get
          if [ ! -d ios/Runner.xcodeproj ]; then
            flutter create --platforms=ios .
          fi
      - name: Diagnose unsigned device build and preserve its failure
        working-directory: apps/primecare_enterprise_blueprint
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --verbose 2>&1 | tee "$RUNNER_TEMP/ios-blueprint-build.log"
      - name: Inspect the unsigned Blueprint device bundle
        run: |
          python3 - <<'PYCODE'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('apple', 'scripts/test-apple-build-artifacts.py')
          apple = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(apple)
          result = apple.inspect_ios_bundle(
              Path('apps/primecare_enterprise_blueprint/build/ios/iphoneos/Runner.app'),
              'primecare_enterprise_blueprint', os.environ['GITHUB_SHA'])
          print(json.dumps(result))
          PYCODE
      - name: Retain the inspected unsigned device bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-blueprint-unsigned-${{ github.sha }}
          path: apps/primecare_enterprise_blueprint/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
      - name: Retain underlying Xcode build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-blueprint-build-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/ios-blueprint-build.log
          if-no-files-found: error
          retention-days: 7
