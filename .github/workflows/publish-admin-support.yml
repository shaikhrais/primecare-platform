name: Deploy and verify inherited Admin on Support
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy Worker and Support before live verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: primecare-cloudflare-typescript-production
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify-admin-rebuild.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate deployment configuration
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PRODUCTION_DATABASE_URL; do
            test -n "${!name}" || { echo "::error::Missing configuration: ${name}"; exit 1; }
          done
      - name: Install isolated dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/admin-publish" --ignore-scripts wrangler@4.68.1 pg@8.16.3 bcryptjs@3.0.2 playwright@1.60.0 typescript@5.9.3 @types/pg@8.15.5 @cloudflare/workers-types@4.20260403.1
          ln -s "$RUNNER_TEMP/admin-publish/node_modules" node_modules
      - name: Type check deployment entry and inspect existing schema
        run: |
          node_modules/.bin/tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --types @cloudflare/workers-types cloudflare/workers/src/service.ts
          node scripts/check-auth-schema.mjs
      - name: Build inherited Support with production API
        if: inputs.publish
        working-directory: apps/primecare_support
        run: |
          flutter pub get
          flutter analyze lib
          flutter build web --release --dart-define=AUTH_API_URL=https://primecare-api-gateway.itpro-mohammed.workers.dev/v1/auth
      - name: Deploy Auth Worker and Support Pages
        if: inputs.publish
        run: |
          node scripts/generate-cloudflare-worker-config.mjs
          node_modules/.bin/wrangler deploy --config .cloudflare-workers/auth.jsonc
          node_modules/.bin/wrangler pages deploy apps/primecare_support/build/web --project-name=primecare-support --branch=main --commit-hash="$GITHUB_SHA"
      - name: Wait for public deployment
        run: |
          curl --fail --retry 10 --retry-all-errors --retry-delay 5 --connect-timeout 15 --max-time 30 --output /dev/null https://primecare-support.pages.dev/
          curl --fail --retry 10 --retry-all-errors --retry-delay 5 --connect-timeout 15 --max-time 30 https://primecare-api-gateway.itpro-mohammed.workers.dev/v1/auth/health
      - name: Verify production Admin in EN ES FR
        env:
          CONFIRM_ADMIN_SMOKE: VERIFY_ADMIN
          ADMIN_UI_URL: https://primecare-support.pages.dev/
          GATEWAY_URL: https://primecare-api-gateway.itpro-mohammed.workers.dev
        run: |
          node_modules/.bin/playwright install --with-deps chromium
          node scripts/verify-production-admin.mjs
          echo 'PASS: live Support Admin and Auth Worker; production EN/ES/FR account, filter, audit, session and policy verification; owned fixtures removed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-production-failure
          path: admin-production-failure.png
          if-no-files-found: ignore
          retention-days: 1
