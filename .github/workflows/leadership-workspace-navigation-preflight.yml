name: Preflight Leadership managed navigation (isolated Flutter)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/leadership-workspace-navigation-preflight.yml
      - tests/fixtures/leadership/governed-workspace-navigation.patch
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply reviewed product candidate only in the disposable checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          patch=tests/fixtures/leadership/governed-workspace-navigation.patch
          git apply --check --whitespace=error-all "$patch"
          git apply --whitespace=error-all "$patch"
          git diff --check
          expected=$(printf '%s\n' packages/primecare_ui/lib/src/features/workspace/governed_workspace_screen.dart packages/primecare_ui/test/governed_workspace_session_test.dart)
          test "$(git diff --name-only)" = "$expected"
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - name: Install Flutter test dependencies
        working-directory: packages/primecare_ui
        run: flutter pub get
      - name: Verify exact route launch, closed boundaries, and existing shared workspaces
        working-directory: packages/primecare_ui
        run: flutter test test/governed_workspace_session_test.dart test/ceo_workspace_test.dart
