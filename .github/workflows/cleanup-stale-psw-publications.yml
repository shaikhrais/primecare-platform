name: Stop obsolete PSW publications before current EMS release
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cancel-stale-psw-publications.mjs'
      - 'scripts/test-cancel-stale-psw-publications.mjs'
      - '.github/workflows/cleanup-stale-psw-publications.yml'
      - '.github/workflows/psw-workspace.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, actions: write}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test scripts/test-cancel-stale-psw-publications.mjs
      - run: node scripts/cancel-stale-psw-publications.mjs
        env:
          GH_ACTION_TOKEN: ${{ github.token }}
