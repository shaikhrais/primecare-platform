name: Central Dart and UI inheritance
on:
  pull_request:
    paths:
      - 'packages/primecare_ui/lib/src/application/**'
      - 'packages/primecare_ui/lib/primecare_ui.dart'
      - 'packages/primecare_ui/test/base_primecare_app_test.dart'
      - 'packages/primecare_ui/test/base_workspace_controller_test.dart'
      - 'apps/*/lib/main.dart'
      - 'scripts/check-app-shell-inheritance.py'
      - 'packages/flutter_core/lib/business_core.dart'
      - 'packages/flutter_core/lib/*_service.dart'
      - 'packages/flutter_core/lib/models/domain_response.dart'
      - 'packages/flutter_core/lib/network/permission_service.dart'
      - 'packages/flutter_core/lib/src/application/**'
      - 'packages/flutter_core/lib/src/domain/models/**'
      - 'packages/flutter_core/lib/src/infrastructure/**'
      - 'packages/flutter_core/lib/src/security/policies/**'
      - 'packages/flutter_core/lib/src/models/**'
      - 'packages/flutter_core/lib/src/repositories/**'
      - 'packages/flutter_core/test/business_core_test.dart'
      - 'scripts/check-core-layer-migration.py'
      - 'packages/flutter_core/lib/controllers.dart'
      - 'packages/flutter_core/lib/src/controllers/**'
      - 'packages/flutter_core/test/base_controllers_test.dart'
      - 'packages/primecare_ui/lib/**/*_screen_controller.dart'
      - 'apps/**/lib/**/*_screen_controller.dart'
      - 'packages/server_core/**'
      - 'services/**/bin/server.dart'
      - 'services/**/lib/src/application/**'
      - 'scripts/refactor_service_entrypoints.py'
      - 'docs/refactoring/service-entrypoint-migration.*'
      - 'services/**/lib/routes.dart'
      - 'services/**/lib/src/features/**'
      - 'scripts/refactor_api_features.py'
      - 'scripts/verify_api_feature_parity.py'
      - 'docs/refactoring/api-feature-migration.*'
      - 'services/governance_api/lib/src/**'
      - 'services/governance_api/test/governance_shared_parents_test.dart'
      - 'packages/database_client/lib/src/base_repository.dart'
      - 'packages/database_client/lib/database_client.dart'
      - 'scripts/refactor_governance_layers.py'
      - 'scripts/verify_governance_layer_parity.py'
      - 'docs/refactoring/governance-layer-migration.*'
      - 'scripts/check-api-route-inheritance.py'
      - 'docs/refactoring/api-route-migration.*'
      - 'services/**/pubspec.yaml'
      - 'services/**/Dockerfile'
      - 'docker-compose.yml'
      - 'docs/architecture/**'
      - 'scripts/check-controller-inheritance.py'
      - 'scripts/check-http-host-inheritance.py'
      - 'scripts/generate-controller-compile-test.py'
      - 'scripts/nuke_and_restore_controllers.js'
      - '.github/workflows/central-inheritance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inheritance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Check pinned controller identity and Dart route compatibility
        run: |
          python3 scripts/check-controller-inheritance.py
          python3 scripts/check-http-host-inheritance.py
          python3 scripts/check-api-route-inheritance.py
          python3 scripts/refactor_api_features.py --check
          python3 scripts/refactor_governance_layers.py --check
          python3 scripts/refactor_service_entrypoints.py --check
          python3 scripts/check-app-shell-inheritance.py
          python3 scripts/check-core-layer-migration.py
      - name: Resolve shared Flutter dependencies
        working-directory: packages/flutter_core
        run: flutter pub get
      - name: Compile every migrated controller and test shared lifecycle
        run: |
          python3 scripts/generate-controller-compile-test.py
          cd packages/flutter_core
          flutter test test/base_controllers_test.dart test/controller_migration_compile_test.dart
          flutter analyze lib/controllers.dart lib/src/controllers test/base_controllers_test.dart
      - name: Verify shared Dart host
        working-directory: packages/server_core
        run: |
          dart pub get
          dart analyze lib test
          dart test
      - name: Analyze every Dart service entry point
        run: |
          for service in services/*; do
            if [ -f "$service/bin/server.dart" ]; then
              (cd "$service" && dart pub get && dart analyze bin/server.dart)
            fi
          done
      - name: Compare every extracted route against its original response
        run: python3 scripts/verify_api_feature_parity.py
      - name: Verify governance controller and repository extraction
        run: |
          python3 scripts/verify_governance_layer_parity.py
          cd services/governance_api
          dart analyze lib/src/controllers lib/src/core/base_controller.dart lib/src/core/base_repository.dart lib/src/repositories/governance_repository.dart lib/src/routes test/governance_shared_parents_test.dart
          dart test test/governance_shared_parents_test.dart
      - name: Verify shared Flutter application shell
        working-directory: packages/primecare_ui
        run: |
          flutter pub get
          flutter analyze lib/src/application test/base_primecare_app_test.dart test/base_workspace_controller_test.dart
          flutter test test/base_primecare_app_test.dart test/base_workspace_controller_test.dart
      - name: Verify business, repository, model and permission parents
        working-directory: packages/flutter_core
        run: |
          flutter analyze lib/business_core.dart lib/src/application lib/src/domain/models lib/src/infrastructure lib/src/security/policies lib/network/permission_service.dart test/business_core_test.dart
          flutter test test/business_core_test.dart test/provider_profile_test.dart test/own_notifications_repository_test.dart test/business_development_transport_test.dart
