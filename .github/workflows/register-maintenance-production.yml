name: Validate and bind existing maintenance workflow
on:
  push:
    branches: [main]
    paths: [.github/workflows/register-maintenance-production.yml]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: maintenance_metadata_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U primecare -d maintenance_metadata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e632f7f8890f3610ff5032653cba0d62a891eea7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Transaction rollback authority and namespace regression checks
        env:
          WORKFLOW_TEST_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/maintenance_metadata_test
        run: python tools/governance-production/test-maintenance-registration.py
  register:
    needs: isolated
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e632f7f8890f3610ff5032653cba0d62a891eea7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Apply only existing maintenance metadata in one pinned transaction
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_MAINTENANCE_REGISTRATION_WRITES: '1'
        run: python -u tools/governance-production/maintenance_flow_binding.py --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-production-registration
          path: test-results/maintenance-registration
