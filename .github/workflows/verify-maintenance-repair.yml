           const read=(token,headers={},suffix='',method='GET')=>fetch(origin+'/v1/auth/maintenance/configuration'+suffix,{method,headers:{...(token?{authorization:'Bearer '+token}:{}),...headers}});
           const login=async email=>{const r=await fetch(origin+'/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});assert.equal(r.status,200);return(await r.json()).token;};
           const check=async(token,t=tenant)=>{const before=await snapshot(),r=await read(token);assert.equal(r.status,200);assert.equal(r.headers.get('cache-control'),'no-store');const value=await r.json(),row=(await db.query('SELECT sender,templates,revision,updated_at FROM tenant_mail_configuration WHERE tenant_id=$1',[t])).rows[0];assert.equal(value.sender,row.sender);assert.equal(value.revision,row.revision);assert.equal(value.updatedAt,row.updated_at.toISOString());assert.equal(value.provider,'cloudflare');assert.equal(value.keyConfigured,false);assert.equal(value.bindingConfigured,true);assert.equal(value.encryptionReady,true);assert.equal(value.deliveryVerified,false);assert.equal(value.emailReady,row.sender===env.EMAIL_ALLOWED_SENDER);assert.deepEqual(value.templates,{...canonicalTemplates,...Object.fromEntries(Object.entries(row.templates).map(([key,v])=>[key,{...v,required:canonicalTemplates[key].required}]))});assert.deepEqual(value.audit,(await db.query('SELECT action,created_at FROM tenant_configuration_audit WHERE tenant_id=$1 ORDER BY created_at DESC LIMIT 20',[t])).rows.map(a=>({action:a.action,created_at:a.created_at.toISOString()})));assert.ok(!JSON.stringify(value).includes(secret));assert.ok(!JSON.stringify(value).includes(env.CONFIG_ENCRYPTION_KEY));assert.ok(!JSON.stringify(value).includes(url.toString()));assert.equal(Object.hasOwn(value,'api_key_ciphertext'),false);assert.deepEqual(await snapshot(),before);return value;};
           const ceoToken=await login('ceo@example.invalid'),maintToken=await login('maintenance@example.invalid'),foreignToken=await login('foreign-maintenance@example.invalid'),platformToken=await login('platform@example.invalid'),pswToken=await login('psw@example.invalid');
           await check(ceoToken);await check(maintToken);await check(foreignToken,foreign);receipt.apiChecks.push('CEO and maintenance read exact native sender/revision/templates/readiness/latest20 audit entries; secrets remain server-only and tenant-local');
           browser=await chromium.launch({headless:true});const cy=(page,id)=>page.locator('[data-cy="'+id+'"]');
           for(const [role,email,locale,width]of [['ceo','ceo@example.invalid','en',320],['maintenance','maintenance@example.invalid','en',1440],['maintenance','maintenance@example.invalid','fr',768],['maintenance','maintenance@example.invalid','es',1280]]){
