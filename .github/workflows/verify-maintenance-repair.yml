           const backend=join(dir,'backend.cjs');await writeFile(backend,back.outputFiles[0].text.replaceAll('require("pg")',`require(${JSON.stringify(join(process.cwd(),'node_modules/pg'))})`));const {gateway,service}=require(backend);
           const paths=[...Object.keys(front.metafile.inputs),...Object.keys(back.metafile.inputs),'websites/typescript/src/styles.css',...['20260926_auth_sessions.sql','20260928_auth_rate_limits.sql','20260928_auth_account_audit.sql','20260928_auth_management_audit.sql','20261003_maintenance_configuration.sql','20261011_platform_administration.sql','20261013_screen_text.sql'].map(f=>'packages/database/migrations/'+f)];for(const path of paths)if(path!=='<stdin>'&&!path.includes('node_modules/'))receipt.source_bindings[path]=digest(await readFile(path));
           let mailCalls=0;const secret='synthetic-server-only-'+randomUUID(),env={DB_URL:url.toString(),CONFIG_ENCRYPTION_KEY:'a'.repeat(64),EMAIL:{send:async()=>{mailCalls++;throw Error('Mail forbidden in read-only inspection');}},EMAIL_FROM:'default@example.invalid',EMAIL_ALLOWED_SENDER:'primary-sender@example.invalid',AUTH_SOURCE_LIMIT:{limit:async()=>({success:true})}},css=await readFile('websites/typescript/src/styles.css','utf8');
