           settings.templates={password_reset:{subject:canonicalTemplates.password_reset.subject,title:canonicalTemplates.password_reset.title,body:canonicalTemplates.password_reset.body}};assert.ok(validateSettings(settings));
           for(const [id,sender,revision]of [[tenant,primarySender,7],[foreign,foreignSender,13]])await db.query('INSERT INTO tenant_mail_configuration(tenant_id,sender,api_key_ciphertext,templates,revision) VALUES($1,$2,$3,$4,$5)',[id,sender,secret,JSON.stringify(settings.templates),revision]);
           for(let i=0;i<23;i++)await db.query("INSERT INTO tenant_configuration_audit(tenant_id,actor_user_id,action,created_at) VALUES($1,$2,'email_configuration_changed',NOW()-($3||' minutes')::interval)",[tenant,maint,String(i)]);
