name: Verify complete maintenance repair candidate
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-maintenance-repair.yml]
concurrency:
  group: primecare-maintenance-repair-candidate
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: maintenance_metadata_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U primecare -d maintenance_metadata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 100c63aea562eb8a998d6617ffb16273a966715f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Verify bounded writer rollback idempotence authority and source binding
        env:
          WORKFLOW_TEST_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/maintenance_metadata_test
        run: python tools/governance-production/test-maintenance-registration.py
  requirements:
    needs: safety
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 100c63aea562eb8a998d6617ffb16273a966715f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Bind exact candidate source and load current production requirements
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_MAINTENANCE_REGISTRATION_WRITES: '1'
        run: |
          python -u - <<'PY'
          import sys,json,pathlib
          sys.path.insert(0,'tools/governance-production')
          from maintenance_registration import MaintenanceRegistrationStore
          from maintenance_flow_binding import bind
          flow='auth.inspect-email-config'
          with MaintenanceRegistrationStore() as db:
              binding=bind(db)
              def rows(name,where='',parameters=()):
                  keys=[c['name'] for c in db.tables[name]['columns']]
                  return [dict(zip(keys,r)) for r in db.execute('SELECT * FROM '+name+(' WHERE '+where if where else ''),parameters)]
              result={name:rows(name,'flow_id=?',(flow,)) for name in ['virtual_workflow_definitions','virtual_workflow_steps','virtual_workflow_source_links','virtual_workflow_checkpoints']}
              result['apis']=rows('api_endpoints',"route_path LIKE ?",('%maintenance/configuration%',))
              result['linked_screens']=rows('screens','id=1264')
              for name in ['screen_components','screen_required_elements','screen_sections','screen_section_elements','role_screen_permissions','screen_api_links']:
                  result[name]=rows(name,'screen_id=1264')
              result['screen_permissions']=result['role_screen_permissions']
              result['theme']=dict(db.execute('SELECT css_variable_name,token_value FROM theme_design_tokens WHERE theme_id=1 AND active=1'))
              result['resources']=[dict(zip(['resource_key','language_code','translated_text'],r)) for r in db.execute("SELECT r.resource_key,l.language_code,v.translated_text FROM language_resources r JOIN language_resource_values v USING(resource_id) JOIN languages l USING(language_id) WHERE r.context='maintenance' AND v.approved=1")]
              result['totals']=dict(db.execute("SELECT verification_status,COUNT(*) FROM virtual_workflow_definitions WHERE flow_kind='business_process' GROUP BY verification_status"))
              checkpoint=dict(main_sha=__import__('os').environ['GITHUB_SHA'],active_branch='work/auth-maintenance-repair-20261019',work_branch_sha='100c63aea562eb8a998d6617ffb16273a966715f',pr=215,workflow_id=flow,stage='Production metadata and exact source binding ready; full browser replay and current PR CI pending',binding=binding,next_action='Complete the current maintenance browser replay and current-head CI; merge and remove the sole work branch; record focused closures only from current evidence')
              db.execute('INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP',('maintenance-repair-in-progress',json.dumps(checkpoint,sort_keys=True)))
          path=pathlib.Path('test-results/email-config');path.mkdir(parents=True,exist_ok=True);(path/'governance.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print('MAINTENANCE_REPAIR_REQUIREMENTS '+json.dumps(dict(binding=binding,apis=len(result['apis']),controls=len(result['screen_components']),resources=len(result['resources']))))
          
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-current-requirements
          path: test-results
  native:
    needs: requirements
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: login_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U primecare -d login_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 100c63aea562eb8a998d6617ffb16273a966715f
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-current-requirements
          path: test-results
      - run: |
          npm install --prefix /tmp/maintenance-repair --ignore-scripts --no-audit --no-fund pg@8.16.3 bcryptjs@3 esbuild@0.27.2 playwright@1.55.1 @axe-core/playwright@4.10.2
          ln -s /tmp/maintenance-repair/node_modules node_modules
          node /tmp/maintenance-repair/node_modules/playwright/cli.js install --with-deps chromium
      - name: Real credential UI API PostgreSQL reload denial recovery and locale verification
        env:
          LOGIN_BROWSER_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/login_browser
          VERIFICATION_SOURCE_SHA: 100c63aea562eb8a998d6617ffb16273a966715f
        run: node scripts/test-maintenance-read-workflow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-complete-repair-evidence
          path: test-results
