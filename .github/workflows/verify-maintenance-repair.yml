          let server,browser,bridgeFailure;const password='Synthetic-only!Login-2026',actor=randomUUID(),tenant=randomUUID(),foreign=randomUUID(),admin=randomUUID(),denied=randomUUID();
          const policy=JSON.parse(await readFile(out+'/governance.json','utf8'));const definition=policy.virtual_workflow_definitions[0];assert.equal(definition.definition_sha256,'6150401698099eb793f1d2fb6f78a27e861818ca9064b94527608b376646f7da');receipt.definition_sha256=definition.definition_sha256;receipt.failures=[];receipt.limitations=['Actual main browser/gateway/inherited service with native PostgreSQL; not deployed Cloudflare execution.','EMAIL binding and server configuration use isolated fixtures; no email is sent.','Email configuration API has no live registered endpoint; screen1264 has no registered controls. Source behavior cannot establish governed acceptance.','Full accessibility/PWA/performance, governed playback and independent reviews pending.'];
          try{
