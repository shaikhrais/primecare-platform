            res.writeHead(404);res.end();
           }catch(error){bridgeFailure=error;res.writeHead(500);res.end('Synthetic bridge failure');}});await new Promise(r=>server.listen(0,'127.0.0.1',r));const origin='http://127.0.0.1:'+server.address().port;
          
           const ceo=randomUUID(),maint=randomUUID(),foreignMaint=randomUUID();
           for(const [id,t,email,role]of [[ceo,tenant,'ceo@example.invalid','ceo'],[maint,tenant,'maintenance@example.invalid','maintenance'],[foreignMaint,foreign,'foreign-maintenance@example.invalid','maintenance']])await db.query("INSERT INTO users(id,tenant_id,email,roles,password_hash,status) VALUES($1,$2,$3,$4,$5,'active')",[id,t,email,role,hash]);
           const primarySender='primary-sender@example.invalid',foreignSender='foreign-sender@example.invalid';
           const override={password_reset:{subject:'Synthetic code {{code}}',title:'Synthetic reset',body:'Synthetic code {{code}} for {{email}}'}};
           const canonicalTemplates=JSON.parse(await readFile('cloudflare/workers/src/email-templates.json','utf8'));override.password_reset.required=canonicalTemplates.password_reset.required;
