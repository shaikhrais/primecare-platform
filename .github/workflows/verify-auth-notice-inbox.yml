name: Verify auth lifecycle security notice inbox
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-auth-notice-inbox.yml
      - tools/auth-verification/security_notice_inbox.py
      - tools/auth-verification/test-live-security-notice-inbox.py
      - tools/auth-verification/test_live_security_totp.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auth-owned-inbox-browser
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install native database reader
        timeout-minutes: 5
        run: |
          pip install psycopg[binary]==3.2.13 bcrypt==4.3.0
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix "$RUNNER_TEMP/notice-reader" --ignore-scripts pg@8.16.3
          ln -s "$RUNNER_TEMP/notice-reader/node_modules" node_modules
      - name: Verify notice MIME and cleanup guards
        run: |
          python tools/auth-verification/test-owned-inbox-parser.py
          python tools/auth-verification/test-security-notice-inbox.py
      - name: Verify pinned production governance authority
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python tools/governance-production/verify-production-reader.py
      - name: Verify deployed API lifecycle and actual localized security notice receipt
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/auth-verification/test-live-security-notice-inbox.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-auth-notice-inbox
          path: test-results/security-notice-inbox
          retention-days: 90
