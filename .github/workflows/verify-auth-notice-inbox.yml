name: Verify auth lifecycle security notice inbox
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-auth-notice-inbox.yml
      - tools/auth-verification/security_notice_inbox.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: auth-owned-inbox-browser
  cancel-in-progress: false
jobs:
  deploy:
    uses: ./.github/workflows/_deploy-web.yml
    with:
      app: primecare_clinic
      project: primecare-clinic
    secrets: inherit
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require promoted registered auth source
        run: |
          python - <<'PYCODE'
          import json
          assert json.load(open('tools/auth-verification/auth-lifecycle-candidate.json')).get('state')=='promoted'
          PYCODE
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install psycopg[binary]==3.2.13 bcrypt==4.3.0 playwright==1.58.0
          python -m playwright install --with-deps chromium
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix "$RUNNER_TEMP/mfa-reader" --ignore-scripts pg@8.16.3
          ln -s "$RUNNER_TEMP/mfa-reader/node_modules" node_modules
      - name: Verify browser focus handoff and rejection of lost input
        run: python -m unittest tools.deployment.test_flutter_browser
      - uses: actions/download-artifact@v4
        with:
          name: flutter-build-primecare-clinic
          path: test-results/flutter-build
      - name: Verify pinned production governance authority
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python tools/governance-production/verify-production-reader.py
      - name: Verify deployed English French Spanish MFA and exact synthetic cleanup
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          VERIFY_MFA_LIFECYCLE: '1'
          VERIFY_MFA_NOTICE_INBOX: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/auth-verification/test-live-flutter-mfa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-auth-notice-inbox
          path: test-results/live-flutter-mfa
          retention-days: 90
