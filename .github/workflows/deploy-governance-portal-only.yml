name: Deploy Governance portal only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-governance-portal-only.yml']
  # A push only exercises the read-only rehearsal, never the publish path.
  workflow_dispatch:
    inputs:
      mode:
        description: Verify without publishing, or explicitly publish to Governance
        type: choice
        options: [verify-only, publish]
        default: verify-only
      expected_main:
        description: Exact tested main commit
        required: true
        type: string
      previous_live:
        description: Exact currently verified Governance portal commit
        required: true
        type: string
      verified_run_id:
        description: Successful verify-only run on the identical main commit (publish only)
        required: false
        type: string
      confirm:
        description: For publish only, type DEPLOY GOVERNANCE
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && 'primecare-cloudflare-typescript-production' || format('primecare-governance-verify-{0}', github.run_id) }}
  cancel-in-progress: false
env:
  PROJECT: primecare-governance
  API_GATEWAY_URL: https://primecare-api-gateway.itpro-mohammed.workers.dev
  EXPECTED_MAIN: ${{ github.event_name == 'push' && github.sha || inputs.expected_main }}
  PREVIOUS_LIVE: ${{ github.event_name == 'push' && '48e6d4edee1020cc059fa4cfb840c4ec690dddf0' || inputs.previous_live }}
  CONFIRM: ${{ inputs.confirm }}
  VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
  RELEASE_MODE: ${{ github.event_name == 'push' && 'verify-only' || inputs.mode }}
jobs:
  build:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-only') || github.event.before == '718a9194702925e3b2f5741b10ad9dcf7794ec71'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check approval and exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ && "$PREVIOUS_LIVE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          case "$RELEASE_MODE" in
            verify-only) test -z "$CONFIRM" && test -z "$VERIFIED_RUN_ID" ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r tools/governance-production/requirements.txt
      - run: python -m unittest tools.deployment.test_portal_artifact tools.deployment.test_typescript_release
      - run: node --test scripts/test-typescript-screen-manager.mjs scripts/test-workspace-route-handoffs.mjs scripts/test-workspace-manager-boundaries.mjs
      - name: Build with the existing read-only metadata export
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: node scripts/build-typescript-websites.mjs
      - name: Seal tested output
        run: python -m tools.deployment.portal_artifact seal "websites/typescript/dist/$PROJECT" "$PROJECT" "$GITHUB_SHA" "$RUNNER_TEMP/governance-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: governance-portal-bundle
          path: websites/typescript/dist/primecare-governance
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: governance-portal-receipt
          path: ${{ runner.temp }}/governance-receipt.json
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Check artifact and publish only if requested
    needs: build
    if: always() && !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && needs.build.result == 'skipped') || ((github.event_name == 'push' || inputs.mode == 'verify-only') && needs.build.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: ${{ inputs.mode == 'publish' && 'primecare-cloudflare-primecare-governance' || format('primecare-governance-artifact-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Pin previous verify-only run and select artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ && "$PREVIOUS_LIVE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$EXPECTED_MAIN" != "$PREVIOUS_LIVE"
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          case "$RELEASE_MODE" in
            verify-only)
              test -z "$CONFIRM" && test -z "$VERIFIED_RUN_ID"
              printf 'run_id=%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
              ;;
            publish)
              test "$CONFIRM" = 'DEPLOY GOVERNANCE'
              [[ "$VERIFIED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              test "$VERIFIED_RUN_ID" != "$GITHUB_RUN_ID"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID" > "$RUNNER_TEMP/verify-run.json"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID/jobs" > "$RUNNER_TEMP/verify-jobs.json"
              python -m tools.deployment.governance_verify_run "$RUNNER_TEMP/verify-run.json" "$RUNNER_TEMP/verify-jobs.json" "$EXPECTED_MAIN" "$VERIFIED_RUN_ID"
              printf 'run_id=%s\n' "$VERIFIED_RUN_ID" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/download-artifact@v4
        with:
          name: governance-portal-bundle
          path: release/governance
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: governance-portal-receipt
          path: release/proof
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'publish'
        with:
          name: governance-publish-evidence
          path: release/prior
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Recheck prior live version and exact artifact
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.deployment.runtime_policy "$PROJECT" typescript --require
          python -m tools.deployment.portal_artifact check release/governance "$PROJECT" "$GITHUB_SHA" release/proof/governance-receipt.json
          if [[ "$RELEASE_MODE" == publish ]]; then
            python -m tools.deployment.typescript_release live "$PROJECT" "$PREVIOUS_LIVE" --baseline release/prior/before.json --record release/proof/before.json
          else
            python -m tools.deployment.typescript_release live "$PROJECT" "$PREVIOUS_LIVE" --record release/proof/before.json
          fi
          python -m tools.deployment.portal_artifact check-contract release/governance "$PROJECT" "$GITHUB_SHA" release/proof/before.json
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          test "$GITHUB_SHA" = "$EXPECTED_MAIN"
      - name: Recheck production preconditions and publish only the tested Governance artifact
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.68.1 --version
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          python -m tools.deployment.typescript_release live "$PROJECT" "$PREVIOUS_LIVE" --baseline release/proof/before.json
          npx --yes wrangler@4.68.1 pages deploy release/governance --project-name=primecare-governance --branch=main --commit-hash="$GITHUB_SHA"
      - name: Record successful verification without publishing
        if: github.event_name == 'push' || inputs.mode == 'verify-only'
        run: echo "Governance bundle verified. No deployment performed." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify live source and exact assets
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        run: python -m tools.deployment.typescript_release verify-deploy release/governance "$PROJECT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-publish-evidence
          path: release/proof
          if-no-files-found: error
          retention-days: 30
