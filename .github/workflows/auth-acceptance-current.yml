name: Inspect current production auth acceptance
on:
  push:
    branches: [main]
    paths: [.github/workflows/auth-acceptance-current.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix /tmp/auth-reader --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/auth-reader/node_modules node_modules
          pip install -r tools/governance-production/requirements.txt
      - name: Read current pinned auth acceptance after account UI source binding
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python -u - <<'PY'
          import sys,json,pathlib
          sys.path.insert(0,'tools/governance-production')
          from production_reader import connect
          out=pathlib.Path('test-results/auth-current');out.mkdir(parents=True,exist_ok=True)
          with connect() as db:
              def rows(sql,args=()):
                  names,values=db.query(sql,args)
                  return [dict(zip(names,row)) for row in values]
              flows=rows("SELECT * FROM virtual_workflow_definitions WHERE flow_kind='business_process' AND flow_id LIKE 'auth.%' ORDER BY flow_id")
              snapshots=rows("SELECT * FROM virtual_flow_catalog_snapshots WHERE name IN ('auth-completion-current','execution-handoff-current')")
              apis=rows("SELECT * FROM api_endpoints WHERE route_path LIKE '/v1/auth/%' OR route_path LIKE '/v1/user/%' OR route_path LIKE '/v1/admin/users%'")
              packet={'flows':flows,'snapshots':snapshots,'apis':apis,'recovery_policy_registered':'auth_recovery_web_policy' in db.tables}
              (out/'packet.json').write_text(json.dumps(packet,indent=2))
              for f in flows:
                  definition=json.loads(f['definition_json'])
                  print('AUTH_ACCEPTANCE '+json.dumps({'id':f['flow_id'],'status':f['verification_status'],'test_status':f['test_status'],'blockers':json.loads(f['blocker_json'] or '[]'),'definition':definition}))
              print('AUTH_API_CONTRACTS '+json.dumps(apis))
              print('RECOVERY_POLICY_REGISTERED '+str(packet['recovery_policy_registered']))
              for table,query in [
                  ('mutation_api_metadata',"SELECT * FROM api_endpoints WHERE (route_path='/v1/auth/register' AND http_method='POST') OR (route_path='/v1/admin/users' AND http_method='POST') OR (route_path='/v1/admin/users/{userId}/sessions' AND http_method='DELETE')"),
                  ('mutation_api_permissions',"SELECT p.* FROM api_permissions p JOIN api_endpoints a ON a.id=p.api_id WHERE (a.route_path='/v1/auth/register' AND a.http_method='POST') OR (a.route_path='/v1/admin/users' AND a.http_method='POST') OR (a.route_path='/v1/admin/users/{userId}/sessions' AND a.http_method='DELETE')"),
                  ('hr_dashboard',"SELECT id,app_id,role_id,screen_code,route_path,active FROM screens WHERE role_id=27 AND screen_code LIKE '%dashboard%'"),
                  ('role_directory',"SELECT id,role_code,role_name,active FROM roles WHERE active=1"),
                  ('ceo_account_screens',"SELECT * FROM screens WHERE id IN (705,903,935)"),
                  ('ceo_account_roles',"SELECT * FROM role_screen_permissions WHERE screen_id IN (705,903,935)"),
                  ('ceo_account_components',"SELECT * FROM screen_components WHERE screen_id IN (705,903,935)"),
                  ('ceo_account_elements',"SELECT * FROM screen_required_elements WHERE screen_id IN (705,903,935)"),
                  ('ceo_account_links',"SELECT * FROM screen_api_links WHERE screen_id IN (705,903,935)"),
                  ('ceo_account_policy',"SELECT * FROM auth_account_management_policy"),
                  ('ceo_creation_policy',"SELECT * FROM auth_account_creation_policy"),
                  ('ceo_roles',"SELECT * FROM roles WHERE role_code IN ('ceo','hr_director')"),
                  ('own_session_steps',"SELECT * FROM virtual_workflow_steps WHERE flow_id IN ('auth.inspect-own-sessions','auth.revoke-own-sessions')"),
                  ('component_registry',"SELECT id,component_code,html_tag_equivalent,active FROM primecare_ui_component_registry WHERE active=1"),
                  ('app_bindings',"SELECT id,app_code FROM apps"),
                  ('route_registry',"SELECT * FROM auth_route_registry"),
                  ('account_screens',"SELECT id,screen_code,route_path,actual_file_path,active FROM screens WHERE LOWER(screen_code) LIKE '%success%' OR LOWER(screen_code) LIKE '%account%' OR LOWER(screen_code) LIKE '%profile%' OR route_path IN ('/success','/account','/user/sessions')"),
                  ('self_session_apis',"SELECT * FROM api_endpoints WHERE route_path='/v1/user/sessions'"),
                  ('screens',"SELECT id,screen_code,route_path,actual_file_path,active FROM screens WHERE screen_code IN ('forgot_password','reset_password','login')"),
                  ('resources',"SELECT * FROM language_resources WHERE resource_key LIKE 'authRecovery.%'"),
                  ('components',"SELECT * FROM screen_components WHERE screen_id IN (SELECT id FROM screens WHERE screen_code IN ('forgot_password','reset_password'))"),
                  ('elements',"SELECT * FROM screen_required_elements WHERE screen_id IN (SELECT id FROM screens WHERE screen_code IN ('forgot_password','reset_password'))"),
                  ('links',"SELECT * FROM screen_api_links WHERE screen_id IN (SELECT id FROM screens WHERE screen_code IN ('forgot_password','reset_password'))")]:
                  print('RECOVERY_METADATA '+json.dumps({'table':table,'rows':rows(query)}))
              for table in ['screens','auth_route_registry','primecare_ui_component_registry','screen_components','screen_required_elements','screen_api_links','api_endpoints','language_resources','language_resource_values','role_screen_permissions','auth_account_management_policy','auth_account_creation_policy','virtual_workflow_definitions','virtual_workflow_steps','virtual_workflow_source_links']:
                  print('RECOVERY_SCHEMA '+json.dumps(db.tables[table.lower()]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-auth-acceptance
          path: test-results/auth-current
          retention-days: 90
