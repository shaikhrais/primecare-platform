name: Dashboard page projection
on:
  push:
    branches: [main]
    paths:
      - packages/shared/src/dashboard-pages/**
      - packages/primecare_ui/web/dashboard-pages.ts
      - packages/primecare_ui/web/supporting-pages.ts
      - packages/primecare_ui/web/record-pages.ts
      - scripts/test-dashboard-record-pages.mjs
      - packages/flutter_core/lib/dashboard_pages*
      - packages/flutter_core/lib/dashboard_pages/**
      - packages/flutter_core/test/dashboard_pages/**
      - packages/primecare_ui/lib/dashboard_pages.dart
      - websites/typescript/src/tenant-dashboard/dashboard-page-transport.ts
      - scripts/test-dashboard-pages-*.mjs
      - .github/workflows/dashboard-pages-projection.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: |
          npm install --prefix /tmp/dashboard-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 playwright@1.60.0 @electric-sql/pglite@0.3.14 bcryptjs@3.0.2 pg@8.16.3
          ln -s /tmp/dashboard-tools/node_modules node_modules
          npx playwright install --with-deps chromium
          node --test scripts/test-dashboard-pages-projection.mjs scripts/test-dashboard-pages-session.mjs scripts/test-dashboard-record-pages.mjs
          node scripts/test-dashboard-pages-parity.mjs
          node scripts/test-dashboard-pages-integration.mjs
          node scripts/test-dashboard-pages-browser.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM --resolveJsonModule packages/primecare_ui/web/dashboard-pages.ts packages/primecare_ui/web/supporting-pages.ts packages/primecare_ui/web/record-pages.ts websites/typescript/src/tenant-dashboard/dashboard-page-transport.ts
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: psw_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: fixture}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PSW_TEST_DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/psw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: |
          npm install --prefix /tmp/dashboard-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 bcryptjs@3.0.2 pg@8.16.3
          ln -s /tmp/dashboard-tools/node_modules node_modules
          npx playwright install --with-deps chromium
          node scripts/test-dashboard-pages-integration.mjs
          node scripts/test-dashboard-pages-browser.mjs

  native:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/flutter_core
      - run: flutter analyze --no-fatal-infos lib/dashboard_pages lib/dashboard_pages.dart test/dashboard_pages
        working-directory: packages/flutter_core
      - run: flutter test test/dashboard_pages --reporter expanded
        working-directory: packages/flutter_core
