name: Deploy Web - primecare-marketing

on:
  push:
    branches: [main]
    paths:
      - 'apps/primecare_marketing/**'
      - 'packages/flutter_core/**'
      - 'packages/primecare_ui/**'
      - '.github/workflows/deploy-web-marketing.yml'
      - '.github/workflows/_deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-web.yml
    with:
      app: primecare_marketing
      project: primecare-marketing
    secrets: inherit
