name: PrimeCare independent call audit release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/call-audit-release.yml'
      - 'cloudflare/workers/src/business-tasks/call-audit*.ts'
      - 'scripts/*call-audit*.mjs'
      - 'tools/governance-production/call_audit*.py'
      - 'tools/governance-production/call-audit*.json'
      - 'packages/database/migrations/20261027_communication_call_audit.sql'
permissions: {contents: read}
concurrency: {group: primecare-call-audit-release, cancel-in-progress: false}
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: audit_fixture, POSTGRES_PASSWORD: disposable-only, POSTGRES_DB: call_audit_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U audit_fixture -d call_audit_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUDIT_TEST_DATABASE_URL: postgres://audit_fixture:disposable-only@localhost:5432/call_audit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/audit-test" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 twilio@6.2.0 pg@8.16.3 @types/pg@8.15.5 typescript@5.9.3 @types/node@24.0.0 @cloudflare/workers-types@4.20260403.1 miniflare@4.20260730.0
          ln -s "$RUNNER_TEMP/audit-test/node_modules" node_modules
      - run: |
          node --test scripts/test-verification-outcome.mjs scripts/test-call-audit.mjs scripts/test-vapi-service-auth.mjs scripts/test-vapi-call-read.mjs scripts/test-vapi-call-identity.mjs
          node scripts/migrate-call-audit.mjs --reference
          node scripts/test-call-audit-postgres.mjs
          node scripts/test-call-audit-provider-workerd.mjs
          node scripts/test-vapi-spoken-workerd.mjs
          node scripts/test-vapi-callback-worker-workerd.mjs
          node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions --resolveJsonModule --types node,@cloudflare/workers-types cloudflare/workers/src/business-tasks/call-audit-events-worker.ts cloudflare/workers/src/business-tasks/vapi-spoken-worker.ts cloudflare/workers/src/business-tasks/vapi-callback-worker.ts
          node --check scripts/deploy-call-audit.mjs
      - uses: actions/upload-artifact@v4
        with: {name: call-audit-schema-reference, path: test-results/call-audit/reference.json, retention-days: 30}
  deploy:
    if: contains(github.event.head_commit.message, 'CALL_AUDIT_ACTIVATE')
    needs: tests
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: call-audit-schema-reference, path: test-results/call-audit}
      - run: |
          npm install --prefix "$RUNNER_TEMP/audit-deploy" --ignore-scripts --no-audit --no-fund twilio@6.2.0 pg@8.16.3 wrangler@4.68.1 esbuild@0.27.2
          ln -s "$RUNNER_TEMP/audit-deploy/node_modules" node_modules
          pip install -r tools/governance-production/requirements.txt
      - name: Register exact private audit storage and provider contract
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_CALL_AUDIT_STORAGE_WRITES: '1'
          GOVERNANCE_CALL_AUDIT_REGISTRATION: '1'
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python tools/governance-production/call_audit_storage.py --register
          python tools/governance-production/call_audit_registration.py --apply > "$RUNNER_TEMP/audit-registration.txt"
          python - <<'PY'
          import os,json,pathlib
          rows=[json.loads(s.removeprefix('CALL_AUDIT_REGISTRATION ')) for s in (pathlib.Path(os.environ['RUNNER_TEMP'])/'audit-registration.txt').read_text().splitlines() if s.startswith('CALL_AUDIT_REGISTRATION ')]
          assert len(rows)==1 and rows[0]['independentReadback']
          pathlib.Path('test-results/call-audit/api-registration.json').write_text(json.dumps(rows[0]))
          PY
      - name: Apply and independently verify the private PostgreSQL schema
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CALL_AUDIT_SCHEMA_APPLY: '1'
        run: |
          node scripts/migrate-call-audit.mjs --apply
          node scripts/migrate-call-audit.mjs --verify
      - name: Deploy audit and instrument existing tools; preserve credentials and routing
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPI_PRIVATE_API_KEY: ${{ secrets.VAPI_PRIVATE_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
        run: |
          node scripts/deploy-call-audit.mjs
          node scripts/verify-call-audit.mjs
