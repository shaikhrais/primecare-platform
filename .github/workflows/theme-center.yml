  pull_request:
    paths: ['scripts/migrate-clinical-semantic-palette.py', 'scripts/clinical-semantic-palette-manifest.json', 'scripts/tests/test_migrate_clinical_semantic_palette.py', 'packages/primecare_ui_foundation/**', 'packages/flutter_core/pubspec.yaml', 'packages/primecare_ui/pubspec.yaml', 'packages/flutter_core/lib/**', 'packages/flutter_core/test/shared_primitives_migration_compile_test.dart', 'scripts/migrate-core-shared-primitives.py', 'scripts/core-shared-primitives-manifest.json', 'scripts/tests/test_migrate_core_shared_primitives.py', 'scripts/migrate-generated-possessives.py', 'scripts/generated-possessive-manifest.json', 'scripts/tests/test_migrate_generated_possessives.py', 'scripts/tests/fixtures/generated_possessives/**', 'scripts/migrate-target-role-headings.py', 'scripts/target-role-heading-manifest.json', 'scripts/tests/test_migrate_target_role_headings.py', 'scripts/migrate-premium-semantic-accents.py', 'scripts/tests/test_migrate_premium_semantic_accents.py', 'scripts/migrate-premium-primary-brand.py', 'scripts/tests/test_migrate_premium_primary_brand.py', 'scripts/migrate-muted-sections.py', 'scripts/tests/test_migrate_muted_sections.py', 'scripts/migrate-premium-progress.py', 'scripts/tests/test_migrate_premium_progress.py', 'apps/**/lib/**', 'apps/**/test/shared_text_migration_compile_test.dart', 'scripts/migrate-generated-theme.py', 'scripts/tests/test_migrate_generated_theme.py', 'scripts/migrate-shared-loading.py', 'scripts/tests/test_migrate_shared_loading.py', 'scripts/migrate-api-error-borders.py', 'scripts/tests/test_migrate_api_error_borders.py', 'scripts/migrate-shared-workspace-pages.py', 'scripts/tests/test_migrate_shared_workspace_pages.py', 'scripts/migrate-shared-text.py', 'scripts/migrate-shared-status.py', 'scripts/tests/test_migrate_shared_status.py', 'scripts/migrate-shared-buttons.py', 'scripts/tests/test_migrate_shared_buttons.py', 'scripts/tests/test_migrate_shared_text.py', 'packages/primecare_ui/lib/**', 'packages/primecare_ui/test/**', 'websites/typescript/**', 'packages/domain/src/theme_center.ts', 'packages/flutter_core/lib/theme/**', 'packages/flutter_core/lib/src/resilience/**', 'packages/flutter_core/lib/registry/widgets/**', 'packages/flutter_core/test/theme*.dart', 'packages/primecare_ui/lib/src/theme/**', 'packages/primecare_ui/lib/src/localization/**', 'packages/primecare_ui/lib/src/components/**', 'packages/primecare_ui/lib/src/screens/admin/**', 'packages/primecare_ui/test/admin_role_carousel_localization_test.dart', 'packages/primecare_ui/test/auth_unavailable_localization_test.dart', 'apps/**/assets/translations/**', 'packages/flutter_core/assets/translations/**', 'packages/flutter_core/lib/src/localization/*.json', 'packages/primecare_ui/test/theme_consumers_test.dart', 'packages/primecare_ui/test/fixtures/generated_theme_fixture.dart', 'apps/primecare_enterprise_blueprint/**', 'scripts/check-admin-localization.py', 'scripts/register-admin-reality-filters.py', 'scripts/register-theme-center-options.py', 'packages/primecare_ui/test/admin_reality_filter_localization_test.dart', 'scripts/audit-ui-localization.py', 'scripts/implement_screens_from_db.py', 'scripts/test-theme-center-browser.mjs', 'scripts/generate-theme-center-catalog.mjs', 'scripts/primecare_presets.json', '.github/workflows/theme-center.yml']
permissions:
  contents: read
concurrency:
  group: theme-center-${{ github.ref }}
  cancel-in-progress: false
jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated historical governance test fixture
        env:
          GOVERNANCE_ALLOW_SQLITE_FIXTURES: '1'
        run: python3 tools/governance-production/prepare-ci-fixture.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/theme-center-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 typescript@5.9.3 @twilio/voice-sdk@2.18.5
          ln -s "$RUNNER_TEMP/theme-center-tools/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/generate-theme-center-catalog.mjs --check
      - run: node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --resolveJsonModule --esModuleInterop --lib ES2022,DOM,DOM.Iterable websites/typescript/src/main.ts
      - run: node scripts/test-layout-manager-browser.mjs
      - run: node scripts/test-theme-center-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: theme-center-website, path: artifacts/theme-center}
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated historical governance test fixture
        env:
          GOVERNANCE_ALLOW_SQLITE_FIXTURES: '1'
        run: python3 tools/governance-production/prepare-ci-fixture.py
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Generate web oracle fixtures required by the complete Flutter test suite
        run: |
          npm install --prefix /tmp/theme-native-fixtures --ignore-scripts --no-audit --no-fund esbuild@0.27.2
          ln -s /tmp/theme-native-fixtures/node_modules node_modules
          node scripts/page-template-fixtures.mjs
          node scripts/advanced-theme-fixtures.mjs
          node scripts/workspace-navigation-fixtures.mjs
          node scripts/workspace-native-contract-fixtures.mjs
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/primecare_ui_foundation
      - run: flutter test
        working-directory: packages/primecare_ui_foundation
      - run: flutter pub get
        working-directory: packages/flutter_core
      - run: flutter analyze lib/theme/personal_theme.dart lib/theme/theme_library_provider.dart lib/theme/theme_settings_provider.dart lib/registry/widgets/theme_center_panel.dart lib/registry/widgets/theme_settings_drawer.dart lib/registry/widgets/governance_master_layout.dart
        working-directory: packages/flutter_core
      - run: flutter test test/theme_center_test.dart
        working-directory: packages/flutter_core
      - run: flutter test test
        working-directory: packages/flutter_core
      - run: python3 scripts/test_dashboard_generator.py
      - name: Verify conservative themed workspace migration
        run: python3 -m unittest discover -s scripts/tests -p test_migrate_shared_workspace_pages.py
      - name: Verify generated API error border migration
        run: python3 -m unittest discover -s scripts/tests -p test_migrate_api_error_borders.py
      - run: python3 scripts/register-theme-center-options.py --check
      - run: python3 scripts/register-admin-reality-filters.py --check
      - run: python3 scripts/check-admin-localization.py --check
      - run: python3 scripts/audit-ui-localization.py
      - run: flutter pub get
        working-directory: packages/primecare_ui
      - run: flutter test test/clinical_semantic_palette_compile_test.dart test/clinical_semantic_palette_test.dart test/clinical_dashboard_failclosed_test.dart test/shared_primitive_identity_test.dart test/generated_possessives_compile_test.dart test/target_role_headings_theme_test.dart test/premium_semantic_accents_theme_test.dart test/premium_primary_brand_theme_test.dart test/premium_audit_panel_theme_test.dart test/muted_sections_part_*_compile_test.dart test/muted_sections_theme_test.dart test/prime_linear_progress_indicator_test.dart test/prime_page_scaffold_test.dart test/generated_theme_part_2_compile_test.dart test/generated_theme_part_1_compile_test.dart test/prime_status_test.dart test/prime_loading_indicator_test.dart test/generated_palette_migration_compile_test.dart test/shared_status_migration_compile_test.dart test/theme_consumers_test.dart test/base_primecare_app_test.dart test/admin_role_carousel_localization_test.dart test/auth_unavailable_localization_test.dart test/admin_reality_filter_localization_test.dart
        working-directory: packages/primecare_ui
      - run: flutter pub get
        working-directory: apps/primecare_enterprise_blueprint
      - run: flutter test test/widget_test.dart
        working-directory: apps/primecare_enterprise_blueprint
  migrated-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [primecare_business_development, primecare_client, primecare_clinic, primecare_corporate, primecare_franchise, primecare_enterprise_blueprint, primecare_governance, primecare_marketing, primecare_support]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated historical governance test fixture
        env:
          GOVERNANCE_ALLOW_SQLITE_FIXTURES: '1'
        run: python3 tools/governance-production/prepare-ci-fixture.py
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: apps/${{ matrix.app }}
      - name: Compile migrated consumer libraries
        run: flutter test test/shared_text_migration_compile_test.dart
        working-directory: apps/${{ matrix.app }}
