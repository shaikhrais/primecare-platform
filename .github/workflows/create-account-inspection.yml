name: Inspect governed tenant account creation
on:
  push:
    branches: [main]
    paths: [.github/workflows/create-account-inspection.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  requirements:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix /tmp/govt-reader --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/govt-reader/node_modules node_modules
          pip install -r tools/governance-production/requirements.txt
      - name: Load live specifications and theme after merge
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import sys,json,pathlib,sqlite3
          sys.path.insert(0,'tools/governance-production')
          from production_reader import connect
          flow='auth.create-tenant-account'
          with connect() as db:
              db.row_factory=sqlite3.Row
              result={}
              for name in ['virtual_workflow_definitions','virtual_workflow_steps','virtual_workflow_source_links','virtual_workflow_checkpoints']:
                  result[name]=[dict(r) for r in db.execute('SELECT * FROM '+name+' WHERE flow_id=?',(flow,))]
              result['apis']=[dict(r) for r in db.execute("SELECT * FROM api_endpoints WHERE route_path LIKE '%admin/users%' OR route_path='/v1/auth/register'")]
              ids=[r['id'] for r in result['apis']]
              result['permissions']=[dict(r) for r in db.execute('SELECT * FROM api_permissions WHERE api_id IN ('+','.join('?' for _ in ids)+')',ids)] if ids else []
              result['screen_links']=[dict(r) for r in db.execute('SELECT * FROM screen_api_links WHERE api_id IN ('+','.join('?' for _ in ids)+')',ids)] if ids else []
              result['policy_schema']=[dict(r) for r in db.execute('PRAGMA table_info(auth_account_creation_policy)')]
              result['creation_policy']=[dict(r) for r in db.execute('SELECT * FROM auth_account_creation_policy')]
              result['roles']=[dict(r) for r in db.execute("SELECT id,role_code,role_name,active,post_login_route FROM roles WHERE role_code IN ('ceo','hr_director','platform_admin')")]
              result['related_screens']=[dict(r) for r in db.execute("SELECT s.* FROM screens s JOIN roles r ON r.id=s.role_id WHERE r.role_code IN ('ceo','hr_director')")]
              result['policy_roles']=[dict(r) for r in db.execute('SELECT p.*,a.role_code actor_role,t.role_code target_role FROM auth_account_creation_policy p JOIN roles a ON a.id=p.actor_role_id JOIN roles t ON t.id=p.target_role_id')]
              result['required_elements']=[dict(r) for r in db.execute('SELECT * FROM screen_required_elements WHERE screen_id IN (705,903,935,39,314)')]
              result['section_elements']=[dict(r) for r in db.execute('SELECT * FROM screen_section_elements WHERE screen_id IN (705,903,935,39,314)')]
              result['components']=[dict(r) for r in db.execute('SELECT * FROM screen_components WHERE screen_id IN (705,903,935,39,314)')]
              result['ui_schema']={name:[dict(r) for r in db.execute('PRAGMA table_info('+name+')')] for name in ['screen_required_elements','screen_section_elements','screen_components','screen_component_map']}
              result['creation_sections']=[dict(r) for r in db.execute("SELECT * FROM screen_sections WHERE lower(section_code) LIKE '%account%' OR lower(section_code) LIKE '%user%' OR lower(section_name) LIKE '%account%' OR lower(section_name) LIKE '%creation%'")]
              result['metadata_tables']=[dict(r) for r in db.execute("SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE '%element%' OR name LIKE '%component%' OR name LIKE '%resource%')")]
              result['guides']=[dict(r) for r in db.execute("SELECT * FROM virtual_role_flow_guides WHERE guide_json LIKE '%/v1/auth/admin/users%' OR guide_json LIKE '%auth.create-tenant-account%'")]
              result['snapshot']=[dict(r) for r in db.execute("SELECT * FROM virtual_flow_catalog_snapshots WHERE name='recovery-handoff-current'")]
              result['totals']=[dict(r) for r in db.execute("SELECT verification_status,COUNT(*) n FROM virtual_workflow_definitions WHERE flow_kind='business_process' GROUP BY verification_status")]
              result['schema']={name:[dict(r) for r in db.execute('PRAGMA table_info('+name+')')] for name in ['screens','screen_sections','screen_elements']}
              path=pathlib.Path('test-results/create-tenant-account');path.mkdir(parents=True,exist_ok=True)
              (path/'governance.json').write_text(json.dumps(result,indent=2))
              print('CREATE_ACCOUNT_INSPECTION '+json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: create-account-live-requirements
          path: test-results/
  native:
    needs: requirements
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: login_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U primecare -d login_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: create-account-live-requirements
          path: test-results
      - run: |
          npm install --prefix /tmp/create-account --ignore-scripts --no-audit --no-fund pg@8.16.3 bcryptjs@3 esbuild@0.27.2
          ln -s /tmp/create-account/node_modules node_modules
      - name: Test credential login and native creation API while UI is missing
        env:
          LOGIN_BROWSER_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/login_browser
        run: |
          cat > test-results/create-tenant-account/run.mjs <<'NATIVE'
          import assert from 'node:assert/strict';
          import pg from 'pg';import bcrypt from 'bcryptjs';import {build} from 'esbuild';
          import {readFile,writeFile,mkdir,mkdtemp} from 'node:fs/promises';import {createRequire} from 'node:module';import {createServer} from 'node:http';import {createHash,randomUUID} from 'node:crypto';import {tmpdir} from 'node:os';import {join} from 'node:path';
          const out='test-results/create-tenant-account';await mkdir(out,{recursive:true});
          if(process.env.PRODUCTION_DATABASE_URL||process.env.GOVERNANCE_DATABASE_URL)throw Error('Production credentials forbidden in browser fixture');
          const connection=process.env.LOGIN_BROWSER_DATABASE_URL,url=new URL(connection);if(!['localhost','127.0.0.1'].includes(url.hostname)||url.pathname!='/login_browser')throw Error('Loopback login_browser database required');
          const db=new pg.Client({connectionString:connection});await db.connect();const schema='login_'+randomUUID().replaceAll('-','');await db.query('CREATE SCHEMA '+schema);await db.query('SET search_path TO '+schema);url.searchParams.set('options','-c search_path='+schema);
          const dir=await mkdtemp(join(tmpdir(),'primecare-login-main-')),require=createRequire(import.meta.url),digest=v=>createHash('sha256').update(v).digest('hex');
          const receipt={workflow_id:'auth.create-tenant-account',passed:false,wholeTaskVerified:false,commit:process.env.GITHUB_SHA,cases:[],apiChecks:[],trace:[],navigation:[],source_bindings:{},limitations:['Loopback hosting with production source; not a deployed Cloudflare execution.','Cloudflare source limiter is a controlled synthetic binding; trusted source/origin headers are supplied by the harness.','Portal manifest only transports production theme plus fixture origin/name; no production business records.','Platform-admin landing only; all registered role destinations, full accessibility/PWA and independent review gates remain pending.']};
          let server,browser,bridgeFailure;const password='Synthetic-only!Login-2026',actor=randomUUID(),tenant=randomUUID(),foreign=randomUUID(),admin=randomUUID(),denied=randomUUID();
          const policy=JSON.parse(await readFile(out+'/governance.json','utf8'));const definition=policy.virtual_workflow_definitions[0];assert.equal(definition.definition_sha256,'dfce268cc1726c6c1a90745da0bab663164ad5bd4a6c47221719c6ac3e312410');receipt.definition_sha256=definition.definition_sha256;receipt.limitations=['API-only native execution; required general CEO/HR creation UI is absent, so browser/UI acceptance is blocked.','Loopback actual gateway/service; deployed edge/cookie policy, accessibility/PWA, localized UI, evidence playback and independent reviews remain unproven.','Explicit isolated actors and rate budgets; authentication rate-window acceptance is outside this scope.'];
          try{
           await db.query('CREATE TABLE tenants(id uuid PRIMARY KEY,name text,slug text UNIQUE,status text,created_at timestamptz DEFAULT NOW(),updated_at timestamptz DEFAULT NOW());CREATE TABLE users(id uuid PRIMARY KEY,tenant_id uuid REFERENCES tenants(id),email text UNIQUE,roles text,password_hash text,status text,updated_at timestamptz DEFAULT NOW());CREATE TABLE auth_sessions(user_id uuid REFERENCES users(id),token_hash text,expires_at timestamptz)');
           for(const file of ['20260928_auth_rate_limits.sql','20260928_auth_account_audit.sql','20261011_platform_administration.sql','20261013_screen_text.sql'])await db.query(await readFile('packages/database/migrations/'+file,'utf8'));
           await db.query("INSERT INTO tenants(id,name,slug,status) VALUES($1,'Synthetic Primary','synthetic-primary','active'),($2,'Synthetic Foreign','synthetic-foreign','active')",[tenant,foreign]);const hash=await bcrypt.hash(password,12);
           for(const [id,t,email,role]of [[actor,tenant,'platform@example.invalid','platform_admin'],[admin,foreign,'tenant-admin@example.invalid','tenant_admin'],[denied,tenant,'psw@example.invalid','psw']])await db.query("INSERT INTO users(id,tenant_id,email,roles,password_hash,status) VALUES($1,$2,$3,$4,$5,'active')",[id,t,email,role,hash]);
           const front=await build({entryPoints:['websites/typescript/src/main.ts'],bundle:true,write:false,metafile:true,platform:'browser',format:'iife'});
           const back=await build({stdin:{contents:"export {default as gateway} from './cloudflare/workers/src/gateway';export {default as service} from './cloudflare/workers/src/service';",resolveDir:process.cwd()},bundle:true,platform:'node',format:'cjs',write:false,metafile:true,external:['pg']});
           const backend=join(dir,'backend.cjs');await writeFile(backend,back.outputFiles[0].text.replaceAll('require("pg")',`require(${JSON.stringify(join(process.cwd(),'node_modules/pg'))})`));const {gateway,service}=require(backend);
           const paths=[...Object.keys(front.metafile.inputs),...Object.keys(back.metafile.inputs),'websites/typescript/src/styles.css',...['20260928_auth_rate_limits.sql','20260928_auth_account_audit.sql','20261011_platform_administration.sql','20261013_screen_text.sql'].map(f=>'packages/database/migrations/'+f)];for(const path of paths)if(path!=='<stdin>'&&!path.includes('node_modules/'))receipt.source_bindings[path]=digest(await readFile(path));
           const env={DB_URL:url.toString(),AUTH_SOURCE_LIMIT:{limit:async()=>({success:true})}},css=await readFile('websites/typescript/src/styles.css','utf8');
           server=createServer(async(req,res)=>{try{const requestUrl=new URL(req.url,'http://fixture');
            if(requestUrl.pathname==='/app.js'){res.setHeader('content-type','text/javascript');res.end(front.outputFiles[0].text);return;}
            if(requestUrl.pathname==='/portal.json'){res.setHeader('content-type','application/json');res.end(JSON.stringify({project:'PrimeCare',appCode:'pc',name:'PrimeCare',apiGateway:origin,theme:policy.theme}));return;}
            if(['/login','/platform/administration','/'].includes(requestUrl.pathname)){const locale=requestUrl.searchParams.get('locale')||'en';res.setHeader('content-type','text/html');res.end(`<!doctype html><html lang="${['en','fr','es'].includes(locale)?locale:'en'}"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeCare synthetic login</title><style>${css}</style></head><body><div id="app"></div><script src="/app.js"></script></body></html>`);return;}
            if(requestUrl.pathname.startsWith('/v1/')){let body='';for await(const part of req)body+=part;const headers=new Headers(req.headers);headers.delete('accept-encoding');headers.set('origin','https://primecare-clinic.pages.dev');headers.set('cf-connecting-ip','192.0.2.1');
             const request=new Request(origin+req.url,{method:req.method,headers,...(body?{body}:{})});const bindings={AUTH:{fetch:r=>service.fetch(r,{...env,SERVICE_NAME:'auth'})},GOVERNANCE:{fetch:r=>service.fetch(r,{...env,SERVICE_NAME:'governance'})}};
             const response=await gateway.fetch(request,bindings);receipt.trace.push({path:requestUrl.pathname,method:req.method,status:response.status});res.writeHead(response.status,Object.fromEntries(response.headers));res.end(await response.text());return;}
            res.writeHead(404);res.end();
           }catch(error){bridgeFailure=error;res.writeHead(500);res.end('Synthetic bridge failure');}});await new Promise(r=>server.listen(0,'127.0.0.1',r));const origin='http://127.0.0.1:'+server.address().port;
          
           const ceo=randomUUID(),hr=randomUUID();
           for(const [id,email,role]of [[ceo,'ceo@example.invalid','ceo'],[hr,'hr@example.invalid','hr_director']])await db.query("INSERT INTO users(id,tenant_id,email,roles,password_hash,status) VALUES($1,$2,$3,$4,$5,'active')",[id,tenant,email,role,hash]);
           const login=async(email,value=password)=>{const response=await fetch(origin+'/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password:value})});assert.equal(response.status,200);return(await response.json()).token;};
           const primary=await login('platform@example.invalid'),ceoToken=await login('ceo@example.invalid'),hrToken=await login('hr@example.invalid'),pswToken=await login('psw@example.invalid');
           const register=(token,email,extra={},headers={})=>fetch(origin+'/v1/auth/register',{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json',...headers},body:JSON.stringify({email,password,role:'rmt',...extra})});
           const snapshot=async()=>({users:(await db.query('SELECT id,email,roles,status,tenant_id,password_hash FROM users ORDER BY id')).rows,audit:(await db.query('SELECT * FROM auth_account_audit ORDER BY id')).rows});
           const checkCreated=async(r,email,creator)=>{assert.equal(r.status,201);const value=await r.json();assert.deepEqual(Object.keys(value).sort(),['user']);assert.deepEqual(Object.keys(value.user).sort(),['id','email','tenant_id','roles','status'].sort());assert.equal(value.user.email,email);assert.equal(value.user.tenant_id,tenant);assert.equal(value.user.roles,'rmt');assert.equal(value.user.status,'active');const actual=(await db.query('SELECT * FROM users WHERE id=$1',[value.user.id])).rows;assert.equal(actual.length,1);assert.equal(actual[0].email,email);assert.equal(actual[0].tenant_id,tenant);assert.equal(await bcrypt.compare(password,actual[0].password_hash),true);const audit=(await db.query('SELECT * FROM auth_account_audit WHERE target_user_id=$1',[value.user.id])).rows;assert.equal(audit.length,1);assert.equal(audit[0].actor_user_id,creator);assert.equal(audit[0].tenant_id,tenant);assert.equal(audit[0].action,'account_created');return value.user;};
           for(const [t,id,email]of [[ceoToken,ceo,'created-by-ceo@example.invalid'],[hrToken,hr,'created-by-hr@example.invalid']]){const user=await checkCreated(await register(t,email),email,id);const createdToken=await login(email);const me=await fetch(origin+'/v1/auth/me',{headers:{authorization:'Bearer '+createdToken}});assert.equal(me.status,200);assert.deepEqual(await me.json(),{userId:user.id,roles:'rmt',status:'authenticated'});const reload=await fetch(origin+'/v1/auth/admin/users/'+user.id,{headers:{authorization:'Bearer '+ceoToken}});assert.equal(reload.status,200);const detail=(await reload.json()).user;assert.equal(detail.id,user.id);assert.equal(detail.email,email);assert.equal(detail.roles,'rmt');assert.equal(detail.status,'active');receipt.cases.push({actorRole:id===ceo?'ceo':'hr_director',realCredentialLogin:true,createdSameTenantAccount:true,safeResponse:true,nativePasswordHash:true,singleAudit:true,newCredentialLogin:true,authoritativeApiReread:true,browserExecuted:false});}
           receipt.apiChecks.push('CEO and HR create approved same-tenant accounts; safe persisted/audited result and new credential login');
           for(const [t,extra,headers,status]of [[primary,{},{},403],[pswToken,{},{},403],[hrToken,{role:'ceo'},{},403],[ceoToken,{}, {'x-tenant-id':foreign},403],[ceoToken,{tenantId:foreign},{},400],[ceoToken,{password:'short'},{},400]]){const before=await snapshot();assert.equal((await register(t,'denied-'+randomUUID()+'@example.invalid',extra,headers)).status,status);assert.deepEqual(await snapshot(),before);}
           receipt.apiChecks.push('Platform Admin/PSW and HR escalation denied; foreign tenant header, injected tenant field and invalid password preserve accounts/audit');
           const missing=await fetch(origin+'/v1/auth/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:'missing@example.invalid',password,role:'rmt'})});assert.equal(missing.status,401);
           const exp=await login('psw@example.invalid');await db.query("UPDATE auth_sessions SET expires_at=NOW()-INTERVAL '1 minute' WHERE token_hash=$1",[digest(exp)]);const beforeExpired=await snapshot();assert.equal((await register(exp,'expired@example.invalid')).status,401);assert.deepEqual(await snapshot(),beforeExpired);receipt.apiChecks.push('Missing and expired credentials denied without account/audit mutation');
           // Separate scenario rate budgets are reset only in the isolated synthetic schema.
           await db.query('DELETE FROM auth_rate_limits');
           const duplicateBefore=await snapshot();assert.equal((await register(ceoToken,'CREATED-BY-CEO@EXAMPLE.INVALID')).status,409);assert.deepEqual(await snapshot(),duplicateBefore);receipt.apiChecks.push('Case-normalized retry returns conflict without duplicate account/audit');
           await db.query("CREATE FUNCTION fixture_creation_audit_failure() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NULL; END $$;CREATE TRIGGER fixture_creation_audit_failure BEFORE INSERT ON auth_account_audit FOR EACH ROW EXECUTE FUNCTION fixture_creation_audit_failure()");
           const rollbackEmail='rollback@example.invalid';try{const before=await snapshot();assert.equal((await register(ceoToken,rollbackEmail)).status,503);assert.deepEqual(await snapshot(),before);}finally{await db.query('DROP TRIGGER fixture_creation_audit_failure ON auth_account_audit;DROP FUNCTION fixture_creation_audit_failure()');}
           await checkCreated(await register(ceoToken,rollbackEmail),rollbackEmail,ceo);receipt.apiChecks.push('Suppressed audit rolls back creation; clean retry commits exactly one account and audit');
           const concurrentEmail='concurrent@example.invalid';const concurrent=await Promise.all([register(ceoToken,concurrentEmail),register(ceoToken,concurrentEmail.toUpperCase())]);assert.deepEqual(concurrent.map(r=>r.status).sort(),[201,409]);await checkCreated(concurrent.find(r=>r.status===201),concurrentEmail,ceo);receipt.apiChecks.push('Concurrent duplicate submissions yield exactly one persisted account/audit and one conflict');
           if(bridgeFailure)throw bridgeFailure;for(const[path,sha]of Object.entries(receipt.source_bindings))assert.equal(digest(await readFile(path)),sha);receipt.passed=true;
          }catch(error){receipt.error=error.message;console.error(error);process.exitCode=1;}
          finally{if(server)await new Promise(r=>server.close(r));await db.query('DROP SCHEMA '+schema+' CASCADE');await db.end();receipt.cleanup='Isolated synthetic schema dropped; production business accounts untouched';await writeFile(out+'/results.json',JSON.stringify(receipt,null,2));console.log(JSON.stringify({passed:receipt.passed,apiCases:receipt.cases.length,apiGroups:receipt.apiChecks.length,browserExecuted:false,wholeTaskVerified:false,error:receipt.error}));}
          
          NATIVE
          node test-results/create-tenant-account/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: create-account-native-evidence
          path: test-results
