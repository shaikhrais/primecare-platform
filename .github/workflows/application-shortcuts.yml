name: Application shortcut picker and recovery
on:
  push:
    branches: [main]
    paths:
      - 'packages/shared/src/application-modules/**'
      - 'packages/shared/src/preference-sync/**'
      - 'packages/flutter_core/lib/preference_sync/**'
      - 'packages/flutter_core/test/preference_sync/**'
      - 'packages/primecare_ui/catalogs/application-recovery.registration.json'
      - 'scripts/test-preference-recovery.mjs'
      - 'packages/flutter_core/lib/application_modules.dart'
      - 'packages/flutter_core/lib/application_modules/**'
      - 'packages/flutter_core/test/application_modules/**'
      - 'packages/primecare_ui/web/application-shortcuts.ts'
      - 'packages/primecare_ui/web/application-modules.ts'
      - 'packages/primecare_ui/catalogs/application-shortcuts.destinations.json'
      - 'websites/typescript/src/tenant-dashboard/shortcut-settings-host.ts'
      - 'websites/typescript/src/tenant-dashboard/index.ts'
      - 'scripts/test-application-shortcut-*'
      - '.github/workflows/application-shortcuts.yml'
permissions: {contents: read}
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/shortcut-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 linkedom@0.18.12 playwright@1.60.0 @electric-sql/pglite@0.3.14 pg@8.16.3 bcryptjs@3.0.2 ajv@8.17.1 ajv-formats@3.0.1 postal-mime@4.1.2 htmlparser2@12.0.0
          ln -s /tmp/shortcut-tools/node_modules node_modules
          npx playwright install --with-deps chromium
          node --test scripts/test-application-shortcut-host-lifecycle.mjs scripts/test-application-shortcut-editor.mjs scripts/test-application-shortcut-view.mjs scripts/test-application-modules-settings-lifecycle.mjs scripts/test-preference-client.mjs scripts/test-preference-recovery.mjs
          node scripts/test-application-shortcut-browser.mjs
          node scripts/test-tenant-read-page-host-browser.mjs
          node scripts/test-tenant-work-module-host.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable --resolveJsonModule websites/typescript/src/tenant-dashboard/index.ts packages/primecare_ui/web/application-modules.ts
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: preference_test, POSTGRES_PASSWORD: isolated, POSTGRES_DB: preference_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U preference_test -d preference_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PREFERENCE_TEST_DATABASE_URL: postgresql://preference_test:isolated@127.0.0.1:5432/preference_test
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/shortcut-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 @electric-sql/pglite@0.3.14 pg@8.16.3 bcryptjs@3.0.2 ajv@8.17.1 ajv-formats@3.0.1 postal-mime@4.1.2 htmlparser2@12.0.0
          ln -s /tmp/shortcut-tools/node_modules node_modules
          npx playwright install --with-deps chromium
          node scripts/test-application-shortcut-browser.mjs
  native:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/flutter_core
      - run: flutter analyze --no-fatal-infos lib/application_modules.dart lib/application_modules lib/preference_sync test/application_modules test/preference_sync
        working-directory: packages/flutter_core
      - run: flutter test test/application_modules test/preference_sync
        working-directory: packages/flutter_core
