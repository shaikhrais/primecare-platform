name: Shared API UI model migration
on:
  pull_request:
    paths:
      - 'packages/primecare_models/**'
      - '**/*_model.dart'
      - 'scripts/*shared_model*.py'
      - 'docs/refactoring/shared-model-migration.json'
      - '.github/workflows/shared-model-migration.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.3'
      - run: python3 scripts/test_shared_model_migration.py -v
      - run: python3 scripts/verify_shared_models.py
      - run: dart pub get
        working-directory: packages/primecare_models
      - run: dart analyze
        working-directory: packages/primecare_models
      - run: dart test
        working-directory: packages/primecare_models
