name: Verify auth recovery and key rotation foundations
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auth-lifecycle-foundations.yml
      - cloudflare/workers/src/security/mfa-key-rotation.mjs
      - scripts/test-code-admin-key-rotation-postgres.mjs
      - scripts/test-code-admin-key-rotation-drill.mjs
      - cloudflare/workers/src/security/mfa-keyring.mjs
      - cloudflare/workers/src/security/mfa-recovery-codes.mjs
      - cloudflare/workers/src/security/mfa-lifecycle.mjs
      - cloudflare/workers/src/security/mfa-notifications.mjs
      - scripts/test-code-admin-keyring.mjs
      - scripts/test-code-admin-recovery-codes.mjs
      - scripts/test-mfa-lifecycle-schema.mjs
      - scripts/test-code-admin-lifecycle-postgres.mjs
      - scripts/test-code-admin-mfa-outbox-postgres.mjs
      - scripts/mfa-schema-profile.mjs
      - scripts/export-mfa-lifecycle-schema.mjs
      - scripts/apply-mfa-lifecycle-schema.mjs
      - packages/database/migrations/20261026_auth_mfa_lifecycle.sql
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifecycle
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: lifecycle
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lifecycle" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/lifecycle-foundation" --ignore-scripts pg@8.16.3 bcryptjs@3.0.2
          ln -s "$RUNNER_TEMP/lifecycle-foundation/node_modules" node_modules
          node --test scripts/test-code-admin-keyring.mjs scripts/test-code-admin-recovery-codes.mjs scripts/test-code-admin-key-rotation-drill.mjs
      - name: Require rollback and idempotency on native disposable PostgreSQL
        env:
          MFA_TEST_DATABASE_URL: postgresql://lifecycle:disposable-only@localhost:5432/lifecycle
        run: node --test scripts/test-mfa-lifecycle-schema.mjs
      - name: Verify native transaction proof consumption isolation revocation and fault rollback
        env:
          MFA_TEST_DATABASE_URL: postgresql://lifecycle:disposable-only@localhost:5432/lifecycle
        run: |
          MFA_TEST_ID_TYPE=text node --test scripts/test-code-admin-key-rotation-postgres.mjs
          MFA_TEST_ID_TYPE=uuid node --test scripts/test-code-admin-key-rotation-postgres.mjs
          MFA_TEST_ID_TYPE=text node --test scripts/test-code-admin-lifecycle-postgres.mjs
          MFA_TEST_ID_TYPE=uuid node --test scripts/test-code-admin-lifecycle-postgres.mjs
          node --test scripts/test-code-admin-mfa-outbox-postgres.mjs
          node scripts/export-mfa-lifecycle-schema.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-mfa-lifecycle-schema
          path: test-results/mfa-lifecycle-schema
  schema:
    needs: foundation
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        with:
          name: native-mfa-lifecycle-schema
          path: test-results/mfa-lifecycle-schema
      - run: |
          npm install --prefix "$RUNNER_TEMP/lifecycle-schema" --ignore-scripts pg@8.16.3
          ln -s "$RUNNER_TEMP/lifecycle-schema/node_modules" node_modules
      - name: Validate exact native schema in rollback before applying empty lifecycle tables
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          APPLY_MFA_LIFECYCLE_SCHEMA: '1'
        run: |
          node scripts/apply-mfa-lifecycle-schema.mjs --dry-run
          node scripts/apply-mfa-lifecycle-schema.mjs --apply
