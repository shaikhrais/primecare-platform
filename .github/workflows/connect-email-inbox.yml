name: Connect Cloudflare email inbox routing
on:
  push:
    branches: [deploy/email-inbox-20261010]
    paths: [.github/workflows/connect-email-inbox.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node cloudflare/email-inbox/connect-routing.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_ROUTING_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
