name: Inspect current-session live acceptance
on:
  push:
    branches: [main]
    paths: [.github/workflows/current-session-recovery.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  requirements:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix /tmp/govt-reader --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/govt-reader/node_modules node_modules
          pip install -r tools/governance-production/requirements.txt
      - name: Load live specifications and theme after merge
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import sys,json,pathlib,sqlite3
          sys.path.insert(0,'tools/governance-production')
          from production_reader import connect
          flow='auth.read-current-session'
          with connect() as db:
              db.row_factory=sqlite3.Row
              result={}
              for name in ['virtual_workflow_definitions','virtual_workflow_steps','virtual_workflow_source_links','virtual_workflow_checkpoints']:
                  result[name]=[dict(r) for r in db.execute('SELECT * FROM '+name+' WHERE flow_id=?',(flow,))]
              checkpoint=result['virtual_workflow_checkpoints']
              if checkpoint:
                  result['attempt']=[dict(r) for r in db.execute('SELECT * FROM virtual_workflow_attempts WHERE attempt_id=?',(checkpoint[0]['attempt_id'],))]
              result['permissions']=[dict(r) for r in db.execute('SELECT * FROM api_permissions WHERE api_id IN (779,16402)')]
              result['screen_links']=[dict(r) for r in db.execute('SELECT * FROM screen_api_links WHERE api_id IN (779,16402)')]
              result['auth_registry']=[dict(r) for r in db.execute('SELECT * FROM auth_route_registry WHERE id=1')]
              result['guides']=[dict(r) for r in db.execute("SELECT * FROM virtual_role_flow_guides WHERE guide_json LIKE '%auth.read-current-session%' OR guide_json LIKE '%/v1/auth/me%'")]
              result['snapshots']=[dict(r) for r in db.execute("SELECT * FROM virtual_flow_catalog_snapshots WHERE name='recovery-handoff-current'")]
              result['api']=[dict(r) for r in db.execute("SELECT * FROM api_endpoints WHERE route_path='/v1/auth/me'")]
              result['totals']=[dict(r) for r in db.execute("SELECT verification_status,COUNT(*) n FROM virtual_workflow_definitions WHERE flow_kind='business_process' GROUP BY verification_status")]
              result['catalogue']=[dict(r) for r in db.execute("SELECT flow_kind,COUNT(*) n FROM virtual_workflow_definitions GROUP BY flow_kind")]
              result['schema']={name:[dict(r) for r in db.execute('PRAGMA table_info('+name+')')] for name in ['virtual_role_flow_guides','virtual_flow_catalog_snapshots','api_permissions','screen_api_links']}
              theme=dict(db.execute('SELECT css_variable_name,token_value FROM theme_design_tokens WHERE theme_id=1 AND active=1'))
              path=pathlib.Path('test-results/current-session');path.mkdir(parents=True,exist_ok=True)
              (path/'governance.json').write_text(json.dumps(dict(result,theme=theme),indent=2))
              print('CURRENT_SESSION_INSPECTION '+json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: current-session-live-requirements
          path: test-results/
  browser:
    needs: requirements
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      evidence_url: ${{ steps.evidence.outputs.artifact-url }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: login_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U primecare -d login_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: current-session-live-requirements
          path: test-results
      - run: |
          npm install --prefix /tmp/auth-recovery --ignore-scripts --no-audit --no-fund pg@8.16.3 bcryptjs@3 esbuild@0.27.2 playwright@1.60.0
          ln -s /tmp/auth-recovery/node_modules node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Execute current-session native browser acceptance
        env:
          LOGIN_BROWSER_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/login_browser
        run: |
          cat > test-results/current-session/run.mjs <<'BROWSER'
          import assert from 'node:assert/strict';
          import pg from 'pg';import bcrypt from 'bcryptjs';import {build} from 'esbuild';import {chromium} from 'playwright';
          import {readFile,writeFile,mkdir,mkdtemp} from 'node:fs/promises';import {createRequire} from 'node:module';import {createServer} from 'node:http';import {createHash,randomUUID} from 'node:crypto';import {tmpdir} from 'node:os';import {join} from 'node:path';
          const out='test-results/current-session';await mkdir(out,{recursive:true});
          if(process.env.PRODUCTION_DATABASE_URL||process.env.GOVERNANCE_DATABASE_URL)throw Error('Production credentials forbidden in browser fixture');
          const connection=process.env.LOGIN_BROWSER_DATABASE_URL,url=new URL(connection);if(!['localhost','127.0.0.1'].includes(url.hostname)||url.pathname!='/login_browser')throw Error('Loopback login_browser database required');
          const db=new pg.Client({connectionString:connection});await db.connect();const schema='login_'+randomUUID().replaceAll('-','');await db.query('CREATE SCHEMA '+schema);await db.query('SET search_path TO '+schema);url.searchParams.set('options','-c search_path='+schema);
          const dir=await mkdtemp(join(tmpdir(),'primecare-login-main-')),require=createRequire(import.meta.url),digest=v=>createHash('sha256').update(v).digest('hex');
          const receipt={workflow_id:'auth.read-current-session',passed:false,wholeTaskVerified:false,commit:process.env.GITHUB_SHA,cases:[],apiChecks:[],trace:[],navigation:[],source_bindings:{},limitations:['Loopback hosting with production source; not a deployed Cloudflare execution.','Cloudflare source limiter is a controlled synthetic binding; trusted source/origin headers are supplied by the harness.','Portal manifest only transports production theme plus fixture origin/name; no production business records.','Platform-admin landing only; all registered role destinations, full accessibility/PWA and independent review gates remain pending.']};
          let server,browser,bridgeFailure;const password='Synthetic-only!Login-2026',actor=randomUUID(),tenant=randomUUID(),foreign=randomUUID(),admin=randomUUID(),denied=randomUUID();
          const policy=JSON.parse(await readFile(out+'/governance.json','utf8'));const definition=policy.virtual_workflow_definitions[0];assert.equal(definition.definition_sha256,'6e3ab5f37b63a1f2bf30c8850ca844c357350a5d8586ea536d22d153ad7e1d8a');receipt.definition_sha256=definition.definition_sha256;
          try{
           await db.query('CREATE TABLE tenants(id uuid PRIMARY KEY,name text,slug text UNIQUE,status text,created_at timestamptz DEFAULT NOW(),updated_at timestamptz DEFAULT NOW());CREATE TABLE users(id uuid PRIMARY KEY,tenant_id uuid REFERENCES tenants(id),email text UNIQUE,roles text,password_hash text,status text,updated_at timestamptz DEFAULT NOW());CREATE TABLE auth_sessions(user_id uuid REFERENCES users(id),token_hash text,expires_at timestamptz)');
           for(const file of ['20260928_auth_rate_limits.sql','20261011_platform_administration.sql','20261013_screen_text.sql'])await db.query(await readFile('packages/database/migrations/'+file,'utf8'));
           await db.query("INSERT INTO tenants(id,name,slug,status) VALUES($1,'Synthetic Primary','synthetic-primary','active'),($2,'Synthetic Foreign','synthetic-foreign','active')",[tenant,foreign]);const hash=await bcrypt.hash(password,12);
           for(const [id,t,email,role]of [[actor,tenant,'platform@example.invalid','platform_admin'],[admin,foreign,'tenant-admin@example.invalid','tenant_admin'],[denied,tenant,'psw@example.invalid','psw']])await db.query("INSERT INTO users(id,tenant_id,email,roles,password_hash,status) VALUES($1,$2,$3,$4,$5,'active')",[id,t,email,role,hash]);
           const front=await build({entryPoints:['websites/typescript/src/main.ts'],bundle:true,write:false,metafile:true,platform:'browser',format:'iife'});
           const back=await build({stdin:{contents:"export {default as gateway} from './cloudflare/workers/src/gateway';export {default as service} from './cloudflare/workers/src/service';",resolveDir:process.cwd()},bundle:true,platform:'node',format:'cjs',write:false,metafile:true,external:['pg']});
           const backend=join(dir,'backend.cjs');await writeFile(backend,back.outputFiles[0].text.replaceAll('require("pg")',`require(${JSON.stringify(join(process.cwd(),'node_modules/pg'))})`));const {gateway,service}=require(backend);
           const paths=[...Object.keys(front.metafile.inputs),...Object.keys(back.metafile.inputs),'websites/typescript/src/styles.css',...['20260928_auth_rate_limits.sql','20261011_platform_administration.sql','20261013_screen_text.sql'].map(f=>'packages/database/migrations/'+f)];for(const path of paths)if(path!=='<stdin>'&&!path.includes('node_modules/'))receipt.source_bindings[path]=digest(await readFile(path));
           const env={DB_URL:url.toString(),AUTH_SOURCE_LIMIT:{limit:async()=>({success:true})}},css=await readFile('websites/typescript/src/styles.css','utf8');
           server=createServer(async(req,res)=>{try{const requestUrl=new URL(req.url,'http://fixture');
            if(requestUrl.pathname==='/app.js'){res.setHeader('content-type','text/javascript');res.end(front.outputFiles[0].text);return;}
            if(requestUrl.pathname==='/portal.json'){res.setHeader('content-type','application/json');res.end(JSON.stringify({project:'PrimeCare',appCode:'pc',name:'PrimeCare',apiGateway:origin,theme:policy.theme}));return;}
            if(['/login','/platform/administration','/'].includes(requestUrl.pathname)){const locale=requestUrl.searchParams.get('locale')||'en';res.setHeader('content-type','text/html');res.end(`<!doctype html><html lang="${['en','fr','es'].includes(locale)?locale:'en'}"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeCare synthetic login</title><style>${css}</style></head><body><div id="app"></div><script src="/app.js"></script></body></html>`);return;}
            if(requestUrl.pathname.startsWith('/v1/')){let body='';for await(const part of req)body+=part;const headers=new Headers(req.headers);headers.delete('accept-encoding');headers.set('origin','https://primecare-clinic.pages.dev');headers.set('cf-connecting-ip','192.0.2.1');
             const request=new Request(origin+req.url,{method:req.method,headers,...(body?{body}:{})});const bindings={AUTH:{fetch:r=>service.fetch(r,{...env,SERVICE_NAME:'auth'})},GOVERNANCE:{fetch:r=>service.fetch(r,{...env,SERVICE_NAME:'governance'})}};
             const response=await gateway.fetch(request,bindings);receipt.trace.push({path:requestUrl.pathname,method:req.method,status:response.status});res.writeHead(response.status,Object.fromEntries(response.headers));res.end(await response.text());return;}
            res.writeHead(404);res.end();
           }catch(error){bridgeFailure=error;res.writeHead(500);res.end('Synthetic bridge failure');}});await new Promise(r=>server.listen(0,'127.0.0.1',r));const origin='http://127.0.0.1:'+server.address().port;
           browser=await chromium.launch({headless:true});const cy=(page,id)=>page.locator('[data-cy="'+id+'"]');const waitLogin=async(page)=>{await cy(page,'login-submit').waitFor();};
           const submit=async(page,value=password)=>{await cy(page,'login-email').fill('platform@example.invalid');await cy(page,'login-password').fill(value);await cy(page,'login-submit').click();};
           const token=page=>page.evaluate(()=>sessionStorage.getItem('primecare_session'));
           const sessions=async()=>Number((await db.query('SELECT count(*) n FROM auth_sessions WHERE user_id=$1',[actor])).rows[0].n);
          
           const loginActor=async email=>{const r=await fetch(origin+'/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});assert.equal(r.status,200);return(await r.json()).token;};
           const identity=async(t,method='GET',extra={})=>fetch(origin+'/v1/auth/me?enable-semantics=true',{method,headers:{authorization:'Bearer '+t,...extra}});
           const safe=async(t,id,role,method='GET',extra={})=>{const r=await identity(t,method,extra);assert.equal(r.status,200);assert.equal(r.headers.get('cache-control'),'no-store');const value=await r.json();assert.deepEqual(value,{userId:id,roles:role,status:'authenticated'});return value;};
           for(const [locale,width]of [['en',320],['fr',1440],['es',768]]){
            await db.query('DELETE FROM auth_sessions;DELETE FROM auth_rate_limits');
            const context=await browser.newContext({viewport:{width,height:1000},recordVideo:{dir:out+'/video',size:{width,height:1000}}}),page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
            try{
             await page.goto(origin+'/login?locale='+locale+'&enable-semantics=true');await waitLogin(page);
             const confirmation=page.waitForResponse(r=>new URL(r.url()).pathname==='/v1/auth/me');await submit(page);const confirmed=await confirmation;assert.equal(confirmed.status(),200);assert.deepEqual(await confirmed.json(),{userId:actor,roles:'platform_admin',status:'authenticated'});
             await cy(page,'platform-topbar-tenant').waitFor();const bearer=await token(page);assert.ok(bearer);
             const stored=(await db.query('SELECT u.id,u.roles,s.token_hash FROM auth_sessions s JOIN users u ON u.id=s.user_id WHERE s.token_hash=$1',[digest(bearer)])).rows;assert.equal(stored.length,1);assert.equal(stored[0].id,actor);assert.equal(stored[0].roles,'platform_admin');
             await safe(bearer,actor,'platform_admin');await safe(bearer,actor,'platform_admin','POST');
             const displayed=await cy(page,'platform-topbar-tenant').evaluate(e=>Array.from(e.options).filter(o=>o.value).map(o=>({id:o.value,name:o.textContent})));assert.deepEqual(displayed,(await db.query('SELECT id,name FROM tenants ORDER BY slug')).rows);
             await page.goto(origin+'/platform/administration?locale='+locale+'&enable-semantics=true');await cy(page,'platform-topbar-tenant').waitFor();assert.equal(await token(page),bearer);assert.equal(await sessions(),1);
             await context.setOffline(true);await cy(page,'platform-refresh').click();await page.waitForFunction(()=>!!document.querySelector('[data-cy=platform-status]')?.textContent);assert.equal(await token(page),bearer);assert.equal(await sessions(),1);await context.setOffline(false);await cy(page,'platform-refresh').click();await cy(page,'platform-topbar-tenant').waitFor();
             await db.query("UPDATE auth_sessions SET expires_at=NOW()-INTERVAL '1 minute' WHERE token_hash=$1",[digest(bearer)]);assert.equal((await identity(bearer)).status,401);
             await page.goto(origin+'/platform/administration?enable-semantics=true');await waitLogin(page);assert.equal(await token(page),null);
             await submit(page);await cy(page,'platform-topbar-tenant').waitFor();const renewed=await token(page);assert.notEqual(renewed,bearer);await safe(renewed,actor,'platform_admin');assert.equal((await identity(bearer)).status,401);
             const revoked=await fetch(origin+'/v1/auth/logout?enable-semantics=true',{method:'POST',headers:{authorization:'Bearer '+renewed}});assert.equal(revoked.status,200);await page.goto(origin+'/platform/administration?enable-semantics=true');await waitLogin(page);assert.equal(await token(page),null);assert.equal((await identity(renewed)).status,401);
             assert.deepEqual(errors,[]);await page.screenshot({path:out+'/identity-'+locale+'.png',fullPage:true});
             receipt.cases.push({locale,width,actorRole:'platform_admin',realCredentialLogin:true,safeIdentityMatchesNativeDatabase:true,registeredGetAndPost:true,displayedTenantRecordsMatchDatabase:true,reload:true,offlineRetry:true,expiredSessionDenied:true,reauthentication:true,revokedSessionCannotRestore:true});
            }finally{const video=page.video();await context.close();if(video)await video.saveAs(out+'/identity-'+locale+'.webm');}
           }
           // Identity is authenticated-self for every registered actor, including roles
           // denied platform administration. This is not an all-role UI acceptance claim.
           const roles=JSON.parse(definition.actor_roles_json);receipt.roleChecks=[];
           for(const role of roles){await db.query('UPDATE users SET roles=$1 WHERE id=$2',[role,denied]);const t=await loginActor('psw@example.invalid');await safe(t,denied,role);await safe(t,denied,role,'POST');await fetch(origin+'/v1/auth/logout?enable-semantics=true',{method:'POST',headers:{authorization:'Bearer '+t}});receipt.roleChecks.push(role);}
           await db.query("UPDATE users SET roles='psw' WHERE id=$1",[denied]);const psw=await loginActor('psw@example.invalid');assert.equal((await fetch(origin+'/v1/governance/platform?enable-semantics=true',{headers:{authorization:'Bearer '+psw}})).status,403);receipt.apiChecks.push('Authenticated self identity supports all registered roles; PSW denied platform administration');
           const other=await loginActor('tenant-admin@example.invalid');await safe(other,admin,'tenant_admin','GET',{'x-tenant-id':tenant,'x-user-id':actor});
           const scoped=await fetch(origin+'/v1/governance/platform/tenants/'+tenant+'?enable-semantics=true',{headers:{authorization:'Bearer '+other}});assert.equal(scoped.status,403);receipt.apiChecks.push('Forged tenant/user headers cannot select identity; foreign tenant service denied');
           const before=(await db.query('SELECT user_id,token_hash,expires_at FROM auth_sessions ORDER BY token_hash')).rows;
           for(const method of ['GET','POST']){assert.equal((await fetch(origin+'/v1/auth/me?enable-semantics=true',{method})).status,401);assert.equal((await identity('malformed-session',method)).status,401);}
           await db.query("UPDATE users SET status='inactive' WHERE id=$1",[denied]);assert.equal((await identity(psw)).status,401);assert.deepEqual((await db.query('SELECT user_id,token_hash,expires_at FROM auth_sessions ORDER BY token_hash')).rows,before);receipt.apiChecks.push('Missing malformed and inactive sessions denied without session mutations');
           await db.query("UPDATE users SET status='active' WHERE id=$1",[denied]);
           const parallel=await Promise.all(Array.from({length:12},()=>safe(other,admin,'tenant_admin')));assert.equal(parallel.length,12);assert.deepEqual((await db.query('SELECT user_id,token_hash,expires_at FROM auth_sessions ORDER BY token_hash')).rows,before);receipt.apiChecks.push('Twelve concurrent native reads preserve authoritative session records');
           if(bridgeFailure)throw bridgeFailure;for(const[path,sha]of Object.entries(receipt.source_bindings))assert.equal(digest(await readFile(path)),sha);receipt.passed=true;
          }catch(error){receipt.error=error.message;console.error(error);process.exitCode=1;}
          finally{if(browser)await browser.close();if(server)await new Promise(r=>server.close(r));await db.query('DROP SCHEMA '+schema+' CASCADE');await db.end();receipt.cleanup='Isolated synthetic schema dropped; production business data untouched';await writeFile(out+'/results.json',JSON.stringify(receipt,null,2));console.log(JSON.stringify({passed:receipt.passed,browserCases:receipt.cases.length,roleChecks:receipt.roleChecks?.length,apiChecks:receipt.apiChecks.length,wholeTaskVerified:false,error:receipt.error}));}
          
          BROWSER
          node test-results/current-session/run.mjs
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: current-session-native-browser-evidence
          path: test-results
