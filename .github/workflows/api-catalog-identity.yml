name: API Catalog Identity Guard
on:
  pull_request:
    paths:
      - '.agents/governance/governance.db'
      - 'scripts/check-api-catalog-identity.py'
      - 'scripts/test-api-catalog-identity.py'
      - 'docs/api/api-catalog-identity-quarantine.json'
      - '.github/workflows/api-catalog-identity.yml'
  push:
    branches: [main]
    paths:
      - '.agents/governance/governance.db'
      - 'scripts/check-api-catalog-identity.py'
      - 'scripts/test-api-catalog-identity.py'
      - 'docs/api/api-catalog-identity-quarantine.json'
      - '.github/workflows/api-catalog-identity.yml'
  workflow_dispatch:
jobs:
  catalog-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-api-catalog-identity.py
      - run: GOVERNANCE_ALLOW_SQLITE_FIXTURES=1 python scripts/check-api-catalog-identity.py
