name: Inspect email domain configuration
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-email-domain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Inspect domain and email configuration without exposing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.error
          domain = "15minutes-email.com"
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          report = {"domain": domain, "configured_secrets": {k: bool(os.environ.get(k)) for k in ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "RESEND_API_KEY", "EMAIL_FROM"]}}
          def get(base, path, key):
              request = urllib.request.Request(base + path, headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  return {"success": False, "http_status": error.code}
              except Exception as error:
                  return {"success": False, "error_type": type(error).__name__}
          if token:
              base = "https://api.cloudflare.com/client/v4"
              zones = get(base, "/zones?name=" + domain, token)
              report["zone_query_success"] = zones.get("success", False)
              report["zone_query_http_status"] = zones.get("http_status")
              report["zones"] = []
              for zone in zones.get("result", []):
                  item = {k: zone.get(k) for k in ["id", "name", "status", "name_servers", "original_name_servers"]}
                  zid = zone["id"]
                  dns = get(base, "/zones/" + zid + "/dns_records?per_page=100", token)
                  item["dns_query_success"] = dns.get("success", False)
                  item["dns_http_status"] = dns.get("http_status")
                  item["email_dns"] = [{"type": r.get("type"), "name": r.get("name"), "content": r.get("content"), "priority": r.get("priority")} for r in dns.get("result", []) if r.get("type") in ["MX", "TXT"] and (r.get("type") == "MX" or any(s in r.get("content", "") for s in ["v=spf1", "v=DKIM1", "v=DMARC1"]) or "_domainkey" in r.get("name", ""))]
                  routing = get(base, "/zones/" + zid + "/email/routing", token)
                  item["email_routing_query_success"] = routing.get("success", False)
                  item["email_routing_http_status"] = routing.get("http_status")
                  item["email_routing_enabled"] = routing.get("result", {}).get("enabled") if isinstance(routing.get("result"), dict) else None
                  report["zones"].append(item)
              if account:
                  settings = get(base, "/accounts/" + account + "/workers/scripts/primecare-auth-api/settings", token)
                  report["auth_worker_settings_success"] = settings.get("success", False)
                  report["auth_worker_http_status"] = settings.get("http_status")
                  result = settings.get("result", {})
                  bindings = result.get("bindings", []) if isinstance(result, dict) else []
                  report["auth_worker_binding_names"] = sorted(b.get("name", "") for b in bindings)
          resend = os.environ.get("RESEND_API_KEY")
          if resend:
              response = get("https://api.resend.com", "/domains", resend)
              report["resend_http_status"] = response.get("http_status")
              report["resend_domain"] = [{k: d.get(k) for k in ["id", "name", "status", "region"]} for d in response.get("data", []) if d.get("name") == domain]
          print(json.dumps(report, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Email domain configuration\n\n```json\n" + json.dumps(report, indent=2) + "\n```\n")
