name: Verify business communications inventory and services
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-business-communications.yml'
      - 'tools/governance-production/audit-business-communications.py'
      - 'tools/governance-production/communication_contract_report.py'
      - 'tools/governance-production/test-communication-contract-report.py'
      - 'tools/governance-production/communication_provider_inventory.py'
      - 'tools/governance-production/test-communication-provider-inventory.py'
      - 'tools/governance-production/read-bridge.mjs'
      - 'tools/governance-production/reader-errors.mjs'
      - 'tools/governance-production/test-reader-errors.mjs'
      - 'packages/database/migrations/20261023_communication_voice_otp.sql'
      - 'packages/database/migrations/20261023_communication_voice_confirmations.sql'
      - 'packages/database/migrations/20261023_communication_voice_tasks.sql'
      - 'packages/database/migrations/20261023_communication_voicemails.sql'
      - 'packages/shared/src/communications/**'
      - 'cloudflare/workers/src/business-tasks/**'
      - 'scripts/test-business-communications.mjs'
      - 'scripts/test-communication-http.mjs'
      - 'scripts/test-communication-mail-preview.mjs'
      - 'scripts/test-communication-access-policy.mjs'
      - 'scripts/test-communication-audio-session.mjs'
      - 'tools/communication-route-bindings.py'
      - 'tools/communication-schema-validators.mjs'
      - 'scripts/test-communication-schema-validator.mjs'
      - 'scripts/test-communication-validator-workerd.mjs'
      - 'scripts/test-business-media.mjs'
      - 'scripts/test-communication-ringing-browser.mjs'
      - 'scripts/test-communication-twilio-*.mjs'
      - 'scripts/test-communication-adapter-base.mjs'
      - 'scripts/test-communication-workers-runtime.mjs'
      - 'scripts/test-communication-relay-session.mjs'
      - 'scripts/test-communication-openai-relay.mjs'
      - 'scripts/test-communication-sales-quality.mjs'
      - 'packages/database/migrations/20261023_sales_call_quality.sql'
      - 'scripts/test-communication-relay-workerd.mjs'
      - 'scripts/test-communication-relay-postgres.mjs'
      - 'packages/database/migrations/20261023_communication_relay_sessions.sql'
      - 'scripts/test-communication-agent-start.mjs'
      - 'scripts/test-communication-voice-task-approval.mjs'
      - 'scripts/test-communication-voice-task-approval-browser.mjs'
      - 'scripts/test-communication-voice-otp-app.mjs'
      - 'scripts/test-communication-voice-otp-browser.mjs'
      - 'scripts/test-communication-twilio.mjs'
      - 'scripts/test-communication-twilio-token.mjs'
      - 'scripts/test-communication-twilio-sms.mjs'
      - 'scripts/test-communication-sms-service.mjs'
      - 'scripts/test-communication-sms-postgres.mjs'
      - 'scripts/test-communication-voice-directory.mjs'
      - 'packages/database/migrations/20261023_business_sms.sql'
      - 'packages/database/migrations/20261023_voice_extensions.sql'
      - 'scripts/test-communication-twilio-workerd.mjs'
      - 'tools/governance-production/twilio-voice-requirement.json'
      - 'scripts/test-communication-inbound-email.mjs'
      - 'scripts/test-communication-inbound-workerd.mjs'
      - 'scripts/test-communication-pictures.mjs'
      - 'scripts/test-communication-workers-pictures.mjs'
      - 'scripts/test-communication-pictures-workerd.mjs'
      - 'scripts/fixtures/business-*'
      - 'packages/database/migrations/20261022_business_communications.sql'
      - 'packages/flutter_core/lib/communications/**'
      - 'packages/flutter_core/lib/src/network/api_client.dart'
      - 'packages/flutter_core/lib/flutter_core.dart'
      - 'packages/flutter_core/lib/business_core.dart'
      - 'packages/flutter_core/test/communication_transport_failure_test.dart'
      - 'packages/flutter_core/test/dio_communication_transport_test.dart'
      - 'tools/communication-client-check.dart'
      - 'tools/communication-ui-bindings.py'
      - 'tools/communication-media-bundle.mjs'
      - 'scripts/test-communication-flutter-browser.mjs'
      - 'scripts/test-communication-flutter-bridge.mjs'
      - 'packages/flutter_core/assets/communications/**'
      - 'packages/flutter_core/pubspec.yaml'
      - 'packages/flutter_core/test/communication_mail_controller_test.dart'
      - 'packages/flutter_core/test/communication_call_controller_test.dart'
      - 'packages/flutter_core/test/communication_browser_media_harness.dart'
      - 'packages/flutter_core/test/fixtures/communication_channels_transport.dart'
      - 'packages/primecare_ui/test/communication_channels_test.dart'
      - 'packages/flutter_core/test/communication_workspace_controller_test.dart'
      - 'packages/flutter_core/test/fixtures/communication_workspace_transport.dart'
      - 'packages/primecare_ui/lib/src/communications/**'
      - 'packages/primecare_ui/lib/primecare_ui.dart'
      - 'packages/primecare_ui/lib/src/components/prime_components.dart'
      - 'packages/primecare_ui/lib/src/screens/staff/communication/communication_screen.dart'
      - 'packages/primecare_ui/lib/src/screens/common/patient_messages/patient_messages_screen.dart'
      - 'packages/primecare_ui/lib/src/screens/psw/psw_messages/psw_messages_screen.dart'
      - 'packages/primecare_ui/lib/src/screens/psw/messaging/messaging_screen.dart'
      - 'packages/primecare_ui/test/communication_workspace_test.dart'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  twilio-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: twilio_fixture
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: twilio_sms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U twilio_fixture -d twilio_sms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/twilio-voice-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 miniflare@4.20260730.0 twilio@6.2.0 typescript@5.9.3 @types/node@24.0.0 pg@8.16.3 postal-mime@4.1.2 htmlparser2@12.0.0
          ln -s "$RUNNER_TEMP/twilio-voice-tools/node_modules" node_modules
          node_modules/.bin/tsc --noEmit --strict --target ES2022 --module esnext --moduleResolution bundler packages/shared/src/communications/twilio-voice.d.mts
          node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions cloudflare/workers/src/business-tasks/twilio-integration.ts
          node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions packages/shared/src/communications/sales-call-quality.ts packages/shared/src/communications/twilio-sales-quality.d.mts
          node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module esnext --moduleResolution bundler packages/shared/src/communications/twilio-sms.d.mts packages/shared/src/communications/twilio-verify.d.mts packages/shared/src/communications/voice-task-approval.d.mts packages/shared/src/communications/twilio-agent-start.d.mts packages/shared/src/communications/twilio-relay-session.d.mts packages/shared/src/communications/openai-relay-model.d.mts packages/shared/src/communications/twilio-device.d.mts packages/shared/src/communications/twilio-ringing.d.mts
          node --test scripts/test-communication-twilio.mjs scripts/test-communication-twilio-token.mjs scripts/test-communication-twilio-sms.mjs scripts/test-communication-twilio-device.mjs scripts/test-communication-twilio-connect.mjs scripts/test-communication-twilio-ringing.mjs scripts/test-communication-twilio-voicemail.mjs scripts/test-communication-voice-tasks.mjs scripts/test-communication-voice-confirmations.mjs scripts/test-communication-voice-reception-tasks.mjs scripts/test-communication-twilio-verify.mjs scripts/test-communication-voice-otp.mjs scripts/test-communication-otp-pairing.mjs scripts/test-communication-voice-otp-app.mjs scripts/test-communication-voice-task-approval.mjs scripts/test-communication-agent-start.mjs scripts/test-communication-relay-session.mjs scripts/test-communication-openai-relay.mjs
          node --test scripts/test-communication-sms-service.mjs scripts/test-business-communications.mjs
          node --test scripts/test-communication-voice-directory.mjs
          node scripts/test-communication-twilio-workerd.mjs
          node scripts/test-communication-relay-workerd.mjs
      - name: Verify SMS against disposable PostgreSQL
        env:
          TWILIO_SMS_TEST_DATABASE_URL: postgres://twilio_fixture:fixture_only@127.0.0.1:5432/twilio_sms_test
        run: |
          node scripts/test-communication-sms-postgres.mjs
          node --test scripts/test-communication-relay-postgres.mjs
          node --test scripts/test-communication-sales-quality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: communication-twilio-voice
          path: test-results/communication-twilio
          retention-days: 90
  flutter-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/flutter_core
      - name: Real communication transport failures and existing caller regressions
        working-directory: packages/flutter_core
        run: flutter test test/communication_mail_controller_test.dart test/communication_call_controller_test.dart test/communication_workspace_controller_test.dart test/dio_communication_transport_test.dart test/communication_transport_failure_test.dart test/business_development_transport_test.dart test/own_notifications_repository_test.dart test/auth_transport_test.dart test/auth_session_test.dart test/auth_mfa_test.dart test/provider_profile_test.dart
  flutter-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - name: Verify production-readback workspace bindings
        run: python3 tools/communication-ui-bindings.py
      - run: flutter pub get
        working-directory: packages/primecare_ui
      - name: Shared messaging widgets, localization, lifecycle and existing component regressions
        working-directory: packages/primecare_ui
        run: flutter test test/communication_channels_test.dart test/communication_workspace_test.dart test/theme_consumers_test.dart test/auth_design_test.dart
  flutter-browser-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/flutter_core
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/flutter-media-tools" --ignore-scripts playwright@1.60.0 esbuild@0.27.2
          ln -s "$RUNNER_TEMP/flutter-media-tools/node_modules" node_modules
          node tools/communication-media-bundle.mjs
          mkdir -p test-results
          cd packages/flutter_core
          dart compile js test/communication_browser_media_harness.dart -o ../../test-results/communication-dart-browser.js
      - name: Compiled Dart bridge, shared session and real audio packets
        run: |
          export BUSINESS_TEST_CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          node --test scripts/test-communication-flutter-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: communication-flutter-browser
          path: test-results/communication-flutter-browser
          retention-days: 90
  dart-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: {sdk: '3.11.3'}
      - name: Analyze and execute the shared Dart client without unrelated Flutter dependencies
        run: |
          acceptance="$RUNNER_TEMP/communication-dart"
          mkdir -p "$acceptance/packages/flutter_core/lib/communications" "$acceptance/tools"
          cp packages/flutter_core/lib/communications/communication_core.dart "$acceptance/packages/flutter_core/lib/communications/"
          cp tools/communication-client-check.dart "$acceptance/tools/"
          printf 'name: communication_core_acceptance\nenvironment:\n  sdk: ">=3.11.3 <4.0.0"\n' > "$acceptance/pubspec.yaml"
          cd "$acceptance"
          dart pub get
          dart analyze
          dart run tools/communication-client-check.dart
  inventory:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix "$RUNNER_TEMP/communications-reader" --ignore-scripts pg@8.16.3
          ln -s "$RUNNER_TEMP/communications-reader/node_modules" node_modules
      - name: Test contract gap reporting without production credentials
        run: |
          node --test tools/governance-production/test-reader-errors.mjs
          python tools/governance-production/test-communication-contract-report.py
          python tools/governance-production/test-communication-provider-inventory.py
      - name: Read production registrations without business access
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python tools/governance-production/audit-business-communications.py
      - name: Read known Worker binding names without secrets or mail contents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/governance-production/communication_provider_inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-communications-registry
          path: test-results/business-communications
          retention-days: 90
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: communications_test
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: communications_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U communications_test -d communications_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BUSINESS_TEST_DATABASE_URL: postgres://communications_test:disposable-only@localhost:5432/communications_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/communications-tools" --ignore-scripts pg@8.16.3 esbuild@0.27.2 typescript@5.9.3 @types/node@24.0.0 ajv@8.17.1 ajv-formats@3.0.1 postal-mime@4.1.2 htmlparser2@12.0.0 twilio@6.2.0
          ln -s "$RUNNER_TEMP/communications-tools/node_modules" node_modules
      - name: Check production-generated shared route bindings
        run: |
          python3 tools/communication-route-bindings.py
          node tools/communication-schema-validators.mjs
          node --test scripts/test-communication-schema-validator.mjs
      - name: Shared business rules
        run: node --test packages/shared/test/business-*.test.mjs
      - name: Strict service types and existing email compatibility
        run: |
          node_modules/.bin/tsc --noEmit --target ES2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions --strict --skipLibCheck --resolveJsonModule cloudflare/workers/src/business-tasks/*.ts
          node --test scripts/test-email-runtime-validation.mjs scripts/test-communication-session.mjs scripts/test-communication-endpoint-policy.mjs scripts/test-communication-native-mail.mjs scripts/test-communication-runtime.mjs scripts/test-communication-workers-runtime.mjs
      - name: All candidate workflow services and communications with native PostgreSQL
        run: node --test scripts/test-business-communications.mjs scripts/test-communication-mail-preview.mjs
      - name: Native current account, task, mailbox policies and default runtime integration
        run: node --test scripts/test-communication-access-policy.mjs
      - name: Registered HTTP contracts through native PostgreSQL
        run: node --test scripts/test-communication-http.mjs
      - name: Shared communication resource and byte-limit bases
        run: node --test scripts/test-communication-adapter-base.mjs scripts/test-communication-inbound-email.mjs scripts/test-communication-pictures.mjs scripts/test-communication-workers-pictures.mjs scripts/test-communication-audio-session.mjs scripts/test-communication-flutter-bridge.mjs
  worker-pictures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/picture-worker-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 miniflare@4.20260730.0 sharp@0.34.5 postal-mime@4.1.2 htmlparser2@12.0.0
          ln -s "$RUNNER_TEMP/picture-worker-tools/node_modules" node_modules
          node --test scripts/test-communication-pictures.mjs scripts/test-communication-workers-pictures.mjs
          node scripts/test-communication-pictures-workerd.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: communication-worker-pictures
          path: test-results/communication-worker-pictures
          retention-days: 90
  worker-validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/validator-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 ajv@8.17.1 ajv-formats@3.0.1 miniflare@4.20260730.0
          ln -s "$RUNNER_TEMP/validator-tools/node_modules" node_modules
          node tools/communication-schema-validators.mjs
          node --test scripts/test-communication-schema-validator.mjs
          node scripts/test-communication-validator-workerd.mjs
          node scripts/test-communication-inbound-workerd.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: communication-worker-validator
          path: test-results/communication-validator
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: communication-worker-inbound
          path: test-results/communication-inbound
          retention-days: 90
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install image and browser test packages
        run: |
          npm install --prefix "$RUNNER_TEMP/media-tools" --ignore-scripts playwright@1.60.0 sharp@0.34.5
          ln -s "$RUNNER_TEMP/media-tools/node_modules" node_modules
      - name: Select the runner Chrome instead of downloading another browser and system packages
        run: |
          browser_path="$(command -v google-chrome)"
          test -x "$browser_path"
          "$browser_path" --version
          echo "BUSINESS_TEST_CHROMIUM_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
      - name: Decode real raster data, bound email streams and verify audio packets
        run: node --test scripts/test-business-media.mjs scripts/test-communication-ringing-browser.mjs scripts/test-communication-voice-otp-browser.mjs scripts/test-communication-voice-task-approval-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-communications-media
          path: test-results/business-communications-media
          retention-days: 90
