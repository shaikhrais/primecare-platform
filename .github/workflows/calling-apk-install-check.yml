name: Verify delivered calling APK installation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calling-apk-install-check.yml'
      - 'scripts/check-calling-apk-install.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: PrimeCare-Calls-native-test-apk
          run-id: 40322198541
          github-token: ${{ github.token }}
          path: apk
      - name: Verify exact delivered APK
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('apk/PrimeCare-Calls-native-test.apk')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='9246b71cc7bd14572496664c9161fd929874d92b2436be4b0fa717927d2ac863'
          assert Path('apk/SOURCE.txt').read_text().strip()=='c25f9f428646b86f5247b84d885870b177c7ad3d'
          PY
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open exact APK on clean Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 300
          script: python scripts/check-calling-apk-install.py
      - name: Save installation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calling-apk-android13-install-evidence
          path: apk-install-evidence/
          if-no-files-found: error
