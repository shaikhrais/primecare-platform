name: Diagnose deployed browser calling
on:
  push:
    branches: [main]
    paths: ['.github/workflows/calling-browser-check.yml', 'scripts/diagnose-browser-calling.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primecare-calling-browser-proof
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/call-proof" --ignore-scripts --no-audit --no-fund pg@8.16.3 bcryptjs@2.4.3 playwright@1.56.1
          ln -s "$RUNNER_TEMP/call-proof/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
          pip install -r tools/governance-production/requirements.txt
      - env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python scripts/prepare-internal-call-live-identity.py
          node scripts/diagnose-browser-calling.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-calling-proof, path: test-results/internal-calls, retention-days: 30}
