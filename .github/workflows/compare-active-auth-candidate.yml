name: Compare active auth candidate
on:
  push:
    branches: [main]
    paths:
      - 'scripts/compare-active-auth-candidate.mjs'
      - '.github/workflows/compare-active-auth-candidate.yml'
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm ci --ignore-scripts
          npm install --prefix /tmp/auth-release-extra --ignore-scripts --no-audit --no-fund bcryptjs@3.0.2
          test -e node_modules/bcryptjs || ln -s /tmp/auth-release-extra/node_modules/bcryptjs node_modules/bcryptjs
          node scripts/compare-active-auth-candidate.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
