name: Prepare private Cloudflare email inbox
on:
  push:
    branches: [deploy/email-inbox-20261010]
    paths: [.github/workflows/setup-email-inbox.yml, cloudflare/email-inbox/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cloudflare/email-inbox/worker.test.mjs
      - run: node cloudflare/email-inbox/setup.mjs
      - run: npx --yes wrangler@4.68.1 deploy --config cloudflare/email-inbox/wrangler.generated.json
      - name: Record routing prerequisite
        run: echo 'Storage Worker deployed. Addresses are not active until Email Routing rules are connected; current token returned HTTP 403 for Routing and DNS.' >> "$GITHUB_STEP_SUMMARY"
