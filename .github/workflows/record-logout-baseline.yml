name: Record logout server-failure baseline
on:
  push:
    branches: [main]
    paths: [.github/workflows/record-logout-baseline.yml]
permissions:
  contents: read
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 39322477891
          github-token: ${{ github.token }}
          name: logout-server-failure-baseline
          path: test-results/logout-workflow
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Persist failed acceptance before implementation
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
        run: |
          python - <<'PY'
          import sys,json,pathlib,hashlib,os
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt
          root=pathlib.Path.cwd();base='test-results/logout-workflow';flow='auth.logout'
          receipt=json.loads((root/base/'results.json').read_text())
          assert receipt['baseline'] is True and receipt['probeCompleted'] is True and receipt['passed'] is False and receipt['wholeTaskVerified'] is False and len(receipt['failures'])==3
          for case in receipt['cases']:assert case['databaseFailureReproduced'] and case['serverSessionStillActive'] and case['browserTokenCleared']
          sources=receipt['source_bindings']
          for path,sha in sources.items():assert hashlib.sha256((root/path).read_bytes()).hexdigest()==sha
          url='https://github.com/shaikhrais/primecare-platform/actions/runs/39322477891/artifacts/12220063802'
          evidence=[]
          for name,kind in [('results.json','browser'),('run.mjs','test')]+[('logout-'+l+'.webm','video') for l in ['en','fr','es']]:
              path=base+'/'+name;evidence.append(dict(path=path,kind=kind,sha256=hashlib.sha256((root/path).read_bytes()).hexdigest(),url=url))
          issue=dict(criterion_id='step:2',reproduction='Log in as Platform Admin, force DELETE on the isolated auth_sessions table to fail, then click platform-logout. The real logout API returns 503. Reproduced in EN/FR/ES with native PostgreSQL and the actual main router/service.',expected='Database failure shows a localized retryable error and does not claim successful sign-out. A successful current-session revocation is confirmed before committing browser sign-out.',actual='The Platform Admin UI clears primecare_session and navigates to login on HTTP 503, while the token remains stored server-side and GET /v1/auth/me still succeeds.',affected_sources=['websites/typescript/src/platform-admin.ts','websites/typescript/src/auth-client.ts'])
          handoff=json.dumps(dict(workflow_id=flow,main_sha=os.environ['GITHUB_SHA'],work_branch=None,pr=None,verification_status='implemented-unverified',test_status='failed',evidence_url=url,synthetic_data_cleanup=receipt['cleanup'],next_action='Create the single allowed work branch after fresh remote branch/PR inspection. Confirm server sign-out through shared auth transport before browser cleanup; surface the existing localized unavailable text; preserve a replacement session if identity/token changes during the pending response. Add transport/native browser regressions, pass required CI/review gates, merge, verify inclusion and delete the work branch.'),sort_keys=True)
          with ProductionWorkflowStore() as db:
              assert db.execute('SELECT definition_sha256 FROM virtual_workflow_definitions WHERE flow_id=?',(flow,)).fetchone()[0]==receipt['definition_sha256']=='ccebd7a6915d38bbcd01cacba08c80249e81abda5b0b551f4e23b39babcb7ed0'
              output=record_attempt(db,flow,dict(status='implemented-unverified',test_status='failed',scope='scoped',source_bindings=sources,evidence=evidence,issues=[issue],blockers=['Registered API row 5 lacks formal schemas/permission metadata; generic missing/expired-session denial alternatives must be reconciled with the existing idempotent logout contract before full verification.'],next_action=handoff),root)
              ids=list(db.execute('SELECT issue_id FROM virtual_workflow_issues WHERE attempt_id=?',(output['attempt_id'],)))
          print('LOGOUT_BASELINE_COMMITTED '+json.dumps(dict(attempt=output,issue_ids=ids)))
          PY
