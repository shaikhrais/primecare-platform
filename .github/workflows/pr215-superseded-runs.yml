name: Cancel superseded PR215 runs only
on:
  push:
    branches: [main]
    paths: [.github/workflows/pr215-superseded-runs.yml]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:215});
            if (pr.head.ref !== 'work/auth-maintenance-repair-20261019' || pr.state !== 'open') throw Error('Expected sole active repair PR');
            const keep = pr.head.sha;
            let cancelled=0;
            for(let page=1;page<=4;page++){
              const {data}=await github.rest.actions.listWorkflowRunsForRepo({owner:context.repo.owner,repo:context.repo.repo,branch:pr.head.ref,per_page:100,page});
              for(const run of data.workflow_runs){
                if(run.head_sha===keep || !['queued','in_progress','waiting','pending','requested'].includes(run.status))continue;
                if(run.head_branch!==pr.head.ref)continue;
                try{await github.rest.actions.cancelWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:run.id});core.info('Cancelled superseded PR215 source '+run.head_sha+' run '+run.id);cancelled++;}
                catch(error){if(![404,409].includes(error.status))throw error;}
              }
              if(data.workflow_runs.length<100)break;
            }
            core.info('Current head preserved: '+keep+'; superseded runs cancelled: '+cancelled);

# Recheck obsolete runs after the final repair candidate update.
