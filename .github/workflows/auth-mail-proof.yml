name: Prove existing auth maintenance repairs
on:
  push:
    branches: [main]
    paths: [.github/workflows/auth-mail-proof.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maintenance
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: maintenance_metadata_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U maintenance -d maintenance_metadata_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0321f7ca85e3016dee58cc087d48384bbb96b417
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - env:
          WORKFLOW_TEST_DATABASE_URL: postgres://maintenance:fixture-only@127.0.0.1:5432/maintenance_metadata_test
        run: python tools/governance-production/test-maintenance-registration.py
  authority:
    needs: native
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0321f7ca85e3016dee58cc087d48384bbb96b417
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Bind only existing maintenance workflows and export current policy
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_MAINTENANCE_REGISTRATION_WRITES: '1'
        run: |
          python -u - <<'PY'
          import sys,json,pathlib
          sys.path.insert(0,'tools/workflow-verification');sys.path.insert(0,'tools/governance-production')
          from maintenance_registration import MaintenanceRegistrationStore
          from maintenance_flow_binding import bind,FLOWS
          from execution import summary
          out=pathlib.Path('test-results');out.mkdir(exist_ok=True)
          with MaintenanceRegistrationStore() as db:
           result=[bind(db,flow) for flow in FLOWS]
           names=[c['name'] for c in db.tables['virtual_workflow_definitions']['columns']]
           flows=[dict(zip(names,r)) for r in db.execute("SELECT * FROM virtual_workflow_definitions WHERE flow_kind='business_process' AND flow_id LIKE ?",('auth.%',))]
           theme=dict(db.execute('SELECT css_variable_name,token_value FROM theme_design_tokens WHERE theme_id=1 AND active=1'))
           state={'binding_results':result,'summary':summary(db),'candidate_sha':'0321f7ca85e3016dee58cc087d48384bbb96b417','active_branch':'work/auth-mail-contract-20261020','pr':218,'full_auth_verified':False,'next_action':'Complete native browser baseline/candidate attempts, CI, merge and cleanup. Remaining auth requirements/reviews remain unresolved.'}
           for name in ['auth-completion-current','execution-handoff-current']:
            db.execute('INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP',(name,json.dumps(state)))
           (out/'governance.json').write_text(json.dumps({'flows':flows,'theme':theme,'binding_results':result},indent=2))
           (out/'read-governance.json').write_text(json.dumps({'virtual_workflow_definitions':[r for r in flows if r['flow_id']=='auth.inspect-email-config'],'linked_screens':[{'id':1264}],'theme':theme},indent=2))
           print('AUTH_MAIL_BINDINGS_COMMITTED '+json.dumps(state))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: auth-mail-live-authority
          path: test-results
  browser:
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      evidence: ${{ steps.evidence.outputs.artifact-url }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: login_browser
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U primecare -d login_browser" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0321f7ca85e3016dee58cc087d48384bbb96b417
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: auth-mail-live-authority
          path: test-results
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --prefix /tmp/auth-mail-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 pg@8.16.3 bcryptjs@3 @axe-core/playwright@4.11.1
          ln -s /tmp/auth-mail-tools/node_modules node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Reproduce original false-success failures then execute candidate and read regressions
        env:
          LOGIN_BROWSER_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/login_browser
          VERIFICATION_SOURCE_SHA: 0321f7ca85e3016dee58cc087d48384bbb96b417
        run: |
          for flow in auth.save-email-config auth.test-maintenance-email; do
            mkdir -p "test-results/$flow" "test-results/$flow-baseline"
            cp test-results/governance.json "test-results/$flow/governance.json"
            cp test-results/governance.json "test-results/$flow-baseline/governance.json"
          done
          cp websites/typescript/src/maintenance-client.ts /tmp/candidate-maintenance-client.ts
          git show deffda07078489926a7821e48bc42a86bc443f36:websites/typescript/src/maintenance-client.ts > websites/typescript/src/maintenance-client.ts
          MAINTENANCE_BASELINE=1 node scripts/test-maintenance-mutation-workflow.mjs auth.save-email-config
          MAINTENANCE_BASELINE=1 node scripts/test-maintenance-mutation-workflow.mjs auth.test-maintenance-email
          cp /tmp/candidate-maintenance-client.ts websites/typescript/src/maintenance-client.ts
          node --test scripts/test-maintenance-client.mjs scripts/test-account-client.mjs scripts/test-session-signout-client.mjs
          node scripts/test-maintenance-mutation-workflow.mjs auth.save-email-config
          node scripts/test-maintenance-mutation-workflow.mjs auth.test-maintenance-email
          mkdir -p test-results/email-config
          cp test-results/read-governance.json test-results/email-config/governance.json
          node scripts/test-maintenance-read-workflow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        id: evidence
        with:
          name: auth-mail-browser-proof
          path: test-results
          retention-days: 90
  record:
    needs: browser
    if: always() && needs.browser.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0321f7ca85e3016dee58cc087d48384bbb96b417
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: auth-mail-browser-proof
          path: test-results
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Record original failures, focused repairs and current handoff
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          EVIDENCE_URL: ${{ needs.browser.outputs.evidence }}
          RUN_URL: https://github.com/shaikhrais/primecare-platform/actions/runs/${{ github.run_id }}
        run: |
          python -u - <<'PY'
          import sys,json,pathlib,hashlib,os,subprocess
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt,summary,_resolution_current
          root=pathlib.Path.cwd();client=root/'websites/typescript/src/maintenance-client.ts';candidate=client.read_bytes()
          base=subprocess.check_output(['git','show','deffda07078489926a7821e48bc42a86bc443f36:websites/typescript/src/maintenance-client.ts'])
          attempts=[]
          for flow in ['auth.save-email-config','auth.test-maintenance-email']:
           for baseline in [True,False]:
            client.write_bytes(base if baseline else candidate)
            folder='test-results/'+flow+('-baseline' if baseline else '');path=folder+'/results.json'
            r=json.loads((root/path).read_text());passed=r.get('passed') is True
            if baseline and not r.get('probeCompleted'):raise RuntimeError('Baseline reproduction did not complete: '+flow)
            if not baseline and not passed:raise RuntimeError('Candidate browser failed: '+flow+' '+str(r.get('error')))
            sources={**r['source_bindings'],'scripts/test-maintenance-mutation-workflow.mjs':hashlib.sha256((root/'scripts/test-maintenance-mutation-workflow.mjs').read_bytes()).hexdigest()}
            evidence=[{'kind':'browser','path':path,'sha256':hashlib.sha256((root/path).read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']}]
            for v in sorted((root/folder).glob('*.webm')):evidence.append({'kind':'video','path':str(v.relative_to(root)),'sha256':hashlib.sha256(v.read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']})
            proof_path=folder+'/focused-resolution.json'
            if passed:
             proof={'workflow_id':flow,'criterion_results':r['criterion_results'],'source_bindings':sources,'wholeTaskVerified':False,'execution_receipt':path}
             (root/proof_path).write_text(json.dumps(proof,indent=2));evidence.append({'kind':'browser','path':proof_path,'sha256':hashlib.sha256((root/proof_path).read_bytes()).hexdigest(),'url':os.environ['RUN_URL']})
            result={'status':'implemented-unverified','test_status':'scoped_pass' if passed else 'failed','scope':'scoped','source_bindings':sources,'evidence':evidence,'issues':r['failures'] if baseline else [],'blockers':r['limitations'],'next_action':'Complete current PR218 CI/review/merge/cleanup. Full workflow acceptance and independent reviews remain required; address other unblocked auth gaps next.'}
            with ProductionWorkflowStore() as db:
             if passed:
              ids=db.execute('SELECT i.issue_id,i.criterion_id FROM virtual_workflow_issues i JOIN virtual_workflow_attempts a ON a.attempt_id=i.attempt_id WHERE a.flow_id=? AND i.criterion_id=?',(flow,'ui.maintenance-mutation-confirmation')).fetchall()
              ids=[(i,c) for i,c in ids if not _resolution_current(db,flow,i,root)]
              result.update(resolves_issue_ids=[i for i,c in ids],resolution_note='Original false-success reproduction replayed in six real-credential browser/database cases; current acknowledgements fail closed and retry passes.',issue_resolution_results={str(i):{'criterion_id':c,'result':'passed','reproduction_verified':True,'evidence_path':proof_path} for i,c in ids})
             saved=record_attempt(db,flow,result,root);attempts.append(saved)
            print('AUTH_MAIL_ATTEMPT '+json.dumps(saved))
          client.write_bytes(candidate)
          path='test-results/email-config/results.json';r=json.loads((root/path).read_text())
          if not r.get('passed'):raise RuntimeError('Read regression failed')
          evidence=[{'kind':'browser','path':path,'sha256':hashlib.sha256((root/path).read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']}]
          for v in (root/'test-results/email-config').glob('*.webm'):evidence.append({'kind':'video','path':str(v.relative_to(root)),'sha256':hashlib.sha256(v.read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']})
          with ProductionWorkflowStore() as db:
           saved=record_attempt(db,'auth.inspect-email-config',{'status':'implemented-unverified','test_status':'scoped_pass','scope':'scoped','source_bindings':r['source_bindings'],'evidence':evidence,'issues':[],'blockers':r['limitations'],'next_action':'Current read regression passed; full acceptance and independent review gates remain required.'},root);attempts.append(saved)
           state={'summary':summary(db),'auth_summary':{status:db.execute("SELECT COUNT(*) FROM virtual_workflow_definitions WHERE flow_kind='business_process' AND flow_id LIKE ? AND verification_status=?",('auth.%',status)).fetchone()[0] for status in ['missing','implemented-unverified','verified','blocked']},'candidate_sha':'0321f7ca85e3016dee58cc087d48384bbb96b417','active_branch':'work/auth-mail-contract-20261020','pr':218,'attempts':attempts,'evidence':os.environ['EVIDENCE_URL'],'full_auth_verified':False,'synthetic_cleanup':'All native browser schemas dropped; capture-only provider; no production business data or real mail changed','next_action':'Complete PR218 required CI/review/merge and local/remote branch cleanup. Next address unblocked auth contract discrepancies; full auth requirements and independent reviews remain open.'}
           for name in ['auth-completion-current','execution-handoff-current']:
            db.execute('INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP',(name,json.dumps(state)))
           pathlib.Path('test-results/auth-mail-handoff.json').write_text(json.dumps(state,indent=2));print('AUTH_MAIL_HANDOFF '+json.dumps(state))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: auth-mail-current-handoff
          path: test-results/auth-mail-handoff.json
