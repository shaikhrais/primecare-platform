name: Verify named runtime service packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_guarded_service/**'
      - 'packages/primecare_demo_dashboard/**'
      - 'packages/primecare_demo_scheduler/**'
      - 'packages/primecare_intelligence/**'
      - 'packages/primecare_preferences/**'
      - '.github/workflows/native-runtime-service-packages.yml'
permissions: {contents: read}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        package: [primecare_guarded_service, primecare_demo_dashboard, primecare_demo_scheduler, primecare_intelligence, primecare_preferences]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
