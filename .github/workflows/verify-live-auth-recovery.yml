name: Verify deployed auth recovery through owned inbox
on:
  push:
    branches: [work/auth-live-mail-20261020]
    paths: [.github/workflows/verify-live-auth-recovery.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg[binary]==3.2.13 bcrypt==4.3.0
      - name: Send one correlated synthetic email and remove only its inbox record
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os,json,pathlib,urllib.request,urllib.error,urllib.parse,time,uuid,hashlib
          token=os.environ.get('CLOUDFLARE_API_TOKEN');account=os.environ.get('CLOUDFLARE_ACCOUNT_ID');assert token and account
          domain='15minutes-email.com';recipient='auth-test@'+domain;sender='noreply@'+domain;nonce=str(uuid.uuid4())
          report={'domain':domain,'recipient':recipient,'sender':sender,'synthetic':True,'read_other_inboxes':False,'application_accounts_changed':False,'password_resets_requested':False,'send_attempted':False,'accepted':False,'received':False,'cleanup':'No message sent','whole_workflow_verified':False}
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          def call(path,method='GET',body=None):
              req=urllib.request.Request(base+path,method=method,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},data=None if body is None else json.dumps(body).encode())
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:return response.status,response.read(),dict(response.headers)
              except urllib.error.HTTPError as error:return error.code,error.read(),{}
          def read_json(path):
              status,data,_=call(path);assert status==200,'Cloudflare read unavailable: '+str(status)
              result=json.loads(data);assert result.get('success');return result['result']
          settings=read_json('/workers/scripts/primecare-email-inbox/settings');bindings=settings.get('bindings',[])
          kv=next(b for b in bindings if b.get('name')=='INBOX' and b.get('type')=='kv_namespace');namespace=kv['namespace_id']
          addresses=next(b.get('text','') for b in bindings if b.get('name')=='INBOX_ADDRESSES' and b.get('type')=='plain_text')
          assert recipient in [v.strip().lower() for v in addresses.split(',')],'Owned synthetic recipient not configured'
          status,source,_=call('/workers/scripts/primecare-email-inbox/content/v2');assert status==200
          source=source.decode('utf8','replace');compact=''.join(source.split())
          assert 'inbox/${recipient}/${receivedAt}/${crypto.randomUUID()}' in source,'Append-only inbox key schema changed'
          assert '.forward(' not in compact and '.reply(' not in compact and 'fetch(' not in compact,'Receiving Worker needs a new side-effect review'
          api='/storage/kv/namespaces/'+namespace;prefix='inbox/'+recipient+'/'
          def keys():
              found=set();cursor=None
              for _ in range(10):
                  query={'prefix':prefix,'limit':1000}
                  if cursor:query['cursor']=cursor
                  status,data,_=call(api+'/keys?'+urllib.parse.urlencode(query));assert status==200,'Inbox key read unavailable: '+str(status)
                  result=json.loads(data);assert result.get('success')
                  found.update(row['name'] for row in result['result'])
                  cursor=(result.get('result_info') or {}).get('cursor')
                  if not cursor:return found
              raise RuntimeError('Owned test inbox metadata exceeds bounded pagination')
          def value_path(key):return api+'/values/'+urllib.parse.quote(key,safe='')
          import psycopg,bcrypt,re,secrets
          db=psycopg.connect(os.environ['PRODUCTION_DATABASE_URL'],connect_timeout=15)
          tenant_id=str(uuid.uuid4());user_id=str(uuid.uuid4());password=secrets.token_urlsafe(24);new_password=secrets.token_urlsafe(24);fixture_created=False
          gateway='https://primecare-api-gateway.itpro-mohammed.workers.dev'
          def auth_call(path,body=None,bearer=None):
              headers={'Content-Type':'application/json'}
              if bearer:headers['Authorization']='Bearer '+bearer
              request=urllib.request.Request(gateway+path,headers=headers,data=None if body is None else json.dumps(body).encode(),method='GET' if body is None else 'POST')
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:return response.status,json.loads(response.read())
              except urllib.error.HTTPError as error:return error.code,json.loads(error.read())
          def must(value,label):
              assert value,label
              report.setdefault('auth_checks',[]).append(label)
          owned_key=None;owned_hash=None;received_code=None
          try:
              baseline=keys();probe=prefix+'__synthetic_probe_'+nonce
              status,_,_=call(value_path(probe));assert status==404,'Expected absent owned probe key'
              status,data,_=call(value_path(probe),'DELETE');assert status in [200,204],'Owned fixture cleanup permission unavailable'
              auth=read_json('/workers/scripts/primecare-auth-api/settings');auth_bindings=auth.get('bindings',[])
              assert any(b.get('name')=='EMAIL' and b.get('type')=='send_email' for b in auth_bindings)
              assert next(b.get('text') for b in auth_bindings if b.get('name')=='EMAIL_FROM')==sender
              with db.transaction():
                  must(db.execute('SELECT COUNT(*) FROM users WHERE LOWER(email)=%s',(recipient,)).fetchone()[0]==0,'Synthetic inbox has no existing account; preserve existing users')
                  db.execute("INSERT INTO tenants(id,name,slug,status,updated_at,allowed_vpn_ranges,cors_allowed_origins,cors_allowed_methods,cors_allowed_headers) VALUES(%s,'Temporary recovery QA',%s,'active',NOW(),'','[]'::jsonb,'[]'::jsonb,'[]'::jsonb)",(tenant_id,'recovery-'+nonce))
                  db.execute("INSERT INTO users(id,email,tenant_id,roles,password_hash,status,updated_at) VALUES(%s,%s,%s,'rmt',%s,'active',NOW())",(user_id,recipient,tenant_id,bcrypt.hashpw(password.encode(),bcrypt.gensalt(12)).decode()))
              fixture_created=True
              status,login=auth_call('/v1/auth/login',{'email':recipient,'password':password})
              must(status==200 and login.get('userId')==user_id,'Real deployed credential login')
              old_token=login['token']
              status,response=auth_call('/v1/auth/forgot-password',{'email':recipient})
              report['send_attempted']=True;report['send_http_status']=status
              must(status==200 and response.get('message')=='If an active account matches, recovery instructions will be emailed. Check your inbox and spam folder.','Deployed recovery request accepted with generic response')
              must('code' not in response and 'token' not in response,'Recovery code absent from HTTP response')
              report['accepted']=True;report['cleanup']='Awaiting hash-matched recovery email'
              for _ in range(24):
                  for key in sorted(keys()-baseline):
                      status,data,_=call(value_path(key))
                      if status==404:continue
                      assert status==200
                      candidates=re.findall(r'(?<![A-F0-9])[A-F0-9]{12}(?![A-F0-9])',data.decode('utf8','replace'))
                      for candidate in candidates:
                          hashed=hashlib.sha256((recipient+':'+candidate).encode()).hexdigest()
                          row=db.execute('SELECT user_id FROM auth_password_resets WHERE token_hash=%s AND user_id=%s AND expires_at>NOW()',(hashed,user_id)).fetchone()
                          db.commit()
                          if row:received_code=candidate;break
                      if not received_code:continue
                      owned_key=key;owned_hash=hashlib.sha256(data).hexdigest();report['received']=True;report['received_record_sha256']=owned_hash;report['matched_correlation']=True;break
                  if owned_key:break
                  time.sleep(5)
              assert owned_key,'Owned receiving Worker did not record the correlated email within 120 seconds'
              must(bool(received_code),'Recovery email received and code hash matches database')
              status,reset=auth_call('/v1/auth/reset-password',{'email':recipient,'code':received_code,'newPassword':new_password})
              must(status==200 and reset.get('status')=='password_reset' and reset.get('reauthenticationRequired') is True,'Deployed password reset succeeds')
              must(auth_call('/v1/auth/me',bearer=old_token)[0]==401,'Reset revokes existing session')
              must(auth_call('/v1/auth/login',{'email':recipient,'password':password})[0]==401,'Old password rejected')
              status,new_login=auth_call('/v1/auth/login',{'email':recipient,'password':new_password})
              must(status==200 and new_login.get('userId')==user_id,'New password authenticates')
              must(auth_call('/v1/auth/reset-password',{'email':recipient,'code':received_code,'newPassword':secrets.token_urlsafe(24)})[0]==400,'Consumed reset code cannot be replayed')
              must(auth_call('/v1/auth/me',bearer=new_login['token'])[0]==200,'New authenticated identity survives reread')
              must(auth_call('/v1/auth/logout',{},new_login['token'])[0]==200,'New session logout succeeds')
              must(auth_call('/v1/auth/me',bearer=new_login['token'])[0]==401,'Logged-out session rejected')
              must(db.execute('SELECT COUNT(*) FROM auth_password_resets WHERE user_id=%s',(user_id,)).fetchone()[0]==0,'All reset codes removed after success')
              db.commit()
              report['roundtrip_passed']=True;report['deployed_recovery_passed']=True
          except Exception as error:
              report['error']=str(error);raise
          finally:
              if owned_key:
                  status,data,_=call(value_path(owned_key))
                  assert status==200 and hashlib.sha256(data).hexdigest()==owned_hash  ,'Correlated fixture changed; preserve instead of deleting'
                  status,_,_=call(value_path(owned_key),'DELETE');assert status in [200,204],'Owned test-message cleanup failed'
                  report['cleanup']='Only the exact nonce/hash-matched synthetic message removed; pre-existing inbox entries preserved'
              try:
                  db.rollback()
                  if fixture_created:
                      with db.transaction():
                          for table in ['auth_password_resets','auth_sessions','auth_password_audit']:
                              db.execute('DELETE FROM '+table+' WHERE user_id=%s',(user_id,))
                          for table in ['auth_account_audit','auth_management_audit']:
                              db.execute('DELETE FROM '+table+' WHERE tenant_id=%s',(tenant_id,))
                          for operation,subject in [('login',recipient),('forgot',recipient),('reset',recipient),('changePassword',user_id)]:
                              db.execute('DELETE FROM auth_rate_limits WHERE subject_hash=%s',(hashlib.sha256((operation+':'+subject).encode()).hexdigest(),))
                          db.execute('DELETE FROM users WHERE id=%s AND tenant_id=%s',(user_id,tenant_id))
                          db.execute('DELETE FROM tenants WHERE id=%s',(tenant_id,))
                      report['account_cleanup']='Exact synthetic user, tenant, sessions, codes, audit and counters removed'
              finally:db.close()
              path=pathlib.Path('test-results/mail-roundtrip');path.mkdir(parents=True,exist_ok=True);(path/'results.json').write_text(json.dumps(report,indent=2))
              print('OWNED_EMAIL_ROUNDTRIP '+json.dumps(report))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-auth-recovery-evidence
          path: test-results
