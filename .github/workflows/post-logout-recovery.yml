  record:
    needs: browser
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: post-logout-main-browser-evidence
          path: test-results
      - uses: actions/download-artifact@v4
        with:
          run-id: 39322958457
          github-token: ${{ github.token }}
          name: synthetic-care-browser-evidence
          path: care-regression-artifact
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Record current proofs, focused issue resolution and source staleness
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GH_TOKEN: ${{ github.token }}
          AUTH_EVIDENCE_URL: ${{ needs.browser.outputs.evidence_url }}
        run: |
          python - <<'PY'
          import sys,os,json,pathlib,hashlib,urllib.request
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt,summary,_bindings_current
          root=pathlib.Path.cwd();url=os.environ['AUTH_EVIDENCE_URL'];assert '/artifacts/' in url
          request=urllib.request.Request('https://api.github.com/repos/shaikhrais/primecare-platform/pulls/213',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          pr=json.load(urllib.request.urlopen(request));assert pr['merged'] and pr['state']=='closed' and pr['head']['sha']=='67d47d59b001b3ab1939a8891b036ed624aada5e'
          cases=[('auth.credential-login','credential-login-browser','login-workspace',5),('auth.change-password','password-workflow-browser','password-reauth',3),('auth.logout','logout-workflow','logout',4)]
          outputs=[]
          for flow,directory,video_prefix,groups in cases:
              base='test-results/'+directory;receipt=json.loads((root/base/'results.json').read_text())
              assert receipt['workflow_id']==flow and receipt['passed'] is True and receipt['wholeTaskVerified'] is False and len(receipt['cases'])==3 and len(receipt['apiChecks'])==groups
              assert receipt['commit']==os.environ['GITHUB_SHA']
              sources=receipt['source_bindings']
              assert _bindings_current(sources,root)
              files=[('results.json','browser'),('governance.json','specification'),('run.mjs','test')]+[(video_prefix+'-'+locale+'.webm','video') for locale in ['en','fr','es']]
              evidence=[dict(path=base+'/'+name,sha256=hashlib.sha256((root/base/name).read_bytes()).hexdigest(),kind=kind,url=url) for name,kind in files]
              blockers=['Platform Admin EN/FR/ES path is demonstrated on current merged main; other registered role UI surfaces and deployed Cloudflare/cookie acceptance remain unproven.','Full accessibility/PWA, governed recording playback delivery, current specification/source rebinding and independent review gates remain pending.']
              if flow=='auth.credential-login':blockers.append('Registered login API row 2 auth_required/service/schema metadata remains unreconciled with shared credential entry.')
              if flow=='auth.logout':blockers.append('Registered logout API row 5 has no formal response/permission schema; reconcile generic missing/expired-session denial alternatives with the existing idempotent logout contract. Workspace/maintenance logout surfaces require separate registered-role review.')
              handoff=dict(workflow_id=flow,main_sha=os.environ['GITHUB_SHA'],merge_sha=pr['merge_commit_sha'],work_branch='work/logout-session-confirmation',work_branch_sha=pr['head']['sha'],pr=213,merge_state='Merged and closed; exact work-branch cleanup pending',verification_status='implemented-unverified',test_status='scoped_pass',actor_role='platform_admin',evidence_url=url,synthetic_data_cleanup=receipt['cleanup'],blockers=blockers,next_action='Finish post-merge CI and exact branch cleanup, invalidate stale scoped proofs, then select the next unblocked live business process. Own-session workflow remains missing with the exact registration dependency recorded in attempt 318.')
              result=dict(status='implemented-unverified',test_status='scoped_pass',scope='scoped',source_bindings=sources,evidence=evidence,blockers=blockers,next_action=json.dumps(handoff,sort_keys=True))
              if flow=='auth.logout':
                  assert receipt['criterion_results']['step:2']=='passed'
                  result.update(resolves_issue_ids=[16],resolution_note='Replayed the original native PostgreSQL DELETE failure in EN/FR/ES. Platform Admin now retains the browser token and shows the existing localized retry error on 503. Additional cases cover offline/malformed acknowledgements, lost-response retry, replacement-session race, foreign-session preservation and denied reload.',issue_resolution_results={'16':dict(criterion_id='step:2',result='passed',reproduction_verified=True,evidence_path=base+'/results.json')})
              with ProductionWorkflowStore() as db:
                  assert db.execute('SELECT definition_sha256 FROM virtual_workflow_definitions WHERE flow_id=?',(flow,)).fetchone()[0]==receipt['definition_sha256']
                  output=record_attempt(db,flow,result,root)
              outputs.append(output);print('AUTH_RECOVERY_ATTEMPT_COMMITTED '+json.dumps(output))
          # Existing PR care proof may refresh its scoped status only when every
          # producer-bound application source still matches merged main.
          candidates=list((root/'care-regression-artifact').rglob('availability-workflow/results.json'))
          care_result={'refreshed':False}
          if len(candidates)==1:
              receipt_path=candidates[0];care=json.loads(receipt_path.read_text())
              matched=care.get('passed') is True and care.get('wholeTaskVerified') is False and len(care.get('cases',[]))==6 and len(care.get('apiChecks',[]))>=8
              matched=matched and _bindings_current(care.get('sources',{}),root)
              if matched:
                  with ProductionWorkflowStore() as db:
                      binding=db.execute("SELECT d.definition_sha256,a.definition_sha256 FROM virtual_workflow_definitions d JOIN virtual_workflow_checkpoints c ON c.flow_id=d.flow_id JOIN virtual_workflow_attempts a ON a.attempt_id=c.attempt_id WHERE d.flow_id=?",('care.psw.submit-availability',)).fetchone()
                      matched=bool(binding and binding[0]==binding[1])
              if matched:
                  path=str(receipt_path.relative_to(root));care_url='https://github.com/shaikhrais/primecare-platform/actions/runs/39322958457/artifacts/12220818758'
                  limitations=care.get('limitations',[])+['This PR regression uses an explicitly isolated historical CI theme fixture; live production governance was separately checked. Full production-theme/deployment acceptance remains pending.']
                  with ProductionWorkflowStore() as db:
                      care_result=record_attempt(db,'care.psw.submit-availability',dict(status='implemented-unverified',test_status='scoped_pass',scope='scoped',source_bindings=care['sources'],evidence=[dict(path=path,sha256=hashlib.sha256(receipt_path.read_bytes()).hexdigest(),kind='browser',url=care_url)],blockers=limitations,next_action='Current source-bound six-case/eight-group PR care regression passed. Continue native multi-connection/deployed-route/accessibility/PWA/video delivery and independent review acceptance; evidence used an isolated CI theme fixture.'),root)
          stale=[]
          with ProductionWorkflowStore() as db:
              rows=db.execute("SELECT d.flow_id,d.verification_status,d.blocker_json,a.source_bindings_json FROM virtual_workflow_definitions d JOIN virtual_workflow_checkpoints c ON c.flow_id=d.flow_id JOIN virtual_workflow_attempts a ON a.attempt_id=c.attempt_id WHERE d.flow_kind='business_process' AND d.test_status IN ('scoped_pass','passed')").fetchall()
              for flow,status,old_blockers,encoded in rows:
                  bindings=json.loads(encoded)
                  changed=[name for name,sha in bindings.items() if not (root/name).resolve().is_relative_to(root) or not (root/name).is_file() or hashlib.sha256((root/name).read_bytes()).hexdigest()!=sha]
                  if not changed:continue
                  assert status!='verified','Full verified-proof invalidation required'
                  reasons=['Source binding changed; scoped acceptance evidence requires refresh: '+', '.join(changed)]
                  blockers=json.loads(old_blockers or '[]')+reasons
                  db.execute("UPDATE virtual_workflow_definitions SET verification_status=?, test_status='stale',blocker_json=?,updated_at=CURRENT_TIMESTAMP WHERE flow_id=?",(status,json.dumps(blockers),flow))
                  db.execute("UPDATE virtual_workflow_checkpoints SET invalidation_json=?, updated_at=CURRENT_TIMESTAMP WHERE flow_id=?",(json.dumps(reasons),flow))
                  stale.append(dict(workflow_id=flow,changed_sources=changed))
              totals=summary(db)
          print('AUTH_RECOVERY_SUMMARY '+json.dumps(dict(attempts=outputs,care_regression=care_result,stale=stale,summary=totals)))
          PY
