name: Verify inherited Admin rebuild
# Verify applied status selection after fast failures and tenant pagination in EN/ES/FR.
on:
  push:
    branches: [deploy/email-inbox-20261010]
    paths: [.github/workflows/verify-admin-rebuild.yml]
  workflow_call:
  workflow_dispatch:
concurrency:
  group: admin-rebuild-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: disposable-ci-fixture
          POSTGRES_DB: auth_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U auth_test -d auth_test" --health-interval 5s --health-retries 10
    env:
      AUTH_TEST_DATABASE_URL: postgres://auth_test:disposable-ci-fixture@127.0.0.1:5432/auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Isolated Worker dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/admin-deps" --ignore-scripts esbuild@0.27.2 pg@8.16.3 bcryptjs@3.0.2 playwright@1.60.0 typescript@5.9.3 @types/pg@8.15.5 @cloudflare/workers-types@4.20260403.1
          ln -s "$RUNNER_TEMP/admin-deps/node_modules" node_modules
      - name: Worker type checks and auth regression
        run: |
          node_modules/.bin/tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --types @cloudflare/workers-types cloudflare/workers/src/auth.ts cloudflare/workers/src/gateway.ts
          node scripts/test-auth-postgres.mjs
          node scripts/test-admin-workspace-postgres.mjs
      - name: Shared model, core, and UI checks
        run: |
          python scripts/generate-app-localizations.py --check
          for package in primecare_models primecare_core primecare_ui; do
            (cd packages/$package && flutter pub get && dart format lib test && flutter analyze && flutter test)
          done
      - name: Build inherited Support portal
        run: |
          cd apps/primecare_support
          flutter pub get
          flutter build web --release --dart-define=AUTH_API_URL=https://127.0.0.1:8443/v1/auth
      - name: Admin browser E2E against disposable PostgreSQL
        env:
          ADMIN_TEST_TLS_KEY: ${{ runner.temp }}/admin-test.key
          ADMIN_TEST_TLS_CERT: ${{ runner.temp }}/admin-test.crt
        run: |
          node_modules/.bin/playwright install --with-deps chromium
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$ADMIN_TEST_TLS_KEY" -out "$ADMIN_TEST_TLS_CERT" -days 1 -subj '/CN=localhost'
          node scripts/test-admin-workspace-browser.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-rebuild-failure
          path: admin-rebuild-failure.png
          if-no-files-found: ignore
          retention-days: 1
