name: Capture actual deployed EMS screens
on:
  push:
    branches: [main]
    paths: ['.github/workflows/capture-live-ems.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install the supported browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/ems-browser" --ignore-scripts --no-audit --no-fund @playwright/test@1.60.0
          ln -s "$RUNNER_TEMP/ems-browser/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Capture the actual deployed app without mocked requests
        env:
          BOOTSTRAP_CODE_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_CODE_ADMIN_EMAIL }}
          BOOTSTRAP_CODE_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_CODE_ADMIN_PASSWORD }}
        run: node scripts/capture-live-ems.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ems-actual-deployed-screens
          path: test-results/ems/live-browser
          retention-days: 30
