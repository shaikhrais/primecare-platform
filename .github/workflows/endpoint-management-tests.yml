name: Endpoint management tests
on:
  pull_request:
    paths:
      - 'cloudflare/workers/src/endpoint-*'
      - 'cloudflare/workers/src/gateway.ts'
      - 'cloudflare/workers/src/governance-api.ts'
      - 'websites/typescript/src/endpoint-*'
      - 'scripts/*endpoint*'
      - 'scripts/test-governance-api.mjs'
      - 'tools/endpoint-capacity/**'
      - 'packages/shared/src/endpoint-management/**'
      - 'packages/domain/src/endpoint_traffic.ts'
      - 'packages/primecare_ui/web/endpoint-management-panel.ts'
      - '.github/workflows/endpoint-management-tests.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/workers/src/endpoint-*'
      - 'cloudflare/workers/src/gateway.ts'
      - 'cloudflare/workers/src/governance-api.ts'
      - 'websites/typescript/src/endpoint-*'
      - 'scripts/*endpoint*'
      - 'scripts/test-governance-api.mjs'
      - 'tools/endpoint-capacity/**'
      - 'packages/shared/src/endpoint-management/**'
      - 'packages/domain/src/endpoint_traffic.ts'
      - 'packages/primecare_ui/web/endpoint-management-panel.ts'
      - '.github/workflows/endpoint-management-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install isolated verification dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/endpoint-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 pg@8.16.3 bcryptjs@3.0.2 @types/node@22.19.1 @cloudflare/workers-types@4.20260403.1 jsdom@26.1.0
          ln -s "$RUNNER_TEMP/endpoint-tools/node_modules" node_modules
      - name: Test authorization, privacy, metrics, capacity and dashboard lifecycle
        run: node --test scripts/test-endpoint-analytics.mjs scripts/test-endpoint-capacity.mjs scripts/test-endpoint-capacity-profile.mjs scripts/test-endpoint-management-preflight.mjs scripts/test-endpoint-management-panel.mjs scripts/test-endpoint-traffic.mjs scripts/test-endpoint-body-traffic.mjs scripts/test-governance-api.mjs
      - name: Type-check Workers and dashboard separately
        run: |
          node_modules/.bin/tsc --noEmit --skipLibCheck --allowImportingTsExtensions --module esnext --moduleResolution bundler --target es2022 --types @cloudflare/workers-types,node cloudflare/workers/src/gateway.ts cloudflare/workers/src/governance-api.ts
          node_modules/.bin/tsc --noEmit --skipLibCheck --allowImportingTsExtensions --module esnext --moduleResolution bundler --target es2022 --lib es2022,dom,dom.iterable websites/typescript/src/endpoint-management-panel.ts
      - name: Validate load harness syntax without sending traffic
        run: node --check tools/endpoint-capacity/load-test.js
