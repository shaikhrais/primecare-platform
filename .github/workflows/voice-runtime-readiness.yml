name: Verify voice runtime and deployment configuration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-runtime-readiness.yml'
      - 'cloudflare/workers/src/business-tasks/voice-runtime.ts'
      - 'scripts/test-communication-voice-runtime.mjs'
      - 'scripts/voice-deployment-configuration.mjs'
      - 'scripts/test-voice-deployment-configuration.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/voice-runtime-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 twilio@6.2.0 typescript@5.9.3 @types/node@24.0.0
          ln -s "$RUNNER_TEMP/voice-runtime-tools/node_modules" node_modules
      - name: Registered routing, real signatures, WebSocket ownership and configuration redaction
        run: |
          node --test scripts/test-communication-voice-runtime.mjs scripts/test-voice-deployment-configuration.mjs
          node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions cloudflare/workers/src/business-tasks/voice-runtime.ts
  configuration:
    needs: runtime
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Check presence only without copying or printing credentials
        run: node scripts/voice-deployment-configuration.mjs
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          TWILIO_APPLICATION_SID: ${{ secrets.TWILIO_APPLICATION_SID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOICE_MODEL: ${{ vars.VOICE_MODEL }}
          VOICE_ORIGIN: ${{ vars.VOICE_ORIGIN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-deployment-configuration
          path: test-results/voice-runtime
          retention-days: 30
