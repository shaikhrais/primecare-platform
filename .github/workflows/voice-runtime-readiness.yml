name: Verify voice runtime and deployment configuration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-runtime-readiness.yml'
      - 'cloudflare/workers/src/business-tasks/voice-runtime.ts'
      - 'cloudflare/workers/src/business-tasks/voice-composition.ts'
      - 'cloudflare/workers/src/business-tasks/voice-cloudflare-sockets.ts'
      - 'scripts/voice-provider-preflight.mjs'
      - 'scripts/test-voice-provider-preflight.mjs'
      - 'scripts/test-communication-voice-cloudflare-sockets.mjs'
      - 'cloudflare/workers/src/business-tasks/endpoint-policy.ts'
      - 'scripts/test-communication-voice-endpoint-policy.mjs'
      - 'scripts/test-communication-endpoint-policy.mjs'
      - 'scripts/test-communication-voice-runtime.mjs'
      - 'scripts/test-communication-voice-composition.mjs'
      - 'scripts/voice-deployment-configuration.mjs'
      - 'scripts/test-voice-deployment-configuration.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voice_test
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: voice_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voice_test -d voice_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BUSINESS_TEST_DATABASE_URL: postgres://voice_test:disposable-only@localhost:5432/voice_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/voice-runtime-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 twilio@6.2.0 typescript@5.9.3 @types/node@24.0.0 miniflare@4.20260426.0 pg@8.11.3
          ln -s "$RUNNER_TEMP/voice-runtime-tools/node_modules" node_modules
      - name: Registered routing, real signatures, WebSocket ownership and configuration redaction
        run: |
          node --test scripts/test-communication-voice-runtime.mjs scripts/test-communication-voice-composition.mjs scripts/test-voice-deployment-configuration.mjs scripts/test-voice-provider-preflight.mjs scripts/test-communication-voice-cloudflare-sockets.mjs scripts/test-communication-endpoint-policy.mjs scripts/test-communication-voice-endpoint-policy.mjs
          node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions cloudflare/workers/src/business-tasks/voice-runtime.ts cloudflare/workers/src/business-tasks/voice-composition.ts cloudflare/workers/src/business-tasks/voice-cloudflare-sockets.ts
  providers:
    needs: runtime
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Validate provider credentials without traffic or response body logging
        run: node scripts/voice-provider-preflight.mjs
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-provider-preflight
          path: test-results/voice-runtime/provider-preflight.json
          retention-days: 30
  configuration:
    needs: runtime
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Check presence only without copying or printing credentials
        run: node scripts/voice-deployment-configuration.mjs
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          TWILIO_APPLICATION_SID: ${{ secrets.TWILIO_APPLICATION_SID }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOICE_MODEL: ${{ vars.VOICE_MODEL }}
          VOICE_ORIGIN: ${{ vars.VOICE_ORIGIN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-deployment-configuration
          path: test-results/voice-runtime
          retention-days: 30
