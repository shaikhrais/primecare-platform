name: Diagnose deployed Flutter login dispatch
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-flutter-login.yml, tools/deployment/diagnose_flutter_login.py, tools/deployment/flutter_browser.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - run: python3 tools/deployment/diagnose_flutter_login.py
