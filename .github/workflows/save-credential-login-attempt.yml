name: Save credential login native attempt
on:
  push:
    branches: [main]
    paths: [.github/workflows/save-credential-login-attempt.yml]
permissions:
  contents: read
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d988803e620eeea863b78e6d98d58f98f90f04a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 39318143744
          github-token: ${{ github.token }}
          pattern: credential-login-native-*
          path: test-results/credential-login
          merge-multiple: true
      - run: pip install -r tools/governance-production/requirements.txt
      - uses: actions/upload-artifact@v4
        id: evidence
        with:
          name: credential-login-native-combined
          path: test-results/credential-login
      - name: Record scoped attempt through supported production writer
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          LOGIN_EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import sys,json,pathlib,hashlib,os,re
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt,summary
          root=pathlib.Path.cwd()
          receipts=[json.loads((root/f'test-results/credential-login/receipt-{t}.json').read_text()) for t in ['uuid','text']]
          sources={}
          for receipt in receipts:
              assert receipt['passed'] and receipt['wholeTaskVerified'] is False and receipt['commit']=='8d988803e620eeea863b78e6d98d58f98f90f04a'
              for path,sha in receipt['source_bindings'].items():
                  assert hashlib.sha256((root/path).read_bytes()).hexdigest()==sha
                  sources[path]=sha
          for t in ['uuid','text']:
              result=(root/f'test-results/credential-login/postgres-{t}.txt').read_text()
              native=[json.loads(line) for line in result.splitlines() if line.startswith('{')]
              assert len(native)==1 and native[0]['productionVerified'] is False and native[0]['passed']==90
          blockers=['Full current-main workspace/browser login, reload, EN/FR/ES, accessibility and PWA acceptance are not proven by this native API attempt.','Registered login API auth_required flag must be reconciled with unauthenticated credential entry before full verification.','Governed workflow recording playback delivery and independent review gates remain unresolved; uploaded artifact is scoped evidence only.']
          next_action=json.dumps(dict(main_sha=os.environ['GITHUB_SHA'],active_branch='main',work_branch=None,pr=None,cleanup_required=['Remove temporary credential login inspection and attempt workflows after evidence/recording finish'],workflow_id='auth.credential-login',verification_status='implemented-unverified',test_status='scoped_pass',blockers=blockers,evidence_url=os.environ['LOGIN_EVIDENCE_URL'],synthetic_cleanup=receipts[0]['cleanup'],next_action='Use live auth route/API requirements and existing browser evidence, then execute actual main router through authorized workspace with native database and browser reload. Reconcile auth_required metadata without inventing grants; execute pending accessibility/PWA/video/review gates. Select another unblocked workflow if exact requirements cannot be resolved.'))
          evidence=[]
          for t in ['uuid','text']:
              for prefix in ['receipt','postgres','client']:
                  path=f'test-results/credential-login/{prefix}-{t}.'+('json' if prefix=='receipt' else 'txt')
                  evidence.append(dict(path=path,sha256=hashlib.sha256((root/path).read_bytes()).hexdigest(),kind='database' if prefix!='client' else 'test',url=os.environ['LOGIN_EVIDENCE_URL']))
          with ProductionWorkflowStore() as db:
              assert db.execute('SELECT definition_sha256 FROM virtual_workflow_definitions WHERE flow_id=?',('auth.credential-login',)).fetchone()[0]=='47871a7c0750f03de65847537bfadd5cbe02895eb7e04fce920907ed062c3791'
              output=record_attempt(db,'auth.credential-login',dict(status='implemented-unverified',test_status='scoped_pass',scope='scoped',source_bindings=sources,evidence=evidence,blockers=blockers,next_action=next_action),root)
              counts=summary(db)
          print('LOGIN_ATTEMPT_COMMITTED '+json.dumps(dict(attempt=output,summary=counts)))
          PY
