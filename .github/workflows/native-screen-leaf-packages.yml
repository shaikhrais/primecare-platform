name: Verify screen and device leaf packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_screen_registry_data/**'
      - 'packages/primecare_screen_intents/**'
      - 'packages/primecare_demo_user_management/**'
      - 'packages/primecare_device_identity/**'
      - 'packages/primecare_presentation_preview/**'
      - '.github/workflows/native-screen-leaf-packages.yml'
permissions: {contents: read}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        package: [primecare_screen_registry_data, primecare_screen_intents, primecare_demo_user_management, primecare_device_identity, primecare_presentation_preview]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
