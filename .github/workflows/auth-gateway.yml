name: Auth Gateway Verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/auth_api/**'
      - 'services/api_gateway/**'
      - 'packages/database_client/**'
      - 'packages/flutter_core/test/auth*_test.dart'
      - 'packages/flutter_core/lib/src/security/security_interceptor.dart'
      - 'packages/flutter_core/lib/auth_service.dart'
      - 'packages/flutter_core/lib/src/network/api_client.dart'
      - 'apps/primecare_auth/lib/**'
      - 'packages/primecare_ui/lib/src/features/auth/**'
      - 'apps/*/lib/**'
      - 'apps/*/test/auth*_test.dart'
      - 'packages/flutter_core/lib/routes/clinic_login_bridge.dart'
      - 'packages/flutter_core/lib/routes/governance_router.dart'
      - 'compose.auth.yml'
      - '.dockerignore'
      - '.github/workflows/auth-gateway.yml'

concurrency:
  group: auth-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Analyze auth service
        working-directory: services/auth_api
        run: |
          dart pub get
          dart analyze bin/server.dart bin/hash_password.dart lib
      - name: Analyze gateway
        working-directory: services/api_gateway
        run: |
          dart pub get
          dart analyze bin/server.dart lib
          dart test

  runtime-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: primecare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primecare -d primecare"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Verify login and logout against PostgreSQL
        timeout-minutes: 8
        env:
          PGPASSWORD: integration-only-password
          DB_HOST: localhost
          DB_USER: primecare
          DB_PASSWORD: integration-only-password
          DB_NAME: primecare
          DB_SSL_MODE: disable
          AUTH_SERVICE_URL: http://127.0.0.1:8081
        run: |
          set -euo pipefail
          echo 'Preparing PostgreSQL schemas'
          postgres_container=$(docker ps --format '{{.Image}} {{.ID}}' | awk '$1 ~ /postgres/ {print $2; exit}')
          test -n "$postgres_container"
          docker exec -i "$postgres_container" psql -U primecare -d primecare < services/auth_api/dev_schema.sql
          docker exec -i "$postgres_container" psql -U primecare -d primecare < packages/database/migrations/20260926_auth_sessions.sql
          echo 'Resolving Dart dependencies'
          (cd services/auth_api && dart pub get)
          (cd services/api_gateway && dart pub get)
          hash=$(printf 'integration-password-123\n' | (cd services/auth_api && dart run bin/hash_password.dart) | tail -n 1)
          printf "INSERT INTO users (email, roles, password_hash) VALUES ('smoke@example.test', 'client', '%s');\n" "$hash" |
            docker exec -i "$postgres_container" psql -U primecare -d primecare
          echo 'Starting auth and gateway services'
          (cd services/auth_api && PORT=8081 dart run bin/server.dart > /tmp/primecare-auth.log 2>&1) &
          (cd services/api_gateway && PORT=8700 dart run bin/server.dart > /tmp/primecare-gateway.log 2>&1) &
          trap 'cat /tmp/primecare-auth.log /tmp/primecare-gateway.log' ERR
          for attempt in $(seq 1 60); do
            if curl --max-time 5 -fsS http://localhost:8700/v1/auth/health >/dev/null; then break; fi
            sleep 2
          done
          curl --max-time 5 -fsS http://localhost:8700/v1/auth/health
          echo 'Checking credentials and logout'
          wrong=$(curl --max-time 5 -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"smoke@example.test","password":"wrong"}' http://localhost:8700/v1/auth/login)
          test "$wrong" = 401
          login=$(curl --max-time 5 -fsS -H 'Content-Type: application/json' -d '{"email":"smoke@example.test","password":"integration-password-123"}' http://localhost:8700/v1/auth/login)
          token=$(echo "$login" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl --max-time 5 -fsS -H "Authorization: Bearer $token" http://localhost:8700/v1/auth/me |
            python3 -c 'import json,sys; assert json.load(sys.stdin)["roles"] == "client"'
          curl --max-time 5 -fsS -X POST -H "Authorization: Bearer $token" http://localhost:8700/v1/auth/logout
          expired=$(curl --max-time 5 -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://localhost:8700/v1/auth/me)
          test "$expired" = 401

  flutter-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
      - name: Analyze Flutter auth app
        working-directory: apps/primecare_auth
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib

      - name: Verify Flutter auth transport failures
        working-directory: packages/flutter_core
        run: |
          flutter pub get
          flutter test test/auth_transport_test.dart test/auth_session_test.dart

      - name: Verify embedded clinic login routing
        working-directory: apps/primecare_clinic
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib test/auth_routing_test.dart
          flutter test test/auth_routing_test.dart

  shared-app-auth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [business_development, marketing, corporate, client, support, franchise, governance]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
      - name: Verify shared auth routes in each app
        working-directory: apps/primecare_${{ matrix.app }}
        run: |
          flutter pub get
          flutter test test/auth_routing_test.dart
