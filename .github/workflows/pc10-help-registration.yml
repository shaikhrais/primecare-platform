name: Register accepted Help reader definitions
on:
  push:
    branches: [main]
    paths:
      - 'tools/governance-production/pc10-help-reader-contract.json'
      - 'tools/governance-production/pc10-help-registration.mjs'
      - 'scripts/test-pc10-help-registration.mjs'
      - 'scripts/test-pc10-help-reader-schema.py'
      - '.github/workflows/pc10-help-registration.yml'
permissions: {contents: read}
concurrency:
  group: pc10-help-reader-definitions
  cancel-in-progress: false
jobs:
  postgres-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: help_registration, POSTGRES_USER: postgres, POSTGRES_PASSWORD: fixture}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          npm install --prefix /tmp/help-registration-tools --ignore-scripts --no-audit --no-fund pg@8.16.3 @electric-sql/pglite@0.3.14
          ln -s /tmp/help-registration-tools/node_modules node_modules
          node --test scripts/test-pc10-help-registration.mjs
          python -m pip install jsonschema==4.23.0
          python scripts/test-pc10-help-reader-schema.py
      - run: node --test scripts/test-pc10-help-registration.mjs
        env:
          HELP_REGISTRATION_TEST_DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/help_registration
  production-registration:
    needs: postgres-proof
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/help-registration-tools --ignore-scripts --no-audit --no-fund pg@8.16.3
          ln -s /tmp/help-registration-tools/node_modules node_modules
      - name: Register exact schemas and usage link, preserving every legacy grant
        run: |
          node tools/governance-production/pc10-help-registration.mjs --plan
          node tools/governance-production/pc10-help-registration.mjs --apply
        env:
          REGISTER_PC10_HELP_READER: '1'
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
