name: Inactive Help Workers

on:
  push:
    branches: [main]
    paths:
      - 'services/governance_api/worker/**'
      - 'services/api_gateway/worker/**'
      - 'packages/shared/src/help-reader/**'
      - 'scripts/release-inactive-help-workers.mjs'
      - 'scripts/test-inactive-help-worker-release.mjs'
      - 'tools/inactive-help-gateway-reproduction/package.json'
      - 'tools/inactive-help-gateway-reproduction/package-lock.json'
      - '.github/workflows/inactive-help-workers.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  source-tests:
    name: source-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the scoped producer without provider credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/inactive-help
          node --test scripts/test-inactive-help-worker-release.mjs 2>&1 | tee test-results/inactive-help/source-tests.tap
      - name: Preserve source-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inactive-help-source-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/inactive-help/source-tests.tap
          if-no-files-found: warn
          retention-days: 14

  production-plan:
    name: production-plan
    needs: source-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    concurrency:
      group: primecare-cloudflare-typescript-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore the accepted release's committed dependency graph
        shell: bash
        run: |
          set -euo pipefail
          test ! -e node_modules
          npm ci --ignore-scripts
          test "$(node_modules/.bin/wrangler --version)" = '4.86.0'
          git diff --exit-code -- package.json package-lock.json
      - name: Install the locked Gateway byte-reproduction compiler separately
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/worker-dependencies"
          test ! -L "$RUNNER_TEMP/worker-dependencies"
          mkdir "$RUNNER_TEMP/worker-dependencies"
          cp tools/inactive-help-gateway-reproduction/package.json tools/inactive-help-gateway-reproduction/package-lock.json "$RUNNER_TEMP/worker-dependencies/"
          npm ci --prefix "$RUNNER_TEMP/worker-dependencies" --ignore-scripts --no-audit --no-fund
          test "$("$RUNNER_TEMP/worker-dependencies/node_modules/.bin/wrangler" --version)" = '4.68.1'
          git diff --exit-code -- tools/inactive-help-gateway-reproduction/package.json tools/inactive-help-gateway-reproduction/package-lock.json
      - name: Read the exact production state and build inactive candidates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-inactive-help-workers.mjs --plan
      - name: Preserve plan, rejected-plan and exact build-graph evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inactive-help-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/inactive-help/
            test-results/account-mutations/auth-release-approved.json
            ${{ runner.temp }}/inactive-help-*/metafile.json
          if-no-files-found: warn
          retention-days: 14

  production-release:
    name: production-release
    needs: [source-tests, production-plan]
    # The initial publication authorizes read-only evidence only. There is no publisher here.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: primecare-cloudflare-typescript-production
      cancel-in-progress: false
    steps:
      - name: Production deployment remains disabled
        run: echo 'Deployment is disabled in this read-only preflight workflow.'
