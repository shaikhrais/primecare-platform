name: Deploy API - primecare-franchise-reporting-api

on:
  push:
    branches: [main]
    paths:
      - 'services/franchise_reporting_api/**'
      - 'packages/database_client/**'
      - '.github/workflows/deploy-api-franchise-reporting.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-api.yml
    with:
      service_dir: services/franchise_reporting_api
      service_name: primecare-franchise-reporting-api
      image_name: franchise-reporting-api
    secrets: inherit
