name: Retire standalone auth website
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primecare-cloudflare-primecare-auth
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove only the retired auth Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/retire-auth-website.mjs
