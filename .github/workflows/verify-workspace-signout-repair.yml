name: Production-bound general workspace sign-out repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-workspace-signout-repair.yml]
permissions:
  contents: read
  actions: write
jobs:
  password:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: login_browser
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U primecare -d login_browser" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1edc56771993d563b674e81a746cd3550ef84028
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix /tmp/password-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 pg@8.16.3 bcryptjs@3 typescript@5.9.3 jsdom@26
          ln -s /tmp/password-tools/node_modules node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Export exact live auth definitions and theme
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
        run: |
          python -u - <<'PY'
          import sys,json,pathlib
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          with ProductionWorkflowStore() as db:
           keys=[c['name'] for c in db.tables['virtual_workflow_definitions']['columns']]
           flows=[dict(zip(keys,r)) for r in db.execute("SELECT * FROM virtual_workflow_definitions WHERE flow_kind='business_process' AND flow_id LIKE ?",('auth.%',))]
           theme=dict(db.execute("SELECT css_variable_name,token_value FROM theme_design_tokens WHERE theme_id=1 AND active=1").fetchall())
           policy={'flows':flows,'theme':theme,'authority':'pinned-production-postgresql'}
           for directory in ['workspace-logout','workspace-logout-baseline']:
            p=pathlib.Path('test-results')/directory;p.mkdir(parents=True,exist_ok=True);(p/'governance.json').write_text(json.dumps(policy,indent=2))
           print('CURRENT_AUTHORITY_BOUND '+str(len(flows)))
          PY
      - name: Replay original malformed-success failure
        env:
          LOGIN_BROWSER_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/login_browser
          AUTH_WORKSPACE_BASELINE: '1'
          VERIFICATION_SOURCE_SHA: 9f42d496c1a4f595ef7599867fadfd5eda28507c
        run: |
          cp websites/typescript/src/workspace.ts /tmp/candidate-workspace.ts
          git show 9f42d496c1a4f595ef7599867fadfd5eda28507c:websites/typescript/src/workspace.ts > websites/typescript/src/workspace.ts
          node scripts/test-workspace-signout-workflow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        id: baseline
        with:
          name: workspace-signout-original-failure
          path: test-results/workspace-logout-baseline
          retention-days: 90
      - name: Record original failure before restoring candidate source
        if: steps.baseline.outcome == 'success'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          EVIDENCE_URL: ${{ steps.baseline.outputs.artifact-url }}
          ATTEMPT_MODE: baseline
          CANDIDATE_SHA: 1edc56771993d563b674e81a746cd3550ef84028
        run: |
          python -u - <<'PY'
          import sys,json,pathlib,hashlib,os
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt
          root=pathlib.Path.cwd();baseline=os.environ['ATTEMPT_MODE']=='baseline';directory='workspace-logout-baseline' if baseline else 'workspace-logout'
          path='test-results/'+directory+'/results.json';p=root/path
          if not p.is_file():raise SystemExit('Executed receipt missing; no passing attempt can be recorded')
          r=json.loads(p.read_text())
          r['source_bindings']['scripts/test-workspace-signout-workflow.mjs']=hashlib.sha256((root/'scripts/test-workspace-signout-workflow.mjs').read_bytes()).hexdigest()
          evidence=[{'kind':'browser','path':path,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']}]
          for v in sorted((root/'test-results'/directory).glob('*.webm')):evidence.append({'kind':'video','path':str(v.relative_to(root)),'sha256':hashlib.sha256(v.read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']})
          issues=[]
          if baseline and r.get('failures'):
           f=r['failures'][0];issues=[{k:f[k] for k in ['criterion_id','reproduction','expected','actual','affected_sources']}]
          elif not r.get('passed'):
           issues=[{'criterion_id':'execution.workspace-signout-browser','reproduction':'Execute scripts/test-workspace-signout-workflow.mjs with isolated native PostgreSQL and current production definition.','expected':'All declared targeted workspace sign-out browser checks pass.','actual':r.get('error','No successful execution result.'),'affected_sources':['scripts/test-workspace-signout-workflow.mjs']}]
          result={'status':'implemented-unverified','test_status':'failed' if issues else 'scoped_pass','scope':'scoped','source_bindings':r['source_bindings'],'evidence':evidence,'issues':issues,'blockers':r['limitations'],'next_action':'Finish remaining registered actor/API/UI acceptance and reconcile current specification/source bindings; independent reviews and applicable release/PWA gates remain pending. Complete current single work branch CI, merge and branch cleanup.'}
          with ProductionWorkflowStore() as db:
           if not baseline and r.get('passed'):
            found=db.execute("SELECT i.issue_id FROM virtual_workflow_issues i JOIN virtual_workflow_attempts a ON a.attempt_id=i.attempt_id WHERE a.flow_id=? AND i.criterion_id=? ORDER BY i.issue_id DESC LIMIT 1",('auth.logout','ui.workspace-signout-confirmation')).fetchone()
            if found:
             issue=found[0];result.update(resolves_issue_ids=[issue],resolution_note='Replayed native sign-out failure, malformed acknowledgements, offline/lost-response retry and replacement-session races across RMT/CEO EN/FR/ES; the browser waits for confirmed revocation.',issue_resolution_results={str(issue):{'criterion_id':'ui.workspace-signout-confirmation','result':'passed','reproduction_verified':True,'evidence_path':path}})
           saved=record_attempt(db,'auth.logout',result,root)
           checkpoint={'workflow_id':'auth.logout','attempt':saved,'candidate_sha':os.environ['CANDIDATE_SHA'],'main_sha':os.environ['GITHUB_SHA'],'active_branch':'work/auth-session-repair-20261020','pr':None,'merge_state':'pending CI and merge','evidence':os.environ['EVIDENCE_URL'],'test_result':result['test_status'],'exact_remaining_gates':r['limitations'],'synthetic_cleanup':r['cleanup'],'next_action':result['next_action']}
           db.execute('INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP',('auth-completion-current',json.dumps(checkpoint)))
          print('WORKSPACE_LOGOUT_ATTEMPT_COMMITTED '+json.dumps(saved))
          PY
      - name: Restore candidate and run browser/native workspace sign-out acceptance
        if: always()
        env:
          VERIFICATION_SOURCE_SHA: 1edc56771993d563b674e81a746cd3550ef84028
          LOGIN_BROWSER_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/login_browser
        run: |
          git checkout 1edc56771993d563b674e81a746cd3550ef84028 -- websites/typescript/src/workspace.ts
          node --test scripts/test-workspace-browser.mjs scripts/test-account-client.mjs scripts/test-auth-client.mjs scripts/test-session-signout-client.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --lib es2022,dom,dom.iterable websites/typescript/src/main.ts
          node scripts/test-workspace-signout-workflow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        id: candidate
        with:
          name: workspace-signout-candidate-browser-native
          path: test-results/workspace-logout
          retention-days: 90
      - name: Record exact current rerun and checkpoint
        if: always() && steps.candidate.outcome == 'success'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          EVIDENCE_URL: ${{ steps.candidate.outputs.artifact-url }}
          ATTEMPT_MODE: candidate
          CANDIDATE_SHA: 1edc56771993d563b674e81a746cd3550ef84028
        run: |
          python -u - <<'PY'
          import sys,json,pathlib,hashlib,os
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt
          root=pathlib.Path.cwd();baseline=os.environ['ATTEMPT_MODE']=='baseline';directory='workspace-logout-baseline' if baseline else 'workspace-logout'
          path='test-results/'+directory+'/results.json';p=root/path
          if not p.is_file():raise SystemExit('Executed receipt missing; no passing attempt can be recorded')
          r=json.loads(p.read_text())
          evidence=[{'kind':'browser','path':path,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']}]
          for v in sorted((root/'test-results'/directory).glob('*.webm')):evidence.append({'kind':'video','path':str(v.relative_to(root)),'sha256':hashlib.sha256(v.read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']})
          issues=[]
          if baseline and r.get('failures'):
           f=r['failures'][0];issues=[{k:f[k] for k in ['criterion_id','reproduction','expected','actual','affected_sources']}]
          elif not r.get('passed'):
           issues=[{'criterion_id':'execution.workspace-signout-browser','reproduction':'Execute scripts/test-workspace-signout-workflow.mjs with isolated native PostgreSQL and current production definition.','expected':'All declared targeted workspace sign-out browser checks pass.','actual':r.get('error','No successful execution result.'),'affected_sources':['scripts/test-workspace-signout-workflow.mjs']}]
          result={'status':'implemented-unverified','test_status':'failed' if issues else 'scoped_pass','scope':'scoped','source_bindings':r['source_bindings'],'evidence':evidence,'issues':issues,'blockers':r['limitations'],'next_action':'Finish remaining registered actor/API/UI acceptance and reconcile current specification/source bindings; independent reviews and applicable release/PWA gates remain pending. Complete current single work branch CI, merge and branch cleanup.'}
          with ProductionWorkflowStore() as db:
           if not baseline and r.get('passed'):
            found=db.execute("SELECT i.issue_id FROM virtual_workflow_issues i JOIN virtual_workflow_attempts a ON a.attempt_id=i.attempt_id WHERE a.flow_id=? AND i.criterion_id=? ORDER BY i.issue_id DESC LIMIT 1",('auth.logout','ui.workspace-signout-confirmation')).fetchone()
            if found:
             issue=found[0];result.update(resolves_issue_ids=[issue],resolution_note='Replayed malformed HTTP200 in EN/FR/ES; the registered confirmation is now required, sessions remain available for retry, and native database state is unchanged.',issue_resolution_results={str(issue):{'criterion_id':'ui.workspace-signout-confirmation','result':'passed','reproduction_verified':True,'evidence_path':path}})
           saved=record_attempt(db,'auth.logout',result,root)
           checkpoint={'workflow_id':'auth.logout','attempt':saved,'candidate_sha':os.environ['CANDIDATE_SHA'],'main_sha':os.environ['GITHUB_SHA'],'active_branch':'work/auth-session-repair-20261020','pr':None,'merge_state':'pending CI and merge','evidence':os.environ['EVIDENCE_URL'],'test_result':result['test_status'],'exact_remaining_gates':r['limitations'],'synthetic_cleanup':r['cleanup'],'next_action':result['next_action']}
           db.execute('INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP',('auth-completion-current',json.dumps(checkpoint)))
          print('WORKSPACE_LOGOUT_ATTEMPT_COMMITTED '+json.dumps(saved))
          PY
