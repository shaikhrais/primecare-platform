name: Current-account password browser acceptance
on:
  push:
    branches: [main]
    paths: ['cloudflare/workers/**', 'websites/typescript/src/**', 'scripts/test-auth-password-workflow.mjs', 'scripts/export-typescript-websites.py', 'scripts/theme_manifest.py', 'scripts/test-theme-manifest.py', 'scripts/test-account-client.mjs', 'scripts/test-auth-client.mjs', 'scripts/test-session-signout-client.mjs', 'tools/workflow-verification/specs/auth.change-password.fixture.json', '.github/workflows/account-password-acceptance.yml']
  workflow_dispatch:
  pull_request:
    paths: ['cloudflare/workers/**', 'websites/typescript/src/**', 'scripts/test-auth-password-workflow.mjs', 'scripts/export-typescript-websites.py', 'scripts/theme_manifest.py', 'scripts/test-theme-manifest.py', 'scripts/test-account-client.mjs', 'scripts/test-auth-client.mjs', 'scripts/test-session-signout-client.mjs', 'tools/workflow-verification/specs/auth.change-password.fixture.json', '.github/workflows/account-password-acceptance.yml']
permissions:
  contents: read
jobs:
  password:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: login_browser
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U primecare -d login_browser" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --prefix /tmp/password-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 pg@8.16.3 bcryptjs@3 typescript@5.9.3 axe-core@4.10.3
          ln -s /tmp/password-tools/node_modules node_modules
          node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - run: python3 scripts/test-theme-manifest.py
      - run: node --test scripts/test-account-client.mjs scripts/test-auth-client.mjs scripts/test-session-signout-client.mjs
      - name: Use explicit isolated metadata fixture without production credentials
        run: |
          mkdir -p test-results/auth-password
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const url='https://primecare-clinic.pages.dev/portal.json?enable-semantics=true';
          const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw Error('Deployed theme unavailable: '+response.status);
          const portal=await response.json(),rawTheme=portal.theme;
          if(!rawTheme||typeof rawTheme!=='object'||Array.isArray(rawTheme))throw Error('Invalid deployed theme object');
          const theme=Object.fromEntries(Object.entries(rawTheme).filter(([k,v])=>k.startsWith('--')&&typeof v==='string'&&v.trim()));
          console.log('DEPLOYED_THEME_SUMMARY '+JSON.stringify({project:portal.project,total:Object.keys(rawTheme).length,cssVariables:Object.keys(theme).length,ignoredKeys:Object.keys(rawTheme).filter(k=>!Object.hasOwn(theme,k))}));
          if(Object.keys(theme).length<10)throw Error('Insufficient deployed CSS theme variables');
          for(const key of ['--spacing-sm','--spacing-md','--spacing-xl','--font-size-body','--color-primary','--color-surface'])if(!theme[key])throw Error('Missing deployed theme token: '+key);
          const fixture=JSON.parse(await readFile('tools/workflow-verification/specs/auth.change-password.fixture.json','utf8'));
          fixture.theme=theme;
          fixture.theme_evidence={url,sha256:createHash('sha256').update(JSON.stringify(theme)).digest('hex'),portal_project:portal.project};
          await writeFile('test-results/auth-password/governance.json',JSON.stringify(fixture,null,2));
          JS
      - name: Browser to gateway to native PostgreSQL and reload
        env:
          LOGIN_BROWSER_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/login_browser
          AUTH_PASSWORD_TEST_FIXTURE: '1'
          AUTH_PASSWORD_BROWSER: ${{ matrix.browser }}
        run: node scripts/test-auth-password-workflow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.browser == 'chromium' && 'current-account-password-native-browser' || format('current-account-password-native-browser-{0}', matrix.browser) }}
          path: test-results/auth-password
          retention-days: 90
