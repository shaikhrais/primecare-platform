name: API Smart Deploy - Verify only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/smart-deploy-api-verify.yml']
  workflow_dispatch:
    inputs:
      expected_main:
        description: Exact candidate commit on main (40 lowercase hex characters)
        required: true
        type: string
      comparison_base:
        description: Reviewed comparison commit (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Pin candidate and classify change scope
        shell: bash
        env:
          EXPECTED_MAIN: ${{ github.event_name == 'push' && github.sha || inputs.expected_main }}
          COMPARISON_BASE: ${{ github.event_name == 'push' && '023eb56bc09c9fec58ca112384a4523173c4d2d9' || inputs.comparison_base }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ && "$COMPARISON_BASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$GITHUB_SHA" = "$EXPECTED_MAIN"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA 2315c08f00a9708f83def5e3c589ee7c27a9f2a5"
          fi
          git merge-base --is-ancestor "$COMPARISON_BASE" "$EXPECTED_MAIN"
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          {
            echo '## API Smart Deploy preflight (no publish)'
            printf 'Candidate: `%s`\n\nComparison base (not a live receipt): `%s`\n\n' "$EXPECTED_MAIN" "$COMPARISON_BASE"
            count="$(git diff --no-renames --name-only -z "$COMPARISON_BASE" "$EXPECTED_MAIN" -- | tr -cd '\000' | wc -c)"
            printf 'Changed paths: %s\n\n' "$count"
            echo 'Shared Worker inputs are not yet mapped per service. This preflight checks the entire generic Worker set, not Auth, and never authorizes a release.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r tools/governance-production/requirements.txt
      - name: Verify pinned governance read-only
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_DATABASE_URL" || { echo 'Missing production environment database secret' >&2; exit 1; }
          python tools/governance-production/verify-production-reader.py > /dev/null
          python scripts/check-api-catalog-identity.py
      - name: Check Clinical Director read access with the production GitHub connection
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'PY_CLINICAL'
          import json
          import os
          from pathlib import Path
          import psycopg

          expected = {
              'public_schema_usage', 'not_superuser_or_bypassrls',
              'minimum_read_columns_available', 'authority_tables_exist',
              'no_clinical_write_privileges', 'scope_is_view',
              'reviewed_owner_rights_view_mode', 'runtime_cannot_assume_scope_owner',
              'empty_scope_query_compiles',
          }
          sql = Path('tests/fixtures/clinical-director-api-candidate/runtime-read-preflight.sql').read_text()
          try:
              with psycopg.connect(os.environ['PRODUCTION_DATABASE_URL'], connect_timeout=8, autocommit=True) as conn:
                  with conn.cursor() as cur:
                      cur.execute("""
                          SELECT COUNT(DISTINCT branch_id) = 0
                          FROM public.clinical_branch_director_effective_scope
                          WHERE FALSE
                      """)
                      if cur.fetchone() != (True,):
                          raise SystemExit('Standalone Clinical Director SELECT did not pass')
                      print('Standalone Clinical Director SELECT passed without explicit BEGIN.', flush=True)
                      cur.execute(sql, prepare=False)
                      checks = {}
                      while True:
                          if cur.description:
                              columns = [col.name for col in cur.description]
                              if set(columns) <= expected:
                                  row = cur.fetchone()
                                  if row:
                                      checks.update(zip(columns, row))
                          if not cur.nextset():
                              break
                      if checks.get('no_clinical_write_privileges') is False:
                          cur.execute("""
                              WITH targets(name) AS (VALUES
                                  ('public.clinical_verified_branches'),
                                  ('public.clinical_branch_grant_admins'),
                                  ('public.clinical_branch_director_grants'),
                                  ('public.clinical_branch_access_audit')
                              ), permissions(privilege) AS (VALUES
                                  ('INSERT'), ('UPDATE'), ('DELETE'), ('TRUNCATE'),
                                  ('REFERENCES'), ('TRIGGER')
                              )
                              SELECT targets.name, permissions.privilege,
                                     CASE WHEN has_table_privilege(to_regclass(targets.name), permissions.privilege)
                                          THEN 'table' ELSE 'column' END AS level
                              FROM targets CROSS JOIN permissions
                              WHERE has_table_privilege(to_regclass(targets.name), permissions.privilege)
                                 OR CASE WHEN permissions.privilege IN ('INSERT','UPDATE','REFERENCES')
                                         THEN has_any_column_privilege(to_regclass(targets.name), permissions.privilege)
                                         ELSE false END
                              ORDER BY targets.name, permissions.privilege
                          """)
                          print('Clinical effective privileges: ' + json.dumps(cur.fetchall()), flush=True)
          except psycopg.Error as error:
              state = error.sqlstate or 'unavailable'
              raise SystemExit('Clinical read-only SQL check failed: ' + state) from None
          except Exception:
              raise SystemExit('Clinical read-only SQL check could not complete') from None
          missing = expected - checks.keys()
          if missing:
              raise SystemExit('Missing clinical check results: ' + ', '.join(sorted(missing)))
          print(json.dumps(checks, sort_keys=True))
          print('Evidence applies to the GitHub production database identity.')
          if any(value is not True for value in checks.values()):
              raise SystemExit('Clinical database checks did not all pass for this identity.')
          PY_CLINICAL
      - name: Check Worker types
        run: |
          npx --no-install tsc --noEmit --allowImportingTsExtensions --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --types @cloudflare/workers-types,node cloudflare/workers/src/service.ts cloudflare/workers/src/gateway.ts
      - name: Run Worker release regression tests
        run: node --test scripts/test-generic-worker-deploy.mjs scripts/test-generic-worker-release.mjs scripts/test-generic-worker-observability.mjs scripts/test-worker-secret-retention.mjs
      - name: Dry-run bundle every generic Worker and gateway
        shell: bash
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          node scripts/generate-cloudflare-worker-config.mjs
          for service in client provider visit notes billing scheduling notification verification compliance governance franchise-reporting gateway; do
            npx --no-install wrangler deploy --dry-run --config ".cloudflare-workers/${service}.jsonc" --outdir "$RUNNER_TEMP/api-dry-run/$service"
          done
          echo 'Read-only governance check, API catalog, type checks, regressions and dry-run builds passed. No Worker was uploaded or deployed.' >> "$GITHUB_STEP_SUMMARY"
