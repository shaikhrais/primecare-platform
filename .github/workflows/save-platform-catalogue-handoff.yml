name: Save platform catalogue handoff
on:
  push:
    branches: [main]
    paths: [.github/workflows/save-platform-catalogue-handoff.yml]
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Wait for operational cleanup CI and commit current production handoff
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,sys,json,time,urllib.request,subprocess
          repo='shaikhrais/primecare-platform'
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              return json.load(urllib.request.urlopen(req))
          pending=['.github/workflows/inspect-platform-catalogue.yml','.github/workflows/platform-bootstrap-attempt.yml','.github/workflows/save-platform-catalogue-handoff.yml']
          for poll in range(48):
              main=api('branches/main')['commit']['sha']
              if main!=os.environ['GITHUB_SHA']:
                  subprocess.run(['git','fetch','origin','main'],check=True)
                  remaining=subprocess.check_output(['git','ls-tree','-r','--name-only','origin/main','--',*pending],text=True).strip()
                  checks=api('commits/'+main+'/check-runs?per_page=100')['check_runs']
                  names={c['name'] for c in checks}
                  if any(c['status']=='completed' and c['conclusion'] not in ('success','skipped') for c in checks):raise RuntimeError('Final main validation failed')
                  if not remaining and {'contract-plan','generated-code','compression'}.issubset(names) and all(c['status']=='completed' and c['conclusion']=='success' for c in checks):break
              print('Waiting for final main operational cleanup and checks',flush=True);time.sleep(10)
          else:raise RuntimeError('Final cleanup or CI still pending')
          branches=api('branches?per_page=100');prs=api('pulls?state=open&per_page=100')
          if [b['name'] for b in branches]!=['main'] or prs:raise RuntimeError('Inspect branch/PR state before handoff')
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import summary
          with ProductionWorkflowStore() as db:
              flow='auth.bootstrap-first-platform-admin'
              row=db.execute('SELECT attempt_id FROM virtual_workflow_checkpoints WHERE flow_id=?',(flow,)).fetchone()
              if not row or row[0]!=314:raise RuntimeError('Latest platform attempt changed; re-inspect')
              next_row=db.execute("SELECT flow_id,title FROM virtual_workflow_definitions WHERE flow_kind='business_process' AND flow_id=? AND verification_status!='blocked'",('auth.credential-login',)).fetchone()
              if not next_row:next_row=db.execute("SELECT flow_id,title FROM virtual_workflow_definitions WHERE flow_kind='business_process' AND verification_status!='blocked' ORDER BY flow_id LIMIT 1").fetchone()
              handoff=dict(main_sha=main,work_branch=None,work_branch_sha=None,active_branch='main',pr=None,open_prs=0,remote_branches=['main'],merge_cleanup_state='No work branch or PR opened; completed operational workflows removed from main; final CI passed.',ci_state='Existing native regression and scoped probes passed; production attempt committed; final-main checks passed.',workflow_id=flow,attempt_id=314,verification_status='blocked',test_status='scoped_pass',live_counts=summary(db),evidence_url='https://github.com/shaikhrais/primecare-platform/actions/runs/39315054009/artifacts/12217517903',catalogue_export_url='https://github.com/shaikhrais/primecare-platform/actions/runs/39315497634/artifacts/12217811389',catalogue_snapshot_utc='2026-10-19T19:59:42.073420+00:00',attachment='PrimeCare_Workflow_Catalogue.xlsx',blockers=['Pinned platform bootstrap draft leaves protected deployment operator identity and approved execution environment unbound; credential UI/reload, video and review gates are unproven.'],synthetic_data_cleanup='Native disposable schemas dropped; no synthetic production business data created.',next_workflow=list(next_row) if next_row else None,next_action='Inspect auth.credential-login live definition, source links, registered API/auth metadata, roles and previous checkpoint; then execute isolated credential UI/API/database/reload acceptance. Platform bootstrap remains blocked on governed operator/environment binding. Do not repeat its passing native cases unless bound source/specification/evidence changes.')
              payload=json.dumps(handoff,sort_keys=True)
              db.execute("INSERT INTO virtual_workflow_checkpoints(flow_id,attempt_id,next_action) VALUES(?,?,?) ON CONFLICT(flow_id) DO UPDATE SET attempt_id=excluded.attempt_id, next_action=excluded.next_action,invalidation_json='[]',updated_at=CURRENT_TIMESTAMP",(flow,314,payload))
              db.execute("INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP",('recovery-handoff-current',payload))
          print('CATALOGUE_HANDOFF_COMMITTED '+payload)
          PY
