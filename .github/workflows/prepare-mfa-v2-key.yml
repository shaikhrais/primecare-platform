name: Prepare independent MFA v2 binding without activation
on:
  workflow_run:
    workflows: [Verify auth recovery and key rotation foundations]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: primecare-mfa-key-provision
  cancel-in-progress: false
jobs:
  provision:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERIFIED_SOURCE: ${{ github.event.workflow_run.head_sha }}
      VERIFIED_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify immutable producer source and synthetic cryptography before provisioning
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SOURCE"
          node --test scripts/test-code-admin-keyring.mjs scripts/test-code-admin-key-rotation-drill.mjs
          npm install --prefix "$RUNNER_TEMP/mfa-key-prepare" --ignore-scripts --no-audit --no-fund wrangler@4.68.1
          ln -s "$RUNNER_TEMP/mfa-key-prepare/node_modules" node_modules
          node scripts/generate-cloudflare-worker-config.mjs
      - name: Preserve original key and create independent v2 binding only when absent
        run: |
          set -euo pipefail
          npx wrangler secret list --config .cloudflare-workers/auth.jsonc > "$RUNNER_TEMP/mfa-binding-names.json"
          jq -e 'any(.[]; .name == "DB_URL") and any(.[]; .name == "MFA_ENCRYPTION_KEY")' "$RUNNER_TEMP/mfa-binding-names.json" > /dev/null
          disposition=preserved
          if ! jq -e 'any(.[]; .name == "MFA_ENCRYPTION_KEY_V2")' "$RUNNER_TEMP/mfa-binding-names.json" > /dev/null; then
            node --input-type=module -e 'import {randomBytes} from "node:crypto";process.stdout.write(randomBytes(32).toString("hex"))' | npx wrangler secret put MFA_ENCRYPTION_KEY_V2 --config .cloudflare-workers/auth.jsonc
            disposition=created
          fi
          npx wrangler secret list --config .cloudflare-workers/auth.jsonc > "$RUNNER_TEMP/mfa-binding-names-after.json"
          jq -e 'any(.[]; .name == "MFA_ENCRYPTION_KEY") and any(.[]; .name == "MFA_ENCRYPTION_KEY_V2")' "$RUNNER_TEMP/mfa-binding-names-after.json" > /dev/null
          export MFA_V2_DISPOSITION="$disposition"
          node --input-type=module <<'JS'
          import {mkdirSync,writeFileSync} from 'node:fs';
          if(!/^[a-f0-9]{40}$/.test(process.env.VERIFIED_SOURCE)||!/^\d+$/.test(process.env.VERIFIED_RUN))throw Error('Invalid producer');
          mkdirSync('test-results/mfa-key-preparation',{recursive:true});
          const receipt={source:process.env.VERIFIED_SOURCE,verifiedRun:process.env.VERIFIED_RUN,v2Binding:process.env.MFA_V2_DISPOSITION,existingKeyExported:false,activationChanged:false,accountsChanged:0,bindingDrillPending:true};
          writeFileSync('test-results/mfa-key-preparation/receipt.json',JSON.stringify(receipt,null,2));
          console.log('MFA_V2_BINDING '+JSON.stringify(receipt));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: mfa-v2-binding-preparation
          path: test-results/mfa-key-preparation
          retention-days: 90
