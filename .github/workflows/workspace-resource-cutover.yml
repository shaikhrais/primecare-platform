name: Validate and register existing workspace copy before merging auth repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/workspace-resource-cutover.yml]
permissions:
  contents: read
  actions: write
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: isolated-only
          POSTGRES_DB: workspace_resources_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U workspace -d workspace_resources_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Retire superseded work-branch checks only
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            for(const status of ['queued','in_progress']){
              const {data}=await github.rest.actions.listWorkflowRunsForRepo({owner,repo,event:'pull_request',status,per_page:100});
              for(const run of data.workflow_runs)if(run.head_branch==='work/auth-session-repair-20261020'&&run.head_sha!=='b306f3dbc52a08381fd2d93381d2f2bc2efac3c3'){
                try{await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:run.id});}catch(error){if(![409,422].includes(error.status))throw error;}
              }
            }
      - uses: actions/checkout@v4
        with:
          ref: b306f3dbc52a08381fd2d93381d2f2bc2efac3c3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Test exact scope, unreviewed labels, idempotency, preservation and rollback
        env:
          WORKFLOW_TEST_DATABASE_URL: postgres://workspace:isolated-only@127.0.0.1:5432/workspace_resources_test
        run: python tools/governance-production/test-workspace-resource-registration.py

  authority:
    needs: native
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b306f3dbc52a08381fd2d93381d2f2bc2efac3c3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Register only pinned existing labels without approval or grants
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_WORKSPACE_RESOURCE_WRITES: '1'
        run: python tools/governance-production/workspace_resource_registration.py --apply
      - name: Recalculate live authority and invalidate actual changed source bindings
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
        run: |
          python -u - <<'PY'
          import sys,json,pathlib,hashlib,datetime
          sys.path.insert(0,'tools/workflow-verification');sys.path.insert(0,'tools/governance-production')
          from production_store import ProductionWorkflowStore
          from execution import summary
          from workspace_resource_catalog import verify
          root=pathlib.Path.cwd();out=root/'test-results/workspace-cutover';out.mkdir(parents=True,exist_ok=True)
          with ProductionWorkflowStore() as db:
           keys=[c['name'] for c in db.tables['virtual_workflow_definitions']['columns']]
           flows=[dict(zip(keys,r)) for r in db.execute("SELECT * FROM virtual_workflow_definitions WHERE flow_kind='business_process' AND flow_id LIKE ?",('auth.%',))]
           resources=verify(db)
           theme=dict(db.execute('SELECT css_variable_name,token_value FROM theme_design_tokens WHERE theme_id=1 AND active=1'))
           (out/'governance.json').write_text(json.dumps({'flows':flows,'theme':theme,'workspace_resources':resources,'authority':'pinned-production-postgresql'},indent=2))
           invalidated=[]
           rows=db.execute("SELECT d.flow_id,d.verification_status,d.test_status,d.blocker_json,d.definition_json,d.definition_sha256,a.attempt_id,a.definition_sha256,a.source_bindings_json FROM virtual_workflow_definitions d JOIN virtual_workflow_attempts a ON a.flow_id=d.flow_id WHERE d.flow_kind='business_process' AND d.test_status IN ('passed','scoped_pass') AND a.attempt_id=(SELECT MAX(b.attempt_id) FROM virtual_workflow_attempts b WHERE b.flow_id=d.flow_id)").fetchall()
           for flow,status,test,blockers,definition,spec,attempt,bound_spec,bindings in rows:
            paths=set(json.loads(definition).get('source_paths',[]));changed=[]
            for name,old in json.loads(bindings).items():
             p=(root/name).resolve()
             if not p.is_relative_to(root):continue
             if p.is_file():
              now=hashlib.sha256(p.read_bytes()).hexdigest()
              if now!=old:changed.append({'path':name,'old':old,'current':now})
             elif name in paths:changed.append({'path':name,'old':old,'current':None})
            if changed or spec!=bound_spec:
             reasons=json.loads(blockers or '[]');reason='Current source/specification differs from the last successful scoped attempt; current acceptance evidence must be rerun.'
             if reason not in reasons:reasons.append(reason)
             db.execute('UPDATE virtual_workflow_definitions SET verification_status=?, test_status=?,blocker_json=?,updated_at=CURRENT_TIMESTAMP WHERE flow_id=?',('implemented-unverified' if status=='verified' else status,'stale',json.dumps(reasons),flow))
             db.execute('UPDATE virtual_workflow_checkpoints SET invalidation_json=?, updated_at=CURRENT_TIMESTAMP WHERE flow_id=?',(json.dumps([{'source_changes':changed,'bound_definition_sha256':bound_spec,'current_definition_sha256':spec}]),flow))
             invalidated.append({'workflow_id':flow,'attempt_id':attempt,'changes':changed})
           state={'resources':resources,'source_invalidation':invalidated,'summary':summary(db),'active_branch':'work/auth-session-repair-20261020','pr':None,'candidate_sha':'b306f3dbc52a08381fd2d93381d2f2bc2efac3c3','branch_lifecycle':'Native metadata proof passed; protected label registration applied; browser proof and PR/CI/merge/cleanup still pending.','full_auth_verified':False,'next_action':'Run current logout and password browser regressions, then open the single review PR. After CI/merge/cleanup reconcile the two maintenance mutation workflow bindings. Missing recovery/control requirements and independent reviews remain unresolved.'}
           for name in ['workspace-resource-cutover-current','auth-completion-current','execution-handoff-current']:
            db.execute('INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP',(name,json.dumps(state)))
           (out/'cutover.json').write_text(json.dumps(state,indent=2))
          print('WORKSPACE_CUTOVER_COMMITTED '+json.dumps({**state,'source_invalidation':[v['workflow_id'] for v in invalidated]}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-registration-and-auth-authority
          path: |
            test-results/workspace-cutover
            test-results/workspace-resource-registration
          retention-days: 90
  browser:
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.evidence.outputs.artifact-url }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: login_browser
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U primecare -d login_browser" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b306f3dbc52a08381fd2d93381d2f2bc2efac3c3
      - uses: actions/download-artifact@v4
        with:
          name: workspace-registration-and-auth-authority
          path: test-results
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --prefix /tmp/auth-session-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 pg@8.16.3 bcryptjs@3 typescript@5.9.3 jsdom@26
          ln -s /tmp/auth-session-tools/node_modules node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Replay client and delayed-response regressions
        run: |
          node --test scripts/test-workspace-browser.mjs scripts/test-account-client.mjs scripts/test-auth-client.mjs scripts/test-session-signout-client.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --lib es2022,dom,dom.iterable websites/typescript/src/main.ts
      - name: Current registered logout and password browser regressions
        env:
          LOGIN_BROWSER_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/login_browser
          VERIFICATION_SOURCE_SHA: b306f3dbc52a08381fd2d93381d2f2bc2efac3c3
        run: |
          mkdir -p test-results/workspace-logout test-results/auth-password
          cp test-results/workspace-cutover/governance.json test-results/workspace-logout/governance.json
          cp test-results/workspace-cutover/governance.json test-results/auth-password/governance.json
          node scripts/test-workspace-signout-workflow.mjs
          node scripts/test-auth-password-workflow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        id: evidence
        with:
          name: auth-session-current-browser-proof
          path: |
            test-results/workspace-logout
            test-results/auth-password
          retention-days: 90
  record:
    needs: [browser,authority]
    if: always() && needs.browser.outputs.evidence != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b306f3dbc52a08381fd2d93381d2f2bc2efac3c3
      - uses: actions/download-artifact@v4
        with:
          name: auth-session-current-browser-proof
          path: test-results
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Record each exact scoped result and current handoff
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          EVIDENCE_URL: ${{ needs.browser.outputs.evidence }}
          RUN_URL: https://github.com/shaikhrais/primecare-platform/actions/runs/${{ github.run_id }}
        run: |
          python -u - <<'PY'
          import sys,json,pathlib,hashlib,os
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt,_resolution_current,summary
          root=pathlib.Path.cwd()
          for flow,directory,criteria in [('auth.logout','workspace-logout',['ui.workspace-signout-confirmation','execution.workspace-signout-browser']),('auth.change-password','auth-password',['ui.password-change-confirmation','execution.password-browser'])]:
           path='test-results/'+directory+'/results.json';p=root/path
           if not p.is_file():print('NO_EXECUTION_RECEIPT '+flow);continue
           r=json.loads(p.read_text());passed=r.get('passed') is True
           r['source_bindings']['scripts/test-workspace-signout-workflow.mjs' if flow=='auth.logout' else 'scripts/test-auth-password-workflow.mjs']=hashlib.sha256((root/('scripts/test-workspace-signout-workflow.mjs' if flow=='auth.logout' else 'scripts/test-auth-password-workflow.mjs')).read_bytes()).hexdigest()
           evidence=[{'kind':'browser','path':path,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']}]
           proof_path='test-results/'+directory+'/focused-resolution.json'
           proof={'workflow_id':flow,'criterion_results':{**r.get('criterion_results',{}),**({key:'passed' for key in criteria} if passed else {})},'source_bindings':r['source_bindings'],'wholeTaskVerified':False,'executed_receipt':path}
           (root/proof_path).write_text(json.dumps(proof,indent=2));evidence.append({'kind':'browser','path':proof_path,'sha256':hashlib.sha256((root/proof_path).read_bytes()).hexdigest(),'url':os.environ['RUN_URL']})
           for v in sorted((root/'test-results'/directory).glob('*.webm')):evidence.append({'kind':'video','path':str(v.relative_to(root)),'sha256':hashlib.sha256(v.read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']})
           blockers=list(r['limitations'])
           if flow=='auth.logout':blockers+=['Registered logout API5 lacks a reconciled formal response/permission contract. The generic missing/expired-session denial alternative is unresolved against the implemented idempotent signed_out retry contract.','The six credential cases cover RMT and CEO; remaining registered actor/workspace families, deployed edge/cookie execution and required independent reviews remain unproven.','Workspace labels are registered from existing source with reviewed=0 and approved=0; registration parity is not localization approval.']
           result={'status':'implemented-unverified','test_status':'scoped_pass' if passed else 'failed','scope':'scoped','source_bindings':r['source_bindings'],'evidence':evidence,'issues':[] if passed else [{'criterion_id':criteria[-1],'reproduction':'Run the current production-governed native browser producer '+directory,'expected':'Declared current scoped browser checks pass.','actual':r.get('error','No passing execution result.'),'affected_sources':['scripts/test-workspace-signout-workflow.mjs' if flow=='auth.logout' else 'scripts/test-auth-password-workflow.mjs']}],'blockers':blockers,'next_action':'Finish current single branch PR/CI/merge/cleanup. Then reconcile existing maintenance mutation workflow bindings and remaining auth metadata; full acceptance and external review gates remain required.'}
           with ProductionWorkflowStore() as db:
            if passed:
             ids=db.execute('SELECT i.issue_id,i.criterion_id FROM virtual_workflow_issues i JOIN virtual_workflow_attempts a ON a.attempt_id=i.attempt_id WHERE a.flow_id=? AND i.criterion_id IN (?,?)',(flow,*criteria)).fetchall()
             ids=[(i,c) for i,c in ids if not _resolution_current(db,flow,i,root)]
             result.update(resolves_issue_ids=[v[0] for v in ids],resolution_note='Replayed each original scoped criterion against current candidate source and pinned production metadata; native credential browser cases pass with synthetic cleanup.',issue_resolution_results={str(i):{'criterion_id':criterion,'result':'passed','reproduction_verified':True,'evidence_path':proof_path} for i,criterion in ids})
            saved=record_attempt(db,flow,result,root)
           print('AUTH_SESSION_ATTEMPT_COMMITTED '+json.dumps(saved))
          with ProductionWorkflowStore() as db:
           state={'active_branch':'work/auth-session-repair-20261020','candidate_sha':'b306f3dbc52a08381fd2d93381d2f2bc2efac3c3','pr':None,'summary':summary(db),'evidence':os.environ['EVIDENCE_URL'],'full_auth_verified':False,'synthetic_cleanup':'Each producer dropped its isolated PostgreSQL schema; no production business data changed or email sent.','remaining':'Unreviewed workspace translations; exact logout API/denial contract reconciliation; remaining actor/deployed/PWA/review gates; missing recovery/account/session controls.','next_action':'Open one PR for the proven workspace repair and resource writer, complete CI/review/merge/local+remote cleanup, then reconcile maintenance mutation definitions without inventing grants.'}
           for name in ['auth-completion-current','execution-handoff-current']:
            db.execute('INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP',(name,json.dumps(state)))
          print('AUTH_SESSION_HANDOFF_COMMITTED '+json.dumps(state))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: auth-session-current-focused-resolution
          path: |
            test-results/workspace-logout/focused-resolution.json
            test-results/auth-password/focused-resolution.json
