name: Deploy password recovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primecare-cloudflare-typescript-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate production configuration
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PRODUCTION_DATABASE_URL; do
            test -n "${!name}" || { echo "::error::Missing configuration: ${name}"; exit 1; }
          done
          if test -z "$RESEND_API_KEY" || test -z "$EMAIL_FROM"; then
            echo '::warning::Email secrets missing; recovery will return 503 until delivery is configured.'
          fi
      - name: Install isolated dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-dependencies"
          npm install --prefix "$RUNNER_TEMP/recovery-dependencies" --ignore-scripts wrangler@4.68.1 esbuild@0.27.2 pg@8.16.3 bcryptjs@3.0.2 typescript@5.9.3 @types/pg@8.15.5 @cloudflare/workers-types@4.20260403.1
          ln -s "$RUNNER_TEMP/recovery-dependencies/node_modules" node_modules
      - name: Test and type check
        run: |
          node --test scripts/test-auth-recovery.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --types @cloudflare/workers-types cloudflare/workers/src/service.ts
      - name: Apply additive recovery migration
        run: psql "$PRODUCTION_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/migrations/20261003_auth_password_resets.sql
      - name: Deploy auth with encrypted email secrets
        run: |
          node scripts/generate-cloudflare-worker-config.mjs
          node scripts/check-auth-schema.mjs
          if test -n "$RESEND_API_KEY" && test -n "$EMAIL_FROM"; then
            printf '%s' "$RESEND_API_KEY" | node_modules/.bin/wrangler secret put RESEND_API_KEY --config .cloudflare-workers/auth.jsonc
            printf '%s' "$EMAIL_FROM" | node_modules/.bin/wrangler secret put EMAIL_FROM --config .cloudflare-workers/auth.jsonc
          fi
          node_modules/.bin/wrangler deploy --config .cloudflare-workers/auth.jsonc
      - name: Check public API validation response
        run: |
          status=$(curl --silent --show-error -o response.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"invalid"}' https://primecare-api-gateway.itpro-mohammed.workers.dev/v1/auth/forgot-password)
          test "$status" = 400
