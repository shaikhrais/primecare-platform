name: Deploy native Cloudflare email and recovery
on:
  push:
    branches: [main]
    paths: ['cloudflare/workers/src/email.ts', 'cloudflare/workers/src/maintenance.ts', 'cloudflare/workers/src/password-recovery.ts', 'scripts/generate-cloudflare-worker-config.mjs', '.github/workflows/deploy-password-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primecare-cloudflare-typescript-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate production configuration
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PRODUCTION_DATABASE_URL; do
            test -n "${!name}" || { echo "::error::Missing configuration: ${name}"; exit 1; }
          done
      - name: Install isolated dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-dependencies"
          npm install --prefix "$RUNNER_TEMP/recovery-dependencies" --ignore-scripts wrangler@4.68.1 esbuild@0.27.2 pg@8.16.3 bcryptjs@3.0.2 typescript@5.9.3 @types/pg@8.15.5 @cloudflare/workers-types@4.20260403.1
          ln -s "$RUNNER_TEMP/recovery-dependencies/node_modules" node_modules
      - name: Test and type check
        run: |
          node --test scripts/test-auth-maintenance.mjs scripts/test-auth-recovery.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --types @cloudflare/workers-types cloudflare/workers/src/service.ts
      - name: Apply additive configuration migrations
        run: |
          psql "$PRODUCTION_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/migrations/20261003_auth_password_resets.sql
          psql "$PRODUCTION_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/migrations/20261003_maintenance_configuration.sql
      - name: Deploy auth with native Cloudflare email binding
        run: |
          node scripts/generate-cloudflare-worker-config.mjs
          node scripts/check-auth-schema.mjs
          node_modules/.bin/wrangler secret list --config .cloudflare-workers/auth.jsonc > "$RUNNER_TEMP/auth-secret-names.json"
          if ! node -e 'const names=require(process.argv[1]);process.exit(names.some(v=>v.name==="CONFIG_ENCRYPTION_KEY")?0:1)' "$RUNNER_TEMP/auth-secret-names.json"; then
            node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))' | node_modules/.bin/wrangler secret put CONFIG_ENCRYPTION_KEY --config .cloudflare-workers/auth.jsonc
          fi
          node_modules/.bin/wrangler deploy --config .cloudflare-workers/auth.jsonc
          echo 'Native Cloudflare email binding deployed. Domain onboarding and inbox delivery must still be verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check public API validation response
        run: |
          status=$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 30 --silent --show-error -o response.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"invalid"}' https://primecare-api-gateway.itpro-mohammed.workers.dev/v1/auth/forgot-password)
          test "$status" = 400
