name: Inspect credential login governance
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-credential-login.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix /tmp/govt-reader --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/govt-reader/node_modules node_modules
          pip install -r tools/governance-production/requirements.txt
      - name: Read pinned production login requirements
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import sys,json,sqlite3
          sys.path.insert(0,'tools/governance-production')
          from production_reader import connect
          with connect() as db:
              db.row_factory=sqlite3.Row
              queries={
                'definition':("SELECT * FROM virtual_workflow_definitions WHERE flow_id=?",('auth.credential-login',)),
                'steps':("SELECT * FROM virtual_workflow_steps WHERE flow_id=?",('auth.credential-login',)),
                'links':("SELECT * FROM virtual_workflow_source_links WHERE flow_id=?",('auth.credential-login',)),
                'checkpoint':("SELECT * FROM virtual_workflow_checkpoints WHERE flow_id=?",('auth.credential-login',)),
                'counts':("SELECT verification_status,COUNT(*) AS count FROM virtual_workflow_definitions WHERE flow_kind='business_process' GROUP BY verification_status",()),
                'route':("SELECT * FROM auth_route_registry WHERE id=1",()),
                'guides':("SELECT * FROM virtual_role_flow_guides WHERE guide_json LIKE ?",('%auth.credential-login%',)),
                'snapshots':("SELECT name,updated_at FROM virtual_flow_catalog_snapshots",()),
                'login_api':("SELECT * FROM api_endpoints WHERE route_path LIKE ?",('%auth/login%',))
              }
              for label,(sql,params) in queries.items():
                  print('LOGIN_GOVERNANCE '+json.dumps({'section':label,'rows':[dict(r) for r in db.execute(sql,params)]},default=str))
          PY
