name: Register scoped shared work modules metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/work-modules-registration.yml'
      - 'tools/governance-production/work_modules_registration.py'
      - 'tools/governance-production/test-work-modules-registration.py'
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: work-modules-metadata-registration
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r tools/governance-production/requirements.txt
      - run: |
          python tools/governance-production/test-work-modules-registration.py
  production:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix /tmp/work-modules-registration-tools --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/work-modules-registration-tools/node_modules node_modules
          mkdir -p test-results/work-modules-registration
      - name: Validate exact metadata transaction and roll it back
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_WORK_MODULES_WRITES: '1'
        run: python tools/governance-production/work_modules_registration.py --dry-run | tee test-results/work-modules-registration/dry-run.txt
      - name: Register optional controls and draft labels with independent readback
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_WORK_MODULES_WRITES: '1'
        run: python tools/governance-production/work_modules_registration.py --apply | tee test-results/work-modules-registration/registration.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: work-modules-registration, path: test-results/work-modules-registration}
