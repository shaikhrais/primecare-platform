name: Apply only the approved Clinical Director access schema
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-clinical-director-schema-only.yml'
      - 'tests/fixtures/clinical-director-api-candidate/run-reviewed-migration.py'
  workflow_dispatch:
    inputs:
      expected_main:
        description: Exact current main SHA
        required: true
        type: string
      confirm:
        description: Type APPLY CLINICAL DIRECTOR SCHEMA ONLY
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'primecare-database-migrations' || format('clinical-migration-fixture-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  rehearse-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinical_fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: clinical_fixture
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd "pg_isready -U clinical_fixture -d clinical_fixture" --health-interval 5s --health-timeout 4s --health-retries 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.13'
      - name: Rehearse identical migration and verification without production credentials
        env:
          CLINICAL_MIGRATION_FIXTURE: '1'
        run: python tests/fixtures/clinical-director-api-candidate/run-reviewed-migration.py
  schema-only:
    if: github.event_name == 'workflow_dispatch'
    needs: rehearse-runner
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact approved main and tested migration bytes
        env:
          EXPECTED_MAIN: ${{ inputs.expected_main }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM" = 'APPLY CLINICAL DIRECTOR SCHEMA ONLY'
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_MAIN" = "$GITHUB_SHA"
          test "$EXPECTED_MAIN" = "$(git rev-parse HEAD)"
          test "$EXPECTED_MAIN" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          git merge-base --is-ancestor c91b445e16625d1e6672b895048eae9f0eb5311b "$EXPECTED_MAIN"
          printf '%s  %s\n' 6b6bf92aa84b37caa01167d408b9cdef14ca5c8b2f25f1534e573f01d2e70a3d tests/fixtures/clinical-director-api-candidate/migration-review.sql | sha256sum --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.13'
      - name: Apply and verify only the reviewed empty access schema
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python tests/fixtures/clinical-director-api-candidate/run-reviewed-migration.py

