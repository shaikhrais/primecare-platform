name: Admin website workflow acceptance
on:
  pull_request:
    paths: ['websites/typescript/**', 'evidence/test-admin-reports-browser.mjs', '.github/workflows/admin-website-acceptance.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/admin-browser-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 typescript@5.9.3 pg@8.11.3 bcryptjs@3
          ln -s "$RUNNER_TEMP/admin-browser-tools/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Build real website and PDF renderer
        run: |
          GOVERNANCE_ALLOW_SQLITE_FIXTURES=1 python3 scripts/export-typescript-websites.py --output artifacts/admin-website/manifests --gateway http://127.0.0.1:4173/test-api
          mkdir -p artifacts/admin-website/site/assets
          node_modules/.bin/esbuild websites/typescript/src/main.ts --bundle --outfile=artifacts/admin-website/site/assets/app.js
          node_modules/.bin/esbuild cloudflare/workers/src/reporting.ts --bundle --platform=node --format=cjs --external:pg --external:bcryptjs --outfile=artifacts/admin-website/reporting.cjs
          cp websites/typescript/src/styles.css artifacts/admin-website/site/assets/app.css
          cp websites/typescript/index.html artifacts/admin-website/site/index.html
          node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable websites/typescript/src/main.ts
      - name: Test and record admin workflows
        run: node evidence/test-admin-reports-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-website-fixed-workflows
          path: artifacts/admin-website/
