name: Diagnose Pages auth verification access
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-pages-auth-access.yml
      - tools/deployment/diagnose_pages_access.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read deployment and access metadata without modifying protection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/deployment/diagnose_pages_access.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-auth-access-diagnosis
          path: test-results/pages-access-diagnosis.json
          retention-days: 30
