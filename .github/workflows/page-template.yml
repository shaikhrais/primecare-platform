name: Shared page templates and route layouts
on:
  push:
    branches: [main]
    paths:
      - 'packages/domain/src/page_template.ts'
      - 'packages/primecare_ui/web/page-*.ts'
      - 'packages/flutter_core/lib/page/**'
      - 'packages/flutter_core/lib/page_template.dart'
      - 'packages/flutter_core/lib/workspace/prime_workspace_layout.dart'
      - 'packages/primecare_ui/lib/page_template.dart'
      - 'packages/flutter_core/test/page/**'
      - 'scripts/*page-template*.mjs'
      - '.github/workflows/page-template.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/nav-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 playwright@1.60.0
          ln -s /tmp/nav-tools/node_modules node_modules
          npx playwright install --with-deps chromium
          node scripts/test-page-template-model.mjs
          node scripts/test-page-template-browser.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable packages/primecare_ui/web/page-template.ts
      - uses: actions/upload-artifact@v4
        with: {name: web-page-oracle, path: packages/flutter_core/test/page/fixtures/web.json}
  native:
    needs: web
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - uses: actions/download-artifact@v4
        with: {name: web-page-oracle, path: packages/flutter_core/test/page/fixtures}
      - run: flutter pub get
        working-directory: packages/flutter_core
      - run: flutter analyze --no-fatal-infos lib/page lib/page_template.dart test/page
        working-directory: packages/flutter_core
      - run: flutter test test/page --reporter expanded
        working-directory: packages/flutter_core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-page-${{ matrix.os }}
          path: packages/flutter_core/test/page/fixtures/native.json
  parity:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        with: {pattern: native-page-*, path: artifacts/page}
      - run: |
          npm install --prefix /tmp/nav-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2
          ln -s /tmp/nav-tools/node_modules node_modules
          for file in artifacts/page/*/native.json; do node scripts/page-template-fixtures.mjs --verify-native "$file"; done
