name: Preview inherited shared controls
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inherited-controls-preview.yml', '.github/fixtures/inherited-controls/**']
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: cp .github/fixtures/inherited-controls/*.ts packages/primecare_ui/web/
      - run: |
          npm install --prefix /tmp/control-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 playwright@1.60.0 @electric-sql/pglite@0.3.14 bcryptjs@3.0.2 pg@8.16.3 ajv@8.17.1 ajv-formats@3.0.1 postal-mime@4.1.2 htmlparser2@12.0.0
          ln -s /tmp/control-tools/node_modules node_modules
          npx playwright install --with-deps chromium
      - run: |
          node --test scripts/test-theme-control-base.mjs
          node scripts/test-component-catalogue-browser.mjs
          node scripts/test-dashboard-widgets-browser.mjs
          node scripts/test-work-modules-browser.mjs
          node scripts/test-communication-modules-browser.mjs
          node scripts/test-application-modules-browser.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable --resolveJsonModule packages/primecare_ui/web/component-catalogue.ts packages/primecare_ui/web/dashboard-widgets.ts packages/primecare_ui/web/work-modules.ts packages/primecare_ui/web/communication-modules.ts packages/primecare_ui/web/application-modules.ts
