name: Leadership web combined isolated preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/leadership-web-combined-preflight.yml'
permissions:
  contents: read
jobs:
  synthetic-overlays:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply both pinned tracked candidates in order inside this checkout only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ciso=tests/fixtures/ciso-web-readiness/preflight.patch
          locale=tests/fixtures/leadership-report-locale/workspace-report-locale.patch
          printf '%s  %s\n' \
            92caa981f8b972c93ef6d7eef599e62954e5efe39aaea1b36575989805f35fe4 "$ciso" \
            9a46f7f106833f97cffca2bd1667a4c8144c7b2c4b7f7af6bf986fb863a17f12 "$locale" \
            | sha256sum --check --strict
          git apply --check --whitespace=error-all "$ciso"
          git apply --whitespace=error-all "$ciso"
          git apply --check --whitespace=error-all "$locale"
          git apply --whitespace=error-all "$locale"
          git diff --check
          expected="$(printf '%s\n' packages/primecare_ui/lib/src/localization/screens/workspace.json scripts/test-workspace-browser.mjs websites/typescript/src/workspace.ts)"
          test "$(git diff --name-only)" = "$expected"
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install checks only
        run: |
          npm install --prefix "$RUNNER_TEMP/leadership-combined" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 jsdom@26 @twilio/voice-sdk@2.18.5 bcryptjs@3
          ln -s "$RUNNER_TEMP/leadership-combined/node_modules" node_modules
      - name: Verify actual workspace renderer and selected report locale with synthetic adapters
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" node --test scripts/test-workspace-browser.mjs
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" node --test tests/fixtures/leadership-report-locale/scoped.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --lib es2022,dom,dom.iterable websites/typescript/src/main.ts
      - name: Remove the temporary source overlays in reverse order
        run: |
          set -euo pipefail
          locale=tests/fixtures/leadership-report-locale/workspace-report-locale.patch
          ciso=tests/fixtures/ciso-web-readiness/preflight.patch
          git apply -R --check --whitespace=error-all "$locale"
          git apply -R --whitespace=error-all "$locale"
          git apply -R --check --whitespace=error-all "$ciso"
          git apply -R --whitespace=error-all "$ciso"
          git diff --exit-code
