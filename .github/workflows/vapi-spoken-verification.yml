name: Deploy spoken SMS verification tool
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vapi-spoken-verification.yml'
      - 'cloudflare/workers/src/business-tasks/vapi-spoken*.ts'
      - 'cloudflare/workers/src/business-tasks/vapi-owner-test.ts'
      - 'cloudflare/workers/src/business-tasks/vapi-call-identity.ts'
      - 'scripts/test-vapi-call-identity.mjs'
      - 'packages/shared/src/communications/vapi-call-read.mjs'
      - 'packages/shared/src/vapi-agent-targets.json'
      - 'packages/shared/src/communications/vapi-call-read.d.mts'
      - 'scripts/run-owner-phone-test.mjs'
      - 'scripts/test-vapi-owner-test-postgres.mjs'
      - 'packages/shared/src/vapi-spoken-verification-instructions.txt'
      - 'tools/governance-production/vapi-verification-registration.json'
      - 'tools/governance-production/vapi_verification_registration.py'
      - 'scripts/test-vapi-spoken*.mjs'
      - 'scripts/deploy-vapi-spoken-verification.mjs'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: primecare-vapi-spoken-verification-production, cancel-in-progress: false}
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: owner_fixture, POSTGRES_PASSWORD: disposable-only, POSTGRES_DB: owner_phone_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U owner_fixture -d owner_phone_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKFLOW_TEST_DATABASE_URL: postgres://owner_fixture:disposable-only@localhost:5432/owner_phone_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/spoken-tests" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 miniflare@4.20260730.0 twilio@6.2.0 pg@8.16.3 @types/pg@8.15.5 typescript@5.9.3 @types/node@24.0.0 @cloudflare/workers-types@4.20260403.1
          ln -s "$RUNNER_TEMP/spoken-tests/node_modules" node_modules
          pip install -r tools/governance-production/requirements.txt
      - run: |
          node --test scripts/test-vapi-call-identity.mjs scripts/test-vapi-spoken-verification.mjs scripts/test-vapi-call-read.mjs scripts/test-vapi-service-auth.mjs scripts/test-vapi-agent-library.mjs scripts/test-communication-twilio-verify.mjs scripts/test-communication-voice-tasks.mjs
          node scripts/test-vapi-spoken-workerd.mjs
          node scripts/test-vapi-owner-test-postgres.mjs
          node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions --resolveJsonModule --types node,@cloudflare/workers-types cloudflare/workers/src/business-tasks/vapi-spoken-worker.ts
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'tools/governance-production')
          import vapi_verification_registration as m
          p=json.load(open('tools/governance-production/production-pin.json'))
          assert p['vapiVerificationRegistrationWriter']==m.expected_scope()
          assert m.definition()['operations'][0]['key']=='vapi.verification'
          print('Pinned verification contract passed')
          PY
  deploy:
    needs: tests
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/spoken-deploy" --ignore-scripts --no-audit --no-fund wrangler@4.68.1 pg@8.16.3 twilio@6.2.0
          ln -s "$RUNNER_TEMP/spoken-deploy/node_modules" node_modules
          pip install -r tools/governance-production/requirements.txt
      - name: Register only the exact verification service API; no role grants or schema writes
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_VAPI_VERIFICATION_REGISTRATION: '1'
          GOVERNANCE_WORKFLOW_WRITES: '1'
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          mkdir -p test-results/vapi-spoken
          python tools/governance-production/vapi_verification_registration.py --apply > "$RUNNER_TEMP/spoken-registration.txt"
          python - <<'PY'
          import os,json,pathlib
          lines=(pathlib.Path(os.environ['RUNNER_TEMP'])/'spoken-registration.txt').read_text().splitlines()
          reports=[json.loads(s.removeprefix('VAPI_VERIFICATION_REGISTRATION ')) for s in lines if s.startswith('VAPI_VERIFICATION_REGISTRATION ')]
          assert len(reports)==1 and reports[0]['independentReadback'] is True
          pathlib.Path('test-results/vapi-spoken/registration.json').write_text(json.dumps(reports[0]))
          print('Exact verification API registration independently read back')
          PY
      - name: Deploy dedicated SMS verification and attach its tool to the existing receptionist and eight saved agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          VAPI_PRIVATE_API_KEY: ${{ secrets.VAPI_PRIVATE_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
        run: node scripts/deploy-vapi-spoken-verification.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: spoken-sms-verification, path: test-results/vapi-spoken, retention-days: 30}

  owner-test:
    needs: deploy
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'OWNER_PHONE_TEST_20261026') && github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/owner-phone-test" --ignore-scripts --no-audit --no-fund wrangler@4.68.1 pg@8.16.3
          ln -s "$RUNNER_TEMP/owner-phone-test/node_modules" node_modules
      - name: Make the one explicitly authorized owner call; observe verified contact readback without logging codes
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          VAPI_PRIVATE_API_KEY: ${{ secrets.VAPI_PRIVATE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/run-owner-phone-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: owner-phone-test, path: test-results/owner-phone-test, retention-days: 7}
