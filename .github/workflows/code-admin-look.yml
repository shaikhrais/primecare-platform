name: Review Code Admin dashboard appearance
on:
  push:
    branches: [main]
    paths: ['scripts/review-code-admin-look.mjs', '.github/workflows/code-admin-look.yml', 'websites/typescript/src/styles.css', 'websites/typescript/src/shell.ts', 'websites/typescript/src/navigation.ts', 'websites/typescript/src/platform-admin.ts']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: node scripts/review-code-admin-look.mjs
        env: {LOOK_REVIEW_PHASE: after}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: code-admin-look, path: test-results/code-admin-look, retention-days: 14}

  publish:
    needs: review
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency: {group: primecare-cloudflare-typescript-production, cancel-in-progress: false}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: pip install -r tools/governance-production/requirements.txt
      - run: node scripts/build-typescript-websites.mjs
      - name: Publish verified governance portal from current main
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          npx wrangler pages deploy websites/typescript/dist/primecare-governance --project-name primecare-governance --branch main --commit-hash "$GITHUB_SHA"
