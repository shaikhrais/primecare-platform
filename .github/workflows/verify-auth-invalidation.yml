name: Native auth invalidation rollback proof
on:
  push:
    branches: [main]
    paths: ['cloudflare/workers/**', 'tools/auth-verification/test-auth-invalidation-fault.mjs', '.github/workflows/verify-auth-invalidation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        identity: [uuid, text]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: disposable-ci-fixture
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U auth_test -d auth_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/invalidation-check" --ignore-scripts esbuild@0.27.2 pg@8.16.3 bcryptjs@3.0.2
          ln -s "$RUNNER_TEMP/invalidation-check/node_modules" node_modules
          git fetch --no-tags --depth=1 origin 7a875f6511838ecfdfbe6763798a676b3e138aa8
      - env:
          AUTH_TEST_DATABASE_URL: postgres://auth_test:disposable-ci-fixture@127.0.0.1:5432/auth_test
          AUTH_TEST_ID_TYPE: ${{ matrix.identity }}
        run: node tools/auth-verification/test-auth-invalidation-fault.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-invalidation-${{ matrix.identity }}
          path: test-results/auth-invalidation
