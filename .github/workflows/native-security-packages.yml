name: Verify named authentication storage and security packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_security_models/**'
      - 'packages/primecare_auth_storage/**'
      - 'packages/primecare_session_watchdog/**'
      - '.github/workflows/native-security-packages.yml'
permissions: {contents: read}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        package: [primecare_auth_storage, primecare_session_watchdog]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/primecare_security_models
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: dart-lang/setup-dart@v1
        with: {sdk: '3.11.3'}
      - run: dart pub get
      - run: dart analyze
      - run: dart test
