name: Record recovery proofs and cleaned main handoff
on:
  push:
    branches: [main]
    paths: [.github/workflows/record-auth-recovery.yml]
permissions:
  contents: read
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          run-id: 39339396205
          github-token: ${{ github.token }}
          name: forgot-password-native-browser-evidence
          path: test-results
      - uses: actions/download-artifact@v4
        with:
          run-id: 39338559825
          github-token: ${{ github.token }}
          name: forgot-password-native-browser-evidence
          path: diagnostics/diagnostic-incomplete-schema
      - uses: actions/download-artifact@v4
        with:
          run-id: 39338859913
          github-token: ${{ github.token }}
          name: forgot-password-native-browser-evidence
          path: diagnostics/diagnostic-trigger-quoting
      - uses: actions/download-artifact@v4
        with:
          run-id: 39339102871
          github-token: ${{ github.token }}
          name: forgot-password-native-browser-evidence
          path: diagnostics/diagnostic-unregistered-header
      - name: Record current scope and diagnostic history transactionally
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: '39339396205'
        run: |
          python -u - <<'PY'
          import sys,os,json,pathlib,hashlib,urllib.request
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt,summary,_bindings_current
          root=pathlib.Path.cwd();base='test-results/forgot-password';flow='auth.forgot-password';receipt=json.loads((root/base/'results.json').read_text());policy=json.loads((root/base/'governance.json').read_text())
          assert receipt['workflow_id']==flow and receipt['passed'] is True and receipt['wholeTaskVerified'] is False and len(receipt['cases'])==3 and len(receipt['apiChecks'])==8
          assert _bindings_current(receipt['source_bindings'],root)
          def request(path):return json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/shaikhrais/primecare-platform/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})))
          run=request('actions/runs/'+os.environ['EVIDENCE_RUN']);assert run['conclusion']=='success' and run['head_sha']==receipt['commit']
          artifact=next(a for a in request('actions/runs/'+os.environ['EVIDENCE_RUN']+'/artifacts')['artifacts'] if a['name']=='forgot-password-native-browser-evidence' and not a['expired']);url=run['html_url']+'/artifacts/'+str(artifact['id'])
          blockers=receipt['limitations']+['Actual Cloudflare EMAIL binding, approved sender/tenant configuration and mailbox receipt remain unverified; the loopback mail binding proves acceptance/failure behavior only.','API395 still has auth_required=1, null request/response schemas, no permission/rate-limit key and PRISMA service metadata, while existing shared recovery web policy and auth implementation expose public recovery. Reconcile exact registered contracts with a supported production metadata writer; no new grants or routes inferred.','Observed 429 has no Retry-After header; the registry does not define that header. Clarify the retry-timing contract through governance before full API acceptance.', 'Specification/source bindings and governed video delivery plus independent architecture/database/security/accessibility/performance/localization/API/testing/documentation reviews remain pending.']
          diagnostic_outputs=[]
          with ProductionWorkflowStore() as db:
              assert db.execute('SELECT definition_sha256 FROM virtual_workflow_definitions WHERE flow_id=?',(flow,)).fetchone()[0]==receipt['definition_sha256']
              registered_table='auth_recovery_web_policy' in db.tables
              source=json.loads((root/'packages/shared/src/auth-recovery.json').read_text())
              authority_error='Required auth_recovery_web_policy relation is absent from the pinned production source manifest; the shared adapter refuses it. Its physical availability outside the manifest was not probed. Existing generated JSON is implementation/source evidence only, never a production-authority fallback. Register/migrate the approved recovery UI policy and exact control/resource bindings through a governed production cutover before full acceptance.'
              assert not registered_table, 'Reinspect the newly registered recovery policy before changing this blocked checkpoint'
              blockers.insert(0,authority_error)
              blockers.insert(1,'Producer receipt registeredRecoveryUI flags relied on generated source; live registration was not established. Those flags are invalidated for governance acceptance. Native behavior tests remain scoped evidence only.')
              permission_rows=[dict(zip(['id','role_id','permission_key','can_access'],row)) for row in db.execute('SELECT id,role_id,permission_key,can_access FROM api_permissions WHERE api_id=395')]
              audit=dict(permission_rows=permission_rows,workflow_id=flow,required_policy_relation='auth_recovery_web_policy',policy_relation_in_pinned_manifest=False,source_registration_claim_invalidated=True,physical_relation_not_probed=True,generated_policy_source_sha256=hashlib.sha256((root/'packages/shared/src/auth-recovery.json').read_bytes()).hexdigest(),source_control_names=[c['testId'] for c in source['views']['forgot']['controls']],mail_transport='Isolated native EMAIL binding; not deployed mail or inbox proof',remaining_blockers=blockers)
              (root/base/'registration-review.json').write_text(json.dumps(audit,indent=2))
              files=[('results.json','browser-api-database'),('governance.json','specification'),('run.mjs','test'),('registration-review.json','source-review')]+[('recovery-'+locale+'.webm','video') for locale in ['en','fr','es']]
              evidence=[dict(path=base+'/'+name,sha256=hashlib.sha256((root/base/name).read_bytes()).hexdigest(),kind=kind,url=('https://github.com/shaikhrais/primecare-platform/actions/runs/'+os.environ['GITHUB_RUN_ID'] if name=='registration-review.json' else url)) for name,kind in files]
              diagnostics=[('diagnostic-incomplete-schema',39338559825,'12228545424','Native fixture omitted the existing 20261003_maintenance_configuration.sql migration; configuredMail could not inspect tenant mail settings.'),('diagnostic-trigger-quoting',39338859913,'12227024219','Three browser cases and four API groups passed, then the isolated failure trigger could not be installed because fixture PostgreSQL dollar quoting was altered.'),('diagnostic-unregistered-header',39339102871,'12228012967','Three browser cases and five API groups passed. API returned the required 429, but a test assertion demanded Retry-After although the registered API has no header/rate response contract. This unsupported assertion was removed; the missing contract remains an exact review blocker.')]
              for directory,run_id,artifact_id,reason in diagnostics:
                  diagnostic_base='diagnostics/'+directory+'/forgot-password';producer=json.loads((root/diagnostic_base/'results.json').read_text())
                  assert producer['passed'] is False and producer['definition_sha256']==receipt['definition_sha256'] and _bindings_current(producer['source_bindings'],root)
                  diagnostic_url='https://github.com/shaikhrais/primecare-platform/actions/runs/'+str(run_id)+'/artifacts/'+artifact_id
                  items=[dict(path=diagnostic_base+'/'+name,sha256=hashlib.sha256((root/diagnostic_base/name).read_bytes()).hexdigest(),kind=kind,url=diagnostic_url) for name,kind in [('results.json','diagnostic'),('run.mjs','test')]]
                  history_result=record_attempt(db,flow,dict(status='implemented-unverified',test_status='blocked',scope='scoped',source_bindings=producer['source_bindings'],evidence=items,blockers=[reason],next_action='Fixture corrected in the later producer; see the latest completed acceptance attempt. Do not classify this diagnostic as an application defect.'),root)
                  diagnostic_outputs.append(history_result)
              output=record_attempt(db,flow,dict(status='blocked',test_status='scoped_pass',scope='scoped',source_bindings=receipt['source_bindings'],evidence=evidence,blockers=blockers,next_action='Resolve missing pinned recovery-policy relation/control registration, deployed mail/inbox proof and exact API395 metadata/review blockers. Continue auth.inspect-account from current live production requirements; create-account missing UI remains recorded in attempt 325.'),root)
          for item in diagnostic_outputs:print('FORGOT_PASSWORD_DIAGNOSTIC_COMMITTED '+json.dumps(item))
          print('FORGOT_PASSWORD_ATTEMPT_COMMITTED '+json.dumps(dict(attempt=output,evidence_url=url,blockers=blockers)))
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-recovery-recorded-review
          path: |
            test-results
            diagnostics
      - name: Save final main, counts, evidence and next action
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u - <<'PY'
          import sys,os,json,pathlib,hashlib,urllib.request,subprocess,time
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import summary
          root=pathlib.Path.cwd()
          def request(path):return json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/shaikhrais/primecare-platform/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})))
          paths=['.github/workflows/create-account-inspection.yml','.github/workflows/record-account-creation.yml','.github/workflows/forgot-password-recovery.yml','.github/workflows/record-auth-recovery.yml']
          clean=None
          for _ in range(30):
              branches=request('branches?per_page=100');prs=request('pulls?state=open&per_page=100');main=next(b['commit']['sha'] for b in branches if b['name']=='main')
              subprocess.run(['git','fetch','--no-tags','origin','main'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              absent=all(subprocess.run(['git','cat-file','-e',main+':'+path],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode!=0 for path in paths)
              checks=request('commits/'+main+'/check-runs?per_page=100')['check_runs']
              if absent and len(branches)==1 and not prs and checks and all(c['status']=='completed' and c['conclusion'] in ['success','skipped','neutral'] for c in checks):
                  clean=dict(main_sha=main,work_branch=None,work_branch_sha=None,pr=None,branch_count=1,open_prs=0,ci_state=[dict(name=c['name'],conclusion=c['conclusion']) for c in checks],merge_cleanup_state='No application change or work branch; all four temporary operational workflows removed; main checks passed');break
              time.sleep(15)
          assert clean,'Completed attempts are saved; final main cleanup/checks still require handoff follow-up'
          with ProductionWorkflowStore() as db:
              attempted=[]
              for flow in ['auth.create-tenant-account','auth.forgot-password']:
                  row=db.execute('SELECT c.attempt_id,a.source_bindings_json,a.result_json,d.verification_status,d.test_status FROM virtual_workflow_checkpoints c JOIN virtual_workflow_attempts a ON a.attempt_id=c.attempt_id JOIN virtual_workflow_definitions d ON d.flow_id=c.flow_id WHERE c.flow_id=?',(flow,)).fetchone()
                  assert row
                  attempt,encoded,result,status,test=row;result=json.loads(result)
                  for path,sha in json.loads(encoded).items():assert hashlib.sha256(subprocess.check_output(['git','show',main+':'+path])).hexdigest()==sha,'Source changed after acceptance: '+path
                  attempted.append(dict(workflow_id=flow,attempt_id=attempt,verification_status=status,test_status=test,blockers=result['blockers'],evidence=result['evidence']))
              counts=summary(db);test_counts=dict(db.execute("SELECT test_status,COUNT(*) FROM virtual_workflow_definitions WHERE flow_kind='business_process' GROUP BY test_status"))
              next_row=db.execute("SELECT flow_id,title FROM virtual_workflow_definitions WHERE flow_kind='business_process' AND test_status='not_run' AND verification_status!='blocked' ORDER BY flow_id LIMIT 1").fetchone()
              next_action='Inspect '+next_row[0]+': '+next_row[1]+' from live production definition, UI bindings, permissions and APIs before isolated credential/UI/API/database/reload acceptance.'
              handoff=dict(clean,attempted=attempted,totals=counts,test_status_counts=test_counts,synthetic_data_cleanup='Both random native schemas dropped; no production business data/grants changed; all recovery emails captured by an isolated binding; no real mail sent',remaining_review_state='Full business acceptance and independent review gates outstanding; no verified promotion',next_action=next_action)
              for item in attempted:
                  current=dict(handoff,workflow_id=item['workflow_id'],attempt_id=item['attempt_id'])
                  db.execute("INSERT INTO virtual_workflow_checkpoints(flow_id,attempt_id,next_action) VALUES(?,?,?) ON CONFLICT(flow_id) DO UPDATE SET attempt_id=excluded.attempt_id,next_action=excluded.next_action,invalidation_json='[]',updated_at=CURRENT_TIMESTAMP",(item['workflow_id'],item['attempt_id'],json.dumps(current,sort_keys=True)))
              db.execute('INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP',('recovery-handoff-current',json.dumps(handoff,sort_keys=True)))
          print('AUTH_RECOVERY_HANDOFF_COMMITTED '+json.dumps(handoff))
          
          PY
