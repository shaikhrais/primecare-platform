name: Verify named portal presentation state
on:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_portal_state/**'
      - 'packages/primecare_runtime/lib/providers/portal_providers.dart'
      - 'packages/primecare_runtime/lib/models/governance_role.dart'
      - '.github/workflows/native-portal-state.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - working-directory: packages/primecare_portal_state
        run: flutter pub get
      - working-directory: packages/primecare_portal_state
        run: flutter analyze --no-fatal-infos lib test
      - working-directory: packages/primecare_portal_state
        run: flutter test --reporter expanded
      - working-directory: packages/primecare_runtime
        run: flutter pub get
      - working-directory: packages/primecare_runtime
        run: flutter analyze --no-fatal-infos lib/providers/portal_providers.dart lib/models/governance_role.dart
