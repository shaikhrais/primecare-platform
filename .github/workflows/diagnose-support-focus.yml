name: Diagnose synthetic deployed support focus
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-support-focus.yml, tools/auth-verification/diagnose-support-focus.py, tools/deployment/flutter_browser.py, tools/deployment/test_flutter_browser.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auth-support-focus-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install psycopg[binary]==3.2.13 bcrypt==4.3.0 playwright==1.58.0
          python -m playwright install --with-deps chromium
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix "$RUNNER_TEMP/focus-reader" --ignore-scripts pg@8.16.3
          ln -s "$RUNNER_TEMP/focus-reader/node_modules" node_modules
      - name: Verify pinned production governance authority
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python tools/governance-production/verify-production-reader.py
      - name: Diagnose only synthetic focus with exact fixture cleanup
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIAGNOSE_SUPPORT_FOCUS: '1'
        run: python tools/auth-verification/diagnose-support-focus.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-support-focus-diagnostic
          path: test-results/support-focus
          retention-days: 30
