name: Read theme service binding candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/governance-production/audit_theme_service_candidates.py
      - .github/workflows/theme-service-candidates.yml
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix /tmp/theme-reader --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/theme-reader/node_modules node_modules
      - name: Read pinned registry metadata only
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python tools/governance-production/audit_theme_service_candidates.py --output test-results/theme-service-candidates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: theme-service-candidates, path: test-results/theme-service-candidates.json}
