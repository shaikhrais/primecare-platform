name: Deploy TypeScript APIs to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to authorize production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: primecare-cloudflare-typescript-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Validate authorization and secrets
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "DEPLOY"
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PRODUCTION_DATABASE_URL; do
            test -n "${!name}" || { echo "::error::Missing GitHub secret: ${name}"; exit 1; }
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker deployment dependencies
        run: npm install --no-save --ignore-scripts wrangler@4.68.1 pg@8.16.3 @types/pg bcryptjs@3.0.2 typescript

      - name: Type-check Workers
        run: npx tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --types @cloudflare/workers-types cloudflare/workers/src/service.ts cloudflare/workers/src/gateway.ts

      - name: Generate independent Worker configurations
        run: node scripts/generate-cloudflare-worker-config.mjs

      - name: Deploy and capture every API URL
        run: |
          set -euo pipefail
          : > worker-urls.txt
          services=(auth client provider visit notes billing scheduling notification verification compliance governance franchise-reporting)
          for service in "${services[@]}"; do
            config=".cloudflare-workers/${service}.jsonc"
            output="$(npx wrangler deploy --config "${config}" 2>&1 | tee /dev/stderr)"
            url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' <<<"${output}" | tail -1)"
            test -n "${url}" || { echo "::error::No public URL returned for ${service}"; exit 1; }
            # A Worker must exist before its encrypted secrets can be attached.
            printf '%s' "${PRODUCTION_DATABASE_URL}" | npx wrangler secret put DB_URL --config "${config}"
            printf '%s=%s\n' "${service}" "${url}" | tee -a worker-urls.txt
          done

      - name: Verify independent APIs
        run: |
          set -euo pipefail
          while IFS='=' read -r service url; do
            curl --fail --show-error --retry 10 --retry-all-errors --retry-delay 5 "${url}/health"
          done < worker-urls.txt

      - id: gateway
        name: Deploy service-bound gateway
        run: |
          set -euo pipefail
          output="$(npx wrangler deploy --config .cloudflare-workers/gateway.jsonc 2>&1 | tee /dev/stderr)"
          gateway="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' <<<"${output}" | tail -1)"
          test -n "${gateway}" || { echo '::error::No public gateway URL returned'; exit 1; }
          echo "url=${gateway}" >> "${GITHUB_OUTPUT}"
          printf '%s=%s\n' gateway "${gateway}" >> worker-urls.txt

      - name: Verify gateway routes
        env:
          GATEWAY_URL: ${{ steps.gateway.outputs.url }}
        run: |
          set -euo pipefail
          verify_gateway() {
            local path="$1"
            local attempt
            for attempt in {1..18}; do
              if curl --fail --show-error --silent \
                -H 'cache-control: no-cache' \
                "${GATEWAY_URL}${path}?deployment=${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"; then
                return 0
              fi
              echo "Waiting for gateway propagation: ${path} (attempt ${attempt}/18)"
              sleep 5
            done
            echo "::error::Gateway route did not become healthy: ${path}"
            return 1
          }
          verify_gateway /health
          cors_origin='https://primecare-clinic.pages.dev'
          cors_header="$(curl --fail --show-error --silent --dump-header - --output /dev/null \
            -H "Origin: ${cors_origin}" "${GATEWAY_URL}/health?cors-check=${GITHUB_SHA}" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2}')"
          test "${cors_header}" = "${cors_origin}" || { echo '::error::Gateway browser CORS verification failed'; exit 1; }
          for route in auth client provider visit notes billing scheduling notification verification compliance governance franchise-reporting; do
            verify_gateway "/v1/${route}/health"
          done
          {
            echo '## TypeScript Cloudflare Worker deployment'
            echo
            echo "Gateway: ${GATEWAY_URL}"
            echo
            echo '```text'
            cat worker-urls.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-urls
          path: worker-urls.txt
