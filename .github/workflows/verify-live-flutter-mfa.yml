name: Verify deployed Flutter MFA end to end
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-live-flutter-mfa.yml
      - tools/auth-verification/test-live-flutter-mfa.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: auth-live-flutter-mfa
  cancel-in-progress: false
jobs:
  deploy:
    uses: ./.github/workflows/_deploy-web.yml
    with:
      app: primecare_clinic
      project: primecare-clinic
    secrets: inherit
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install psycopg[binary]==3.2.13 bcrypt==4.3.0 playwright==1.58.0
          python -m playwright install --with-deps chromium
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix "$RUNNER_TEMP/mfa-reader" --ignore-scripts pg@8.16.3
          ln -s "$RUNNER_TEMP/mfa-reader/node_modules" node_modules
      - uses: actions/download-artifact@v4
        with:
          name: flutter-build-primecare-clinic
          path: test-results/flutter-build
      - name: Verify pinned production governance authority
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python tools/governance-production/verify-production-reader.py
      - name: Verify deployed English French Spanish MFA and exact synthetic cleanup
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python tools/auth-verification/test-live-flutter-mfa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-flutter-mfa-acceptance
          path: test-results/live-flutter-mfa
          retention-days: 90
