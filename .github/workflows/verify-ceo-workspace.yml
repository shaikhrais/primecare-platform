name: Verify CEO workspace
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/implement_screens_from_db.py
      - scripts/repair-role-landing-routes.py
      - scripts/test_dashboard_generator.py
      - .agents/governance/governance.db
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify generation safety
        run: python scripts/test_dashboard_generator.py
      - name: Reconcile CEO ownership and translations
        run: |
          python scripts/repair-ceo-workspace.py
          python scripts/repair-role-landing-routes.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Verify workspace presentation and account navigation
        working-directory: packages/primecare_ui
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib/src/features/generated_screens/ceo_dashboard.dart test/ceo_workspace_test.dart
          flutter test test/ceo_workspace_test.dart
      - name: Verify corporate routing and build
        working-directory: apps/primecare_corporate
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test test/auth_routing_test.dart
          flutter build web --release --no-tree-shake-icons --dart-define=API_BASE_URL=https://primecare-api-gateway.itpro-mohammed.workers.dev
