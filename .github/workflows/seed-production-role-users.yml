name: Seed Production QA Role Users
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CREATE_QA_ROLE_USERS to create all active governed roles in the QA tenant
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: primecare-production-role-user-seed
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify-role-provisioning.yml
  seed:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 80
    steps:
      - name: Validate authorization and secrets
        env:
          CONFIRM_QA_CREATE: ${{ inputs.confirm }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          TEST_DEFAULT_PASSWORD: ${{ secrets.TEST_DEFAULT_PASSWORD }}
        run: |
          test "$CONFIRM_QA_CREATE" = CREATE_QA_ROLE_USERS
          test -n "$PRODUCTION_DATABASE_URL" || { echo '::error::Missing PRODUCTION_DATABASE_URL'; exit 1; }
          test -n "$TEST_DEFAULT_PASSWORD" || { echo '::error::Missing TEST_DEFAULT_PASSWORD'; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/role-deps" --ignore-scripts pg@8.16.3 bcryptjs@3.0.2
          ln -s "$RUNNER_TEMP/role-deps/node_modules" node_modules
          python -m pip install selenium==4.28.1
      - name: Export active role metadata and static audit
        run: |
          python scripts/audit-role-dashboards.py
          python - <<'PY'
          import json
          report=json.load(open('docs/audits/role-dashboards/inventory.json'))
          json.dump(report['roles'],open('active-role-users.json','w'))
          PY
      - name: Create missing QA accounts without overwriting existing identities
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          TEST_DEFAULT_PASSWORD: ${{ secrets.TEST_DEFAULT_PASSWORD }}
        run: node scripts/seed-production-role-users.mjs active-role-users.json
      - name: Check each role login and dashboard
        env:
          TEST_DEFAULT_PASSWORD: ${{ secrets.TEST_DEFAULT_PASSWORD }}
        run: python scripts/check-role-dashboard-browser.py
      - name: Save non-secret test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-dashboard-audit
          path: |
            role-dashboard-runtime.json
            docs/audits/role-dashboards/REPORT.md
          retention-days: 7
