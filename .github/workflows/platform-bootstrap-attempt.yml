name: Platform bootstrap scoped attempt
on:
  push:
    branches: [main]
    paths: [.github/workflows/platform-bootstrap-attempt.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      evidence_url: ${{ steps.evidence.outputs.artifact-url }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: platform
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U platform" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --prefix /tmp/platform-probe --ignore-scripts --no-audit --no-fund pg@8.11.3 bcryptjs@3 esbuild@0.27.2
          ln -s /tmp/platform-probe/node_modules node_modules
      - name: Existing scoped contracts and native platform regression
        env:
          PLATFORM_TEST_DATABASE_URL: postgresql://platform:synthetic-only@localhost:5432/platform
        run: |
          mkdir -p test-results/platform-bootstrap
          node --test scripts/test-platform-bootstrap.mjs scripts/test-platform-administration-postgres.mjs > test-results/platform-bootstrap/existing.tap
          cat test-results/platform-bootstrap/existing.tap
      - name: Native suppressed-write rollback and global first-admin race
        env:
          PLATFORM_TEST_DATABASE_URL: postgresql://platform:synthetic-only@localhost:5432/platform
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';import bcrypt from 'bcryptjs';import assert from 'node:assert/strict';import {readFile,writeFile} from 'node:fs/promises';import {createHash,randomUUID} from 'node:crypto';import {build} from 'esbuild';
          import {bootstrapPlatform} from './scripts/bootstrap-first-platform-admin.mjs';
          if(process.env.PRODUCTION_DATABASE_URL||process.env.GOVERNANCE_DATABASE_URL)throw Error('Production credentials forbidden');
          const url=process.env.PLATFORM_TEST_DATABASE_URL,target=new URL(url);assert.equal(target.hostname,'localhost');assert.equal(target.pathname,'/platform');
          const cases=[],password='Synthetic-Only-Platform-2026!';
          async function fixture(name,run){
            const owner=new pg.Client({connectionString:url});await owner.connect();const schema='platform_probe_'+randomUUID().replaceAll('-',''),clients=[];
            try{
              await owner.query('CREATE SCHEMA '+schema+';SET search_path TO '+schema);
              await owner.query('CREATE TABLE tenants(id uuid PRIMARY KEY,status text);CREATE TABLE users(id uuid PRIMARY KEY,email text UNIQUE,tenant_id uuid REFERENCES tenants(id),roles text,password_hash text,status text,updated_at timestamptz)');
              await owner.query(await readFile('packages/database/migrations/20260928_auth_bootstrap_audit.sql','utf8'));
              const tenant=randomUUID();await owner.query("INSERT INTO tenants VALUES($1,'active')",[tenant]);
              const client=async()=>{const db=new pg.Client({connectionString:url});await db.connect();clients.push(db);await db.query('SET search_path TO '+schema);return db;};
              await run(owner,{tenant,email:'first@example.invalid',password},client);
            }finally{
              await Promise.all(clients.map(c=>c.end()));await owner.query('SET search_path TO public');await owner.query('DROP SCHEMA '+schema+' CASCADE');await owner.end();
            }
            cases.push({name,status:'passed'});
          }
          for(const table of ['users','auth_bootstrap_audit'])await fixture('suppressed '+table+' insert rolls back and recovers',async(db,input)=>{
            await db.query('CREATE FUNCTION suppress_insert() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NULL; END $$;CREATE TRIGGER suppress_insert BEFORE INSERT ON '+table+' FOR EACH ROW EXECUTE FUNCTION suppress_insert()');
            await assert.rejects(bootstrapPlatform(db,input),/not persisted/);
            for(const t of ['users','auth_bootstrap_audit'])assert.equal((await db.query('SELECT COUNT(*)::int AS n FROM '+t)).rows[0].n,0);
            await db.query('DROP TRIGGER suppress_insert ON '+table);assert.deepEqual(await bootstrapPlatform(db,input),{created:true});
            assert.equal((await db.query('SELECT COUNT(*)::int AS n FROM auth_bootstrap_audit')).rows[0].n,1);
          });
          await fixture('different-tenant concurrent first-admin requests have exactly one global winner',async(db,input,client)=>{
            const tenant=randomUUID();await db.query("INSERT INTO tenants VALUES($1,'active')",[tenant]);const a=await client(),b=await client();
            const r=await Promise.allSettled([bootstrapPlatform(a,input),bootstrapPlatform(b,{...input,tenant,email:'second@example.invalid'})]);
            assert.equal(r.filter(x=>x.status==='fulfilled').length,1);assert.equal(r.filter(x=>x.status==='rejected').length,1);assert.match(r.find(x=>x.status==='rejected').reason.message,/already exists/);
            const users=(await db.query("SELECT * FROM users WHERE roles='platform_admin'")).rows;assert.equal(users.length,1);assert.equal(await bcrypt.compare(password,users[0].password_hash),true);
            assert.equal((await db.query('SELECT COUNT(*)::int AS n FROM auth_bootstrap_audit')).rows[0].n,1);
          });
          const meta=await build({entryPoints:['cloudflare/workers/src/platform-administration.ts','cloudflare/workers/src/auth.ts'],bundle:true,platform:'node',format:'cjs',outdir:'/tmp/probe-bundle',write:false,metafile:true,external:['pg']});
          const sourcePaths=new Set([...Object.keys(meta.metafile.inputs).filter(p=>!p.includes('node_modules/')&&!p.startsWith('/')),'scripts/bootstrap-first-platform-admin.mjs','scripts/bootstrap-validation.mjs','scripts/test-platform-bootstrap.mjs','scripts/test-platform-administration-postgres.mjs','.github/workflows/bootstrap-first-platform-admin.yml','packages/database/migrations/20260928_auth_bootstrap_audit.sql','packages/database/migrations/20261011_platform_administration.sql','packages/database/migrations/20260928_auth_rate_limits.sql']);
          const source_bindings={};for(const p of sourcePaths)source_bindings[p]=createHash('sha256').update(await readFile(p)).digest('hex');
          const tap=await readFile('test-results/platform-bootstrap/existing.tap','utf8');assert.match(tap,/(?:#|ℹ) pass 8/);assert.match(tap,/(?:#|ℹ) fail 0/);
          await writeFile('test-results/platform-bootstrap/results.json',JSON.stringify({workflow_id:'auth.bootstrap-first-platform-admin',wholeTaskVerified:false,scope:'scoped',existingTests:8,nativeProbeCases:cases,source_bindings,cleanup:'Native disposable schemas dropped; no production business credentials or data used.',limitations:['No approved deployment operator identity/environment bound in live draft.','Credential UI login, permitted console reload, video and required review gates unproven.']},null,2));
          JS
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: platform-bootstrap-scoped-evidence
          path: test-results/platform-bootstrap/
          if-no-files-found: error
  record:
    needs: native
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: platform-bootstrap-scoped-evidence
          path: test-results/platform-bootstrap
      - run: pip install -r tools/governance-production/requirements.txt
      - env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          EVIDENCE_URL: ${{ needs.native.outputs.evidence_url }}
        run: |
          python - <<'PY'
          import sys,json,hashlib,pathlib,os
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt,export_progress
          root=pathlib.Path.cwd();flow='auth.bootstrap-first-platform-admin';path='test-results/platform-bootstrap/results.json';receipt=json.loads((root/path).read_text())
          if receipt['workflow_id']!=flow or receipt['wholeTaskVerified'] is not False or receipt['existingTests']!=8 or len(receipt['nativeProbeCases'])!=3 or any(r['status']!='passed' for r in receipt['nativeProbeCases']):raise ValueError('Successful scoped receipt required')
          result=dict(status='blocked',test_status='scoped_pass',scope='scoped',source_bindings=receipt['source_bindings'],evidence=[dict(path=path,sha256=hashlib.sha256((root/path).read_bytes()).hexdigest(),kind='database',url=os.environ['EVIDENCE_URL'])],blockers=['Pinned draft explicitly leaves protected deployment operator identity and approved execution environment unbound; acceptance evidence and required reviews are not complete.'],next_action='No new implementation defect found in scoped platform bootstrap checks. Bind governed operator identity/environment, then execute credential login, permitted console/API/database/reload, denied-role/session/offline cases, browser/video evidence and required reviews. Continue with the next unblocked workflow from live production. Main '+os.environ['GITHUB_SHA']+'; no active work branch or PR; all native synthetic schemas removed.')
          with ProductionWorkflowStore() as db:
              if db.execute('SELECT definition_sha256 FROM virtual_workflow_definitions WHERE flow_id=?',(flow,)).fetchone()[0]!='258f8083fc9f4c76574e9c967422fea259a6146d1e232c6c03e4f20cc58a3122':raise ValueError('Definition changed')
              output=record_attempt(db,flow,result,root);export_progress(db,root)
          print('PLATFORM_ATTEMPT_COMMITTED '+json.dumps(output))
          PY
