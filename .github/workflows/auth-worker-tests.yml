  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        identity: [uuid, text]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: disposable-ci-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/auth-dependencies"
          npm install --prefix "$RUNNER_TEMP/auth-dependencies" --ignore-scripts esbuild@0.27.2 pg@8.16.3 bcryptjs@3.0.2 typescript@5.9.3 @types/pg@8.15.5 @cloudflare/workers-types@4.20260403.1
          ln -s "$RUNNER_TEMP/auth-dependencies/node_modules" node_modules
      - name: Generate governed workspace catalog
        run: |
          python3 scripts/register-maintenance-governance.py
          python3 scripts/register-workspace-governance.py
      - name: Unit tests
        run: node scripts/verify-api-batches.mjs
      - name: Type check Workers
        run: node_modules/.bin/tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --types @cloudflare/workers-types cloudflare/workers/src/service.ts cloudflare/workers/src/gateway.ts
      - name: Real PostgreSQL session lifecycle
        env:
          AUTH_TEST_ID_TYPE: ${{ matrix.identity }}
          AUTH_TEST_DATABASE_URL: postgres://auth_test:disposable-ci-fixture@127.0.0.1:5432/auth_test
        run: |
          node scripts/test-auth-postgres.mjs
          node scripts/test-auth-cleanup-postgres.mjs
          node scripts/test-governance-postgres.mjs
          node scripts/test-contract-gap-postgres.mjs
          node scripts/test-governed-read-aliases-postgres.mjs
          node scripts/test-account-admin-postgres.mjs
          node scripts/test-self-sessions-postgres.mjs
          node scripts/test-client-self-postgres.mjs
          node scripts/test-provider-self-postgres.mjs
          node scripts/test-client-booking-lifecycle-postgres.mjs
          node scripts/test-client-records-postgres.mjs
          node scripts/test-booking-payment-reads-postgres.mjs
          node scripts/test-self-records-postgres.mjs
          node scripts/test-self-device-wellness-postgres.mjs
          node scripts/test-feedback-reputation-postgres.mjs
          node scripts/test-personal-metadata-postgres.mjs
          node scripts/test-thread-family-postgres.mjs
          node scripts/test-password-history-postgres.mjs
          node scripts/test-provider-metadata-postgres.mjs
          node scripts/test-provider-finance-metadata-postgres.mjs
          node scripts/test-provider-event-metadata-postgres.mjs
          node scripts/test-work-log-metadata-postgres.mjs
          node scripts/test-care-metadata-postgres.mjs
          node scripts/test-authorship-task-postgres.mjs
          node scripts/test-report-audit-postgres.mjs
          node scripts/test-review-telehealth-postgres.mjs
          node scripts/test-owned-status-summaries-postgres.mjs
          node scripts/test-operational-audit-postgres.mjs
