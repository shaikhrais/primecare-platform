name: Inspect live workflow catalogue and platform bootstrap
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-platform-catalogue.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix /tmp/govt-reader --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/govt-reader/node_modules node_modules
          pip install -r tools/governance-production/requirements.txt
      - env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import sys,json,sqlite3,pathlib,collections,datetime,base64,hashlib,os
          sys.path.insert(0,'tools/governance-production')
          from production_reader import connect
          def decode(v,fallback):
              if v is None:return fallback
              return json.loads(v) if isinstance(v,str) else v
          with connect() as db:
              db.row_factory=sqlite3.Row
              rows=[dict(r) for r in db.execute("SELECT flow_id,title,verification_status,test_status,blocker_json,outcome_text,definition_json,updated_at FROM virtual_workflow_definitions WHERE flow_kind='business_process' ORDER BY flow_id")]
              checkpoints={r['flow_id']:dict(r) for r in db.execute("SELECT c.* FROM virtual_workflow_checkpoints c JOIN virtual_workflow_definitions d ON d.flow_id=c.flow_id WHERE d.flow_kind='business_process'")}
              urls=collections.defaultdict(list)
              for r in db.execute("SELECT c.flow_id,e.kind,e.url FROM virtual_workflow_checkpoints c JOIN virtual_workflow_definitions d ON d.flow_id=c.flow_id JOIN virtual_workflow_evidence e ON e.attempt_id=c.attempt_id WHERE d.flow_kind='business_process'"):
                  if r['url'] and r['url'] not in urls[r['flow_id']]:urls[r['flow_id']].append(r['url'])
              kinds=[dict(r) for r in db.execute("SELECT flow_kind,COUNT(*) AS count FROM virtual_workflow_definitions GROUP BY flow_kind")]
              attempts=dict(db.execute("SELECT COUNT(*) AS record_count,MAX(attempt_id) AS latest_attempt_id FROM virtual_workflow_attempts").fetchone())
              guide_count=db.execute("SELECT COUNT(*) FROM virtual_role_flow_guides").fetchone()[0]
          catalogue=[]
          for r in rows:
              spec=decode(r['definition_json'],{});cp=checkpoints.get(r['flow_id'],{});action=cp.get('next_action','')
              if action.startswith('{'):
                  try:action=decode(action,{}).get('next_action',action)
                  except (ValueError,AttributeError):pass
              notes=[r['outcome_text']] if r['outcome_text'] else []
              blockers=decode(r['blocker_json'],[])
              if blockers:notes.append('Recorded blockers: '+' '.join(blockers))
              gaps=spec.get('gaps',[])
              if gaps:notes.append('Specification notes: '+' '.join(gaps))
              catalogue.append(dict(workflow_id=r['flow_id'],area=r['flow_id'].split('.')[0],title=r['title'],verification_status=r['verification_status'],test_status=r['test_status'],latest_attempt_id=cp.get('attempt_id'),notes='\n'.join(notes),next_action=action,evidence_urls=urls[r['flow_id']],source_paths=spec.get('source_paths',[]),updated_at=r['updated_at']))
          output=dict(exported_at_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),authority='Pinned production PostgreSQL govt_ tables',schema='governance_68b0b02dd1215f58630d2c1a',repository='shaikhrais/primecare-platform',source_commit=os.environ['GITHUB_SHA'],business_process_filter="flow_kind='business_process'",catalogue=catalogue,domain_counts=dict(collections.Counter(r['area'] for r in catalogue)),verification_counts=dict(collections.Counter(r['verification_status'] for r in catalogue)),definition_kinds=kinds,attempts=attempts,supporting_role_guide_count=guide_count)
          raw=json.dumps(output,ensure_ascii=False).encode()
          path=pathlib.Path('test-results/workflow-catalogue');path.mkdir(parents=True,exist_ok=True);(path/'catalogue-with-notes.json').write_bytes(raw)
          encoded=base64.b64encode(raw).decode()
          for i in range(0,len(encoded),6000):print('CATALOGUE_EXPORT_CHUNK '+str(i//6000)+' '+encoded[i:i+6000])
          print('CATALOGUE_EXPORT_SHA256 '+hashlib.sha256(raw).hexdigest())
          print('CATALOGUE_COUNTS '+json.dumps(dict(domains=output['domain_counts'],statuses=output['verification_counts'],attempts=attempts)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-business-workflow-catalogue
          path: test-results/workflow-catalogue/
          if-no-files-found: error
