name: Verify platform domain and governed screen packages
on:
  push:
    branches: [main]
    paths:
      - packages/primecare_platform_domain/**
      - packages/primecare_screen_intents/**
      - .github/workflows/verify-platform-domain.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        pkg: [primecare_platform_domain, primecare_screen_intents]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/${{ matrix.pkg }}
      - run: flutter analyze --no-fatal-infos lib test
        working-directory: packages/${{ matrix.pkg }}
      - run: flutter test
        working-directory: packages/${{ matrix.pkg }}
