name: Inspect existing EMS and mail secret capabilities
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect-ems-secret-capabilities.mjs'
      - 'scripts/test-ems-secret-capabilities.mjs'
      - '.github/workflows/ems-secret-capabilities.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Check read-only boundaries and secret redaction
        run: node --test scripts/test-ems-secret-capabilities.mjs
      - name: Check existing credentials and mail bindings without sending or reading mail
        run: node scripts/inspect-ems-secret-capabilities.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENDPOINT_ANALYTICS_READ_TOKEN: ${{ secrets.ENDPOINT_ANALYTICS_READ_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ems-existing-secret-capabilities
          path: test-results/endpoint-management/secret-capabilities.json
          retention-days: 14
