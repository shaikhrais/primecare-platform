name: Verify live HR department reference records
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-hr-departments.yml'
      - 'scripts/verify-live-hr-departments.mjs'
      - 'evidence/hr-department-plan.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/hr-readback-tools" --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s "$RUNNER_TEMP/hr-readback-tools/node_modules" node_modules
      - name: Independently read only the requested departments and their matching audit/receipts
        run: node scripts/verify-live-hr-departments.mjs
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-hr-department-readback
          path: test-results/live-hr-departments
          retention-days: 90
