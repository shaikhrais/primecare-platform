name: Shared charts and dashboard widget catalogue
on:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_ui/web/theme-control-base.ts'
      - 'packages/domain/src/dashboard_widgets.ts'
      - 'packages/shared/src/dashboard-widgets/**'
      - 'packages/primecare_ui/web/dashboard-widgets.ts'
      - 'packages/primecare_ui/catalogs/dashboard-widgets.registration.json'
      - 'packages/flutter_core/lib/dashboard_widgets*'
      - 'packages/flutter_core/lib/dashboard_widgets/**'
      - 'packages/flutter_core/test/dashboard_widgets/**'
      - 'packages/primecare_ui/lib/dashboard_widgets.dart'
      - 'scripts/*dashboard-widgets*.mjs'
      - 'packages/flutter_core/lib/component_catalogue/**'
      - 'packages/domain/src/preference_sync.ts'
      - '.github/workflows/dashboard-widgets.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: dashboard-widgets-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/catalogue-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 playwright@1.60.0
          ln -s /tmp/catalogue-tools/node_modules node_modules
          npx playwright install --with-deps chromium
          node scripts/test-dashboard-widgets-model.mjs
          node scripts/test-dashboard-widgets-browser.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable --resolveJsonModule packages/primecare_ui/web/dashboard-widgets.ts
      - run: |
          pip install -r tools/governance-production/requirements.txt
          python3 tools/governance-production/test-dashboard-widgets-registration.py
          python3 tools/governance-production/test-metadata-store.py
  native:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/flutter_core
      - run: flutter analyze --no-fatal-infos lib/dashboard_widgets lib/dashboard_widgets.dart test/dashboard_widgets
        working-directory: packages/flutter_core
      - run: flutter test test/dashboard_widgets --reporter expanded
        working-directory: packages/flutter_core
