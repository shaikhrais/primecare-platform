name: Deploy API - primecare-visit-api

on:
  push:
    branches: [main]
    paths:
      - 'services/visit_api/**'
      - 'packages/database_client/**'
      - '.github/workflows/deploy-api-visit.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-api.yml
    with:
      service_dir: services/visit_api
      service_name: primecare-visit-api
      image_name: visit-api
    secrets: inherit
