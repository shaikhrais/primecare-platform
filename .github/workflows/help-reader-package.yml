name: Native Help reader package tests
on:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_help_reader/**'
      - 'packages/primecare_theme/**'
      - 'packages/primecare_preferences/**'
      - 'packages/primecare_component_factory/**'
      - 'packages/primecare_ui_foundation/**'
      - 'packages/primecare_master/lib/help_reader.dart'
      - '.github/workflows/help-reader-package.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/primecare_help_reader
      - run: flutter analyze --no-fatal-infos lib test
        working-directory: packages/primecare_help_reader
      - run: flutter test test/help_reader --reporter expanded
        working-directory: packages/primecare_help_reader
