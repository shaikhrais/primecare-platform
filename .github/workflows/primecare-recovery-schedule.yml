name: PrimeCare recovery schedule evidence
on:
  push:
    branches: [main]
    paths:
      - 'docs/task-progress/recovery-schedule-20261112.json'
      - 'docs/task-progress/consolidated-execution-plan.md'
      - 'scripts/report-primecare-schedule.py'
      - 'scripts/tests/test_primecare_schedule.py'
      - '.github/workflows/primecare-recovery-schedule.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  schedule-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify estimate and lateness accounting
        run: python3 -m unittest discover -s scripts/tests -p test_primecare_schedule.py
      - name: Record current fixed-target schedule
        run: python3 scripts/report-primecare-schedule.py > recovery-schedule-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-schedule-${{ github.sha }}
          path: recovery-schedule-report.json
          retention-days: 14
