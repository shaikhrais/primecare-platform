name: Client invoice host metadata discovery
on:
  push:
    branches: [main]
    paths:
      - 'tools/governance-production/client-invoice-host-discovery.mjs'
      - '.github/workflows/client-invoice-host-discovery.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: client-invoice-host-metadata-discovery
  cancel-in-progress: false
jobs:
  production-read-only:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/preference-reader --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/preference-reader/node_modules node_modules
      - run: node tools/governance-production/client-invoice-host-discovery.mjs
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: client-invoice-host-production-discovery, path: test-results/client-invoice-host/discovery.json}
