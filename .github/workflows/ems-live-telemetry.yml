name: Verify real EMS traffic reporting
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-ems-live-telemetry.mjs'
      - 'scripts/test-ems-live-telemetry.mjs'
      - '.github/workflows/ems-live-telemetry.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Test exact report compatibility and secret redaction
        run: node --test scripts/test-ems-live-telemetry.mjs scripts/test-endpoint-analytics.mjs
      - name: Read completed live window through the production reader and dashboard parser
        run: node scripts/verify-ems-live-telemetry.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENDPOINT_ANALYTICS_READ_TOKEN: ${{ secrets.ENDPOINT_ANALYTICS_READ_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ems-live-telemetry
          path: test-results/endpoint-management/live-telemetry.json
          retention-days: 14
