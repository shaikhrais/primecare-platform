name: Verify shared account sessions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'websites/typescript/src/sessions-*.ts'
      - 'websites/typescript/src/account.ts'
      - 'websites/typescript/src/infrastructure/http/base-session-client.ts'
      - 'packages/shared/src/account-sessions.json'
      - 'tools/auth-verification/test-sessions.mjs'
      - '.github/workflows/verify-account-sessions.yml'
permissions:
  contents: read
jobs:
  contract-and-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --disable-warning=ExperimentalWarning tools/auth-verification/test-sessions.mjs
      - name: Compile shared account controls
        run: |
          npm install --prefix "$RUNNER_TEMP/session-check" --ignore-scripts esbuild@0.27.2 typescript@5.9.3
          "$RUNNER_TEMP/session-check/node_modules/.bin/esbuild" websites/typescript/src/account.ts --bundle --outfile="$RUNNER_TEMP/account.js"
          "$RUNNER_TEMP/session-check/node_modules/.bin/tsc" --noEmit --target ES2022 --module ESNext --moduleResolution bundler --resolveJsonModule --allowSyntheticDefaultImports --lib ES2022,DOM,DOM.Iterable websites/typescript/src/account.ts
