name: PrimeCare Automated Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'testingFramework1.0/**'
      - '.agents/governance/governance.db'
      - 'packages/primecare_ui/lib/**/*.dart'
      - 'scripts/reconcile_governance_screens.py'
      - 'scripts/test-reconcile-governance-screens.py'
      - 'cloudflare/workers/src/workspace-registry.json'
      - '.github/workflows/maven-test.yml'
      - '.github/workflows/production-deploy.yml'
      - 'services/api_gateway/**'
      - 'services/*_api/**'
      - '.github/workflows/cloudflare-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'testingFramework1.0/**'
      - '.agents/governance/governance.db'
      - 'packages/primecare_ui/lib/**/*.dart'
      - 'scripts/reconcile_governance_screens.py'
      - 'scripts/test-reconcile-governance-screens.py'
      - 'cloudflare/workers/src/workspace-registry.json'
      - '.github/workflows/maven-test.yml'
      - '.github/workflows/production-deploy.yml'
      - 'services/api_gateway/**'
      - 'services/*_api/**'
      - '.github/workflows/cloudflare-web.yml'

permissions:
  contents: read

concurrency:
  group: automated-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Governance and Complete POM Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout test sources only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            testingFramework1.0
            .agents/governance/governance.db
            packages/primecare_ui/lib
            scripts/reconcile_governance_screens.py
            scripts/test-reconcile-governance-screens.py
            cloudflare/workers/src/workspace-registry.json
          sparse-checkout-cone-mode: false

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: testingFramework1.0/pom.xml

      - name: Audit screen governance evidence
        run: |
          python scripts/test-reconcile-governance-screens.py
          python - <<'PYCODE'
          import os, sqlite3
          source = sqlite3.connect('file:.agents/governance/governance.db?mode=ro', uri=True)
          derived = sqlite3.connect(os.path.join(os.environ['RUNNER_TEMP'], 'screen-governance-derived.db'))
          source.backup(derived)
          derived.close()
          source.close()
          PYCODE
          python scripts/reconcile_governance_screens.py --db "$RUNNER_TEMP/screen-governance-derived.db" --write --report governance-screen-reconciliation.json
          python scripts/reconcile_governance_screens.py --db "$RUNNER_TEMP/screen-governance-derived.db" --check --report governance-screen-audit.json
          git diff --exit-code -- .agents/governance/governance.db

      - name: Validate all active-screen POM mappings
        working-directory: testingFramework1.0
        env:
          CI: 'true'
        run: |
          mvn --batch-mode --no-transfer-progress test \
            -Dtest=PageObjectCoverageTest \
            -Ddb.url="jdbc:sqlite:$RUNNER_TEMP/screen-governance-derived.db" \
            -Dsurefire.printSummary=true \
            -Dsurefire.useFile=true

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          {
            echo "# PrimeCare complete POM coverage"
            echo
            if compgen -G "testingFramework1.0/target-maven/surefire-reports/*.txt" > /dev/null; then
              grep -h "Tests run:" testingFramework1.0/target-maven/surefire-reports/*.txt || true
            else
              echo "No Surefire text report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapped-screen-verification-reports
          path: |
            testingFramework1.0/test-output/
            testingFramework1.0/target-maven/surefire-reports/
            testingFramework1.0/screenshots/
            governance-screen-audit.json
            governance-screen-reconciliation.json
          if-no-files-found: warn
          retention-days: 14
