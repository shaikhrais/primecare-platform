name: HTTP response compression
on:
  pull_request:
    paths:
      - 'cloudflare/workers/src/core/**'
      - 'docs/transport/**'
      - 'scripts/*response-compression*'
      - 'scripts/generate-cloudflare-worker-config.mjs'
      - '.github/workflows/response-compression.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/compression-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 miniflare@4.20260730.0
      - run: ln -s "$RUNNER_TEMP/compression-tools/node_modules" node_modules
      - run: node scripts/test-response-compression.mjs
      - run: node scripts/test-response-compression-runtime.mjs
