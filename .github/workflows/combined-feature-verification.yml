name: Verify pinned combined feature candidate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/combined-feature-verification.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primecare-pinned-combined-feature-verification
  cancel-in-progress: false

jobs:
  acceptance:
    name: Combined feature regression and browser acceptance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: 548c9f1b4d47bbe10d8c9bea1ae3a772a8803f6c
      EXPECTED_PARENT: 69b9c411258b473dd17bb944d93a612fcca708d0
      EXPECTED_TREE: 9c3ea4a9d42954e147b8aa777155cc5939695ef2
      GOVERNANCE_ALLOW_SQLITE_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert candidate, tree and exact reviewed parent
        run: |
          set -eu
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git cat-file commit HEAD | awk 'NF==0{exit} $1=="parent"{print $2}')" = "$EXPECTED_PARENT"
          printf 'Candidate tested: `%s`\n\nTree: `%s`\n\nReviewed parent: `%s`\n\nTrigger SHA: `%s`\n' \
            "$CANDIDATE_SHA" "$EXPECTED_TREE" "$EXPECTED_PARENT" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install isolated fixture test dependencies
        run: |
          npm install --prefix /tmp/combined-feature-tools --ignore-scripts --no-audit --no-fund \
            esbuild@0.27.2 typescript@5.9.3 playwright@1.60.0 pg@8.16.3 bcryptjs@3.0.2 \
            linkedom@0.18.12 jsdom@26.1.0 @electric-sql/pglite@0.3.14 ajv@8.17.1 ajv-formats@3.0.1 @twilio/voice-sdk@2.18.5
          ln -s /tmp/combined-feature-tools/node_modules node_modules
          pip install -r tools/governance-production/requirements.txt
      - name: Prepare only disposable governance fixtures
        run: |
          git fetch --no-tags --depth=1 origin 4e6195c51e639e362b2884e4de435578960f0983
          python3 tools/governance-production/prepare-ci-fixture.py
          python3 tools/workflow-verification/restore_checkpoint.py
      - name: Check feature CSV and governed source
        run: |
          python3 scripts/check-feature-inventory.py
          python3 -m unittest discover -s scripts/tests -p test_feature_inventory.py
          python3 -m unittest discover -s scripts/tests -p test_governance_workspace_mappings.py
          python3 scripts/test-workflow-theme-replay.py
          python3 scripts/test-workflow-contract-plan.py
          python3 -m unittest discover -s scripts/tests -p test_shared_ui_boundary.py
      - name: Run combined feature behavior regressions
        run: |
          node --test \
            scripts/test-auth-recovery-lifecycle.mjs \
            scripts/test-psw-scheduling.mjs \
            scripts/test-ledger-account-isolation.mjs \
            scripts/test-ledger-reversal-atomicity.mjs \
            scripts/test-operational-audit-api.mjs \
            scripts/test-admin-overview-audit-lifecycle.mjs \
            scripts/test-advanced-theme-center-lifecycle.mjs \
            scripts/test-shell-utilities-model.mjs \
            scripts/test-shell-utilities-view-lifecycle.mjs \
            scripts/test-shell-utilities-adapters.mjs \
            scripts/test-workspace-shell-environment.mjs \
            scripts/test-work-modules-transport.mjs \
            scripts/test-communication-modules-transport.mjs \
            scripts/test-work-modules-calendar.mjs \
            scripts/test-work-modules-lifecycle.mjs \
            scripts/test-endpoint-analytics.mjs \
            scripts/test-endpoint-capacity.mjs \
            scripts/test-help-reader-client-cancellation.mjs
      - name: Run disposable database and Chromium acceptance
        run: |
          node scripts/test-work-modules.mjs
          node scripts/test-dashboard-pages-integration.mjs
          node_modules/.bin/playwright install --with-deps chromium
          node scripts/test-shell-utilities-browser.mjs
          node scripts/test-work-modules-browser.mjs
