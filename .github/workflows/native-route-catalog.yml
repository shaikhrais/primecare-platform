name: Verify canonical route catalog and navigation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_route_catalog/**'
      - 'packages/primecare_navigation/lib/routes/**'
      - 'packages/primecare_navigation/test/safe_navigation_package_test.dart'
      - 'scripts/check_module_screen_registrations.py'
      - 'scripts/tests/test_module_screen_registration_check.py'
      - '.github/workflows/native-route-catalog.yml'
permissions: {contents: read}
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: dart-lang/setup-dart@v1
        with: {sdk: '3.11.3'}
      - run: dart pub get
        working-directory: packages/primecare_route_catalog
      - run: dart analyze
        working-directory: packages/primecare_route_catalog
      - run: dart test
        working-directory: packages/primecare_route_catalog
      - run: python3 scripts/tests/test_module_screen_registration_check.py
      - run: python3 scripts/check_module_screen_registrations.py
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/nav-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2
          ln -s /tmp/nav-tools/node_modules node_modules
          node scripts/workspace-navigation-fixtures.mjs
      - uses: actions/upload-artifact@v4
        with: {name: route-navigation-oracle, path: packages/primecare_navigation/test/navigation/fixtures/web.json}
  navigation:
    needs: catalog
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/primecare_navigation
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - uses: actions/download-artifact@v4
        with: {name: route-navigation-oracle, path: packages/primecare_navigation/test/navigation/fixtures}
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
