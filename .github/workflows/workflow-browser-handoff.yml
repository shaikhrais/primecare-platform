name: Save login and password browser recovery handoff
on:
  push:
    branches: [main]
    paths: [.github/workflows/workflow-browser-handoff.yml]
permissions:
  contents: read
  checks: read
  pull-requests: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Verify cleanup, CI, source freshness and save exact handoff
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,sys,json,urllib.request,subprocess,time,hashlib
          def api(path):
              return json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/shaikhrais/primecare-platform/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})))
          names=['credential-login-browser','save-login-browser-attempt','password-workflow-browser','save-password-browser-attempt','workflow-browser-handoff']
          paths={'.github/workflows/'+n+'.yml' for n in names}
          for poll in range(48):
              branches=api('branches?per_page=100');prs=api('pulls?state=open&per_page=100')
              if [b['name'] for b in branches]!=['main'] or prs:raise RuntimeError('Branch/PR state changed')
              main=branches[0]['commit']['sha'];subprocess.run(['git','fetch','origin','main'],check=True,stdout=subprocess.DEVNULL)
              files=set(subprocess.check_output(['git','ls-tree','-r','--name-only',main],text=True).splitlines())
              checks=api('commits/'+main+'/check-runs?per_page=100')['check_runs']
              failed=[c['name'] for c in checks if c['status']=='completed' and c['conclusion'] not in ['success','skipped']]
              if failed:raise RuntimeError('Final main validation failed: '+str(failed))
              if main!=os.environ['GITHUB_SHA'] and not paths.intersection(files) and {'contract-plan','generated-code','compression'}.issubset({c['name'] for c in checks}) and all(c['status']=='completed' and c['conclusion']=='success' for c in checks):break
              print('Waiting for final main cleanup and validation',flush=True);time.sleep(10)
          else:raise RuntimeError('Final main validation/cleanup pending')
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import summary
          cache={}
          with ProductionWorkflowStore() as db:
              handoffs={}
              for flow,expected in [('auth.credential-login',316),('auth.change-password',317)]:
                  row=db.execute('SELECT attempt_id,next_action FROM virtual_workflow_checkpoints WHERE flow_id=?',(flow,)).fetchone()
                  assert row and row[0]==expected
                  bindings=json.loads(db.execute('SELECT source_bindings_json FROM virtual_workflow_attempts WHERE attempt_id=?',(expected,)).fetchone()[0])
                  for path,sha in bindings.items():
                      if path not in cache:cache[path]=hashlib.sha256(subprocess.check_output(['git','show',main+':'+path])).hexdigest()
                      if cache[path]!=sha:raise RuntimeError('Attempt source became stale: '+flow+' '+path)
                  handoff=json.loads(row[1]);handoff.update(attempt_id=expected,main_sha=main,active_branch='main',work_branch=None,work_branch_sha=None,pr=None,remote_branches=['main'],open_prs=0,cleanup_required=[],merge_state='Operational verification published on main; no feature branch or PR created; temporary workflows removed',ci_state='Native browser attempts and production recording jobs passed; final main contract-plan/generated-code/compression passed',current_source_bindings_validated=True,role_instruction='Primary actor is Platform Admin, registered role code platform_admin; tenant_admin is a separate tenant-denial fixture. No production account roles were changed.',attempted_workflows={'auth.credential-login':{'attempt_id':316,'status':'implemented-unverified','test_status':'scoped_pass'},'auth.change-password':{'attempt_id':317,'status':'implemented-unverified','test_status':'scoped_pass'}},live_counts=summary(db),next_workflow='auth.inspect-own-sessions',next_action='Inspect auth.inspect-own-sessions live definition, source links, registered API/permissions and previous checkpoint; test real Platform Admin login, own-session UI, API/database comparison, reload and foreign-session denials. Preserve tenant_admin only for tenant-isolation fixtures. Login/password attempts 316/317 have current source-bound native browser videos; do not repeat passing cases unless source/spec/evidence becomes stale. Remaining full-role/deployment/accessibility/PWA/recording-delivery/review gates prevent verified status.')
                  payload=json.dumps(handoff,sort_keys=True)
                  db.execute("INSERT INTO virtual_workflow_checkpoints(flow_id,attempt_id,next_action) VALUES(?,?,?) ON CONFLICT(flow_id) DO UPDATE SET attempt_id=excluded.attempt_id,next_action=excluded.next_action,invalidation_json='[]',updated_at=CURRENT_TIMESTAMP",(flow,expected,payload))
                  handoffs[flow]=handoff
              current=handoffs['auth.change-password']
              current['test_status_counts']=list(db.execute("SELECT test_status,COUNT(*) FROM virtual_workflow_definitions WHERE flow_kind='business_process' GROUP BY test_status"))
              payload=json.dumps(current,sort_keys=True)
              db.execute("INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP",('recovery-handoff-current',payload))
          print('BROWSER_HANDOFF_COMMITTED '+payload)
          PY
