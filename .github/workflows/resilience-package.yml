name: Verify native resilience package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_resilience/**'
      - 'packages/primecare_runtime/lib/src/resilience/**'
      - 'packages/primecare_runtime/lib/config/resilience_config.dart'
      - '.github/workflows/resilience-package.yml'
permissions: {contents: read}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/primecare_resilience
      - run: flutter analyze --no-fatal-infos lib test
        working-directory: packages/primecare_resilience
      - run: flutter test --reporter expanded
        working-directory: packages/primecare_resilience
