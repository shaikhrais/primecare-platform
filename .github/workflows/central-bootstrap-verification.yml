name: Central bootstrap isolated verification
on:
  pull_request:
    paths: ['scripts/*central-bootstrap*', 'scripts/bootstrap-first-central-admin.mjs', 'scripts/bootstrap-validation.mjs', 'packages/database/migrations/20260928_auth_bootstrap_audit.sql', '.github/workflows/central-bootstrap-verification.yml']
  push:
    branches: [main]
    paths: ['scripts/*central-bootstrap*', 'scripts/bootstrap-first-central-admin.mjs', 'scripts/bootstrap-validation.mjs', 'packages/database/migrations/20260928_auth_bootstrap_audit.sql', '.github/workflows/central-bootstrap-verification.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bootstrap
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: bootstrap
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bootstrap" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/bootstrap-tools" --ignore-scripts --no-audit --no-fund pg@8.11.3 bcryptjs@3
          ln -s "$RUNNER_TEMP/bootstrap-tools/node_modules" node_modules
      - name: Check simulated contracts and actual native transactions
        env:
          CENTRAL_BOOTSTRAP_TEST_DATABASE_URL: postgresql://bootstrap:synthetic-only@localhost:5432/bootstrap
        run: node --test scripts/test-central-bootstrap.mjs scripts/test-central-bootstrap-postgres.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: central-bootstrap-native-receipt
          path: test-results/central-bootstrap/
          if-no-files-found: error
          retention-days: 90
