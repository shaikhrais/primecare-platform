name: Run accepted auth preference candidate
# Reconcile the verified secret-generated version before this code refresh.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-auth-preference-candidate.yml'
permissions: {contents: read, actions: write}
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const branch=(await github.rest.repos.getBranch({owner,repo,branch:'main'})).data;
            if(branch.commit.sha!==context.sha)throw Error('Main changed before candidate dispatch');
            await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id:'auth-preference-candidate.yml',ref:'main'});
