name: Prepare and verify native internal calling
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/internal-calls-production.yml'
      - 'cloudflare/workers/src/business-tasks/internal-call-*'
      - 'tools/governance-production/internal*call*'
      - 'tools/governance-production/native_call_contracts.py'
      - 'tools/governance-production/test-internal-call-*'
      - 'websites/typescript/src/internal-call*'
      - 'websites/typescript/src/infrastructure/webrtc/*'
      - 'scripts/*internal-call*'
      - 'packages/database/migrations/20261025_internal_call_extensions.sql'
      - 'packages/database/migrations/20261025_internal_call_permission_indexes.sql'
      - 'packages/database/migrations/20261025_internal_call_context.sql'
      - 'tools/internal-call-context-procedure.mjs'
      - 'cloudflare/workers/src/business-tasks/endpoint-policy.ts'
      - 'scripts/profile-calling-permissions.mjs'
      - 'packages/shared/src/communications/audio-session.mjs'
      - 'packages/shared/src/communications/audio-call.mjs'
      - 'packages/shared/src/communications/cloudflare-turn.mjs'
      - 'scripts/test-communication-turn.mjs'
      - 'cloudflare/workers/src/gateway.ts'
      - 'cloudflare/workers/src/business-tasks/access-policy.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primecare-internal-calls-production
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: communication_fixture, POSTGRES_PASSWORD: disposable-only, POSTGRES_DB: communication_registration_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U communication_fixture -d communication_registration_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKFLOW_TEST_DATABASE_URL: postgres://communication_fixture:disposable-only@localhost:5432/communication_registration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r tools/governance-production/requirements.txt jsonschema==4.25.1
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/call-schema" --ignore-scripts --no-audit --no-fund pg@8.16.3
          ln -s "$RUNNER_TEMP/call-schema/node_modules" node_modules
          node scripts/migrate-internal-call-schema.mjs --reference
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';const r=JSON.parse(fs.readFileSync('test-results/internal-calls/schema-reference.json'));assert.equal(r.version,1);assert.ok(r.shapes.communication_voice_extensions);assert.equal(r.sequence[0].seqmin,'1000');assert.equal(r.sequence[0].seqmax,'9999');"
      - uses: actions/upload-artifact@v4
        with: {name: internal-call-schema-reference, path: test-results/internal-calls/schema-reference.json, retention-days: 30}
      - run: |
          python tools/governance-production/test-sms-link-contracts-registration.py
          python tools/governance-production/test-voice-contact-access-registration.py
          python tools/governance-production/test-communication-ui-registration.py
          python tools/governance-production/test-internal-call-registration.py
          python tools/governance-production/test-internal-call-access.py
          python tools/governance-production/test-internal-call-ui.py
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: twilio_fixture, POSTGRES_PASSWORD: fixture_only, POSTGRES_DB: twilio_sms_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U twilio_fixture -d twilio_sms_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TWILIO_SMS_TEST_DATABASE_URL: postgres://twilio_fixture:fixture_only@localhost:5432/twilio_sms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/call-tests" --ignore-scripts --no-audit --no-fund pg@8.16.3 @types/pg@8.15.5 typescript@5.9.3 @types/node@24.0.0 esbuild@0.27.2 ajv@8.17.1 twilio@6.2.0 miniflare@4.20260730.0
          ln -s "$RUNNER_TEMP/call-tests/node_modules" node_modules
          node tools/internal-call-schema-validators.mjs
          node tools/internal-call-context-procedure.mjs
          node --test scripts/test-communication-internal-calls.mjs scripts/test-communication-turn.mjs scripts/test-communication-audio-session.mjs scripts/test-communication-access-policy.mjs scripts/test-internal-call-deployment-plan.mjs scripts/test-internal-call-batched-peer.mjs scripts/test-internal-call-database.mjs scripts/test-internal-call-endpoint-policy.mjs scripts/test-voice-contact-deployment-plan.mjs scripts/test-communication-gateway.mjs
          node scripts/test-internal-call-turn-workerd.mjs
          node scripts/test-internal-call-database-workerd.mjs
          call_test_status=0
          node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions --resolveJsonModule --lib ES2022,DOM,DOM.Iterable cloudflare/workers/src/business-tasks/internal-call-worker.ts websites/typescript/src/internal-calls.ts || call_test_status=1
          node scripts/test-internal-call-http-postgres.mjs || call_test_status=1
          node scripts/test-internal-call-policy-projection.mjs || call_test_status=1
          BUSINESS_TEST_DATABASE_URL="$TWILIO_SMS_TEST_DATABASE_URL" node --test scripts/test-communication-endpoint-policy.mjs || call_test_status=1
          node scripts/test-internal-call-permission-indexes.mjs || call_test_status=1
          node scripts/test-internal-call-context.mjs || call_test_status=1
          exit "$call_test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: internal-call-native, path: test-results/internal-calls, retention-days: 30}
  readiness:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/call-readiness" --ignore-scripts --no-audit --no-fund pg@8.16.3
          ln -s "$RUNNER_TEMP/call-readiness/node_modules" node_modules
      - env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/inspect-internal-call-readiness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: internal-call-readiness, path: test-results/internal-calls, retention-days: 30}

  account_catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: recovery_fixture, POSTGRES_PASSWORD: disposable-only, POSTGRES_DB: recovery_metadata_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U recovery_fixture -d recovery_metadata_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKFLOW_TEST_DATABASE_URL: postgres://recovery_fixture:disposable-only@localhost:5432/recovery_metadata_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install -r tools/governance-production/requirements.txt
          python tools/governance-production/test-account-sessions-registration.py
  deploy:
    needs: [metadata, native, account_catalog]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/call-deploy" --ignore-scripts --no-audit --no-fund pg@8.16.3 wrangler@4.68.1
          ln -s "$RUNNER_TEMP/call-deploy/node_modules" node_modules
          pip install -r tools/governance-production/requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: internal-call-schema-reference, path: test-results/internal-calls}
      - name: Register exact native contracts, existing-screen access and shared call controls
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_INTERNAL_CALL_CONTRACTS: '1'
          GOVERNANCE_INTERNAL_CALL_ACCESS: '1'
          GOVERNANCE_INTERNAL_CALL_UI: '1'
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          for writer in contracts access ui; do
            if ! python "tools/governance-production/internal_call_${writer}_registration.py" --verify; then
              python "tools/governance-production/internal_call_${writer}_registration.py" --dry-run
              python "tools/governance-production/internal_call_${writer}_registration.py" --apply
              python "tools/governance-production/internal_call_${writer}_registration.py" --verify
            fi
          done
          python - <<'PYCODE'
          import sys,json,pathlib
          sys.path.insert(0,'tools/governance-production')
          import internal_call_contracts_registration as contracts
          import internal_call_access_registration as access
          import internal_call_ui_registration as ui
          from production_reader import connect
          with connect() as reader:ui.base.readback(ui.ReadView(reader))
          receipt={'contract':contracts.verify(),'access':access.verify(),'ui':{'independentReadback':True,'writesAttempted':False,'definitionSha256':ui.expected_scope()['definitionSha256']}}
          pathlib.Path('test-results/internal-calls/registration.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('INTERNAL_CALL_REGISTRATION '+json.dumps(receipt))
          PYCODE
      - name: Add or independently verify exact private four-digit extension schema
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          INTERNAL_CALL_SCHEMA_APPLY: '1'
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          node scripts/migrate-internal-call-schema.mjs --dry-run
          node scripts/migrate-internal-call-schema.mjs --apply
          node scripts/migrate-internal-call-schema.mjs --verify
      - name: Add native permission lookup indexes and verify their actual query plan
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CALL_PERMISSION_INDEX_APPLY: '1'
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          node scripts/migrate-internal-call-permission-indexes.mjs --dry-run
          python scripts/prepare-internal-call-live-identity.py
          node scripts/profile-calling-permissions.mjs --before-index
          node scripts/migrate-internal-call-permission-indexes.mjs --apply
          node scripts/migrate-internal-call-permission-indexes.mjs --verify
          node scripts/profile-calling-permissions.mjs --after-index
      - name: Create and independently verify the owner-only call context procedure
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CALL_CONTEXT_APPLY: '1'
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          node tools/internal-call-context-procedure.mjs
          node scripts/migrate-internal-call-context.mjs --dry-run
          node scripts/migrate-internal-call-context.mjs --apply
          node scripts/migrate-internal-call-context.mjs --verify
      - name: Deploy native calling, owned TURN key and exact gateway routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: node scripts/deploy-internal-calls.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: internal-call-deployment, path: test-results/internal-calls, retention-days: 30}
  websites:
    needs: deploy
    uses: ./.github/workflows/deploy-typescript-websites.yml
    with: {confirm: DEPLOY}
    secrets: inherit

  live:
    needs: websites
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/call-live" --ignore-scripts --no-audit --no-fund pg@8.16.3 bcryptjs@2.4.3 playwright@1.56.1
          ln -s "$RUNNER_TEMP/call-live/node_modules" node_modules
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          pip install -r tools/governance-production/requirements.txt
      - name: Select current existing role without granting permissions
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python scripts/prepare-internal-call-live-identity.py
      - name: Verify real native login, relay audio, denial and cleanup with synthetic accounts
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CALL_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: node scripts/diagnose-browser-calling.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: internal-call-live-acceptance, path: test-results/internal-calls, retention-days: 30}
