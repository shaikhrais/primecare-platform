name: Smart Deploy one dashboard portal
on:
  push:
    branches: [main]
    paths: ['.github/workflows/smart-deploy-dashboard-portal.yml']
  workflow_dispatch:
    inputs:
      project:
        description: Exact Cloudflare Pages portal to publish
        type: choice
        required: true
        options:
          - select-a-portal
          - primecare-business-development
          - primecare-client
          - primecare-clinic
          - primecare-corporate
          - primecare-franchise
          - primecare-marketing
          - primecare-support
          - primecare-governance
      mode:
        description: Verify without publishing, or publish this dashboard portal
        type: choice
        options: [verify-only, publish]
        default: verify-only
      expected_main:
        description: Exact tested main commit
        required: true
        type: string
      previous_live:
        description: Exact currently verified commit of the selected portal
        required: true
        type: string
      verified_run_id:
        description: Successful verify-only GitHub run ID for this exact portal and main SHA (publish only)
        required: false
        type: string
      confirm:
        description: For publish only, type DEPLOY followed by the exact project name
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.mode == 'publish' && 'primecare-cloudflare-typescript-production' || format('primecare-dashboard-verify-{0}', github.run_id) }}
  cancel-in-progress: false
env:
  PROJECT: ${{ github.event_name == 'push' && 'primecare-clinic' || inputs.project }}
  API_GATEWAY_URL: https://primecare-api-gateway.itpro-mohammed.workers.dev
  EXPECTED_MAIN: ${{ github.event_name == 'push' && github.sha || inputs.expected_main }}
  PREVIOUS_LIVE: ${{ github.event_name == 'push' && 'c7f14f8f45ff32a0c78c61781bda3ab5ec6c838a' || inputs.previous_live }}
  CONFIRM: ${{ inputs.confirm }}
  VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
  RELEASE_MODE: ${{ github.event_name == 'push' && 'verify-only' || inputs.mode }}
jobs:
  scope:
    name: Approve exact dashboard activation and artifact source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_run: ${{ steps.scope.outputs.source_run }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Check approval and exact source
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ && "$PREVIOUS_LIVE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          case "$PROJECT" in
            primecare-business-development|primecare-client|primecare-clinic|primecare-corporate|primecare-franchise|primecare-marketing|primecare-support|primecare-governance) ;;
            *) echo 'Select an allowlisted dashboard portal' >&2; exit 1 ;;
          esac
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          parents=($(git rev-list --parents -n1 HEAD))
          test "${#parents[@]}" = 2
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "${parents[1]}" = 922b98fbce46fda3b2eb41f9882fa388b21e768b
            test "$RELEASE_MODE" = verify-only
          fi
          intent="$(python3 -c 'import json; print(json.load(open("tools/deployment/dashboard-release-intent.json"))["intent"])')"
          if [[ "$intent" == clinic-psw-safety-maintenance ]]; then
            python3 -m tools.deployment.psw_dashboard_release "${parents[1]}" "$GITHUB_SHA" "$PROJECT" "$PREVIOUS_LIVE"
            echo 'lane=smart-dashboard-runtime' >> "$GITHUB_OUTPUT"
          elif [[ "$intent" == clinic-dashboard-cohort ]]; then
            python3 -m tools.deployment.clinic_dashboard_release "${parents[1]}" "$GITHUB_SHA" "$PROJECT" "$PREVIOUS_LIVE"
            echo 'lane=smart-dashboard-runtime' >> "$GITHUB_OUTPUT"
          elif [[ "$intent" == client-dashboard-cohort ]]; then
            python3 -m tools.deployment.client_dashboard_release "${parents[1]}" "$GITHUB_SHA" "$PROJECT" "$PREVIOUS_LIVE"
            echo 'lane=smart-dashboard-runtime' >> "$GITHUB_OUTPUT"
          elif [[ "$intent" == corporate-dashboard-cohort ]]; then
            python3 -m tools.deployment.corporate_dashboard_release "${parents[1]}" "$GITHUB_SHA" "$PROJECT" "$PREVIOUS_LIVE" --observe
            echo 'lane=smart-dashboard-runtime' >> "$GITHUB_OUTPUT"
          elif [[ "${parents[1]}" == 9bedad737ce1e3cfe65494d9bb847f3140168ff2 ||
                "${parents[1]}" == 15bc12d7a7214bd585295e30ac163e89eeb02f9e ]]; then
            # One reviewed, release-tooling-only continuation. Never treat arbitrary
            # metadata commits as runtime activations in the automatic writer classifier.
            python3 - "$GITHUB_SHA" "$PROJECT" <<'PY_SCOPE'
          import json
          import os
          import subprocess
          import sys
          from tools.deployment.dashboard_release_intent import changed_paths, classify

          head, project = sys.argv[1:]
          approved = '47cbcfadac37f3ee4b7a7b82d66eaf43b71c96be'
          activation = '94a7c98a59f8d4aa4fec32734671c9a3df297a46'
          governance_support = '15bc12d7a7214bd585295e30ac163e89eeb02f9e'
          pinned_governance_workflow_blob = '49d0eafa2a027e914df5b692f43e9e85bc3ef986'
          mail = '9bedad737ce1e3cfe65494d9bb847f3140168ff2'
          workflow = '.github/workflows/smart-deploy-dashboard-portal.yml'
          pinned_mail_blobs = {
              '.github/workflows/primecare-qa-email.yml': 'a38d9cd3542ee76f368ed054aaf7fc09bf974287',
              'tools/deployment/qa_email_route.py': 'f2ed2eb7b39d52948ed56569f92b0d65f88178ad',
              'tools/deployment/test_qa_email_route.py': '0339cd8badc2f82709542cc47aecf76ffdb60200',
          }

          def git(*args):
              return subprocess.check_output(('git', *args), text=True).strip()

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def commit_entry(commit, path):
              return git('ls-tree', commit, '--', path)

          parents = git('rev-list', '--parents', '-n1', head).split()
          require(git('rev-list', '--parents', '-n1', mail).split() == [mail, approved]
                  and git('rev-list', '--parents', '-n1', approved).split() == [approved, activation],
                  'Unexpected continuation ancestry')
          if parents == [head, mail]:
              require(project in {'primecare-governance', 'primecare-support'},
                      'This exact continuation is limited to Governance and Support')
              parent = mail
          elif parents == [head, governance_support]:
              require(project in {'primecare-marketing', 'primecare-franchise'},
                      'This exact continuation is limited to Marketing and Franchise')
              require(git('rev-list', '--parents', '-n1', governance_support).split()
                      == [governance_support, mail], 'Unexpected Governance/Support ancestry')
              require(changed_paths(mail, governance_support) == {workflow}
                      and commit_entry(governance_support, workflow)
                      == f'100644 blob {pinned_governance_workflow_blob}\t{workflow}',
                      'Governance/Support continuation is not the reviewed workflow revision')
              parent = governance_support
          else:
              raise SystemExit('Unexpected continuation ancestry')
          require(changed_paths(parent, head) == {workflow},
                  'Continuation must change only its release workflow')
          require(changed_paths(approved, mail) == set(pinned_mail_blobs),
                  'Mail commit does not match the reviewed exact paths')
          for path, sha in pinned_mail_blobs.items():
              entry = f'100644 blob {sha}\t{path}'
              require(commit_entry(mail, path) == entry and commit_entry(head, path) == entry,
                      'Mail workflow or test blob differs from reviewed content')
          require(commit_entry(head, workflow).startswith('100644 blob '),
                  'Continuation workflow is not a regular file')
          runtime = frozenset(git('show', f'{approved}:tools/deployment/dashboard-runtime-paths.txt').splitlines())
          intent = json.loads(git('show', f'{approved}:tools/deployment/dashboard-release-intent.json'))
          require(classify(changed_paths(activation, approved), runtime, intent, activation)
                  == 'smart-dashboard-runtime', 'Original runtime activation is not approved')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('lane=smart-dashboard-runtime\n')
          print('Exact release-tooling continuation of the approved dashboard runtime')
          PY_SCOPE
          else
            python3 -m tools.deployment.dashboard_release_intent "${parents[1]}" "$GITHUB_SHA"
          fi
          grep -Fx 'lane=smart-dashboard-runtime' "$GITHUB_OUTPUT"
          test "$EXPECTED_MAIN" != "$PREVIOUS_LIVE"
          case "$RELEASE_MODE" in
            verify-only)
              test -z "$CONFIRM"
              test -z "$VERIFIED_RUN_ID"
              printf 'source_run=%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
              ;;
            publish)
              test "$CONFIRM" = "DEPLOY $PROJECT"
              [[ "$VERIFIED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              test "$VERIFIED_RUN_ID" != "$GITHUB_RUN_ID"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID" > "$RUNNER_TEMP/verify-run.json"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID/jobs" > "$RUNNER_TEMP/verify-jobs.json"
              python3 -m tools.deployment.dashboard_portal_contract --verify-run "$RUNNER_TEMP/verify-run.json" "$RUNNER_TEMP/verify-jobs.json" "$EXPECTED_MAIN"
              printf 'source_run=%s\n' "$VERIFIED_RUN_ID" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac
  build:
    if: (github.event_name == 'push' || inputs.mode == 'verify-only')
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r tools/governance-production/requirements.txt
      - run: python -m unittest tools.deployment.test_portal_artifact tools.deployment.test_typescript_release tools.deployment.test_dashboard_portal_contract
      - name: Verify strict browser compilation and dashboard navigation
        run: node --test scripts/test-typescript-strict-contracts.mjs scripts/test-typescript-screen-manager.mjs scripts/test-workspace-route-handoffs.mjs scripts/test-workspace-manager-boundaries.mjs scripts/test-platform-browser-fixture.mjs
      - name: Verify Corporate activation rows and rendered browser fixture
        if: inputs.project == 'primecare-corporate'
        run: |
          python -m unittest tools.deployment.test_corporate_dashboard_release
          node --test scripts/test-dashboard-activation.mjs
          npx playwright install --with-deps chromium
          node scripts/test-governed-master-navigation.mjs
      - name: Verify Client activations and rendered browser fixture
        if: inputs.project == 'primecare-client'
        run: |
          node --test scripts/test-dashboard-activation.mjs
          npx playwright install --with-deps chromium
          PRIMECARE_WORKSPACE_CLIENT_FIXTURE=1 node scripts/test-governed-master-navigation.mjs
      - name: Verify Clinic activations and rendered browser fixture
        if: github.event_name == 'push' || inputs.project == 'primecare-clinic'
        run: |
          node --test scripts/test-dashboard-activation.mjs
          npx playwright install --with-deps chromium
          PRIMECARE_WORKSPACE_CLINIC_FIXTURE=1 node scripts/test-governed-master-navigation.mjs
          node --test scripts/test-care-live-manager.mjs scripts/test-personal-care-manager.mjs
      - name: Confirm project runtime policy
        run: python -m tools.deployment.runtime_policy "$PROJECT" typescript --require
      - name: Build with the existing read-only metadata export
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: node scripts/build-typescript-websites.mjs
      - name: Retain deployed Clinic metadata for the dashboard-only build
        if: github.event_name == 'push' || inputs.project == 'primecare-clinic'
        run: |
          python - <<'PY_CLINIC'
          import json
          import os
          from pathlib import Path
          from tools.deployment.dashboard_portal_contract import retain_clinic_live_manifest
          from tools.deployment.typescript_release import make_stamp

          intent = json.loads(Path("tools/deployment/dashboard-release-intent.json").read_text())
          if intent.get("cohort") in {"clinic-02", "clinic-03", "clinic-04", "clinic-05"}:
              bundle = Path("websites/typescript/dist/primecare-clinic")
              retain_clinic_live_manifest(bundle, os.environ["PREVIOUS_LIVE"])
              stamp = make_stamp(bundle, "primecare-clinic", os.environ["GITHUB_SHA"])
              (bundle / "primecare-build.json").write_text(json.dumps(stamp) + "\n")
          PY_CLINIC
      - name: Seal tested output
        run: python -m tools.deployment.portal_artifact seal "websites/typescript/dist/$PROJECT" "$PROJECT" "$GITHUB_SHA" "$RUNNER_TEMP/portal-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-portal-bundle
          path: websites/typescript/dist/${{ env.PROJECT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-portal-receipt
          path: ${{ runner.temp }}/portal-receipt.json
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Check artifact and publish only if requested
    needs: [scope, build]
    if: always() && !cancelled() && needs.scope.result == 'success' && (((github.event_name == 'push' || inputs.mode == 'verify-only') && needs.build.result == 'success') || (inputs.mode == 'publish' && needs.build.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: ${{ inputs.mode == 'publish' && format('primecare-cloudflare-{0}', inputs.project) || format('primecare-dashboard-artifact-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-portal-bundle
          path: release/bundle
          github-token: ${{ github.token }}
          run-id: ${{ needs.scope.outputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-portal-receipt
          path: release/proof
          github-token: ${{ github.token }}
          run-id: ${{ needs.scope.outputs.source_run }}
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'publish'
        with:
          name: dashboard-publish-evidence
          path: release/accepted
          github-token: ${{ github.token }}
          run-id: ${{ needs.scope.outputs.source_run }}
      - name: Recheck prior live version and exact artifact
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.deployment.runtime_policy "$PROJECT" typescript --require
          python -m tools.deployment.portal_artifact check release/bundle "$PROJECT" "$GITHUB_SHA" release/proof/portal-receipt.json
          python -m tools.deployment.typescript_release live "$PROJECT" "$PREVIOUS_LIVE" --record release/proof/before.json
          if [ "$RELEASE_MODE" = publish ]; then
            cmp release/proof/portal-receipt.json release/accepted/portal-receipt.json
            cmp release/proof/before.json release/accepted/before.json
          fi
          python -m tools.deployment.dashboard_portal_contract release/bundle "$PROJECT" "$GITHUB_SHA" release/proof/before.json
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          test "$GITHUB_SHA" = "$EXPECTED_MAIN"
      - name: Recheck production preconditions and publish only the tested portal artifact
        if: inputs.mode == 'publish'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.68.1 --version
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          python -m tools.deployment.typescript_release live "$PROJECT" "$PREVIOUS_LIVE" --baseline release/proof/before.json
          npx --yes wrangler@4.68.1 pages deploy release/bundle --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA"
      - name: Record successful verification without publishing
        if: (github.event_name == 'push' || inputs.mode == 'verify-only')
        run: echo "Selected portal bundle verified. Use this run ID to promote these exact bytes. No deployment performed." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify live source and exact assets
        if: inputs.mode == 'publish'
        run: python -m tools.deployment.typescript_release verify-deploy release/bundle "$PROJECT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-publish-evidence
          path: release/proof
          if-no-files-found: error
          retention-days: 30
