name: Verify existing owned email inbox roundtrip
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Send one correlated synthetic email and remove only its inbox record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os,json,pathlib,urllib.request,urllib.error,urllib.parse,time,uuid,hashlib
          token=os.environ.get('CLOUDFLARE_API_TOKEN');account=os.environ.get('CLOUDFLARE_ACCOUNT_ID');assert token and account
          domain='15minutes-email.com';recipient='auth-test@'+domain;sender='noreply@'+domain;nonce=str(uuid.uuid4())
          report={'domain':domain,'recipient':recipient,'sender':sender,'synthetic':True,'read_other_inboxes':False,'application_accounts_changed':False,'password_resets_requested':False,'send_attempted':False,'accepted':False,'received':False,'cleanup':'No message sent','whole_workflow_verified':False}
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          def call(path,method='GET',body=None):
              req=urllib.request.Request(base+path,method=method,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},data=None if body is None else json.dumps(body).encode())
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:return response.status,response.read(),dict(response.headers)
              except urllib.error.HTTPError as error:return error.code,error.read(),{}
          def read_json(path):
              status,data,_=call(path);assert status==200,'Cloudflare read unavailable: '+str(status)
              result=json.loads(data);assert result.get('success');return result['result']
          settings=read_json('/workers/scripts/primecare-email-inbox/settings');bindings=settings.get('bindings',[])
          kv=next(b for b in bindings if b.get('name')=='INBOX' and b.get('type')=='kv_namespace');namespace=kv['namespace_id']
          addresses=next(b.get('text','') for b in bindings if b.get('name')=='INBOX_ADDRESSES' and b.get('type')=='plain_text')
          assert recipient in [v.strip().lower() for v in addresses.split(',')],'Owned synthetic recipient not configured'
          status,source,_=call('/workers/scripts/primecare-email-inbox/content/v2');assert status==200
          source=source.decode('utf8','replace');compact=''.join(source.split())
          assert 'inbox/${recipient}/${receivedAt}/${crypto.randomUUID()}' in source,'Append-only inbox key schema changed'
          assert '.forward(' not in compact and '.reply(' not in compact and 'fetch(' not in compact,'Receiving Worker needs a new side-effect review'
          api='/storage/kv/namespaces/'+namespace;prefix='inbox/'+recipient+'/'
          def keys():
              found=set();cursor=None
              for _ in range(10):
                  query={'prefix':prefix,'limit':1000}
                  if cursor:query['cursor']=cursor
                  status,data,_=call(api+'/keys?'+urllib.parse.urlencode(query));assert status==200,'Inbox key read unavailable: '+str(status)
                  result=json.loads(data);assert result.get('success')
                  found.update(row['name'] for row in result['result'])
                  cursor=(result.get('result_info') or {}).get('cursor')
                  if not cursor:return found
              raise RuntimeError('Owned test inbox metadata exceeds bounded pagination')
          def value_path(key):return api+'/values/'+urllib.parse.quote(key,safe='')
          owned_key=None;owned_hash=None
          try:
              baseline=keys();probe=prefix+'__synthetic_probe_'+nonce
              status,_,_=call(value_path(probe));assert status==404,'Expected absent owned probe key'
              status,data,_=call(value_path(probe),'DELETE');assert status in [200,204],'Owned fixture cleanup permission unavailable'
              auth=read_json('/workers/scripts/primecare-auth-api/settings');auth_bindings=auth.get('bindings',[])
              assert any(b.get('name')=='EMAIL' and b.get('type')=='send_email' for b in auth_bindings)
              assert next(b.get('text') for b in auth_bindings if b.get('name')=='EMAIL_FROM')==sender
              body={'from':sender,'to':recipient,'subject':'PrimeCare synthetic delivery check '+nonce,'text':'Authorized isolated email delivery test. Correlation '+nonce+'. No account or password action is requested.'}
              report['send_attempted']=True
              status,data,_=call('/email/sending/send','POST',body);result=json.loads(data)
              report['send_http_status']=status
              report['provider_success']=result.get('success',False)
              report['provider_error_codes']=[e.get('code') for e in result.get('errors',[])]
              assert status in [200,201,202] and result.get('success'),'Provider did not accept the synthetic email'
              delivery=result.get('result') or {}
              assert recipient not in delivery.get('permanent_bounces',[])
              assert recipient in delivery.get('delivered',[])+delivery.get('queued',[]),'Provider acknowledgement did not name the owned recipient'
              report['accepted']=True;report['provider_delivered_immediately']=recipient in delivery.get('delivered',[]);report['cleanup']='Awaiting unique correlated inbox key'
              for _ in range(24):
                  for key in sorted(keys()-baseline):
                      status,data,_=call(value_path(key))
                      if status==404:continue
                      assert status==200
                      if nonce.encode() not in data:continue
                      owned_key=key;owned_hash=hashlib.sha256(data).hexdigest();report['received']=True;report['received_record_sha256']=owned_hash;report['matched_correlation']=True;break
                  if owned_key:break
                  time.sleep(5)
              assert owned_key,'Owned receiving Worker did not record the correlated email within 120 seconds'
              report['roundtrip_passed']=True
          except Exception as error:
              report['error']=str(error);raise
          finally:
              if owned_key:
                  status,data,_=call(value_path(owned_key))
                  assert status==200 and hashlib.sha256(data).hexdigest()==owned_hash and nonce.encode() in data,'Correlated fixture changed; preserve instead of deleting'
                  status,_,_=call(value_path(owned_key),'DELETE');assert status in [200,204],'Owned test-message cleanup failed'
                  report['cleanup']='Only the exact nonce/hash-matched synthetic message removed; pre-existing inbox entries preserved'
              path=pathlib.Path('test-results/mail-roundtrip');path.mkdir(parents=True,exist_ok=True);(path/'results.json').write_text(json.dumps(report,indent=2))
              print('OWNED_EMAIL_ROUNDTRIP '+json.dumps(report))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-email-roundtrip-evidence
          path: test-results
