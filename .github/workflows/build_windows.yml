name: Build Windows Distributions

on:
  workflow_call:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/**'
      - 'packages/**/lib/**'
      - 'packages/**/assets/**'
      - 'packages/**/pubspec*'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'melos.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/build_windows.yml'
  workflow_dispatch:

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    # local_auth_windows still depends on the pre-VS-2026 coroutine toolchain.
    # Pin the compatible runner until the plugin migrates to C++20 coroutines.
    runs-on: windows-2022
    
    timeout-minutes: 45
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        app: 
          - primecare_business_development
          - primecare_client
          - primecare_clinic
          - primecare_corporate
          - primecare_franchise
          - primecare_marketing
          - primecare_support
          - primecare_governance
          - primecare_enterprise_blueprint

    steps:
      - name: Enable Git long paths
        shell: powershell
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: |
          cd apps/${{ matrix.app }}
          flutter pub get
          flutter build windows --release --dart-define=API_BASE_URL=https://primecare-api-gateway.itpro-mohammed.workers.dev

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/windows/x64/runner/Release/
