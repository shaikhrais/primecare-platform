name: Materialize verified runtime rename source
on:
  push:
    branches: ['build/primecare-runtime-rename-1126']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact reviewed tree on isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/build/primecare-runtime-rename-1126
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp tools/runtime-rename-build/recreate.py "$RUNNER_TEMP/recreate.py"
          git checkout --detach a3052ff0350f6ef75a6b338dc66e320e34fc83c9
          python -m pip install PyYAML==6.0.3
          python "$RUNNER_TEMP/recreate.py"
          test "$(git write-tree)" = cb9ad8d901c58b289b64d1eaddf929f6053eec5d
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit-tree cb9ad8d901c58b289b64d1eaddf929f6053eec5d -p "$GITHUB_SHA" -m "Materialize exact verified PrimeCare runtime rename source" > "$RUNNER_TEMP/commit.txt"
          candidate="$(cat "$RUNNER_TEMP/commit.txt")"
          test "$(git rev-parse "$candidate^{tree}")" = cb9ad8d901c58b289b64d1eaddf929f6053eec5d
          test "$(git ls-remote origin refs/heads/build/primecare-runtime-rename-1126 | cut -f1)" = "$GITHUB_SHA"
          git push origin "$candidate:refs/heads/build/primecare-runtime-rename-1126"
          test "$(git ls-remote origin refs/heads/build/primecare-runtime-rename-1126 | cut -f1)" = "$candidate"
          echo "Verified source commit: $candidate"
