name: Create PrimeCare saved Vapi agent library
on:
  push:
    branches: [main]
    paths: ['packages/shared/src/vapi-agent-*.json', 'packages/shared/src/communications/vapi-agent-library.mjs', 'scripts/*vapi-agent*.mjs', 'scripts/build-vapi-agent-scripts.py', 'packages/shared/src/communications/vapi-growth-tools.mjs', 'packages/shared/src/communications/vapi-growth-tool-schemas.mjs', 'packages/shared/src/communications/vapi-agent-tool-pack.mjs', 'scripts/test-vapi-growth-tools.mjs', 'scripts/test-vapi-agent-tool-pack.mjs', 'packages/shared/src/communications/vapi-client-tools.mjs', 'packages/shared/src/communications/vapi-business-tool-runner.mjs', 'packages/shared/src/communications/vapi-business-function.mjs', 'packages/shared/src/communications/vapi-public-knowledge.mjs', 'packages/shared/src/communications/vapi-request-tool-library.mjs', 'packages/shared/src/vapi-agent-public-knowledge.txt', 'scripts/test-vapi-client-tools.mjs', 'scripts/test-vapi-business-function.mjs', 'scripts/test-vapi-public-knowledge.mjs', 'scripts/test-vapi-request-tool-library.mjs', '.github/workflows/vapi-agent-library.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: primecare-vapi-agent-library, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify generated role scripts are reproducible
        run: python scripts/build-vapi-agent-scripts.py && git diff --exit-code -- packages/shared/src/vapi-agent-templates.json
      - run: node --test scripts/test-vapi-agent-library.mjs scripts/test-vapi-admin.mjs scripts/test-vapi-growth-tools.mjs scripts/test-vapi-agent-tool-pack.mjs scripts/test-vapi-client-tools.mjs scripts/test-vapi-business-function.mjs scripts/test-vapi-public-knowledge.mjs scripts/test-vapi-request-tool-library.mjs
  create:
    if: ${{ !contains(github.event.head_commit.message, 'VAPI_CLIENT_INFORMATION_RELEASE') }}
    needs: verify
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/vapi-agent-audit" --ignore-scripts --no-audit --no-fund pg@8.16.3
          ln -s "$RUNNER_TEMP/vapi-agent-audit/node_modules" node_modules
      - name: Read production API registrations without enabling unverified bindings
        run: node scripts/audit-vapi-agent-api-bindings.mjs
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - name: Update pinned saved agents and verify scripts and native tools
        run: node scripts/create-vapi-agent-library.mjs
        env:
          VAPI_PRIVATE_API_KEY: ${{ secrets.VAPI_PRIVATE_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: vapi-agent-library, path: test-results/vapi/, retention-days: 30}
