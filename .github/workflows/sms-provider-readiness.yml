name: Read SMS provider configuration
on:
  push:
    branches: [main]
    paths: ['scripts/sms-provider-readiness.mjs', 'scripts/test-sms-provider-readiness.mjs', '.github/workflows/sms-provider-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test scripts/test-sms-provider-readiness.mjs
      - name: Read owned number SMS capability without traffic or routing changes
        run: node scripts/sms-provider-readiness.mjs
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sms-provider-readiness
          path: test-results/sms/readiness.json
