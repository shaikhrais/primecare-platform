name: Verify PSW action safety without deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/psw-action-safety-preflight.yml'
      - 'packages/primecare_ui/lib/src/screens/psw/psw_dashboard/**'
      - 'packages/primecare_ui/test/psw_dashboard_unconnected_actions_test.dart'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  psw-widget:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm exact source under test
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Test unconnected actions without production access
        working-directory: packages/primecare_ui
        run: flutter test test/psw_dashboard_unconnected_actions_test.dart
      - name: Compile the Clinic Flutter app from checked-out source
        working-directory: apps/primecare_clinic
        run: flutter build web --release --no-tree-shake-icons
      - name: Confirm the compiled Clinic bundle exists
        run: test -s apps/primecare_clinic/build/web/main.dart.js
