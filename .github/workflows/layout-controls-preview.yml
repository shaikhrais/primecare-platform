name: Preview inherited page and shell controls
on:
  push:
    branches: [main]
    paths: ['.github/workflows/layout-controls-preview.yml', '.github/fixtures/layout-controls/**']
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: cp .github/fixtures/layout-controls/*.ts packages/primecare_ui/web/
      - run: |
          npm install --prefix /tmp/control-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 playwright@1.60.0 @types/node@22.20.5 pg@8.16.3 bcryptjs@3.0.3 @electric-sql/pglite@0.3.14
          ln -s /tmp/control-tools/node_modules node_modules
          npx playwright install --with-deps chromium
      - run: |
          node --test scripts/test-theme-control-base.mjs
          node scripts/test-page-template-model.mjs
          node scripts/test-page-template-browser.mjs
          node scripts/test-shell-utilities-model.mjs
          node scripts/test-shell-utilities-browser.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable --resolveJsonModule packages/primecare_ui/web/page-template.ts packages/primecare_ui/web/shell-utilities.ts
