name: Shift-Left CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  factory-pipeline:
    name: Component Validation Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client (Worker API)
        run: npx prisma generate
        working-directory: apps/worker-api
        continue-on-error: true

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Architectural Governance Gate
        run: npm run check-architecture
        working-directory: packages/database

      - name: Platform Governance Audit Gate
        run: flutter test test/governance_audit_test.dart
        working-directory: packages/factory_system/primecare_ui

      - name: Run Global Pipeline (Test/Lint/Typecheck)
        run: npx turbo run typecheck lint test --concurrency=4

  security-architecture-sweep:
    name: Shift-Left Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Package Vulnerability Audit (NPM)
        run: npm audit --audit-level=high

      - name: Threat Matrix Vulnerability Audit (Dart SDKs)
        run: |
          for dir in apps/* packages/*; do
            if [ -f "$dir/pubspec.yaml" ]; then
              echo "Scanning $dir for security vulnerabilities..."
              cd "$dir"
              flutter pub get
              # Only fail if a serious vulnerability is found. The pub tool handles exit codes.
              flutter pub outdated --mode=security
              cd - > /dev/null
            fi
          done
