name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Type Checking (parallel per workspace)
  # ──────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [web-admin, worker-api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        if: matrix.workspace == 'worker-api'
        run: npx prisma generate
        working-directory: apps/worker-api

      - name: Typecheck ${{ matrix.workspace }}
        run: npm run typecheck
        working-directory: apps/${{ matrix.workspace }}

  # ──────────────────────────────────────────────
  # Stage 1b: Lint (parallel with typecheck)
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [web-admin, worker-api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        if: matrix.workspace == 'worker-api'
        run: npx prisma generate
        working-directory: apps/worker-api

      - name: Lint ${{ matrix.workspace }}
        run: npm run lint
        working-directory: apps/${{ matrix.workspace }}

  # ──────────────────────────────────────────────
  # Stage 2: Tests with coverage (parallel per workspace)
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [web-admin, worker-api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        if: matrix.workspace == 'worker-api'
        run: npx prisma generate
        working-directory: apps/worker-api

      - name: Run tests with coverage — ${{ matrix.workspace }}
        run: npx vitest run --coverage --reporter=default --reporter=json --outputFile=test-results.json
        working-directory: apps/${{ matrix.workspace }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.workspace }}
          path: apps/${{ matrix.workspace }}/test-results.json
          retention-days: 14

  # ──────────────────────────────────────────────
  # Stage 3: Production Build (Flutter V4)
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/primecare_v4

      - name: Build primecare_v4
        run: flutter build web --release
        working-directory: apps/primecare_v4

      - name: Check bundle sizes
        run: |
          echo "=== Bundle Size Report ==="
          du -sh build/web/* | sort -rh | head -20
          echo ""
          echo "=== Total bundle size ==="
          du -sh build/web/
        working-directory: apps/primecare_v4

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: primecare-v4-dist
          path: apps/primecare_v4/build/web
          retention-days: 7

  # ──────────────────────────────────────────────
  # Stage 3b: Lighthouse CI (performance budgets)
  # ──────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-admin-dist
          path: apps/web-admin/dist

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: lighthouserc.json

  # ──────────────────────────────────────────────
  # Stage 4: Deploy (main branch only)
  # ──────────────────────────────────────────────
  deploy-pages:
    name: Deploy Flutter Web 
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: primecare-v4-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=primecare-admin

  deploy-worker:
    name: Deploy Worker API
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/worker-api

      - name: Deploy Worker API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: apps/worker-api
