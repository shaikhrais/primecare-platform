name: PrimeCare Unified Dart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-platform:
    name: Platform Validation (Analyze & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'
          cache: true

      - name: Resolve and analyze Dart packages
        run: |
          set -euo pipefail
          for dir in services/* packages/*; do
            if [ -f "$dir/pubspec.yaml" ]; then
              echo "::group::Analyzing $dir"
              (
                cd "$dir"
                if grep -q "sdk: flutter" pubspec.yaml; then
                  flutter pub get
                  flutter analyze --no-fatal-warnings --no-fatal-infos
                else
                  dart pub get
                  dart analyze --no-fatal-warnings
                fi
              )
              echo "::endgroup::"
            fi
          done

      - name: Run Backend Service Tests
        run: |
          for dir in services/*; do
            if [ -f "$dir/pubspec.yaml" ]; then
              echo "Testing service: $dir"
              (
                cd "$dir"
                dart pub get
                if [ -d test ]; then dart test; fi
              )
            fi
          done

      - name: Run Frontend App Tests
        run: |
          for dir in apps/*; do
            if [ -f "$dir/pubspec.yaml" ]; then
              echo "Testing app: $dir"
              (
                cd "$dir"
                flutter pub get
                if [ -d test ]; then flutter test; fi
              )
            fi
          done

  security-sweep:
    name: Security & Compliance Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Dependency Vulnerability Audit
        run: |
          for dir in services/* apps/*; do
            if [ -f "$dir/pubspec.yaml" ]; then
              echo "Scanning $dir for security vulnerabilities..."
              (
                cd "$dir"
                flutter pub get
                # Pub reports known advisories during dependency resolution.
                # The former --mode=security option was removed from Dart.
                dart pub outdated
              )
            fi
          done
