name: PrimeCare Unified Dart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-platform:
    name: Platform Validation (Analyze & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'
          cache: true

      - name: Verify Platform Architecture
        run: dart analyze . --fatal-warnings

      - name: Run Backend Service Tests
        run: |
          for dir in services/*; do
            if [ -f "$dir/pubspec.yaml" ]; then
              echo "Testing service: $dir"
              cd "$dir"
              dart pub get
              dart test
              cd - > /dev/null
            fi
          done

      - name: Run Frontend App Tests
        run: |
          for dir in apps/*; do
            if [ -f "$dir/pubspec.yaml" ]; then
              echo "Testing app: $dir"
              cd "$dir"
              flutter pub get
              flutter test
              cd - > /dev/null
            fi
          done

  security-sweep:
    name: Security & Compliance Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Dependency Vulnerability Audit
        run: |
          for dir in services/* apps/*; do
            if [ -f "$dir/pubspec.yaml" ]; then
              echo "Scanning $dir for security vulnerabilities..."
              cd "$dir"
              flutter pub get
              flutter pub outdated --mode=security
              cd - > /dev/null
            fi
          done
