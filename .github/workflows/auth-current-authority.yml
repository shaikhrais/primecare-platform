name: Read current auth production authority
on:
  push:
    branches: [main]
    paths: [.github/workflows/auth-current-authority.yml]
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python -u - <<'PY'
          import sys,json,pathlib,os
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import summary
          def rows(db,sql,args=()):
           c=db.execute(sql,args);names=[v['name'] for v in db.tables[sql.split(' FROM ')[1].split()[0]]['columns']];return [dict(zip(names,r)) for r in c.fetchall()]
          with ProductionWorkflowStore() as db:
           flows=rows(db,"SELECT * FROM virtual_workflow_definitions WHERE flow_kind='business_process' AND flow_id LIKE ?",('auth.%',))
           ids=[r['flow_id'] for r in flows]
           sources=rows(db,"SELECT * FROM virtual_workflow_source_links WHERE flow_id LIKE ?",('auth.%',))
           steps=rows(db,"SELECT * FROM virtual_workflow_steps WHERE flow_id LIKE ?",('auth.%',))
           guides=rows(db,"SELECT * FROM virtual_role_flow_guides")
           snapshots=rows(db,"SELECT * FROM virtual_flow_catalog_snapshots WHERE name IN ('auth-completion-current','execution-handoff-current')")
           apis=rows(db,"SELECT * FROM api_endpoints WHERE id IN (1,2,5,395,779,16402,16493,16494,16495)")
           screen=rows(db,"SELECT * FROM role_screen_permissions WHERE screen_id=1264")
           theme=dict(db.execute('SELECT css_variable_name,token_value FROM theme_design_tokens WHERE theme_id=1 AND active=1'))
           reviews=rows(db,'SELECT * FROM manual_review_checks')
           state={'main_sha':os.environ['SOURCE_SHA'],'local_cleanup':'confirmed main-only at deffda07078489926a7821e48bc42a86bc443f36; merged local branch deleted; no tracked changes','active_branch':None,'pr':217,'pr_state':'merged/closed','remote_cleanup':'complete','summary':summary(db),'auth_statuses':[{k:r[k] for k in ['flow_id','verification_status','test_status','blocker_json']} for r in flows],'full_auth_verified':False,'evidence':'https://github.com/shaikhrais/primecare-platform/actions/runs/39423663930/artifacts/12263869961','synthetic_cleanup':'complete: previous isolated schemas dropped','next_action':'Repair and prove supported auth email configuration save/test response contract, then address other unblocked auth acceptance cases; full reviews remain required.'}
           for name in ['auth-authority-audit-current']:
            db.execute('INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP',(name,json.dumps(state)))
           report={'flows':flows,'sources':sources,'steps':steps,'guides':guides,'snapshots':snapshots,'apis':apis,'maintenance_permissions':screen,'theme':theme,'reviews':reviews,'summary':state['summary']}
           pathlib.Path('test-results').mkdir(exist_ok=True);pathlib.Path('test-results/auth-live-authority.json').write_text(json.dumps(report,indent=2,default=str))
           print('AUTH_UI_SCHEMA '+json.dumps({name:[c['name'] for c in meta['columns']] for name,meta in db.tables.items() if name in ['auth_route_registry','screen_sections','screen_functions','screen_required_elements','screen_components','screen_api_links','auth_ui_policy','auth_account_creation_policy','auth_account_management_policy']}))
           print('AUTH_ACCOUNT_UI_AUTHORITY '+json.dumps({'routes':rows(db,'SELECT * FROM auth_route_registry'),'screens':rows(db,"SELECT * FROM screens WHERE route_path IN ('/account','/login','/user/sessions')"),'apis':rows(db,"SELECT * FROM api_endpoints WHERE route_path IN ('/v1/user/sessions','/v1/user/change-password')"),'api_permissions':rows(db,"SELECT * FROM api_permissions WHERE api_id IN (16425,16426,277)")},default=str))
           print('AUTH_AUTHORITY_SUMMARY '+json.dumps({'summary':state['summary'],'auth':[{'id':r['flow_id'],'status':r['verification_status'],'test_status':r['test_status'],'blockers':r['blocker_json']} for r in flows],'reviews':len(reviews)}))
           print('MAINTENANCE_AUTHORITY '+json.dumps({'flows':[r for r in flows if r['flow_id'] in ['auth.inspect-email-config','auth.save-email-config','auth.test-maintenance-email']],'apis':[r for r in apis if r['id'] in [16493,16494,16495]],'permissions':screen},default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: auth-current-production-authority
          path: test-results/auth-live-authority.json
