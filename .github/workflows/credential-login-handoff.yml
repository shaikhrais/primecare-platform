name: Save credential login recovery handoff
on:
  push:
    branches: [main]
    paths: [.github/workflows/credential-login-handoff.yml]
permissions:
  contents: read
  checks: read
  pull-requests: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Verify final main and save exact production checkpoint
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,sys,json,urllib.request,subprocess,time
          def api(path):
              return json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/shaikhrais/primecare-platform/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})))
          paths=['.github/workflows/'+name+'.yml' for name in ['inspect-credential-login','credential-login-attempt','save-credential-login-attempt','credential-login-handoff']]
          for poll in range(48):
              branches=api('branches?per_page=100');prs=api('pulls?state=open&per_page=100')
              if [b['name'] for b in branches]!=['main'] or prs:raise RuntimeError('Branch/PR state changed; inspect')
              main=branches[0]['commit']['sha']
              subprocess.run(['git','fetch','origin','main'],check=True,stdout=subprocess.DEVNULL)
              files=subprocess.check_output(['git','ls-tree','-r','--name-only',main],text=True).splitlines()
              checks=api('commits/'+main+'/check-runs?per_page=100')['check_runs']
              failed=[c['name'] for c in checks if c['status']=='completed' and c['conclusion'] not in ['success','skipped']]
              if failed:raise RuntimeError('Final main validation failed: '+str(failed))
              if main!=os.environ['GITHUB_SHA'] and not set(paths).intersection(files) and {'contract-plan','generated-code','compression'}.issubset({c['name'] for c in checks}) and all(c['status']=='completed' and c['conclusion']=='success' for c in checks):break
              print('Waiting for operational cleanup and final main checks',flush=True);time.sleep(10)
          else:raise RuntimeError('Final main validation/cleanup still pending')
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import summary
          with ProductionWorkflowStore() as db:
              row=db.execute('SELECT attempt_id,next_action FROM virtual_workflow_checkpoints WHERE flow_id=?',('auth.credential-login',)).fetchone()
              assert row and row[0]==315
              handoff=json.loads(row[1]);handoff.update(attempt_id=row[0],main_sha=main,tested_main_sha='8d988803e620eeea863b78e6d98d58f98f90f04a',active_branch='main',work_branch=None,work_branch_sha=None,pr=None,remote_branches=['main'],open_prs=0,cleanup_required=[],merge_state='Operational verification on main; no feature branch or PR created; all temporary workflows removed',ci_state='UUID/text native tests passed; corrected recorder passed; final main contract-plan, generated-code and compression passed',live_counts=summary(db))
              payload=json.dumps(handoff,sort_keys=True)
              db.execute("INSERT INTO virtual_workflow_checkpoints(flow_id,attempt_id,next_action) VALUES(?,?,?) ON CONFLICT(flow_id) DO UPDATE SET attempt_id=excluded.attempt_id,next_action=excluded.next_action,invalidation_json='[]',updated_at=CURRENT_TIMESTAMP",('auth.credential-login',row[0],payload))
              db.execute("INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP",('recovery-handoff-current',payload))
          print('LOGIN_HANDOFF_COMMITTED '+payload)
          PY
