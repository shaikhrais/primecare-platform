name: Reconcile deployed auth preference artifact provenance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth-preference-artifact.yml'
      - 'tools/governance-production/auth-preference-artifact*'
      - 'scripts/test-auth-preference-artifact.mjs'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: auth-preference-artifact-registration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: artifact_test, POSTGRES_PASSWORD: isolated, POSTGRES_DB: artifact_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/artifact-tests --ignore-scripts --no-audit --no-fund pg@8.16.3 @electric-sql/pglite@0.3.14
          ln -s /tmp/artifact-tests/node_modules node_modules
          node scripts/test-auth-preference-artifact.mjs
      - name: Verify native PostgreSQL atomicity, exact scope and independent readback
        env:
          ARTIFACT_TEST_DATABASE_URL: postgresql://artifact_test:isolated@127.0.0.1:5432/artifact_test
        run: node scripts/test-auth-preference-artifact.mjs
  reconcile:
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REGISTER_AUTH_PREFERENCE_ARTIFACT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          npm install --prefix /tmp/artifact-repair --ignore-scripts --no-audit --no-fund pg@8.16.3
          ln -s /tmp/artifact-repair/node_modules node_modules
          pip install -r tools/governance-production/requirements.txt
      - name: Check unchanged current main and original identity guard
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python scripts/check-api-catalog-identity.py
      - name: Preview exact repair with rollback and live Worker identity verification
        run: node tools/governance-production/auth-preference-artifact.mjs
      - name: Apply only the legitimate artifact and 64 existing reference repairs
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          node tools/governance-production/auth-preference-artifact.mjs --apply
      - name: Independently verify metadata and unchanged quarantine guard
        run: |
          node tools/governance-production/auth-preference-artifact.mjs --readback
          python scripts/check-api-catalog-identity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: auth-preference-artifact-reconciliation, path: test-results/auth-preference-artifact}
