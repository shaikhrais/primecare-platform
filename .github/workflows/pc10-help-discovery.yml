name: Help schema and access reconciliation
on:
  push:
    branches: [main]
    paths:
      - 'tools/governance-production/pc10-help-discovery.mjs'
      - 'scripts/test-pc10-help-discovery.mjs'
      - '.github/workflows/pc10-help-discovery.yml'
permissions: {contents: read}
concurrency:
  group: pc10-help-schema-access-readback
  cancel-in-progress: false
jobs:
  production-read-only:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/help-reader --ignore-scripts --no-audit --no-fund pg@8.16.3 @electric-sql/pglite@0.3.14
          ln -s /tmp/help-reader/node_modules node_modules
          node --test scripts/test-pc10-help-discovery.mjs
      - name: Read exact Help schema and registered access without business content
        run: node tools/governance-production/pc10-help-discovery.mjs
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        with: {name: pc10-help-schema-access, path: test-results/pc10-help/discovery.json, if-no-files-found: error}
