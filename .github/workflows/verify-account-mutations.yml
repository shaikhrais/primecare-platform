name: Verify deployed account creation editing revocation and email recovery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-account-mutations.yml
      - websites/typescript/src/account-mutations-*.ts
      - websites/typescript/src/tenant-accounts-*.ts
      - websites/typescript/src/infrastructure/http/base-session-client.ts
      - packages/shared/src/account-mutations.json
      - tools/auth-verification/test-live-account-mutations.py
      - tools/auth-verification/test-live-tenant-account-reads.py
      - tools/auth-verification/owned_inbox.py
      - tools/auth-verification/accepted-auth-live-proof-release.json
      - docs/appearance/pc10-preferences-activation.json
      - scripts/verify-auth-live-proof-source.mjs
      - packages/shared/src/dashboard-pages/projection.d.mts
      - scripts/test-typescript-strict-contracts.mjs
      - tools/auth-verification/test-auth-live-proof-source.mjs
      - tools/deployment/typescript_release.py
      - tools/deployment/test_typescript_release.py
      - tools/deployment/http_client.py
      - tools/deployment/runtime_policy.py
      - tools/deployment/test_runtime_policy.py
      - websites/production-runtime.json
      - scripts/build-typescript-websites.mjs
      - scripts/portal-pwa-assets.mjs
      - scripts/test-portal-pwa.mjs
      - scripts/test-portal-pwa-browser.mjs
      - packages/primecare_ui/web/theme-library.ts
      - packages/primecare_ui/web/theme-center.ts
      - scripts/test-theme-library-recovery.mjs
      - scripts/test-theme-library-recovery-browser.mjs
      - scripts/test-shell-footer.mjs
      - scripts/test-shell-footer-model.mjs
      - scripts/test-tenant-workspace-layout.mjs
      - scripts/retry-stale-workspace-release.mjs
      - scripts/test-retry-stale-workspace-release.mjs
      - scripts/test-typescript-publisher-lock.mjs
      - packages/primecare_ui/web/shell.ts
      - tools/governance-production/theme-source-revisions.json
      - packages/primecare_ui/web/workspace-customizer.ts
      - websites/typescript/src/tenant-dashboard/index.ts
      - .github/workflows/deploy-typescript-websites.yml
      - .github/workflows/psw-workspace.yml
  workflow_run:
    workflows: ['Release confirmed self-session revocation']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: account-mutations-live-release
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix "$RUNNER_TEMP/account-tools" --ignore-scripts esbuild@0.27.2 typescript@5.9.3
          ln -s "$RUNNER_TEMP/account-tools/node_modules" node_modules
          node tools/auth-verification/test-auth-live-proof-source.mjs
          node scripts/test-account-mutations-client.mjs
          node scripts/test-tenant-account-reads.mjs
          node scripts/test-auth-client.mjs
          node --test scripts/test-portal-pwa.mjs
          node --test scripts/test-theme-library-recovery.mjs
          node --test scripts/test-shell-footer-model.mjs
          node --test scripts/test-retry-stale-workspace-release.mjs
          node --test scripts/test-typescript-publisher-lock.mjs
          python3 tools/auth-verification/test-owned-inbox-parser.py
          python3 -m py_compile tools/auth-verification/test-live-account-mutations.py tools/auth-verification/test-live-tenant-account-reads.py
          python3 -m unittest tools.deployment.test_typescript_release tools.deployment.test_http_client tools.deployment.test_runtime_policy -v
          node_modules/.bin/tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --resolveJsonModule --allowSyntheticDefaultImports --lib dom,dom.iterable,es2022 websites/typescript/src/account-mutations-panel.ts websites/typescript/src/tenant-accounts-panel.ts
  shell_acceptance:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: tenant_route, POSTGRES_PASSWORD: fixture-only, POSTGRES_DB: psw_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U tenant_route -d psw_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify fresh install and old worker migration in a real isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/shell-tools" --ignore-scripts esbuild@0.27.2 playwright@1.60.0 pg@8.16.3 bcryptjs@3.0.2 @electric-sql/pglite@0.3.14 @twilio/voice-sdk@2.18.5
          ln -s "$RUNNER_TEMP/shell-tools/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
          node scripts/test-portal-pwa-browser.mjs
          node scripts/test-theme-library-recovery-browser.mjs
          node scripts/test-shell-footer.mjs
      - name: Verify actual tenant navigation and pending-work guards with PostgreSQL
        env: {PSW_TEST_DATABASE_URL: 'postgres://tenant_route:fixture-only@127.0.0.1:5432/psw_test'}
        run: node scripts/test-tenant-workspace-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-shell-acceptance
          path: |
            test-results/external-calls/pwa-browser.json
            test-results/theme-library-recovery
            test-results/shell-footer
  release_source:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.source.outputs.reuse }}
      runtime_source: ${{ steps.source.outputs.runtime_source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime=3c732cf3096716b32ad3baae70f443f4b6903edd
          if git diff --quiet "$runtime" HEAD -- websites/typescript websites/production-runtime.json packages cloudflare/workers scripts tools/governance-production tools/deployment package.json package-lock.json .github/workflows/deploy-typescript-websites.yml .github/workflows/psw-workspace.yml; then
            gh api repos/${{ github.repository }}/actions/runs/41457664954 > /tmp/deployed-account-run.json
            gh api repos/${{ github.repository }}/actions/runs/41457664954/jobs --paginate > /tmp/deployed-account-jobs.json
            python3 - <<'PY'
          import json
          run=json.load(open('/tmp/deployed-account-run.json'))
          assert run['head_sha']=='3c732cf3096716b32ad3baae70f443f4b6903edd' and run['head_branch']=='main' and run['path']=='.github/workflows/verify-account-mutations.yml' and run['conclusion']=='success','Pinned runtime source must match its own CI run'
          jobs=json.load(open('/tmp/deployed-account-jobs.json'))['jobs']
          expected={'test','source_proof','bind','proof (en, 320)','proof (fr, 768)','proof (es, 1440)','deploy / verify_gateway','deploy / build',*('deploy / deploy ('+p+')' for p in ['primecare-business-development','primecare-client','primecare-clinic','primecare-corporate','primecare-franchise','primecare-marketing','primecare-support','primecare-governance','primecare-enterprise-blueprint'])}
          actual={j['name'] for j in jobs if j['conclusion']=='success'}
          assert expected.issubset(actual),'All nine pinned runtime deployments must have succeeded'
          print('Reusing successful all-nine deployment phases from41457664954; runtime/build/catalog sources identical to3c732cf3; current provider source is independently rechecked')
          PY
            echo reuse=true >> "$GITHUB_OUTPUT"
            echo "runtime_source=$runtime" >> "$GITHUB_OUTPUT"
          else
            echo reuse=false >> "$GITHUB_OUTPUT"
            echo "runtime_source=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
  source_proof:
    needs: test
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Read-only source and active-provider gate before metadata or publication
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-auth-live-proof-source.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-live-proof-source-acceptance
          path: test-results/account-mutations/auth-release-approved.json
  bind:
    needs: [release_source, source_proof, shell_acceptance]
    if: needs.release_source.outputs.reuse != 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix "$RUNNER_TEMP/account-tools" --ignore-scripts pg@8.16.3
          ln -s "$RUNNER_TEMP/account-tools/node_modules" node_modules
          python3 tools/governance-production/test-account-mutations-registration.py
          python3 tools/governance-production/test-tenant-accounts-registration.py
  deploy:
    needs: bind
    uses: ./.github/workflows/deploy-typescript-websites.yml
    with:
      confirm: DEPLOY
      bind_account_metadata: true
    secrets: inherit
  proof:
    needs: [release_source, source_proof, shell_acceptance, deploy]
    if: always() && needs.release_source.result == 'success' && needs.source_proof.result == 'success' && needs.shell_acceptance.result == 'success' && (needs.deploy.result == 'success' || needs.release_source.outputs.reuse == 'true')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {locale: en, width: 320}
          - {locale: fr, width: 768}
          - {locale: es, width: 1440}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r tools/governance-production/requirements.txt
          pip install bcrypt==4.3.0 playwright==1.58.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/account-tools" --ignore-scripts pg@8.16.3
          ln -s "$RUNNER_TEMP/account-tools/node_modules" node_modules
      - name: Require independently verified deployed auth source
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-auth-live-proof-source.mjs
      - name: Verify actual account UI API database audit reload and owned receiving-Worker mail
        env:
          EXPECTED_WEB_SOURCE: ${{ needs.release_source.outputs.runtime_source }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEST_LOCALE: ${{ matrix.locale }}
          TEST_WIDTH: ${{ matrix.width }}
        run: |
          for project in primecare-corporate primecare-clinic; do
            python3 -m tools.deployment.typescript_release live "$project" "$EXPECTED_WEB_SOURCE" --record "test-results/account-mutations/web-release-$project.json"
          done
          python3 scripts/verify-tenant-account-reads-catalog.py
          python3 scripts/verify-account-mutations-catalog.py
          python3 tools/auth-verification/test-live-tenant-account-reads.py
          python3 tools/auth-verification/test-live-account-mutations.py
          for project in primecare-corporate primecare-clinic; do
            python3 -m tools.deployment.typescript_release live "$project" "$EXPECTED_WEB_SOURCE" --baseline "test-results/account-mutations/web-release-$project.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-account-journeys-${{ matrix.locale }}-${{ matrix.width }}
          path: |
            test-results/tenant-account-reads
            test-results/account-mutations
