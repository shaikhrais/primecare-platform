name: Verify deployed account creation editing revocation and email recovery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-account-mutations.yml
      - websites/typescript/src/account-mutations-*.ts
      - websites/typescript/src/tenant-accounts-*.ts
      - websites/typescript/src/infrastructure/http/base-session-client.ts
      - packages/shared/src/account-mutations.json
      - tools/auth-verification/test-live-account-mutations.py
      - tools/auth-verification/owned_inbox.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account-mutations-live-release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix "$RUNNER_TEMP/account-tools" --ignore-scripts esbuild@0.27.2 typescript@5.9.3
          ln -s "$RUNNER_TEMP/account-tools/node_modules" node_modules
          node scripts/test-account-mutations-client.mjs
          node scripts/test-tenant-account-reads.mjs
          node scripts/test-auth-client.mjs
          python3 tools/auth-verification/test-owned-inbox-parser.py
          node_modules/.bin/tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --resolveJsonModule --allowSyntheticDefaultImports --lib dom,dom.iterable,es2022 websites/typescript/src/account-mutations-panel.ts websites/typescript/src/tenant-accounts-panel.ts
  bind:
    needs: test
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix "$RUNNER_TEMP/account-tools" --ignore-scripts pg@8.16.3
          ln -s "$RUNNER_TEMP/account-tools/node_modules" node_modules
          python3 tools/governance-production/test-account-mutations-registration.py
          python3 tools/governance-production/test-tenant-accounts-registration.py
      - name: Bind existing account processes to current source and canonical APIs
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          GOVERNANCE_ACCOUNT_MUTATIONS_REGISTRATION: '1'
          GOVERNANCE_TENANT_ACCOUNTS_READ_WRITES: '1'
        run: |
          python3 tools/governance-production/account_mutations_registration.py --apply --bind
          python3 tools/governance-production/tenant_accounts_registration.py --apply --bind
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-account-registration-bindings
          path: |
            test-results/account-mutations-registration
            test-results/tenant-accounts-registration
  deploy:
    needs: bind
    uses: ./.github/workflows/deploy-typescript-websites.yml
    with:
      confirm: DEPLOY
    secrets: inherit
  proof:
    needs: deploy
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {locale: en, width: 320}
          - {locale: fr, width: 768}
          - {locale: es, width: 1440}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r tools/governance-production/requirements.txt
          pip install bcrypt==4.3.0 playwright==1.58.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/account-tools" --ignore-scripts pg@8.16.3
          ln -s "$RUNNER_TEMP/account-tools/node_modules" node_modules
      - name: Verify actual account UI API database audit reload and owned receiving-Worker mail
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEST_LOCALE: ${{ matrix.locale }}
          TEST_WIDTH: ${{ matrix.width }}
        run: |
          python3 scripts/verify-tenant-account-reads-catalog.py
          python3 scripts/verify-account-mutations-catalog.py
          python3 tools/auth-verification/test-live-tenant-account-reads.py
          python3 tools/auth-verification/test-live-account-mutations.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-account-journeys-${{ matrix.locale }}-${{ matrix.width }}
          path: |
            test-results/tenant-account-reads
            test-results/account-mutations
