name: Build macOS Distributions

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/**'
      - 'packages/**/lib/**'
      - 'packages/**/assets/**'
      - 'packages/**/pubspec*'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'melos.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/build_macos.yml'
      - 'scripts/prepare-macos-entitlements.py'
      - 'scripts/test-macos-entitlements.py'
  pull_request:
    paths:
      - 'packages/primecare_ui/lib/**'
      - 'packages/primecare_ui/test/admin_reports_test.dart'
      - 'packages/flutter_core/lib/**'
      - 'packages/primecare_models/lib/**'
      - 'apps/**'
      - '.github/workflows/build_macos.yml'
      - 'scripts/prepare-macos-entitlements.py'
      - 'scripts/test-macos-entitlements.py'
  workflow_dispatch:

concurrency:
  group: native-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_macos:
    runs-on: macos-latest
    
    timeout-minutes: 45
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        app: 
          - primecare_business_development
          - primecare_client
          - primecare_clinic
          - primecare_corporate
          - primecare_franchise
          - primecare_marketing
          - primecare_support
          - primecare_governance
          - primecare_enterprise_blueprint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify shared macOS entitlement preparation
        run: python3 scripts/test-macos-entitlements.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS Release
        run: |
          cd apps/${{ matrix.app }}
          flutter pub get
          if [ ! -d macos/Runner.xcodeproj ]; then
            flutter create --platforms=macos .
          fi
          python3 ../../scripts/prepare-macos-entitlements.py .
          flutter build macos --release
          python3 ../../scripts/prepare-macos-entitlements.py . --verify-built

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/macos/Build/Products/Release/
