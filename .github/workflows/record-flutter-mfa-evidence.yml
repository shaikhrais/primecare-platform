name: Record scoped live Flutter MFA evidence
on:
  workflow_run:
    workflows: ['Verify deployed Flutter MFA end to end']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  record:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Require exact producer and unchanged Flutter auth source
        uses: actions/github-script@v7
        with:
          script: |
            const run=context.payload.workflow_run;
            if(run.path!=='.github/workflows/verify-live-flutter-mfa.yml'||run.head_branch!=='main'||run.conclusion!=='success')throw Error('Exact live Flutter producer required');
            const diff=(await github.rest.repos.compareCommits({...context.repo,base:run.head_sha,head:context.sha})).data;
            if(!['identical','ahead'].includes(diff.status)||diff.files.some(f=>['packages/flutter_core/','packages/primecare_ui/','packages/primecare_models/','apps/primecare_clinic/','cloudflare/workers/'].some(p=>f.filename.startsWith(p))||f.filename==='tools/auth-verification/test-live-flutter-mfa.py'))throw Error('Runtime or verification source changed after proof');
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: live-flutter-mfa-acceptance
          path: test-results/live-flutter-mfa
      - run: |
          node --test scripts/test-flutter-mfa-receipt.mjs
          npm install --prefix "$RUNNER_TEMP/flutter-mfa-evidence" --ignore-scripts pg@8.16.3
          ln -s "$RUNNER_TEMP/flutter-mfa-evidence/node_modules" node_modules
      - name: Record native controls without approval or whole-auth credit
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RECORD_FLUTTER_MFA_EVIDENCE: '1'
          MFA_PRODUCER_SHA: ${{ github.event.workflow_run.head_sha }}
          MFA_PRODUCER_RUN: ${{ github.event.workflow_run.id }}
        run: node scripts/record-flutter-mfa-evidence.mjs
