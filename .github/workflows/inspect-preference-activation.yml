name: Inspect preference activation readiness
on:
  push:
    branches: [main]
    paths:
      - 'tools/governance-production/inspect-preference-activation.mjs'
      - '.github/workflows/inspect-preference-activation.yml'
      - 'docs/appearance/pc10-preferences-activation.json'
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/preference-inspection --ignore-scripts --no-audit --no-fund pg@8.16.3
          ln -s /tmp/preference-inspection/node_modules node_modules
          node tools/governance-production/inspect-preference-activation.mjs
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
