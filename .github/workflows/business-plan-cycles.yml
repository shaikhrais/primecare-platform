name: Test and publish six-month business plans
on:
  push:
    branches: [main]
    paths: ['packages/shared/src/business-plans/**', 'cloudflare/workers/src/business-plans/**', 'packages/database/migrations/20261028_business_plan_cycles.sql', 'websites/typescript/src/business-plans/**', 'scripts/*business-plan*', '.github/workflows/business-plan-cycles.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: business_plan_test, POSTGRES_PASSWORD: fixture-only, POSTGRES_DB: business_plan_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U business_plan_test -d business_plan_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts
      - run: npm install --prefix /tmp/business-plan-tools --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14 bcryptjs@3.0.2
      - run: test -e node_modules/bcryptjs || ln -s /tmp/business-plan-tools/node_modules/bcryptjs node_modules/bcryptjs
      - name: Native PostgreSQL complete business loop and isolation
        env: {BUSINESS_PLAN_TEST_DATABASE_URL: 'postgres://business_plan_test:fixture-only@127.0.0.1:5432/business_plan_test'}
        run: node scripts/test-business-plan-cycles.mjs
      - name: Session-facing API acceptance and production UI bundle
        env: {BUSINESS_PLAN_PGLITE_MODULE: /tmp/business-plan-tools/node_modules/@electric-sql/pglite/dist/index.js}
        run: node scripts/preview-business-plan-project.mjs
      - name: Typecheck project API and portal
        run: npx -p typescript@5.9.3 tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --resolveJsonModule --esModuleInterop --lib ES2022,DOM,DOM.Iterable cloudflare/workers/src/business-plans/service.ts websites/typescript/src/main.ts
  publish:
    needs: acceptance
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency: {group: primecare-cloudflare-typescript-production, cancel-in-progress: false}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: npm install --prefix /tmp/business-plan-release --ignore-scripts --no-audit --no-fund bcryptjs@3.0.2
      - run: test -e node_modules/bcryptjs || ln -s /tmp/business-plan-release/node_modules/bcryptjs node_modules/bcryptjs
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Verify current main before publication
        run: git fetch origin main && test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Persist templates and deliver role-scoped in-app announcement
        run: node scripts/apply-business-plan-schema.mjs
      - name: Publish governance API while preserving existing live bindings
        run: node scripts/deploy-approved-admin-governance.mjs
      - name: Build database-governed portals
        run: node scripts/build-typescript-websites.mjs
      - name: Publish the planning route to every existing portal
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          for project in $(node -e "console.log(Object.keys(require('./websites/typescript/projects.json')).join(' '))"); do
            npx wrangler pages deploy "websites/typescript/dist/$project" --project-name "$project" --branch main --commit-hash "$GITHUB_SHA"
          done
      - name: Verify live gateway routes enforce authentication
        run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://primecare-api-gateway.itpro-mohammed.workers.dev/v1/governance/growth/cycles');
          if(r.status!==401)throw Error('Live business planning authentication readback failed: '+r.status);
          console.log('BUSINESS_PLAN_LIVE_AUTHENTICATION_CONFIRMED');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: business-plan-production-receipt, path: 'test-results/business-plan-release', retention-days: 30}
