name: Deploy Web Apps to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - primecare_business_development
          - primecare_client
          - primecare_clinic
          - primecare_corporate
          - primecare_franchise
          - primecare_marketing
          - primecare_support
          - primecare_governance
          - primecare_enterprise_blueprint
          - primecare_auth

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Format project name
        run: |
          formatted_name="${{ matrix.app }}"
          echo "project_name=${formatted_name//_/-}" >> "$GITHUB_ENV"

      - name: Build web release
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons \
            --dart-define=SSO_PORTAL_URL=https://primecare-auth.pages.dev \
            --dart-define=APP_BASE_URL=https://${{ env.project_name }}.pages.dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/${{ matrix.app }}/build/web --project-name=${{ env.project_name }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
