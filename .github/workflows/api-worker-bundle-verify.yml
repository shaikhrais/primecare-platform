name: API Worker Bundle Verification (no publish)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/api-worker-bundle-verify.yml']
  workflow_dispatch:
permissions:
  contents: read

env:
  REVIEWED_SOURCE: '5c875053c23eb78faf3a164d2ca4ac217ec0c754'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  bundle:
    name: Bundle (${{ matrix.target }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [client, provider, visit, notes, billing, scheduling, notification, verification, compliance, governance, franchise-reporting, gateway, auth]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_SOURCE }}
          persist-credentials: false
      - name: Confirm exact reviewed source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          printf 'Worker bundle candidate: `%s`\n\nThis job performs a Wrangler dry-run only. It does not verify production grants, runtime, deployment or business behavior.\n' "$REVIEWED_SOURCE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Install locked generic Worker dependencies
        if: matrix.target != 'auth'
        run: npm ci --ignore-scripts
      - name: Install reviewed Auth release toolchain
        if: matrix.target == 'auth'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/auth-release" --ignore-scripts --no-audit --no-fund wrangler@4.68.1 pg@8.16.3 bcryptjs@3.0.2
          ln -s "$RUNNER_TEMP/auth-release/node_modules" node_modules
      - name: Dry-run the selected Worker only
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node scripts/generate-cloudflare-worker-config.mjs
          npx --no-install wrangler deploy --dry-run --config ".cloudflare-workers/${TARGET}.jsonc" --outdir "$RUNNER_TEMP/api-dry-run/$TARGET"
          printf 'Dry-run bundle succeeded for `%s`. No Worker was uploaded or deployed.\n' "$TARGET" >> "$GITHUB_STEP_SUMMARY"
