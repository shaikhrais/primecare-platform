name: Report platform compilation
on:
  pull_request:
    paths:
      - 'packages/primecare_ui/**'
      - 'packages/primecare_models/**'
      - 'packages/flutter_core/**'
      - 'scripts/*report*'
      - '.github/workflows/report-platforms.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: report-platforms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {platform: web, os: ubuntu-latest}
          - {platform: android, os: ubuntu-latest}
          - {platform: linux, os: ubuntu-latest}
          - {platform: windows, os: windows-latest}
          - {platform: macos, os: macos-latest}
          - {platform: ios, os: macos-latest}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Linux plugin prerequisites
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Report behavior and responsive layout tests
        run: flutter test test/admin_reports_test.dart test/report_pdf_exporter_test.dart
        working-directory: packages/primecare_ui
      - name: Compile report UI and registered native plugins
        run: python scripts/build-report-platform.py ${{ matrix.platform }}
