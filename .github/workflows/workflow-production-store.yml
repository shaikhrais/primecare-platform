name: Production workflow tracking store
on:
  pull_request:
    paths:
      - 'tools/workflow-verification/**'
      - 'tools/governance-production/**'
      - 'scripts/test-care-availability-workflow.mjs'
      - 'scripts/esbuild-input-path.mjs'
      - 'scripts/test-esbuild-input-path.mjs'
      - '.github/workflows/workflow-production-store.yml'
  push:
    branches: [main]
    paths:
      - 'tools/workflow-verification/production_store.py'
      - 'tools/workflow-verification/record_production_recovery.py'
      - 'tools/governance-production/production-pin.json'
      - 'scripts/test-care-availability-workflow.mjs'
      - 'scripts/esbuild-input-path.mjs'
      - 'scripts/test-esbuild-input-path.mjs'
      - '.github/workflows/workflow-production-store.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: isolated-integration-only
          POSTGRES_DB: workflow_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U workflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKFLOW_TEST_DATABASE_URL: postgresql://workflow:isolated-integration-only@localhost:5432/workflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix /tmp/workflow-test-tools --ignore-scripts --no-audit --no-fund pg@8.11.3 @electric-sql/pglite@0.3.14 esbuild@0.27.2
          ln -s /tmp/workflow-test-tools/node_modules node_modules
      - run: |
          node --test scripts/test-esbuild-input-path.mjs
          python tools/workflow-verification/test_execution.py
          python tools/workflow-verification/test_gates.py
          python tools/workflow-verification/test_production_store.py
          python tools/governance-production/test-production-reader.py
  production:
    if: github.event_name == 'push'
    needs: native
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix /tmp/workflow-browser-tools --ignore-scripts --no-audit --no-fund pg@8.11.3 @electric-sql/pglite@0.3.14 esbuild@0.27.2 bcryptjs@3 playwright@1.60.0
          ln -s /tmp/workflow-browser-tools/node_modules node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser against synthetic business data with production-governed themes
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: node scripts/test-care-availability-workflow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        id: evidence
        with:
          name: production-governed-care-synthetic-browser-evidence
          if-no-files-found: error
          retention-days: 90
          path: test-results/care/availability-workflow/
      - name: Commit scoped attempt and checkpoint to pinned tracking tables
        if: always() && steps.evidence.outcome == 'success'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          WORKFLOW_EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: python tools/workflow-verification/record_production_recovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: production-workflow-tracking-progress
          path: |
            docs/task-progress/workflow-execution-status.json
            docs/task-progress/WORKFLOW_EXECUTION_STATUS.md
