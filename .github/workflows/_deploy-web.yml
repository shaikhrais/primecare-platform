name: Reusable Flutter Website Deployment

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      project:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: primecare-cloudflare-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Verify deployment HTTP client
        run: python3 -m unittest tools.deployment.test_http_client -v
      - name: Verify Cloudflare configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CF_TOKEN}"
          test -n "${CF_ACCOUNT}"
      - name: Build website
        working-directory: apps/${{ inputs.app }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter build web --release --no-tree-shake-icons \
            --dart-define=API_BASE_URL="${{ vars.API_GATEWAY_URL }}" \
            --dart-define=APP_BASE_URL="https://${{ inputs.project }}.pages.dev"
      - name: Bind deployed Flutter bundle to source
        env:
          APP: ${{ inputs.app }}
          PROJECT: ${{ inputs.project }}
        shell: python
        run: |
          import os,json,hashlib,pathlib
          root=pathlib.Path('apps')/os.environ['APP']/'build/web'
          bundle=root/'main.dart.js'
          assert bundle.is_file(),'Flutter JavaScript bundle missing'
          stamp={'runtime':'flutter','commit':os.environ['GITHUB_SHA'],'app':os.environ['APP'],'project':os.environ['PROJECT'],'bundle':'main.dart.js','sha256':hashlib.sha256(bundle.read_bytes()).hexdigest()}
          (root/'primecare-build.json').write_text(json.dumps(stamp,sort_keys=True))
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-build-${{ inputs.project }}
          path: apps/${{ inputs.app }}/build/web/primecare-build.json
          retention-days: 90
      - name: Deploy website with rate-limit retries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if npx wrangler@3.90.0 pages deploy "apps/${{ inputs.app }}/build/web" \
              --project-name="${{ inputs.project }}" --branch=main --commit-hash="${GITHUB_SHA}"; then
              exit 0
            fi
            if [ "${attempt}" = 5 ]; then
              exit 1
            fi
            sleep_seconds=$((attempt * 45))
            echo "Cloudflare deployment attempt ${attempt} failed; retrying in ${sleep_seconds}s"
            sleep "${sleep_seconds}"
          done
      - name: Verify exact live Flutter bundle after propagation
        env:
          APP: ${{ inputs.app }}
          PROJECT: ${{ inputs.project }}
        shell: python
        run: |
          import os,json,hashlib,pathlib,time,urllib.error,sys
          sys.path.insert(0,os.getcwd())
          from tools.deployment.http_client import read_public_asset
          root=pathlib.Path('apps')/os.environ['APP']/'build/web'
          expected=json.loads((root/'primecare-build.json').read_text())
          base='https://'+os.environ['PROJECT']+'.pages.dev/'
          def read(path):
              return read_public_asset(base+path+'?enable-semantics=true&deployment='+os.environ['GITHUB_SHA'])
          for attempt in range(12):
              try:
                  actual=json.loads(read('primecare-build.json'))
                  assert actual==expected,'Live Flutter source stamp differs from this build'
                  assert hashlib.sha256(read('main.dart.js')).hexdigest()==expected['sha256'],'Live Flutter bundle differs from this build'
                  print('Verified source-bound Flutter deployment '+os.environ['PROJECT'])
                  break
              except urllib.error.HTTPError as error:
                  if error.code in (401,403):
                      raise RuntimeError('Live verification access denied; inspect Pages access diagnosis, do not retry authorization failures') from error
                  if attempt==11:raise
                  time.sleep(5)
              except Exception:
                  if attempt==11:raise
                  time.sleep(5)
