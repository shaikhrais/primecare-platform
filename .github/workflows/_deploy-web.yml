name: Reusable Flutter Website Deployment

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      project:
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: primecare-cloudflare-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Verify Cloudflare configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CF_TOKEN}"
          test -n "${CF_ACCOUNT}"
      - name: Build website
        working-directory: apps/${{ inputs.app }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter build web --release --no-tree-shake-icons \
            --dart-define=API_BASE_URL="${{ vars.API_GATEWAY_URL }}" \
            --dart-define=SSO_PORTAL_URL=https://primecare-auth.pages.dev \
            --dart-define=APP_BASE_URL="https://${{ inputs.project }}.pages.dev"
      - name: Deploy website with rate-limit retries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if npx wrangler@3.90.0 pages deploy "apps/${{ inputs.app }}/build/web" \
              --project-name="${{ inputs.project }}" --branch=main; then
              exit 0
            fi
            if [ "${attempt}" = 5 ]; then
              exit 1
            fi
            sleep_seconds=$((attempt * 45))
            echo "Cloudflare deployment attempt ${attempt} failed; retrying in ${sleep_seconds}s"
            sleep "${sleep_seconds}"
          done
