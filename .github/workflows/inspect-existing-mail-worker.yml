name: Inspect existing receiving domain and email Worker
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-existing-mail-worker.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read existing domain routing and Worker bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os,json,pathlib,urllib.request,urllib.error,urllib.parse
          domain='15minutes-email.com';token=os.environ.get('CLOUDFLARE_API_TOKEN');account=os.environ.get('CLOUDFLARE_ACCOUNT_ID')
          assert token and account,'Protected Cloudflare read credentials unavailable'
          def get(path):
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:return response.status,json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code,{'success':False}
          status,zones=get('/zones?name='+domain)
          owned=[z for z in zones.get('result',[]) if z.get('name')==domain and z.get('account',{}).get('id')==account]
          report={'domain':domain,'read_only':True,'messages_sent':0,'zone_lookup_http':status,'owned_zone_matches':len(owned)}
          workers=set()
          def summarize(rule):
              actions=rule.get('actions',[]);names=[name for action in actions if action.get('type')=='worker' for name in action.get('value',[])]
              workers.update(names)
              return {'enabled':rule.get('enabled'),'action_types':[a.get('type') for a in actions],'worker_names':names,'matcher_types':[m.get('type') for m in rule.get('matchers',[])]}
          if len(owned)==1:
              zone=owned[0];report['zone_status']=zone.get('status');zid=zone['id']
              status,routing=get('/zones/'+zid+'/email/routing');report['routing']={'http':status,'success':routing.get('success'),'enabled':(routing.get('result') or {}).get('enabled')}
              status,rules=get('/zones/'+zid+'/email/routing/rules?per_page=100');report['rules_http']=status;report['rules']=[summarize(r) for r in rules.get('result',[])]
              status,catch=get('/zones/'+zid+'/email/routing/rules/catch_all');report['catch_all']={'http':status,'success':catch.get('success'),'rule':summarize(catch.get('result') or {})}
              status,dns=get('/zones/'+zid+'/dns_records?type=MX&per_page=100');report['mx']={'http':status,'records':[{'name':r.get('name'),'target':r.get('content'),'priority':r.get('priority')} for r in dns.get('result',[])]}
              status,sending=get('/zones/'+zid+'/email/sending/subdomains');report['sending']={'http':status,'success':sending.get('success'),'domains':[{'name':d.get('name'),'enabled':d.get('enabled')} for d in sending.get('result',[]) if isinstance(d,dict)]}
          report['workers']={}
          for name in sorted(workers|{'primecare-auth-api'}):
              status,settings=get('/accounts/'+account+'/workers/scripts/'+urllib.parse.quote(name,safe='')+'/settings')
              result=settings.get('result') or {};bindings=result.get('bindings',[]) if isinstance(result,dict) else []
              report['workers'][name]={'http':status,'success':settings.get('success'),'binding_types':[{'name':b.get('name'),'type':b.get('type')} for b in bindings],'email_from':[b.get('text') for b in bindings if b.get('name')=='EMAIL_FROM' and b.get('type')=='plain_text']}
          path=pathlib.Path('test-results/existing-mail');path.mkdir(parents=True,exist_ok=True);(path/'configuration.json').write_text(json.dumps(report,indent=2))
          print('EXISTING_MAIL_CONFIGURATION '+json.dumps(report))
      - uses: actions/upload-artifact@v4
        with:
          name: existing-mail-domain-and-worker
          path: test-results
