name: Inspect Look Manager production readiness
on:
  push:
    branches: [main]
    paths: ['scripts/inspect-look-readiness.mjs', '.github/workflows/look-manager-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts
      - run: node scripts/inspect-look-readiness.mjs
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOOK_AI_MODEL: ${{ vars.LOOK_AI_MODEL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: look-readiness, path: test-results/look/readiness.json, retention-days: 14}
