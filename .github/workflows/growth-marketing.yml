name: Founder growth and marketing workflow
on:
  pull_request:
    paths: ['docs/auth-recovery/**', 'scripts/test-auth-recovery-governance.py', 'docs/workforce/**', 'packages/shared/src/workforce/**', 'cloudflare/workers/src/workforce/**', 'scripts/*workforce*', 'scripts/register-report-navigation.py', 'scripts/review-admin-marketing-ui.mjs', 'scripts/register-admin-reports.py', 'cloudflare/workers/src/report-registry.json', 'websites/typescript/src/reports.ts', 'scripts/register-admin-form-drafts.py', 'packages/shared/src/admin-form-draft.json', 'websites/typescript/src/auth-recovery.ts', 'packages/shared/src/auth-recovery.json', 'websites/typescript/src/workspace.ts', 'scripts/*workspace*', 'scripts/*auth-recovery-web*', 'websites/typescript/src/form-draft.ts', 'websites/typescript/src/admin-row-draft.ts', 'packages/shared/src/media/**', 'websites/typescript/src/media-look.ts', 'websites/typescript/src/auth-screen.ts', 'websites/typescript/public/assets/media/**', 'scripts/*media-look*', 'cloudflare/workers/src/look/**', 'packages/shared/src/look/**', 'websites/typescript/src/look-review.ts', 'docs/appearance/**', 'scripts/*look*', 'scripts/generate-cloudflare-worker-config.mjs', 'packages/database/migrations/*look*', 'cloudflare/workers/src/growth/**', 'cloudflare/workers/src/platform-administration.ts', 'cloudflare/workers/src/admin-hierarchy.json', 'cloudflare/workers/src/account*.ts', 'cloudflare/workers/src/reporting.ts', 'websites/typescript/src/platform*.ts', 'scripts/*admin-hierarchy*', 'scripts/*central*', 'scripts/test-platform-administration-postgres.mjs', 'cloudflare/workers/src/account-policy.json', 'cloudflare/workers/src/business-modules.ts', 'packages/shared/src/growth/**', 'packages/database/migrations/*growth*', 'websites/typescript/src/growth/**', 'websites/typescript/src/main.ts', 'websites/typescript/src/styles.css', 'websites/typescript/public/assets/growth/**', 'websites/typescript/src/theme-manager.ts', 'websites/typescript/src/layout-manager.ts', 'websites/typescript/src/layout-customizer.ts', 'websites/typescript/src/shell.ts', 'scripts/build-typescript-websites.mjs', 'scripts/*growth*', 'docs/marketing/**', '.github/workflows/growth-marketing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: growth_test
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: growth_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U growth_test -d growth_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GROWTH_TEST_DATABASE_URL: postgresql://growth_test:integration-only@localhost:5432/growth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/growth-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 @types/node@22 @types/pg@8 pg@8.16.3 bcryptjs@3 playwright@1.60.0 jsqr@1.4.0 miniflare@4.20260730.0 jsdom@26
      - run: ln -s "$RUNNER_TEMP/growth-tools/node_modules" node_modules
      - name: Register operations governance before export checks
        run: python3 scripts/register-workspace-governance.py
      - run: python3 scripts/register-admin-form-drafts.py --check && python3 scripts/register-admin-hierarchy.py --check && python3 scripts/register-growth-governance.py --check && python3 scripts/register-look-manager.py --check && python3 scripts/register-look-provider.py --check
      - run: node --test scripts/test-look-vision-provider.mjs scripts/test-look-vision-runtime.mjs scripts/test-growth.mjs scripts/test-method-capture-blockers.mjs scripts/test-existing-auth-contracts-api.mjs scripts/test-central-bootstrap.mjs
      - run: node --test scripts/test-growth-postgres.mjs scripts/test-growth-intake.mjs scripts/test-growth-reporting.mjs scripts/test-growth-business.mjs
      - run: node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --resolveJsonModule --esModuleInterop --lib ES2022,DOM,DOM.Iterable cloudflare/workers/src/look/vision-provider.ts cloudflare/workers/src/growth/service.ts websites/typescript/src/main.ts
      - run: node_modules/.bin/playwright install --with-deps chromium
      - name: Check shared growth loading and retry states
        run: node scripts/test-growth-loading-browser.mjs
      - run: node --test scripts/test-growth-browser.mjs scripts/test-growth-admin-browser.mjs scripts/test-look-manager.mjs
      - run: node scripts/build-typescript-websites.mjs
      - run: python3 scripts/register-media-look.py --check && node scripts/test-media-look-browser.mjs
      - run: python3 scripts/test-auth-recovery-governance.py && python3 scripts/register-auth-recovery-web.py --check && python3 scripts/register-workspace-visual-review.py
      - run: node --test scripts/test-workspace-browser.mjs scripts/test-auth-recovery-web.mjs
      - run: node scripts/audit-workspace-role-browser.mjs
      - run: REVIEW_PHASE=after node scripts/review-admin-marketing-ui.mjs
      - run: python3 scripts/register-workforce-foundation.py --check && node --test scripts/test-workforce-foundation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: founder-growth-browser-evidence
          path: test-results/
          retention-days: 14
