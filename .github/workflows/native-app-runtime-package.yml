name: Verify canonical application runtime and host localization
on:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_app_runtime/**'
      - 'packages/primecare_runtime/lib/src/resilience/primecare_app_runner.dart'
      - '.github/workflows/native-app-runtime-package.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - working-directory: packages/primecare_app_runtime
        run: flutter pub get
      - working-directory: packages/primecare_app_runtime
        run: flutter analyze --no-fatal-infos lib test
      - working-directory: packages/primecare_app_runtime
        run: flutter test --reporter expanded
      - working-directory: packages/primecare_ui
        run: flutter pub get
      - working-directory: packages/primecare_ui
        run: flutter test test/auth_login_localization_test.dart --reporter expanded
