name: Test all available Apple build artifacts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-artifact-tests.yml'
      - 'scripts/test-apple-build-artifacts.py'
      - 'scripts/test-apple-artifact-scope.py'
  workflow_dispatch:
  workflow_run:
    workflows: ['Build macOS Distributions', 'Build iOS Distributions', 'Diagnose unsigned Blueprint iOS build']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: apple-artifact-tests-${{ github.sha }}-${{ github.event.workflow_run.id || 'manual' }}
  cancel-in-progress: false
jobs:
  inventory:
    if: github.event_name != 'workflow_run' || ((github.event.workflow_run.head_sha == '785dcac644ef21e79aaa7e012154aee989bf71cf' && (github.event.workflow_run.id == 43328101727 || github.event.workflow_run.id == 43328101736)) || (github.event.workflow_run.head_sha == '89273fca8fd30463a8b4c80f66106b8693601fa2' && github.event.workflow_run.id == 43349642502) || (github.event.workflow_run.head_sha == 'a41163b1da96015c05618b30a68d0af6c1929471' && github.event.workflow_run.id == 43456846629) || (github.event.workflow_run.head_sha == 'a94e222694c2875e0864e561905e7e4552a49107' && github.event.workflow_run.id == 43442916442) || (github.event.workflow_run.head_sha == 'ab9ce22d10c8d947be437b584f4f9a73a48e1db6' && github.event.workflow_run.id == 43377825284))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
      available: ${{ steps.inventory.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify producer scope and archive consumer fixtures
        run: python3 scripts/test-apple-artifact-scope.py
      - id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event_name == 'push' && '43456846629' || github.event.workflow_run.id || '' }}
        run: python3 scripts/test-apple-build-artifacts.py discover
      - uses: actions/upload-artifact@v4
        with:
          name: apple-artifact-coverage
          path: apple-artifact-coverage.json
  artifact:
    needs: inventory
    if: needs.inventory.outputs.available == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ITEM: ${{ toJSON(matrix) }}
        run: python3 scripts/test-apple-build-artifacts.py metadata
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ matrix.id }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: apple-artifact
          merge-multiple: true
      - name: Test artifact with explicit runtime limitations
        env:
          ARTIFACT_ITEM: ${{ toJSON(matrix) }}
        run: python3 scripts/test-apple-build-artifacts.py inspect

