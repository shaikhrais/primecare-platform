name: Verify named dynamic page provider
on:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_dynamic_pages/**'
      - 'packages/flutter_core/lib/dynamic_page_providers.dart'
      - '.github/workflows/native-dynamic-pages.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - working-directory: packages/primecare_dynamic_pages
        run: flutter pub get
      - working-directory: packages/primecare_dynamic_pages
        run: flutter analyze --no-fatal-infos lib
      - working-directory: packages/flutter_core
        run: flutter pub get
      - working-directory: packages/flutter_core
        run: flutter analyze --no-fatal-infos lib/dynamic_page_providers.dart
