name: Inspect EMS deployment mismatch without publishing
on:
  push:
    branches: [main]
    paths: ['scripts/inspect-ems-deployment-state.mjs', '.github/workflows/ems-deployment-state.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node scripts/inspect-ems-deployment-state.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAPACITY_TEST_ORIGIN: ${{ secrets.CAPACITY_TEST_ORIGIN }}
          CAPACITY_TEST_TOKEN: ${{ secrets.CAPACITY_TEST_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ems-deployment-state
          path: test-results/endpoint-management/deployment-state.json
          retention-days: 14
