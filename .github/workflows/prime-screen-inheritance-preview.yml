name: Preview PrimeCare screen inheritance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prime-screen-inheritance-preview.yml', '.github/fixtures/prime-screen-inheritance/**']
permissions: {contents: read}
jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - name: Apply candidate to isolated runner
        run: |
          cp .github/fixtures/prime-screen-inheritance/prime_screen_inheritance.dart packages/primecare_ui/lib/src/theme/
          cp .github/fixtures/prime-screen-inheritance/primecare_ui.dart packages/primecare_ui/lib/
          cp .github/fixtures/prime-screen-inheritance/prime_screen_inheritance_test.dart packages/primecare_ui/test/
      - run: flutter pub get
        working-directory: packages/primecare_ui
      - run: flutter analyze --no-fatal-infos lib/src/theme/prime_screen_inheritance.dart test/prime_screen_inheritance_test.dart
        working-directory: packages/primecare_ui
      - run: flutter test test/prime_screen_inheritance_test.dart
        working-directory: packages/primecare_ui
