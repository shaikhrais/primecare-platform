name: Deploy TypeScript Websites to Cloudflare Pages

on:
  workflow_call:
    inputs:
      confirm:
        description: Production deployment authorization
        required: true
        type: string
      bind_account_metadata:
        description: Bind existing account metadata within this publication lock
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to authorize production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: primecare-cloudflare-typescript-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_GATEWAY_URL: https://primecare-api-gateway.itpro-mohammed.workers.dev

jobs:
  verify_gateway:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.gateway.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify current main before release verification
        run: git fetch origin main && test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Validate authorization and secrets
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = DEPLOY
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
      - id: gateway
        run: |
          set -euo pipefail
          body="$(curl --fail --show-error --silent --retry 10 --retry-all-errors --retry-delay 5 "${API_GATEWAY_URL}/health?deployment=${GITHUB_SHA}")"
          grep -q 'cloudflare-worker-typescript' <<<"${body}"
          echo "url=${API_GATEWAY_URL}" >> "${GITHUB_OUTPUT}"

  build:
    environment: production
    needs: verify_gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind requested account metadata and build governed TypeScript websites
        env:
          API_GATEWAY_URL: ${{ needs.verify_gateway.outputs.gateway }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          python3 -m unittest tools.deployment.test_typescript_release tools.deployment.test_http_client tools.deployment.test_runtime_policy -v
          python3 -m tools.deployment.runtime_policy all typescript --require
          npm ci --ignore-scripts
          node --test scripts/test-typescript-screen-manager.mjs scripts/test-typescript-presentation-bindings.mjs scripts/test-tenant-presentation-tokens.mjs
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" node --test scripts/test-workspace-route-handoffs.mjs
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" node --test scripts/test-platform-admin-navigation.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-platform-admin-transport.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-platform-admin-manager.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-typescript-document-scroll.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-workspace-calls-resume.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-workspace-manager-boundaries.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-tenant-manager-entry.mjs scripts/test-tenant-manager-children.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-coordinator-charge-manager.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-psw-requests-manager.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-business-plans-manager.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-care-live-manager.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-personal-care-manager.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-coordinator-demo-manager.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-growth-manager.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-enquiry-manager.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-auth-screen-lifecycle.mjs scripts/test-auth-screen-labels.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-auth-recovery-lifecycle.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-typescript-strict-contracts.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test --test-concurrency=1 scripts/test-maintenance-manager.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test --test-concurrency=1 scripts/test-appearance-manager.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-admin-child-sessions.mjs
          env -i PATH="$PATH" HOME=/tmp TMPDIR=/tmp node --test scripts/test-admin-auth-edges.mjs
          pip install -r tools/governance-production/requirements.txt
          if [ "${{ inputs.bind_account_metadata }}" = true ]; then
            git fetch origin main
            test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
            (
              export GOVERNANCE_WORKFLOW_WRITES=1
              export GOVERNANCE_ACCOUNT_MUTATIONS_REGISTRATION=1
              export GOVERNANCE_TENANT_ACCOUNTS_READ_WRITES=1
              export GOVERNANCE_RECOVERY_REGISTRATION_WRITES=1
              python3 tools/governance-production/account_mutations_registration.py --apply --bind
              python3 tools/governance-production/tenant_accounts_registration.py --apply --bind
              python3 tools/governance-production/recovery_registration.py --apply
            )
          fi
          node scripts/build-typescript-websites.mjs
          for project in $(jq -r 'keys[]' websites/typescript/projects.json); do
            test -s "websites/typescript/dist/${project}/index.html"
            test -s "websites/typescript/dist/${project}/portal.json"
            test -s "websites/typescript/dist/${project}/assets/app.js"
          done
      - uses: actions/upload-artifact@v4
        if: always() && inputs.bind_account_metadata
        with:
          name: current-account-registration-bindings
          path: |
            test-results/account-mutations-registration
            test-results/tenant-accounts-registration
      - uses: actions/upload-artifact@v4
        with:
          name: primecare-typescript-websites
          path: websites/typescript/dist
          retention-days: 14

  deploy:
    # Share the per-project deployment lock with the Flutter publisher.
    concurrency:
      group: primecare-cloudflare-${{ matrix.project }}
      cancel-in-progress: false
    needs: [verify_gateway, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        project: [primecare-business-development, primecare-client, primecare-clinic, primecare-corporate, primecare-franchise, primecare-marketing, primecare-support, primecare-governance, primecare-enterprise-blueprint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: primecare-typescript-websites
          path: websites/typescript/dist
      - name: Deploy ${{ matrix.project }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python3 -m tools.deployment.runtime_policy "${{ matrix.project }}" typescript --require
          npx --yes wrangler@4.68.1 pages deploy "websites/typescript/dist/${{ matrix.project }}" --project-name="${{ matrix.project }}" --branch=main --commit-hash="${GITHUB_SHA}"
      - name: Verify ${{ matrix.project }}
        run: |
          set -euo pipefail
          url="https://${{ matrix.project }}.pages.dev/?enable-semantics=true&deployment=${GITHUB_SHA}"
          for attempt in {1..18}; do
            if body="$(curl --fail --show-error --silent --location "${url}")" \
              && manifest="$(curl --fail --show-error --silent "https://${{ matrix.project }}.pages.dev/portal.json?deployment=${GITHUB_SHA}")" \
              && grep -q 'id="app"' <<<"${body}" \
              && grep -q 'apiGateway' <<<"${manifest}"; then
              exit 0
            fi
            echo "Waiting for Pages production propagation: ${{ matrix.project }} (attempt ${attempt}/18)"
            sleep 5
          done
          exit 1
      - name: Verify source stamp and exact live TypeScript assets
        run: python3 -m tools.deployment.typescript_release verify-deploy "websites/typescript/dist/${{ matrix.project }}" "${{ matrix.project }}"
      - name: Retain verified portal release stamp
        uses: actions/upload-artifact@v4
        with:
          name: verified-portal-release-${{ matrix.project }}
          path: websites/typescript/dist/${{ matrix.project }}/primecare-build.json
          if-no-files-found: error
          retention-days: 90
