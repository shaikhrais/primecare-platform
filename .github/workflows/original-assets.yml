name: Original assets and shared icon adoption
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_ui/assets/original/**'
      - 'packages/primecare_ui/web/original-asset*'
      - 'packages/primecare_ui/web/icons.ts'
      - 'packages/primecare_ui/web/index.ts'
      - 'packages/primecare_ui/lib/original_assets.dart'
      - 'packages/primecare_ui/lib/src/theme/primecare_assets.dart'
      - 'packages/primecare_ui/catalogs/original-assets.registration.json'
      - 'packages/flutter_core/lib/original_assets*'
      - 'packages/flutter_core/lib/original_assets/**'
      - 'packages/flutter_core/lib/navigation/prime_workspace_navigation.dart'
      - 'packages/flutter_core/lib/data_controls/prime_data_controls.dart'
      - 'packages/flutter_core/test/original_assets/**'
      - 'scripts/build-original-assets.py'
      - 'scripts/test-original-asset*'
      - '.github/workflows/original-assets.yml'
permissions: {contents: read}
concurrency:
  group: original-asset-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/asset-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 playwright@1.60.0
          ln -s /tmp/asset-tools/node_modules node_modules
          npx playwright install --with-deps chromium
          python3 scripts/build-original-assets.py --check
          python3 scripts/test-original-asset-compiler.py
          node scripts/test-original-assets-model.mjs
          node scripts/test-original-assets-browser.mjs
          node scripts/test-workspace-navigation-model.mjs
          node scripts/test-workspace-navigation-browser.mjs
          node scripts/test-tenant-dashboard.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable --resolveJsonModule packages/primecare_ui/web/original-asset-view.ts packages/primecare_ui/web/icons.ts
      - run: |
          pip install -r tools/governance-production/requirements.txt
          python3 tools/governance-production/test-original-assets-registration.py
          python3 tools/governance-production/test-metadata-store.py
  native:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/flutter_core
      - run: flutter analyze --no-fatal-infos lib/original_assets lib/original_assets.dart lib/navigation/prime_workspace_navigation.dart lib/data_controls/prime_data_controls.dart test/original_assets
        working-directory: packages/flutter_core
      - run: flutter test test/original_assets test/navigation test/data_controls --reporter expanded
        working-directory: packages/flutter_core
