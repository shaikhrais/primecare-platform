name: Verify current auth preference deployment candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth-preference-candidate.yml'
      - 'scripts/deploy-auth-preference-code.mjs'
      - 'scripts/*preserved-service-config.mjs'
      - 'scripts/*auth-preference-deployment-config.mjs'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: auth-preference-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  auth-security:
    uses: ./.github/workflows/code-admin-tests.yml
    secrets: inherit
  preference-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: preference_test, POSTGRES_PASSWORD: isolated, POSTGRES_DB: preference_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PREFERENCE_TEST_DATABASE_URL: postgresql://preference_test:isolated@127.0.0.1:5432/preference_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify current source preference ownership and receipt behavior
        run: |
          npm install --prefix /tmp/auth-preference --ignore-scripts --no-audit --no-fund esbuild@0.27.2 pg@8.16.3 @electric-sql/pglite@0.3.14 bcryptjs@3.0.3 playwright@1.60.0
          ln -s /tmp/auth-preference/node_modules node_modules
          npx playwright install --with-deps chromium
          node --test scripts/test-worker-deployment-receipt.mjs scripts/test-theme-runtime-artifacts.mjs scripts/test-preserved-service-config.mjs scripts/test-auth-preference-deployment-config.mjs
          node scripts/test-preference-service.mjs
          node scripts/test-preference-browser.mjs
  source-acceptance:
    needs: [auth-security, preference-postgres]
    runs-on: ubuntu-24.04
    steps:
      - name: Record bounded source acceptance without runtime activation
        env:
          SOURCE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os
          print(json.dumps({'source':os.environ['SOURCE'],'authSecurityAndPreferenceChecks':'passed','productionDeployed':False,'runtimeActivated':False,'productionGrantsChanged':0,'legacyCandidateHashesRewritten':False}))
          PY
  deploy-code:
    needs: source-acceptance
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    concurrency:
      group: auth-preference-code-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Prepare locked release dependencies
        run: |
          npm ci --ignore-scripts
          npm install --prefix /tmp/auth-release-extra --ignore-scripts --no-audit --no-fund bcryptjs@3.0.2
          test -e node_modules/bcryptjs || ln -s /tmp/auth-release-extra/node_modules/bcryptjs node_modules/bcryptjs
      - name: Update only accepted auth code while keeping preference runtime disabled
        env:
          DEPLOY_AUTH_PREFERENCE_CODE: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-auth-preference-code.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: auth-preference-code-release, path: test-results/auth-preference-release}
