name: Release confirmed self-session revocation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-session-revocation-fix.yml']
  workflow_run:
    workflows: ['Auth Worker unit and PostgreSQL tests']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: primecare-cloudflare-typescript-production
  cancel-in-progress: false
jobs:
  checks:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            let authRunId=context.payload.workflow_run?.id;
            if(!authRunId){
              const runs=(await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'auth-worker-tests.yml',branch:'main',status:'success',per_page:1})).data.workflow_runs;
              if(!runs.length)throw Error('Successful current auth backend verification required');
              authRunId=runs[0].id;
            }
            const authRun=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:authRunId})).data;
            const nativeRuns=(await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'verify-session-revocation-fault.yml',branch:'main',per_page:100})).data.workflow_runs;
            const nativeRun=nativeRuns.find(r=>r.head_sha===authRun.head_sha)||nativeRuns.find(r=>r.conclusion==='success');
            if(!nativeRun)throw Error('Current native revocation proof required');
            const invalidationRuns=(await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'verify-auth-invalidation.yml',branch:'main',per_page:100})).data.workflow_runs;
            const invalidationRun=invalidationRuns.find(r=>r.head_sha===authRun.head_sha)||invalidationRuns.find(r=>r.conclusion==='success');
            const passwordRuns=(await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'account-password-acceptance.yml',branch:'main',per_page:100})).data.workflow_runs;
            // A repaired newer proof may supersede a failed run for the same Worker source.
            // It must be successful and match both the Worker and password UI inputs below.
            const passwordRun=passwordRuns.find(r=>r.conclusion==='success')||passwordRuns.find(r=>r.head_sha===authRun.head_sha);
            if(!invalidationRun||!passwordRun)throw Error('Native invalidation and real password UI proof required');
            for(const run_id of [authRunId,nativeRun.id,invalidationRun.id,passwordRun.id]){
              let run;
              for(let i=0;i<48;i++){
                run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id})).data;
                if(run.status==='completed')break;
                await new Promise(resolve=>setTimeout(resolve,15000));
              }
              if(run.conclusion!=='success')throw Error('Required native/unit verification failed: '+run_id+' '+run.conclusion);
              const comparison=(await github.rest.repos.compareCommits({owner,repo,base:run.head_sha,head:context.sha})).data;
              if(comparison.files.some(f=>f.filename.startsWith('cloudflare/workers/')))throw Error('Worker source changed after required checks');
              if(run_id===passwordRun.id&&comparison.files.some(f=>f.filename.startsWith('websites/typescript/src/')||f.filename.startsWith('packages/shared/')||f.filename==='packages/primecare_ui/lib/src/localization/screens/auth.json'||f.filename.startsWith('packages/database/migrations/')))throw Error('Password browser runtime inputs changed after successful proof');
            }
  deploy-auth:
    needs: checks
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate credentials, pinned governance and existing auth schema
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PRODUCTION_DATABASE_URL"
          npm install --prefix "$RUNNER_TEMP/auth-release" --ignore-scripts wrangler@4.68.1 pg@8.16.3 @types/pg@8.15.5 bcryptjs@3.0.2 typescript@5.9.3 @cloudflare/workers-types@4.20260403.1
          ln -s "$RUNNER_TEMP/auth-release/node_modules" node_modules
          pip install -r tools/governance-production/requirements.txt
          python3 tools/governance-production/verify-production-reader.py
          python3 scripts/check-api-catalog-identity.py
          node scripts/check-auth-schema.mjs
          npx tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --types @cloudflare/workers-types cloudflare/workers/src/service.ts
          node scripts/generate-cloudflare-worker-config.mjs
      - name: Publish the tested auth Worker and preserve existing encrypted database binding
        run: |
          set -euo pipefail
          npx wrangler secret list --config .cloudflare-workers/auth.jsonc > "$RUNNER_TEMP/auth-secrets.json"
          jq -e 'any(.[]; .name == "DB_URL")' "$RUNNER_TEMP/auth-secrets.json" > /dev/null
          npx wrangler deploy --config .cloudflare-workers/auth.jsonc
          curl --fail --show-error --retry 10 --retry-all-errors --retry-delay 5 'https://primecare-auth-api.itpro-mohammed.workers.dev/health'
          curl --fail --show-error --retry 10 --retry-all-errors --retry-delay 5 'https://primecare-api-gateway.itpro-mohammed.workers.dev/v1/auth/health'
