name: Finalize merged authentication repair lifecycle
on:
  push:
    branches: [main]
    paths: [.github/workflows/auth-session-finalize.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      final_main: ${{ steps.cleanup.outputs.final_main }}
    steps:
      - uses: actions/github-script@v7
        id: cleanup
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,head='b306f3dbc52a08381fd2d93381d2f2bc2efac3c3';
            const {data:pr}=await github.rest.pulls.get({owner,repo,pull_number:217});
            if(!pr.merged||pr.state!=='closed'||pr.head.sha!==head)throw Error('Expected merged PR217 head missing');
            const {data:main}=await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            const {data:comparison}=await github.rest.repos.compareCommits({owner,repo,base:head,head:main.object.sha});
            if(comparison.behind_by!==0)throw Error('Main does not include proven head');
            try{
              const {data:branch}=await github.rest.git.getRef({owner,repo,ref:'heads/work/auth-session-repair-20261020'});
              if(branch.object.sha!==head)throw Error('Branch changed; preserve it');
              await github.rest.git.deleteRef({owner,repo,ref:'heads/work/auth-session-repair-20261020'});
            }catch(error){if(error.status!==404)throw error;}
            const paths=['.github/workflows/auth-session-finalize.yml','.github/workflows/workspace-resource-cutover.yml','.github/workflows/verify-workspace-signout-repair.yml'];
            const {data:commit}=await github.rest.git.getCommit({owner,repo,commit_sha:main.object.sha});
            const {data:tree}=await github.rest.git.createTree({owner,repo,base_tree:commit.tree.sha,tree:paths.map(path=>({path,mode:'100644',type:'blob',sha:null}))});
            const {data:cleanup}=await github.rest.git.createCommit({owner,repo,message:'chore: close merged auth session repair launchers',tree:tree.sha,parents:[main.object.sha]});
            await github.rest.git.updateRef({owner,repo,ref:'heads/main',sha:cleanup.sha,force:false});
            core.setOutput('final_main',cleanup.sha);
            core.info('MERGED_AUTH_LIFECYCLE '+JSON.stringify({merge:pr.merge_commit_sha,final_main:cleanup.sha,remote_branch_deleted:true,pr_closed:true}));
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.cleanup.outputs.final_main }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Save exact production handoff without promoting incomplete workflows
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          FINAL_MAIN: ${{ steps.cleanup.outputs.final_main }}
        run: |
          python -u - <<'PY'
          import sys,json,os,pathlib
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import summary
          with ProductionWorkflowStore() as db:
           statuses=[dict(zip(['workflow_id','verification_status','test_status','blockers'],r)) for r in db.execute("SELECT flow_id,verification_status,test_status,blocker_json FROM virtual_workflow_definitions WHERE flow_kind='business_process' AND flow_id LIKE ?",('auth.%',))]
           state={'main_sha':os.environ['FINAL_MAIN'],'merged_main_commit':'77145e9daf0840a9e4dbe6909a151e9a5beca7da','published_work_sha':'b306f3dbc52a08381fd2d93381d2f2bc2efac3c3','active_remote_work_branch':None,'pr':217,'pr_state':'closed/merged','remote_cleanup':'complete','local_cleanup':'awaiting local main fast-forward and merged branch deletion confirmation','ci':'23 success, 3 skipped, no failed or unfinished current-head checks before merge','review':'No independent auth acceptance approval recorded; no verification promotion','attempts':[350,351],'workflows':statuses,'summary':summary(db),'evidence':'https://github.com/shaikhrais/primecare-platform/actions/runs/39423663930/artifacts/12263869961','synthetic_cleanup':'Native browser producers dropped isolated fixture schemas; no production business data changed or email sent','full_auth_verified':False,'next_action':'Confirm local main fast-forward and merged branch deletion. Then reconcile auth.save-email-config and auth.test-maintenance-email with existing registered APIs16494/16495 using the bounded production adapter and native tests. Reproduce and repair malformed success acknowledgements. Remaining auth requirements and independent review gates remain unresolved.'}
           for name in ['auth-completion-current','execution-handoff-current']:
            db.execute('INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP',(name,json.dumps(state)))
          pathlib.Path('auth-session-final-handoff.json').write_text(json.dumps(state,indent=2))
          print('AUTH_MERGED_HANDOFF '+json.dumps({k:v for k,v in state.items() if k!='workflows'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: auth-session-merged-handoff
          path: auth-session-final-handoff.json
