name: Publish Client with shared authentication
on:
  push:
    branches: [deploy/client-auth-20261010]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-client-auth
  cancel-in-progress: false
jobs:
  auth-worker:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Worker dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/auth-dependencies" --ignore-scripts wrangler@4.68.1 esbuild@0.27.2 pg@8.16.3 bcryptjs@3.0.2
          ln -s "$RUNNER_TEMP/auth-dependencies/node_modules" node_modules
      - name: Verify auth before deployment
        run: |
          node --test scripts/test-auth-api.mjs scripts/test-auth-password.mjs scripts/test-auth-recovery.mjs scripts/test-auth-rate-limit.mjs scripts/test-auth-source.mjs scripts/test-auth-management.mjs
          node scripts/check-auth-schema.mjs
      - name: Deploy Auth Worker and Gateway
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/generate-cloudflare-worker-config.mjs
          node_modules/.bin/wrangler deploy --config .cloudflare-workers/auth.jsonc
          printf '%s' "$PRODUCTION_DATABASE_URL" | node_modules/.bin/wrangler secret put DB_URL --config .cloudflare-workers/auth.jsonc
          node_modules/.bin/wrangler deploy --config .cloudflare-workers/gateway.jsonc
      - name: Check auth gateway
        run: curl --fail --retry 5 --retry-delay 5 https://primecare-api-gateway.itpro-mohammed.workers.dev/v1/auth/health
  client:
    needs: auth-worker
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify central contracts and auth UI
        run: |
          (cd packages/primecare_models && dart pub get && dart analyze && dart test)
          (cd packages/primecare_core && dart pub get && dart analyze && dart test)
          (cd packages/primecare_ui && flutter pub get && flutter analyze && flutter test)
      - name: Build Client with shared auth gateway
        working-directory: apps/primecare_client
        run: |
          flutter pub get
          flutter analyze
          flutter build web --release --dart-define=AUTH_API_URL=https://primecare-api-gateway.itpro-mohammed.workers.dev/v1/auth
      - uses: actions/upload-artifact@v4
        with:
          name: primecare-client-auth-web
          path: apps/primecare_client/build/web
      - name: Publish Client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.68.1 pages deploy apps/primecare_client/build/web --project-name=primecare-client --branch=main --commit-hash="$GITHUB_SHA"
      - name: Check published Client responds
        run: |
          curl --fail --retry 5 --retry-delay 5 https://primecare-client.pages.dev/
