name: Code Admin page and workflow audit
on:
  push:
    branches: [main]
    paths: ['websites/typescript/src/shell-icons.ts', 'websites/typescript/src/media-look.ts', 'websites/typescript/src/shell.ts', 'websites/typescript/src/navigation.ts', 'websites/typescript/src/layout-customizer.ts', 'scripts/test-layout-manager-browser.mjs', '.github/workflows/code-admin-page-audit.yml', 'scripts/browser-accessibility.mjs', 'scripts/test-admin-training-browser.mjs', 'scripts/test-external-call-browser.mjs', 'websites/typescript/src/styles.css', 'websites/typescript/src/code-admin-layout.ts']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  presentation:
    runs-on: ubuntu-24.04
    env: {CALL_BROWSER_EXECUTABLE: /usr/bin/google-chrome}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare explicit isolated governance metadata
        env: {GOVERNANCE_ALLOW_SQLITE_FIXTURES: '1'}
        run: python3 tools/governance-production/prepare-ci-fixture.py
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/page-audit-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 typescript@5.9.3 pg@8.16.3 bcryptjs@3.0.2 @twilio/voice-sdk@2.18.5 axe-core@4.10.3
          ln -s "$RUNNER_TEMP/page-audit-tools/node_modules" node_modules
      - run: npx playwright install chromium
      - name: Check layout preferences, training, theme, voice administration and Account workflows
        run: |
          failed=0
          mkdir -p test-results/code-admin-page-audit
          for script in test-layout-manager-browser test-theme-center-browser test-admin-training-browser test-vapi-admin-browser test-sms-verification-panel test-voice-pairing-panel test-external-call-browser test-screen-text-browser
          do
            if node "scripts/$script.mjs"
            then
              printf '%s PASS\n' "$script" >> test-results/code-admin-page-audit/results.txt
            else
              failed=1
              printf '%s FAIL\n' "$script" >> test-results/code-admin-page-audit/results.txt
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: code-admin-presentation-audit, path: test-results, retention-days: 14}

  visual-review-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: audit, POSTGRES_PASSWORD: fixture-only, POSTGRES_DB: audit}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U audit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GROWTH_TEST_DATABASE_URL: postgresql://audit:fixture-only@localhost:5432/audit
    steps:
      - uses: actions/checkout@v4
      - name: Prepare explicit isolated governance metadata
        env: {GOVERNANCE_ALLOW_SQLITE_FIXTURES: '1'}
        run: python3 tools/governance-production/prepare-ci-fixture.py
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/page-audit-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 typescript@5.9.3 pg@8.16.3 bcryptjs@3.0.2 @twilio/voice-sdk@2.18.5 axe-core@4.10.3
          ln -s "$RUNNER_TEMP/page-audit-tools/node_modules" node_modules
      - run: npx playwright install chromium
      - run: node --test scripts/test-look-manager.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: code-admin-look-workflow-audit, path: test-results, retention-days: 14}

  account-database-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: audit, POSTGRES_PASSWORD: fixture-only, POSTGRES_DB: voice_identity_schema_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U audit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKFLOW_TEST_DATABASE_URL: postgresql://audit:fixture-only@localhost:5432/voice_identity_schema_test
      AUTH_TEST_DATABASE_URL: postgresql://audit:fixture-only@localhost:5432/auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/account-audit-tools" --ignore-scripts --no-audit --no-fund pg@8.16.3 esbuild@0.27.2 bcryptjs@3.0.2 twilio@6.2.0
          ln -s "$RUNNER_TEMP/account-audit-tools/node_modules" node_modules
      - name: Verify phone enrollment through real storage and a synthetic SMS provider
        run: |
          node scripts/migrate-voice-identity-schema.mjs --reference
          node --test scripts/test-voice-identity-schema.mjs scripts/test-voice-contact-enrollment.mjs scripts/test-phone-number.mjs
      - name: Verify own account and session boundaries for both identifier types
        run: |
          for identity in text uuid
          do
            node --input-type=module -e "import pg from 'pg';const c=new pg.Client({connectionString:process.env.WORKFLOW_TEST_DATABASE_URL});await c.connect();await c.query('DROP DATABASE IF EXISTS auth_test');await c.query('CREATE DATABASE auth_test');await c.end();"
            AUTH_TEST_ID_TYPE="$identity" node scripts/test-auth-postgres.mjs
            AUTH_TEST_ID_TYPE="$identity" node scripts/test-account-session-pages-postgres.mjs
            AUTH_TEST_ID_TYPE="$identity" node scripts/test-self-sessions-postgres.mjs
          done
