name: Inspect CEO bootstrap requirements
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-ceo-bootstrap.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix /tmp/govt-reader --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/govt-reader/node_modules node_modules
          pip install -r tools/governance-production/requirements.txt
      - env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import sys,json,sqlite3
          sys.path.insert(0,'tools/governance-production')
          from production_reader import connect
          with connect() as db:
              db.row_factory=sqlite3.Row
              flow='auth.bootstrap-first-ceo'
              queries={
                'policy':("SELECT * FROM auth_setup_policy WHERE policy_code=?",('first_ceo',)),
                'definition':("SELECT * FROM virtual_workflow_definitions WHERE flow_id=?",(flow,)),
                'steps':("SELECT * FROM virtual_workflow_steps WHERE flow_id=? ORDER BY step_order",(flow,)),
                'links':("SELECT * FROM virtual_workflow_source_links WHERE flow_id=?",(flow,)),
                'guides':("SELECT * FROM virtual_role_flow_guides WHERE LOWER(title) LIKE '%bootstrap%' OR LOWER(title) LIKE '%ceo%'",()),
                'checkpoint':("SELECT * FROM virtual_workflow_checkpoints WHERE flow_id=?",(flow,)),
                'snapshots':("SELECT name,updated_at FROM virtual_flow_catalog_snapshots",()),
                'totals':("SELECT verification_status,COUNT(*) AS count FROM virtual_workflow_definitions WHERE flow_kind='business_process' GROUP BY verification_status",())
              }
              for name,(sql,args) in queries.items():print('CEO_'+name.upper()+' '+json.dumps([dict(r) for r in db.execute(sql,args)],default=str))
          PY
