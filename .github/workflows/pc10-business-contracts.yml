name: Discover existing PC10 business contracts
on:
  push:
    branches: [main]
    paths:
      - 'tools/governance-production/pc10-business-contract-discovery.mjs'
      - '.github/workflows/pc10-business-contracts.yml'
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/pc10-contract-tools --ignore-scripts --no-audit --no-fund pg@8.16.3
          ln -s /tmp/pc10-contract-tools/node_modules node_modules
          node tools/governance-production/pc10-business-contract-discovery.mjs
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
