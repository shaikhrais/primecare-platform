name: Runtime theme and XML layout manager
on:
  pull_request:
    paths: ['websites/typescript/**', 'packages/domain/src/layout_profile.ts', 'scripts/test-layout-manager-browser.mjs', '.github/workflows/layout-manager.yml']
permissions:
  contents: read
concurrency:
  group: layout-manager-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/layout-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 typescript@5.9.3 @twilio/voice-sdk@2.18.5
          ln -s "$RUNNER_TEMP/layout-tools/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - run: node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --resolveJsonModule --esModuleInterop --lib ES2022,DOM,DOM.Iterable websites/typescript/src/main.ts
      - run: node scripts/test-layout-manager-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-layout-manager
          path: artifacts/layout-manager
