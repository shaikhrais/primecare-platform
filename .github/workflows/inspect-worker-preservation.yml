name: Inspect generic Worker preservation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-worker-preservation.yml
      - scripts/check-generic-worker-deploy.mjs
      - scripts/test-generic-worker-deploy.mjs
      - scripts/preserve-generic-worker-observability.mjs
      - scripts/test-generic-worker-observability.mjs
      - scripts/generate-cloudflare-worker-config.mjs
      - scripts/describe-worker-preservation.mjs
      - scripts/test-describe-worker-preservation.mjs
      - scripts/worker-secret-retention.mjs
      - scripts/test-worker-secret-retention.mjs

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the release configuration and test the preservation guard
        run: |
          node scripts/generate-cloudflare-worker-config.mjs
          node --test scripts/test-generic-worker-deploy.mjs
          node --test scripts/test-generic-worker-observability.mjs
          node --test scripts/test-describe-worker-preservation.mjs
          node --test scripts/test-worker-secret-retention.mjs
          node scripts/preserve-generic-worker-observability.mjs
      - name: Summarize non-secret live settings
        run: node scripts/describe-worker-preservation.mjs
      - name: Compare each live Worker without making changes
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for service in client provider visit notes billing scheduling notification verification compliance governance franchise-reporting gateway; do
            if node scripts/check-generic-worker-deploy.mjs --service "$service"; then
              echo "$service: preservation check passed"
            else
              echo "::error::$service: preservation check failed; generic deployment remains blocked"
              failed=1
            fi
          done
          exit "$failed"
