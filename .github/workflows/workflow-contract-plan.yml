name: Workflow contract review coverage
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'docs/**'
      - '.agents/**'
      - 'cloudflare/**'
      - 'packages/**'
      - 'apps/**'
      - 'services/**'
      - 'generated_screen_backup_before_template_reset/**'
      - '.github/workflows/workflow-contract-plan.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - '.agents/**'
      - 'cloudflare/**'
      - 'packages/**'
      - 'apps/**'
      - 'services/**'
      - 'generated_screen_backup_before_template_reset/**'
      - '.github/workflows/workflow-contract-plan.yml'
permissions:
  contents: read
jobs:
  contract-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: python3 scripts/test-workflow-contract-plan.py
      - run: python3 scripts/generate-workflow-contract-plan.py --check
      - run: python3 scripts/test-primecare-contract-factory.py
      - run: python3 scripts/primecare-contract-factory.py --check
      - run: python3 scripts/test-primecare-bulk-codegen.py
      - run: python3 scripts/primecare-bulk-codegen.py --check
  generated-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Typecheck generated domain contracts
        run: |
          npm install --prefix "$RUNNER_TEMP/workflow-tsc" --ignore-scripts --no-audit --no-fund typescript@5.8.3
          "$RUNNER_TEMP/workflow-tsc/node_modules/.bin/tsc" --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext packages/domain/src/generated/unimplemented-workflow-contracts.ts
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: packages/flutter_core
      - run: flutter test test/unimplemented_workflow_contracts_test.dart
        working-directory: packages/flutter_core
      - run: flutter analyze lib/src/generated/unimplemented_workflow_contracts.dart test/unimplemented_workflow_contracts_test.dart
        working-directory: packages/flutter_core
