name: Render requested EMS and Dart Theme Center screenshots
on:
  push:
    branches: [main]
    paths: ['packages/flutter_core/test/screenshots/theme_center_capture_test.dart', 'tools/screen-preview/capture-requested-ems.mjs', '.github/workflows/requested-ems-theme-screenshots.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/flutter_core
      - name: Render actual shared Dart Theme Center panels
        working-directory: packages/flutter_core
        run: flutter test --update-goldens test/screenshots/theme_center_capture_test.dart --reporter expanded
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install browser capture tools
        run: |
          npm install --prefix "$RUNNER_TEMP/requested-tools" --ignore-scripts --no-audit --no-fund esbuild@0.27.2 @playwright/test@1.60.0 @twilio/voice-sdk@2.18.5
          ln -s "$RUNNER_TEMP/requested-tools/node_modules" node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Render the actual EMS HTML with isolated sample data
        run: |
          node tools/screen-preview/build.mjs
          node tools/screen-preview/capture-requested-ems.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requested-ems-theme-screenshots
          path: |
            packages/flutter_core/test/screenshots/captures
            packages/flutter_core/test/screenshots/failures
            test-results/requested-screenshots
          retention-days: 30
