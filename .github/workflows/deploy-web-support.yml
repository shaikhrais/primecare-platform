name: Deploy Web - primecare-support

on:
  push:
    branches: [main]
    paths:
      - 'apps/primecare_support/**'
      - 'packages/flutter_core/**'
      - 'packages/primecare_ui/**'
      - '.github/workflows/deploy-web-support.yml'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-web.yml
    with:
      app: primecare_support
      project: primecare-support
    secrets: inherit
