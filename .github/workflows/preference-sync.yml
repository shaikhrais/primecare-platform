name: Account preference sync
on:
  push:
    branches: [main]
    paths:
      - 'packages/domain/src/preference_sync.ts'
      - 'packages/shared/src/preference-sync/**'
      - 'packages/flutter_core/lib/preference_sync*'
      - 'packages/flutter_core/lib/preference_sync/**'
      - 'packages/flutter_core/test/preference_sync/**'
      - 'packages/primecare_ui/lib/preference_sync.dart'
      - 'packages/primecare_ui/web/preference-sync.ts'
      - 'cloudflare/workers/src/account-preferences.ts'
      - 'cloudflare/workers/src/gateway.ts'
      - 'cloudflare/workers/src/service-application.ts'
      - 'scripts/*preference*.mjs'
      - '.github/workflows/preference-sync.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/preference-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 @types/node@22.20.5 pg@8.16.3 @electric-sql/pglite@0.3.14 bcryptjs@3.0.3
          ln -s /tmp/preference-tools/node_modules node_modules
          node scripts/preference-sync-fixtures.mjs
          node scripts/test-preference-client.mjs
          node scripts/test-preference-registration.mjs
          node scripts/test-preference-service.mjs
          node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable --resolveJsonModule packages/shared/src/preference-sync/transport.ts cloudflare/workers/src/account-preferences.ts
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: preference_test, POSTGRES_PASSWORD: isolated, POSTGRES_DB: preference_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PREFERENCE_TEST_DATABASE_URL: postgresql://preference_test:isolated@127.0.0.1:5432/preference_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/preference-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 pg@8.16.3 @electric-sql/pglite@0.3.14 bcryptjs@3.0.3 playwright@1.60.0
          ln -s /tmp/preference-tools/node_modules node_modules
          npx playwright install --with-deps chromium
          node scripts/test-preference-service.mjs
          node scripts/test-preference-browser.mjs
  native:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: packages/flutter_core
      - run: flutter analyze --no-fatal-infos lib/preference_sync lib/preference_sync.dart test/preference_sync
        working-directory: packages/flutter_core
      - run: flutter test test/preference_sync --reporter expanded
        working-directory: packages/flutter_core
