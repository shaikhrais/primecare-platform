name: Deploy authenticated Vapi tool boundary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-vapi-tool-boundary.yml'
      - 'cloudflare/workers/src/business-tasks/vapi-tool-boundary.ts'
      - 'scripts/deploy-vapi-tool-boundary.mjs'
      - 'scripts/test-vapi-tool-boundary.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primecare-vapi-tool-boundary-production
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/vapi-boundary-tests" --ignore-scripts --no-audit --no-fund esbuild@0.25.5
          ln -s "$RUNNER_TEMP/vapi-boundary-tests/node_modules" node_modules
      - run: node --test scripts/test-vapi-management.mjs scripts/test-vapi-api-request.mjs scripts/test-vapi-service-auth.mjs scripts/test-vapi-tool-boundary.mjs scripts/test-communication-voice-tasks.mjs
  deploy:
    needs: tests
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact deployment dependencies before credentials are supplied
        run: |
          npm install --prefix "$RUNNER_TEMP/vapi-boundary-deploy" --ignore-scripts --no-audit --no-fund wrangler@4.68.1 pg@8.16.3
          ln -s "$RUNNER_TEMP/vapi-boundary-deploy/node_modules" node_modules
          pip install -r tools/governance-production/requirements.txt
      - name: Refuse stale main and independently verify registered API metadata
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          mkdir -p test-results/vapi
          python tools/governance-production/vapi_contracts_registration.py --verify > "$RUNNER_TEMP/vapi-registration-readback.txt"
          python - <<'PY'
          import json,os,pathlib
          lines=(pathlib.Path(os.environ['RUNNER_TEMP'])/'vapi-registration-readback.txt').read_text().splitlines()
          receipts=[json.loads(line.removeprefix('VAPI_CONTRACT_REGISTRATION ')) for line in lines if line.startswith('VAPI_CONTRACT_REGISTRATION ')]
          assert len(receipts)==1 and receipts[0]['independentReadback'] is True and receipts[0]['writesAttempted'] is False
          pathlib.Path('test-results/vapi/deployment-registration.json').write_text(json.dumps(receipts[0],indent=2)+'\n')
          print('Verified registered Vapi API',receipts[0]['apiIds']['vapi.tasks'])
          PY
      - name: Deploy only the closed Vapi boundary, provision scoped credential, and verify HTTP denials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPI_PRIVATE_API_KEY: ${{ secrets.VAPI_PRIVATE_API_KEY }}
        run: node scripts/deploy-vapi-tool-boundary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vapi-authenticated-boundary-deployment
          path: test-results/vapi
          retention-days: 30
