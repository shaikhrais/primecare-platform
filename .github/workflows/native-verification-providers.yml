name: Verify named infrastructure report providers
on:
  push:
    branches: [main]
    paths:
      - 'packages/primecare_verification/**'
      - 'packages/primecare_runtime/lib/verification_providers.dart'
      - 'packages/primecare_runtime/lib/src/application/services/verification_service.dart'
      - '.github/workflows/native-verification-providers.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - working-directory: packages/primecare_verification
        run: flutter pub get
      - working-directory: packages/primecare_verification
        run: flutter analyze --no-fatal-infos lib test
      - working-directory: packages/primecare_verification
        run: flutter test --reporter expanded
      - working-directory: packages/primecare_runtime
        run: flutter pub get
      - working-directory: packages/primecare_runtime
        run: flutter analyze --no-fatal-infos lib/verification_providers.dart lib/src/application/services/verification_service.dart
