name: Deploy Web - primecare-franchise

on:
  push:
    branches: [main]
    paths:
      - 'apps/primecare_franchise/**'
      - 'packages/flutter_core/**'
      - 'packages/primecare_ui/**'
      - '.github/workflows/deploy-web-franchise.yml'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-web.yml
    with:
      app: primecare_franchise
      project: primecare-franchise
    secrets: inherit
