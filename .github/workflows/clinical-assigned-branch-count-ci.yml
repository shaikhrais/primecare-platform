name: Verify isolated Clinical Director branch-count API candidate
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clinical-assigned-branch-count-ci.yml
      - tests/fixtures/clinical-director-api-candidate/assigned-branch-count.review.patch
  workflow_dispatch:
permissions: {contents: read}
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Check source and apply the pinned patch to this runner only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          patch=tests/fixtures/clinical-director-api-candidate/assigned-branch-count.review.patch
          echo "8a9522785c38db30e1dc95be67fe57450d3c9ae1b60c02b1d53ccfdaa7649492  $patch" | sha256sum --check
          git apply --check "$patch"
          git apply "$patch"
      - run: npm ci --ignore-scripts
      - run: npm install --prefix "$RUNNER_TEMP/clinical-route" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Run the real gateway and Worker on the isolated database
        env:
          PGLITE_FIXTURE_MODULE: ${{ runner.temp }}/clinical-route/node_modules/@electric-sql/pglite
        run: |
          set -euo pipefail
          export NODE_PATH="$PWD/node_modules"
          node --test tests/fixtures/clinical-director-api-candidate/route.test.mjs scripts/test-worker-inheritance.mjs
      - name: Check Worker types and bundle locally
        run: |
          set -euo pipefail
          npx --no-install tsc --noEmit --allowImportingTsExtensions --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --types @cloudflare/workers-types,node cloudflare/workers/src/service.ts cloudflare/workers/src/gateway.ts
          npx --no-install esbuild cloudflare/workers/src/service.ts cloudflare/workers/src/gateway.ts --bundle --platform=node --packages=external --outdir="$RUNNER_TEMP/clinical-api-bundles"
          echo 'Candidate verified in an isolated fixture; no API runtime files were committed, uploaded or deployed.' >> "$GITHUB_STEP_SUMMARY"
