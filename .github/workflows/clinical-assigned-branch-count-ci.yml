name: Verify Clinical Director branch-count API without publishing
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clinical-assigned-branch-count-ci.yml
      - tests/fixtures/clinical-director-api-candidate/**
      - cloudflare/workers/src/clinical-dashboard.ts
      - cloudflare/workers/src/business-modules.ts
      - cloudflare/workers/src/gateway.ts
      - scripts/test-worker-inheritance.mjs
      - tools/deployment/api_release_approval.py
      - tools/deployment/test_api_release_approval.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Pin source and require the real route
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f cloudflare/workers/src/clinical-dashboard.ts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest tools.deployment.test_api_release_approval
      - run: npm ci --ignore-scripts
      - run: npm install --prefix "$RUNNER_TEMP/clinical-route" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Run the real gateway and Worker on the isolated database
        env:
          PGLITE_FIXTURE_MODULE: ${{ runner.temp }}/clinical-route/node_modules/@electric-sql/pglite
        run: |
          set -euo pipefail
          export NODE_PATH="$PWD/node_modules"
          node --test tests/fixtures/clinical-director-api-candidate/route.test.mjs scripts/test-worker-inheritance.mjs
      - name: Check Worker types and bundle locally
        run: |
          set -euo pipefail
          npx --no-install tsc --noEmit --allowImportingTsExtensions --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --types @cloudflare/workers-types,node cloudflare/workers/src/service.ts cloudflare/workers/src/gateway.ts
          npx --no-install esbuild cloudflare/workers/src/service.ts cloudflare/workers/src/gateway.ts --bundle --platform=node --packages=external --outdir="$RUNNER_TEMP/clinical-api-bundles"
          echo 'Exact integrated route and approval checks passed against isolated fixtures. No production credentials, database, Worker, or portal were changed.' >> "$GITHUB_STEP_SUMMARY"
