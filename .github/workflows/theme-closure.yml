name: Theme cross-batch closure verification
on:
  workflow_dispatch:
    inputs:
      require_release_complete:
        description: Fail while any B01-B18 release gate remains open
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - cloudflare/workers/src/**
      - packages/flutter_core/test/**
      - packages/flutter_core/lib/**
      - packages/primecare_ui/web/**
      - packages/shared/src/**
      - packages/domain/src/**
      - websites/typescript/src/tenant-dashboard/**
      - tools/governance-production/theme-source-revisions.json
      - tools/governance-production/theme-adoption-preflight.mjs
      - scripts/test-theme-adoption-preflight.mjs
      - scripts/test-tenant-workspace-layout.mjs
      - scripts/tenant-dashboard-fixture.mjs
      - .github/workflows/theme-closure.yml
      - scripts/build-theme-execution-ledger.py
      - scripts/build-theme-service-contract-triage.py
      - scripts/test-theme-execution-plan.py
      - scripts/test-data-controls-rich-ranges.mjs
      - scripts/data-controls-rich-range-fixtures.mjs
      - docs/appearance/theme-execution-ledger.json
      - docs/appearance/theme-service-contract-triage.json
permissions: {contents: read}
concurrency:
  group: theme-closure-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test scripts/test-theme-adoption-preflight.mjs scripts/test-theme-workspace-export.mjs
      - name: Fetch immutable audited source for reproducibility
        run: |
          python - <<'PY'
          import json,re,subprocess
          source=json.load(open('docs/appearance/theme-batches-main-audit-snapshot.json'))['sourceCommit']
          assert re.fullmatch('[0-9a-f]{40}',source)
          subprocess.run(['git','fetch','--depth=1','origin',source],check=True)
          PY
      - run: |
          python scripts/build-theme-developer-catalogue.py --check
          python scripts/build-theme-execution-ledger.py --check
          python scripts/build-theme-service-contract-triage.py --check
          python scripts/test-theme-execution-plan.py
          python scripts/audit-theme-batches.py --check
          python scripts/check-theme-release.py --output docs/appearance/theme-release-gates.json
      - if: inputs.require_release_complete == true
        run: python scripts/check-theme-release.py --require-complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-release-gap-report
          path: docs/appearance/theme-release-gates.json
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/theme-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 typescript@5.9.3 playwright@1.60.0 @electric-sql/pglite@0.3.14 bcryptjs@3.0.2 pg@8.16.3 ajv@8.17.1 ajv-formats@3.0.1 postal-mime@4.1.2 htmlparser2@12.0.0
          ln -s /tmp/theme-tools/node_modules node_modules
          npx playwright install --with-deps chromium
      - name: Cross-batch models and real-handler fixtures
        run: |
          node scripts/test-data-controls-rich-ranges.mjs
          for name in workspace-layout-contract workspace-navigation-model page-template-model advanced-theme-model preference-client shell-utilities-model component-catalogue-model data-controls-model upload-removal dashboard-widgets-model original-assets-model work-modules work-modules-transport communication-modules communication-modules-transport application-modules application-modules-transport dashboard-pages-projection dashboard-pages-session dashboard-record-pages dashboard-pages-parity dashboard-pages-integration; do
            node scripts/test-$name.mjs
          done
      - name: Cross-batch browser acceptance
        run: |
          for name in shell-lifecycle workspace-layout tenant-workspace-layout tenant-work-module-host workspace-navigation-browser page-template-browser advanced-theme-browser preference-browser shell-utilities-browser component-catalogue-browser data-controls-browser dashboard-widgets-browser original-assets-browser work-modules-browser communication-modules-browser application-modules-browser dashboard-pages-browser; do
            node scripts/test-$name.mjs
          done
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: psw_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: fixture}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PSW_TEST_DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/psw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/theme-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 @electric-sql/pglite@0.3.14 bcryptjs@3.0.2 pg@8.16.3 ajv@8.17.1 ajv-formats@3.0.1 postal-mime@4.1.2 htmlparser2@12.0.0
          ln -s /tmp/theme-tools/node_modules node_modules
          npx playwright install --with-deps chromium
          for name in tenant-workspace-layout work-modules work-modules-browser communication-modules communication-modules-browser application-modules application-modules-browser dashboard-pages-integration dashboard-pages-browser; do
            node scripts/test-$name.mjs
          done
  oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix /tmp/oracle-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2
          ln -s /tmp/oracle-tools/node_modules node_modules
          node scripts/workspace-native-contract-fixtures.mjs
          node scripts/workspace-navigation-fixtures.mjs
          node scripts/page-template-fixtures.mjs
          node scripts/advanced-theme-fixtures.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: theme-shared-oracles
          path: |
            packages/flutter_core/test/workspace/fixtures/web.json
            packages/flutter_core/test/navigation/fixtures/web.json
            packages/flutter_core/test/page/fixtures/web.json
            packages/flutter_core/test/advanced_theme/fixtures/*.json
  native:
    needs: oracles
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - uses: actions/download-artifact@v4
        with:
          name: theme-shared-oracles
          path: packages/flutter_core/test
      - run: flutter pub get
        working-directory: packages/flutter_core
      - name: All shared theme factory tests together
        run: flutter test test/workspace test/navigation test/page test/advanced_theme test/preference_sync test/shell_utilities test/component_catalogue test/data_controls test/dashboard_widgets test/original_assets test/work_modules test/communication_modules test/application_modules test/dashboard_pages --reporter expanded
        working-directory: packages/flutter_core
