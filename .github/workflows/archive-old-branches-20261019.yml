name: Archive four old branches and retain four active branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-old-branches-20261019.yml']
permissions:
  contents: write
concurrency:
  group: archive-old-branches-20261019
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'shaikhrais/primecare-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Preserve four exact heads as tags and remove only their branch names
        run: |
          python3 - <<'PY_ARCHIVE'
          import json, os, pathlib, subprocess
          rows = json.loads('[{"branch":"codex/api-batch-12-client-invoices","sha":"80f76fe03009f42a0513ff962135d4601e34bac4","tag":"archive/20261019/codex/api-batch-12-client-invoices"},{"branch":"codex/resume-839-checkpoint","sha":"af0aacba77b0b24a5a28a4c2cfda952f0d7a1483","tag":"archive/20261019/codex/resume-839-checkpoint"},{"branch":"deploy/client-auth-20261010","sha":"a0934a2e2dc98d7b270c29bfeb1f4d9cf082e47c","tag":"archive/20261019/deploy/client-auth-20261010"},{"branch":"deploy/email-inbox-20261010","sha":"bcd0f3450e9c8e09adbbdd3c5c0d435717c93693","tag":"archive/20261019/deploy/email-inbox-20261010"}]')
          assert len(rows) == 4
          protected = {'main','codex/central-worker-classes','refactor/custom-shared-state-skeleton-20261009','refactor/shared-runtime-contracts-20261009'}
          assert not protected.intersection(r['branch'] for r in rows)
          def refs():
              return {ref:sha for sha,ref in (line.split() for line in subprocess.check_output(['git','ls-remote','origin'],text=True).splitlines())}
          before = refs()
          for row in rows:
              assert before.get('refs/heads/'+row['branch']) == row['sha'], 'Branch changed: '+row['branch']
              assert 'refs/tags/'+row['tag'] not in before, 'Archive tag already exists'
          subprocess.run(['git','fetch','--no-tags','--filter=blob:none','--depth=1','origin']+['refs/heads/'+r['branch'] for r in rows],check=True)
          command = ['git','push','--atomic','--porcelain']
          command += ['--force-with-lease=refs/heads/'+r['branch']+':'+r['sha'] for r in rows]
          command += ['--force-with-lease=refs/tags/'+r['tag']+':' for r in rows]
          command += ['origin']
          command += [r['sha']+':refs/tags/'+r['tag'] for r in rows]
          command += [':refs/heads/'+r['branch'] for r in rows]
          subprocess.run(command,check=True)
          after = refs()
          for row in rows:
              assert after.get('refs/tags/'+row['tag']) == row['sha'], 'Archive missing'
              assert 'refs/heads/'+row['branch'] not in after, 'Old branch remains'
          for branch in protected:
              assert after.get('refs/heads/'+branch) == before.get('refs/heads/'+branch), 'Protected branch changed'
          count = sum(ref.startswith('refs/heads/') for ref in after)
          assert count == 4, count
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('Archived four exact branch heads as archive/20261019 tags, then removed the four branch names atomically. Four active branches remain. No business code was merged or deleted.\n')
          PY_ARCHIVE
