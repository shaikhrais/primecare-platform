name: Compare current auth with accepted source
on:
  push:
    branches: [main]
    paths:
      - 'scripts/compare-generic-auth-release.mjs'
      - '.github/workflows/compare-generic-auth-release.yml'
permissions: {contents: read, actions: read}
jobs:
  compare:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify the partial generic release evidence
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,run_id=41916019404;
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id})).data;
            if(run.head_sha!=='85f00097c01729c86451ff2107e93136ef767e85'||run.head_branch!=='main'||run.conclusion!=='failure'||run.path!=='.github/workflows/release-screen-text.yml')throw Error('Generic release identity differs');
            const jobs=(await github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id,per_page:100})).data.jobs;
            if(!jobs.some(j=>j.name==='release_tests'&&j.conclusion==='success')||!jobs.some(j=>j.id===126878791158&&j.name==='apis / deploy'&&j.conclusion==='success'))throw Error('Generic auth upload evidence missing');
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Compare rebuilt source bytes with active provider content
        run: |
          mkdir -p "$RUNNER_TEMP/worker-dependencies"
          npm install --prefix "$RUNNER_TEMP/worker-dependencies" --ignore-scripts wrangler@4.68.1 pg@8.16.3 @types/pg@8.15.5 bcryptjs@3.0.2 typescript@5.9.3 @cloudflare/workers-types@4.20260403.1
          ln -s "$RUNNER_TEMP/worker-dependencies/node_modules" node_modules
          node scripts/compare-generic-auth-release.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
