name: Deploy PrimeCare Flutter Frontends

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - '.github/workflows/deploy-flutter.yml'

jobs:
  governance-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Install UI Package Dependencies
        working-directory: ./packages/factory_system/primecare_ui
        run: flutter pub get

      - name: Platform Governance Audit Gate
        working-directory: ./packages/factory_system/primecare_ui
        run: flutter test test/governance_audit_test.dart

  build-and-deploy:
    needs: governance-audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: 
          - primecare_business_development
          - primecare_client
          - primecare_clinic
          - primecare_corporate
          - primecare_franchise
          - primecare_marketing
          - primecare_support
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Formulate Project Name
        id: project-name
        run: echo "project_name=$(echo ${{ matrix.app }} | tr '_' '-')" >> $GITHUB_ENV

      - name: Install Dependencies
        working-directory: ./apps/${{ matrix.app }}
        run: flutter pub get

      - name: Build Web Application
        working-directory: ./apps/${{ matrix.app }}
        run: flutter build web --release

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ env.project_name }}
          directory: ./apps/${{ matrix.app }}/build/web
          branch: main
