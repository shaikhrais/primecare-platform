name: Credential login current-main browser attempt
on:
  push:
    branches: [main]
    paths: [.github/workflows/credential-login-browser.yml]
permissions:
  contents: read
jobs:
  requirements:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix /tmp/govt-reader --ignore-scripts --no-audit --no-fund pg@8.11.3
          ln -s /tmp/govt-reader/node_modules node_modules
          pip install -r tools/governance-production/requirements.txt
      - name: Read live checkpoint, registered requirements and theme
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import sys,json,sqlite3,pathlib
          sys.path.insert(0,'tools/governance-production')
          from production_reader import connect
          with connect() as db:
              db.row_factory=sqlite3.Row
              flow='auth.credential-login'
              def rows(sql,params=()):return [dict(r) for r in db.execute(sql,params)]
              result=dict(definition=rows('SELECT * FROM virtual_workflow_definitions WHERE flow_id=?',(flow,))[0],steps=rows('SELECT * FROM virtual_workflow_steps WHERE flow_id=?',(flow,)),links=rows('SELECT * FROM virtual_workflow_source_links WHERE flow_id=?',(flow,)),checkpoint=rows('SELECT * FROM virtual_workflow_checkpoints WHERE flow_id=?',(flow,)),api=rows('SELECT * FROM api_endpoints WHERE route_path=?',('/v1/auth/login',)),guides=rows('SELECT outline_id,title,role_id,app_id,definition_status FROM virtual_role_flow_guides WHERE guide_json LIKE ?',('%auth.credential-login%',)),snapshots=rows('SELECT name,updated_at FROM virtual_flow_catalog_snapshots'),counts=rows("SELECT verification_status,COUNT(*) AS count FROM virtual_workflow_definitions WHERE flow_kind='business_process' GROUP BY verification_status"),theme=dict(db.execute('SELECT css_variable_name,token_value FROM theme_design_tokens WHERE theme_id=1 AND active=1')))
              assert result['definition']['definition_sha256']=='47871a7c0750f03de65847537bfadd5cbe02895eb7e04fce920907ed062c3791'
          out=pathlib.Path('test-results/credential-login-browser');out.mkdir(parents=True,exist_ok=True);(out/'governance.json').write_text(json.dumps(result,indent=2))
          print('LOGIN_LIVE_COUNTS '+json.dumps(result['counts']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: credential-login-browser-governance
          path: test-results/credential-login-browser/governance.json
  browser:
    needs: requirements
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: login_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U primecare -d login_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: credential-login-browser-governance
          path: test-results/credential-login-browser
      - run: |
          npm install --prefix /tmp/login-browser --ignore-scripts --no-audit --no-fund pg@8.16.3 bcryptjs@3 esbuild@0.27.2 playwright@1.60.0
          ln -s /tmp/login-browser/node_modules node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Real credential UI, main router, gateway, worker, PostgreSQL and reload
        env:
          LOGIN_BROWSER_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/login_browser
        run: |
          cat > test-results/credential-login-browser/run.mjs <<'BROWSER'
          import assert from 'node:assert/strict';
          import pg from 'pg';import bcrypt from 'bcryptjs';import {build} from 'esbuild';import {chromium} from 'playwright';
          import {readFile,writeFile,mkdir,mkdtemp} from 'node:fs/promises';import {createRequire} from 'node:module';import {createServer} from 'node:http';import {createHash,randomUUID} from 'node:crypto';import {tmpdir} from 'node:os';import {join} from 'node:path';
          const out='test-results/credential-login-browser';await mkdir(out,{recursive:true});
          if(process.env.PRODUCTION_DATABASE_URL||process.env.GOVERNANCE_DATABASE_URL)throw Error('Production credentials forbidden in browser fixture');
          const connection=process.env.LOGIN_BROWSER_DATABASE_URL,url=new URL(connection);if(!['localhost','127.0.0.1'].includes(url.hostname)||url.pathname!='/login_browser')throw Error('Loopback login_browser database required');
          const db=new pg.Client({connectionString:connection});await db.connect();const schema='login_'+randomUUID().replaceAll('-','');await db.query('CREATE SCHEMA '+schema);await db.query('SET search_path TO '+schema);url.searchParams.set('options','-c search_path='+schema);
          const dir=await mkdtemp(join(tmpdir(),'primecare-login-main-')),require=createRequire(import.meta.url),digest=v=>createHash('sha256').update(v).digest('hex');
          const receipt={workflow_id:'auth.credential-login',passed:false,wholeTaskVerified:false,commit:process.env.GITHUB_SHA,cases:[],apiChecks:[],trace:[],navigation:[],source_bindings:{},limitations:['Loopback hosting with production source; not a deployed Cloudflare execution.','Cloudflare source limiter is a controlled synthetic binding; trusted source/origin headers are supplied by the harness.','Portal manifest only transports production theme plus fixture origin/name; no production business records.','Platform-admin landing only; all registered role destinations, full accessibility/PWA and independent review gates remain pending.']};
          let server,browser,bridgeFailure;const password='Synthetic-only!Login-2026',actor=randomUUID(),tenant=randomUUID(),foreign=randomUUID(),admin=randomUUID(),denied=randomUUID();
          const policy=JSON.parse(await readFile(out+'/governance.json','utf8'));assert.equal(policy.definition.definition_sha256,'47871a7c0750f03de65847537bfadd5cbe02895eb7e04fce920907ed062c3791');receipt.definition_sha256=policy.definition.definition_sha256;
          try{
           await db.query('CREATE TABLE tenants(id uuid PRIMARY KEY,name text,slug text UNIQUE,status text,created_at timestamptz DEFAULT NOW(),updated_at timestamptz DEFAULT NOW());CREATE TABLE users(id uuid PRIMARY KEY,tenant_id uuid REFERENCES tenants(id),email text UNIQUE,roles text,password_hash text,status text,updated_at timestamptz DEFAULT NOW());CREATE TABLE auth_sessions(user_id uuid REFERENCES users(id),token_hash text,expires_at timestamptz)');
           for(const file of ['20260928_auth_rate_limits.sql','20261011_platform_administration.sql'])await db.query(await readFile('packages/database/migrations/'+file,'utf8'));
           await db.query("INSERT INTO tenants(id,name,slug,status) VALUES($1,'Synthetic Primary','synthetic-primary','active'),($2,'Synthetic Foreign','synthetic-foreign','active')",[tenant,foreign]);const hash=await bcrypt.hash(password,12);
           for(const [id,t,email,role]of [[actor,tenant,'platform@example.invalid','platform_admin'],[admin,foreign,'admin@example.invalid','admin'],[denied,tenant,'psw@example.invalid','psw']])await db.query("INSERT INTO users(id,tenant_id,email,roles,password_hash,status) VALUES($1,$2,$3,$4,$5,'active')",[id,t,email,role,hash]);
           const front=await build({entryPoints:['websites/typescript/src/main.ts'],bundle:true,write:false,metafile:true,platform:'browser',format:'iife'});
           const back=await build({stdin:{contents:"export {default as gateway} from './cloudflare/workers/src/gateway';export {default as service} from './cloudflare/workers/src/service';",resolveDir:process.cwd()},bundle:true,platform:'node',format:'cjs',write:false,metafile:true,external:['pg']});
           const backend=join(dir,'backend.cjs');await writeFile(backend,back.outputFiles[0].text.replaceAll('require("pg")',`require(${JSON.stringify(join(process.cwd(),'node_modules/pg'))})`));const {gateway,service}=require(backend);
           const paths=[...Object.keys(front.metafile.inputs),...Object.keys(back.metafile.inputs),'websites/typescript/src/styles.css',...['20260928_auth_rate_limits.sql','20261011_platform_administration.sql'].map(f=>'packages/database/migrations/'+f)];for(const path of paths)if(path!=='<stdin>'&&!path.includes('node_modules/'))receipt.source_bindings[path]=digest(await readFile(path));
           const env={DB_URL:url.toString(),AUTH_SOURCE_LIMIT:{limit:async()=>({success:true})}},css=await readFile('websites/typescript/src/styles.css','utf8');
           server=createServer(async(req,res)=>{try{const requestUrl=new URL(req.url,'http://fixture');
            if(requestUrl.pathname==='/app.js'){res.setHeader('content-type','text/javascript');res.end(front.outputFiles[0].text);return;}
            if(requestUrl.pathname==='/portal.json'){res.setHeader('content-type','application/json');res.end(JSON.stringify({project:'PrimeCare',appCode:'pc',name:'PrimeCare',apiGateway:origin,theme:policy.theme}));return;}
            if(['/login','/platform/administration','/'].includes(requestUrl.pathname)){const locale=requestUrl.searchParams.get('locale')||'en';res.setHeader('content-type','text/html');res.end(`<!doctype html><html lang="${['en','fr','es'].includes(locale)?locale:'en'}"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeCare synthetic login</title><style>${css}</style></head><body><div id="app"></div><script src="/app.js"></script></body></html>`);return;}
            if(requestUrl.pathname.startsWith('/v1/')){let body='';for await(const part of req)body+=part;const headers=new Headers(req.headers);headers.delete('accept-encoding');headers.set('origin','https://primecare-clinic.pages.dev');headers.set('cf-connecting-ip','192.0.2.1');
             const request=new Request(origin+req.url,{method:req.method,headers,...(body?{body}:{})});const bindings={AUTH:{fetch:r=>service.fetch(r,{...env,SERVICE_NAME:'auth'})},GOVERNANCE:{fetch:r=>service.fetch(r,{...env,SERVICE_NAME:'governance'})}};
             const response=await gateway.fetch(request,bindings);receipt.trace.push({path:requestUrl.pathname,method:req.method,status:response.status});res.writeHead(response.status,Object.fromEntries(response.headers));res.end(await response.text());return;}
            res.writeHead(404);res.end();
           }catch(error){bridgeFailure=error;res.writeHead(500);res.end('Synthetic bridge failure');}});await new Promise(r=>server.listen(0,'127.0.0.1',r));const origin='http://127.0.0.1:'+server.address().port;
           browser=await chromium.launch({headless:true});const cy=(page,id)=>page.locator('[data-cy="'+id+'"]');const waitLogin=async(page)=>{await cy(page,'login-submit').waitFor();};
           const submit=async(page,value=password)=>{await cy(page,'login-email').fill('platform@example.invalid');await cy(page,'login-password').fill(value);await cy(page,'login-submit').click();};
           const token=page=>page.evaluate(()=>sessionStorage.getItem('primecare_session'));
           const sessions=async()=>Number((await db.query('SELECT count(*) n FROM auth_sessions WHERE user_id=$1',[actor])).rows[0].n);
           for(const [locale,width]of [['en',320],['fr',1440],['es',768]]){
            await db.query('DELETE FROM auth_sessions');await db.query('DELETE FROM auth_rate_limits');const context=await browser.newContext({viewport:{width,height:1000},recordVideo:{dir:out+'/video',size:{width,height:1000}}}),page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('framenavigated',f=>{if(f===page.mainFrame())receipt.navigation.push(new URL(f.url()).pathname+new URL(f.url()).search);});
            try{await page.goto(origin+'/login?locale='+locale+'&enable-semantics=true');await waitLogin(page);const text=await cy(page,'login-submit').innerText();assert.ok(text.trim());
             const failed=page.waitForResponse(r=>r.url().endsWith('/v1/auth/login'));await submit(page,'Wrong-Synthetic-Password');assert.equal((await failed).status(),401);await cy(page,'api-status').filter({hasText:/./}).waitFor();assert.equal(await token(page),null);assert.equal(await sessions(),0);
             if(locale==='en'){
              await context.setOffline(true);await submit(page);await page.waitForTimeout(300);assert.equal(await token(page),null);assert.equal(await sessions(),0);await context.setOffline(false);receipt.apiChecks.push('offline credential submission creates no session; online retry available');
              await page.route('**/v1/auth/me',route=>route.fulfill({status:503,contentType:'application/json',body:JSON.stringify({error:'Synthetic confirmation outage'})}));const revoked=page.waitForResponse(r=>r.url().endsWith('/v1/auth/logout'));await submit(page);assert.equal((await revoked).status(),200);assert.equal(await token(page),null);assert.equal(await sessions(),0);await page.unroute('**/v1/auth/me');receipt.apiChecks.push('confirmation outage revokes provisional database session and leaves browser unauthenticated');
             }
             await submit(page);await cy(page,'platform-topbar-tenant').waitFor();assert.equal(new URL(page.url()).pathname,'/platform/administration');const bearer=await token(page);assert.ok(bearer);assert.equal(await sessions(),1);
             const persisted=(await db.query('SELECT token_hash,expires_at FROM auth_sessions WHERE user_id=$1',[actor])).rows[0];assert.equal(persisted.token_hash,digest(bearer));assert.ok(new Date(persisted.expires_at)>new Date());
             const displayed=await cy(page,'platform-topbar-tenant').evaluate(e=>Array.from(e.options).filter(o=>o.value).map(o=>({id:o.value,name:o.textContent})));const actual=(await db.query('SELECT id,name FROM tenants ORDER BY slug')).rows;assert.deepEqual(displayed,actual);
             await page.reload();await cy(page,'platform-topbar-tenant').waitFor();assert.equal(await token(page),bearer);assert.equal(await sessions(),1);await cy(page,'platform-language').selectOption(locale);assert.deepEqual(errors,[]);
             await page.screenshot({path:out+'/login-workspace-'+locale+'.png',fullPage:true});
             if(locale==='es'){await db.query("UPDATE auth_sessions SET expires_at=NOW()-INTERVAL '1 minute' WHERE user_id=$1",[actor]);await cy(page,'platform-refresh').click();await waitLogin(page);assert.equal(await token(page),null);receipt.apiChecks.push('expired session fails protected workspace read and clears browser token');}
             else{await cy(page,'platform-logout').click();await waitLogin(page);assert.equal(await token(page),null);assert.equal(await sessions(),0);}
             receipt.cases.push({locale,width,wrongCredentials:true,credentialLogin:true,actualMainEntry:true,actualGateway:true,actualServiceDispatch:true,nativePostgres:true,oneHashedSession:true,workspaceMatchesDatabase:true,reload:true,sessionRevocation:true});
            }finally{const video=page.video();await context.close();if(video)await video.saveAs(out+'/login-workspace-'+locale+'.webm');}
           }
           const login=async email=>{const r=await fetch(origin+'/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});assert.equal(r.status,200);return(await r.json()).token;};
           const adminToken=await login('admin@example.invalid'),deniedToken=await login('psw@example.invalid');const call=(path,t)=>fetch(origin+'/v1/governance/platform'+path,{headers:{authorization:'Bearer '+t}});
           assert.equal((await call('',deniedToken)).status,403);const scoped=await call('',adminToken);assert.equal(scoped.status,200);assert.deepEqual((await scoped.json()).tenants.map(t=>t.id),[foreign]);assert.equal((await call('/tenants/'+tenant,adminToken)).status,403);receipt.apiChecks.push('valid PSW denied platform permission; tenant admin sees only own tenant and cannot read foreign tenant');
           await db.query("UPDATE users SET status='inactive' WHERE id=$1",[actor]);const r=await fetch(origin+'/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:'platform@example.invalid',password})});assert.equal(r.status,401);receipt.apiChecks.push('inactive credentials denied');if(bridgeFailure)throw bridgeFailure;
           for(const[path,sha]of Object.entries(receipt.source_bindings))assert.equal(digest(await readFile(path)),sha);receipt.passed=true;
          }catch(error){receipt.error=error.message;console.error(error);process.exitCode=1;}
          finally{if(browser)await browser.close();if(server)await new Promise(r=>server.close(r));await db.query('DROP SCHEMA '+schema+' CASCADE');await db.end();receipt.cleanup='Isolated synthetic schema dropped; production business data untouched';await writeFile(out+'/results.json',JSON.stringify(receipt,null,2));console.log(JSON.stringify({passed:receipt.passed,browserCases:receipt.cases.length,apiChecks:receipt.apiChecks.length,wholeTaskVerified:false,error:receipt.error}));}
          
          BROWSER
          node test-results/credential-login-browser/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-login-current-main-browser
          path: test-results/credential-login-browser
