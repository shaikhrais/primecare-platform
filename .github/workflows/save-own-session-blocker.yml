name: Save own-session requirement blocker and inspect logout
on:
  push:
    branches: [main]
    paths: [.github/workflows/save-own-session-blocker.yml]
permissions:
  contents: read
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 39321720624
          github-token: ${{ github.token }}
          name: own-session-live-requirements
          path: test-results/own-sessions
      - run: pip install -r tools/governance-production/requirements.txt
      - name: Record exact dependency without inventing account UI or grants
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
        run: |
          python - <<'PY'
          import sys,os,json,pathlib,hashlib
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt,summary,_open_issues
          root=pathlib.Path.cwd();flow='auth.inspect-own-sessions';path='test-results/own-sessions/governance.json'
          report=json.loads((root/path).read_text());definition=report['definition'][0]
          assert definition['definition_sha256']=='d78a720e326c8fe09e2fbb153560169cb86dececab060e058377b28015789cb3'
          maps=report['ui_bindings'];assert maps['screens'][0]['id']==948 and maps['screens'][0]['active']==0 and maps['screens'][0]['screen_code']=='login'
          assert maps['screen_functions']==[] and maps['screen_components']==[] and maps['runtime_views']==[]
          api=next(a for a in report['apis'] if a['id']==16425)
          assert api['http_method']=='GET' and api['route_path']=='/v1/user/sessions' and api['permission_key']=='authenticated_self_session'
          assert '/v1/user/sessions' not in (root/'websites/typescript/src/account.ts').read_text()
          sources={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in ['cloudflare/workers/src/self-sessions.ts','cloudflare/workers/src/gateway.ts','websites/typescript/src/main.ts','websites/typescript/src/auth-screen.ts','websites/typescript/src/account.ts','websites/typescript/src/platform-admin.ts']}
          blockers=['Own-session UI is confirmed absent in current shared account renderer. The sole API screen link is inactive Guest login screen 948, with no own-session screen function, component, runtime view, element/test IDs or corresponding EN/FR/ES resources bound. Register approved authenticated-account controls before implementation; do not reinterpret Guest login placeholders as session-management requirements.','Workflow step 2 still binds draft GET /v1/auth/user/sessions while existing canonical endpoint 16425 is GET /v1/user/sessions with authenticated_self_session permission. Reconcile definition/steps/source links via a supported production metadata writer; do not execute the legacy SQLite registration script or invent an alias/grant.']
          handoff=dict(workflow_id=flow,main_sha=os.environ['GITHUB_SHA'],active_branch='main',work_branch=None,pr=None,actor_role='platform_admin',verification_status='missing',test_status='blocked',blockers=blockers,evidence_url='https://github.com/shaikhrais/primecare-platform/actions/runs/39321720624/artifacts/12220486545',synthetic_data_cleanup='No synthetic accounts or business data created; metadata/source inspection only',cleanup_required=['Remove temporary own-session inspection/recording workflows after final checkpoint'],next_workflow='auth.logout',next_action='Inspect auth.logout live definition and registered API/permissions/source/checkpoint; test Platform Admin real credential login, logout UI/API/database deletion, reload, foreign-session preservation, offline and database-failure retry. Own-session UI testing is blocked by the exact recorded registration dependency; do not repeat this unchanged source/metadata diagnosis.')
          with ProductionWorkflowStore() as db:
              assert db.execute('SELECT definition_sha256 FROM virtual_workflow_definitions WHERE flow_id=?',(flow,)).fetchone()[0]==definition['definition_sha256']
              existing=_open_issues(db,flow,root)
              for issue_id in existing:
                  for name in json.loads(db.execute('SELECT affected_sources_json FROM virtual_workflow_issues WHERE issue_id=?',(issue_id,)).fetchone()[0]):
                      sources[name]=hashlib.sha256((root/name).read_bytes()).hexdigest()
              result=dict(status='missing',test_status='blocked',scope='scoped',source_bindings=sources,evidence=[dict(path=path,sha256=hashlib.sha256((root/path).read_bytes()).hexdigest(),kind='specification',url=handoff['evidence_url'])],blockers=blockers,next_action=json.dumps(handoff,sort_keys=True))
              if existing:result['existing_issue_ids']=existing
              else:result['issues']=[dict(criterion_id='step:2',reproduction='Inspect the current account renderer and live own-session API UI mappings. Login as Platform Admin opens the existing account surface, whose only account control is password change; no own-session display/function is registered.',expected='Approved authenticated own-session controls show only own session timestamps/current marker and accurate pagination, through canonical GET /v1/user/sessions.',actual='Required session list is absent; sole link is inactive Guest login screen 948 and draft step API remains auth-prefixed.',affected_sources=['websites/typescript/src/account.ts','websites/typescript/src/platform-admin.ts','cloudflare/workers/src/self-sessions.ts'])]
              output=record_attempt(db,flow,result,root);counts=summary(db)
              next_def=db.execute('SELECT definition_json,definition_sha256,verification_status,test_status,blocker_json FROM virtual_workflow_definitions WHERE flow_id=?',('auth.logout',)).fetchone()
              next_checkpoint=db.execute('SELECT attempt_id,next_action FROM virtual_workflow_checkpoints WHERE flow_id=?',('auth.logout',)).fetchone()
              logout_api=list(db.execute('SELECT id,http_method,route_path,auth_required,permission_key,service_name,request_schema,response_schema FROM api_endpoints WHERE route_path=?',('/v1/auth/logout',)))
          print('OWN_SESSION_BLOCKER_COMMITTED '+json.dumps(dict(attempt=output,summary=counts,reused_issue_ids=existing)))
          print('NEXT_LOGOUT '+json.dumps(dict(definition=json.loads(next_def[0]),definition_sha256=next_def[1],verification_status=next_def[2],test_status=next_def[3],blockers=next_def[4],checkpoint=list(next_checkpoint) if next_checkpoint else None,registered_api=logout_api),default=str))
          PY
