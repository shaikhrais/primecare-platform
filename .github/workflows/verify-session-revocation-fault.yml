name: Native session revocation fault proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cloudflare/workers/**', 'tools/auth-verification/test-revocation-fault.mjs', '.github/workflows/verify-session-revocation-fault.yml']
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: disposable-ci-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/revoke-check" --ignore-scripts esbuild@0.27.2 pg@8.16.3 bcryptjs@3.0.2
          ln -s "$RUNNER_TEMP/revoke-check/node_modules" node_modules
      - env:
          AUTH_TEST_DATABASE_URL: postgres://auth_test:disposable-ci-fixture@127.0.0.1:5432/auth_test
        run: node tools/auth-verification/test-revocation-fault.mjs
