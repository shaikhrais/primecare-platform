name: Register Flutter presentation of existing MFA contract
on:
  push:
    branches: [main]
    paths: [.github/workflows/mfa-native-registration.yml, tools/governance-production/mfa-native-surface.json, tools/governance-production/mfa_native_surface.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mfa-policy-registration
  cancel-in-progress: false
jobs:
  register:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      GOVERNANCE_WORKFLOW_WRITES: '1'
      GOVERNANCE_MFA_NATIVE_WRITES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix /tmp/native-mfa --ignore-scripts --no-audit --no-fund pg@8.16.3
          ln -s /tmp/native-mfa/node_modules node_modules
          python tools/governance-production/mfa_native_surface.py --dry-run
          python tools/governance-production/mfa_native_surface.py --apply
