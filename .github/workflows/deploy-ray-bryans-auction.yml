name: Publish Ray Bryans auction sample
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-ray-bryans-auction.yml, applications/ray-bryans-auction/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ray-bryans-auction
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare resume, interactive review and both reports
        shell: python
        run: |
          import pathlib,json,base64,shutil
          root=pathlib.Path('sample');root.mkdir()
          source=pathlib.Path('applications/ray-bryans-auction')
          shutil.copyfile(source/'index.html',root/'index.html')
          review=json.loads("\"<!DOCTYPE html>\\n<html lang=\\\"en-CA\\\"><head><meta charset=\\\"utf-8\\\"><meta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\"><title>Bryan’s Auction | Website review in plain English</title><meta name=\\\"robots\\\" content=\\\"noindex,nofollow\\\"><meta name=\\\"description\\\" content=\\\"A plain-language summary of the November 2026 public website audit, with priorities, examples and a practical action plan.\\\"><style>\\n:root{--navy:#11334a;--blue:#087eaa;--gold:#f8c940;--ink:#19354a;--muted:#607486;--bg:#f3f6fa;--line:#dfe7ee;--red:#b34437;--amber:#9a6509;--green:#297458}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button,a,input,summary{outline-offset:5px}a{color:var(--blue)}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--blue)}.wrap{max-width:1180px;margin:auto;padding:0 28px}.top{background:white;border-bottom:1px solid var(--line)}.bar{display:flex;align-items:center;justify-content:space-between;min-height:78px;gap:20px}.brand{font-size:23px;font-weight:850;letter-spacing:-1px;color:var(--navy)}.brand small{font-size:11px;display:block;letter-spacing:1.7px;text-transform:uppercase;font-weight:650;color:var(--muted)}.pill{display:inline-block;font-size:12px;font-weight:750;padding:5px 11px;border-radius:30px;background:#e9f1f6;color:var(--navy)}.button{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 16px;color:var(--navy);font-size:13px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.hero{background:var(--navy);color:white;padding:56px 0 65px;position:relative;overflow:hidden}.hero:after{content:\\\"\\\";position:absolute;width:390px;height:390px;border:70px solid #ffffff05;border-radius:50%;right:-100px;top:-160px;pointer-events:none}.eyebrow{font-size:11px;font-weight:750;letter-spacing:2.1px;text-transform:uppercase;color:#8dc9df}.hero h1{font-size:clamp(34px,5vw,52px);line-height:1.12;letter-spacing:-2px;max-width:720px;margin:18px 0}.hero p{max-width:680px;color:#c4d7e3;font-size:17px;margin:0}.hero strong{color:var(--gold)}.hero-foot{display:flex;flex-wrap:wrap;gap:18px;margin-top:27px;font-size:12px;color:#b6cedc}.hero-foot span:before{content:\\\"\\\";width:5px;height:5px;background:var(--gold);display:inline-block;margin:0 8px 2px 0;border-radius:50%}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-28px;position:relative}.metric{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 7px 24px #16384b06}.metric b{display:block;font-size:34px;letter-spacing:-1.5px;line-height:1.2}.metric strong{font-size:13px}.metric small{display:block;color:var(--muted);font-size:12px;margin-top:6px}.metric .urgent{color:var(--red)}main{padding-bottom:35px}.section{margin-top:42px}.heading{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:18px}.heading h2{font-size:25px;letter-spacing:-.8px;line-height:1.3;margin:0 0 5px}.heading p{margin:0;color:var(--muted);font-size:14px}.grid2{display:grid;grid-template-columns:1.05fr 1fr;gap:20px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:26px}.panel h3{margin:0 0 8px;font-size:18px;letter-spacing:-.4px}.panel p{font-size:14px;color:var(--muted);margin:8px 0}.priority-layout{display:flex;align-items:center;gap:26px;margin:23px 0}.donut{width:140px;flex-shrink:0}.legend{list-style:none;padding:0;margin:0;width:100%}.legend li{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #edf1f5;padding:10px 0;font-size:13px}.dot{width:9px;height:9px;display:inline-block;border-radius:50%;margin-right:8px}.note{font-size:12px!important;color:var(--muted)!important}.success li{position:relative;padding:9px 0 9px 29px;font-size:14px}.success{list-style:none;margin:14px 0;padding:0}.success li:before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:900}.status{padding:9px 12px;background:#edf6f1;border-radius:8px;font-size:12px;color:var(--green);font-weight:650}.focus{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.focus-card{background:white;border:1px solid var(--line);border-radius:15px;padding:22px}.number{font-size:12px;color:var(--red);font-weight:850;letter-spacing:1px}.focus-card h3{font-size:17px;line-height:1.4;margin:12px 0 9px}.focus-card p{font-size:13px;color:var(--muted);margin:0}.focus-card a{display:inline-block;margin-top:14px;font-size:12px;font-weight:750}.soft{background:#eaf2f8;border:1px solid #d4e4ef;border-radius:16px;padding:22px 25px;font-size:14px}.soft strong{color:var(--navy)}.preview-tabs{display:flex;gap:6px;background:#f0f4f8;border-radius:10px;padding:5px;margin:17px 0}.preview-tabs button{flex:1;background:transparent;border:0;border-radius:7px;padding:8px;font-size:12px;color:var(--muted);font-weight:750}.preview-tabs button[aria-pressed=true]{background:white;box-shadow:0 2px 7px #152f4810;color:var(--blue)}.search-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;min-height:184px}.search-domain{font-size:11px;color:#566c54}.search-title{color:#2253b1;font-size:19px;line-height:1.35;margin:5px 0}.search-description{font-size:13px;color:#59616a;line-height:1.5}.bar-row{margin-top:22px}.bar-title{font-size:13px;display:flex;justify-content:space-between;gap:12px}.track{height:8px;background:#edf2f6;border-radius:20px;overflow:hidden;margin:7px 0}.fill{height:100%;border-radius:20px;background:var(--blue)}.bar-row small{font-size:11px;color:var(--muted);display:block}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.filter{background:white;color:var(--muted);border:1px solid var(--line);border-radius:24px;font-weight:650;font-size:12px;padding:8px 14px}.filter[aria-pressed=true]{background:var(--navy);color:white;border-color:var(--navy)}.tools{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.tools input{background:white;border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:13px;width:285px;max-width:100%}.results{font-size:12px;color:var(--muted)}.issue-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.issue{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden;scroll-margin-top:20px}.issue summary{cursor:pointer;list-style:none;padding:19px 21px;position:relative}.issue summary::-webkit-details-marker{display:none}.issue summary:after{content:'+';position:absolute;right:20px;top:20px;color:var(--muted);font-size:20px}.issue[open] summary:after{content:'−'}.issue summary h3{font-size:15px;line-height:1.45;margin:12px 25px 0 0}.badge{display:inline-block;border-radius:5px;padding:3px 7px;font-size:10px;font-weight:800;letter-spacing:.2px}.badge.first{background:#fbece8;color:var(--red)}.badge.next{background:#fff2d8;color:var(--amber)}.badge.later{background:#ebf2f7;color:#456c87}.category{font-size:10px;color:var(--muted);margin-left:7px}.issue-body{padding:0 21px 22px}.issue-body h4{font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin:15px 0 4px;color:var(--blue)}.issue-body p{font-size:13px;color:#526777;margin:0}.owner{background:#f5f8fb;border-radius:7px;padding:9px 11px;margin-top:15px;font-size:11px;color:var(--muted)}.empty{grid-column:1/-1;text-align:center;padding:30px;color:var(--muted)}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.step{border-top:3px solid var(--blue);padding:17px 15px;background:white;border-radius:0 0 13px 13px}.step:first-child{border-color:var(--red)}.step .when{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--blue)}.step h3{font-size:15px;line-height:1.4;margin:11px 0}.step p{font-size:12px;color:var(--muted);margin:0}.footer-panel{background:var(--navy);color:white;border-radius:18px;padding:29px;display:flex;justify-content:space-between;gap:25px;align-items:center}.footer-panel h2{font-size:21px;margin:0 0 8px}.footer-panel p{font-size:13px;max-width:600px;color:#bed2df;margin:0}.footer-panel .button{flex-shrink:0;background:var(--gold);border:0}.limits{font-size:12px;color:var(--muted);margin:23px 0}.foot{border-top:1px solid var(--line);padding:23px 0;display:flex;justify-content:space-between;gap:16px;font-size:11px;color:var(--muted)}.skip{position:absolute;top:-100px;left:15px;padding:10px;background:white;z-index:9}.skip:focus{top:10px}.all-btn{font-size:12px;white-space:nowrap}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.focus{grid-template-columns:1fr}.timeline{grid-template-columns:repeat(2,1fr)}.issue-grid{grid-template-columns:1fr}.hero{padding-top:38px}.hero h1{letter-spacing:-1px}.footer-panel{flex-direction:column;align-items:start}.heading{align-items:start}.panel{padding:22px}.foot{flex-wrap:wrap}}@media(max-width:480px){.wrap{padding:0 18px}.brand{font-size:20px}.bar{min-height:74px}.bar .pill{display:none}.metric{padding:18px}.metric b{font-size:29px}.metric strong{font-size:12px}.priority-layout{gap:16px}.donut{width:112px}.legend li{font-size:12px}.timeline{grid-template-columns:1fr}.heading{flex-wrap:wrap;gap:8px}.section{margin-top:31px}.heading h2{font-size:23px}.tools input{width:100%}.hero p{font-size:15px}}@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}.issue,.button,.filter{transition:box-shadow .18s,background .18s}.issue:hover{box-shadow:0 5px 18px #16384b0a}}@media print{body{background:white;font-size:11px}.wrap{max-width:none;padding:0}.top,.filters,.tools,.preview-tabs,.no-print,.skip{display:none!important}.hero{background:white;color:var(--navy);padding:10px 0 20px}.hero:after{display:none}.hero p,.hero-foot,.eyebrow{color:var(--muted)}.hero strong{color:var(--navy)}.hero h1{font-size:32px}.metrics{margin:0;gap:8px;grid-template-columns:repeat(4,1fr)}.metric{box-shadow:none;padding:12px}.metric b{font-size:25px}.section{margin-top:25px}.panel,.focus-card,.issue,.step{break-inside:avoid}.issue-grid{display:block}.issue{margin:8px 0}.issue summary:after{display:none}.issue-body{display:block!important}.footer-panel{background:#eff4f7;color:var(--navy)}.footer-panel p{color:var(--muted)}.grid2{gap:12px}.focus{gap:10px}.timeline{gap:10px}.limits{font-size:10px}.foot{font-size:10px}.priority-layout{margin:10px 0}}\\n</style></head><body><a class=\\\"skip\\\" href=\\\"#summary\\\">Skip to summary</a>\\n<header class=\\\"top\\\"><div class=\\\"wrap bar\\\"><div class=\\\"brand\\\">Bryan’s Auction<small>Website review</small></div><div style=\\\"display:flex;gap:15px;align-items:center\\\"><span class=\\\"pill\\\">26 November 2026</span><button class=\\\"button\\\" id=\\\"print\\\">Print / save PDF ↗</button></div></div></header>\\n<section class=\\\"hero\\\"><div class=\\\"wrap\\\"><div class=\\\"eyebrow\\\">The business view · In plain English</div><h1>A strong foundation.<br><strong>A clearer path to bidding.</strong></h1><p>The website already has the essentials. The next step is to fix broken journeys, finish public content and make each auction easier to understand in search.</p><div class=\\\"hero-foot\\\"><span>Public website review</span><span>Prepared for Mohammedrais Shaikh (Ray)</span><span>Recommendations, not completed repairs</span></div></div></section>\\n<main id=\\\"summary\\\" class=\\\"wrap\\\"><div class=\\\"metrics\\\" aria-label=\\\"Audit at a glance\\\"><article class=\\\"metric\\\"><b>120</b><strong>Pages reviewed</strong><small>Unique pages that opened successfully</small></article><article class=\\\"metric\\\"><b>22</b><strong>Findings to address</strong><small>Across content, usability and search</small></article><article class=\\\"metric\\\"><b class=\\\"urgent\\\">5</b><strong>Priorities to fix first</strong><small>Start with customer journeys and content</small></article><article class=\\\"metric\\\"><b class=\\\"urgent\\\">2</b><strong>Broken product links</strong><small>Linked from the home page</small></article></div>\\n<section class=\\\"section\\\"><div class=\\\"heading\\\"><div><h2>What this means for the business</h2><p>Keep what works. Focus effort where visitors need it most.</p></div></div><div class=\\\"grid2\\\"><article class=\\\"panel\\\"><h3>The work, by priority</h3><p>Most findings are improvements to existing pages and settings.</p><div class=\\\"priority-layout\\\"><svg class=\\\"donut\\\" viewBox=\\\"0 0 140 140\\\" role=\\\"img\\\" aria-label=\\\"22 findings: 5 fix first, 13 improve next, 4 tidy up\\\"><circle cx=\\\"70\\\" cy=\\\"70\\\" r=\\\"56\\\" fill=\\\"none\\\" stroke=\\\"#edf2f6\\\" stroke-width=\\\"13\\\"/><g transform=\\\"rotate(-90 70 70)\\\" fill=\\\"none\\\" stroke-width=\\\"13\\\"><circle cx=\\\"70\\\" cy=\\\"70\\\" r=\\\"56\\\" stroke=\\\"#b34437\\\" stroke-dasharray=\\\"79.97 351.86\\\"/><circle cx=\\\"70\\\" cy=\\\"70\\\" r=\\\"56\\\" stroke=\\\"#d6a634\\\" stroke-dasharray=\\\"207.92 351.86\\\" stroke-dashoffset=\\\"-79.97\\\"/><circle cx=\\\"70\\\" cy=\\\"70\\\" r=\\\"56\\\" stroke=\\\"#5885a0\\\" stroke-dasharray=\\\"63.97 351.86\\\" stroke-dashoffset=\\\"-287.89\\\"/></g><text x=\\\"70\\\" y=\\\"70\\\" text-anchor=\\\"middle\\\" font-size=\\\"31\\\" font-weight=\\\"800\\\" fill=\\\"#19354a\\\">22</text><text x=\\\"70\\\" y=\\\"89\\\" text-anchor=\\\"middle\\\" font-size=\\\"10\\\" fill=\\\"#607486\\\">FINDINGS</text></svg><ul class=\\\"legend\\\"><li><span><i class=\\\"dot\\\" style=\\\"background:#b34437\\\"></i>Fix first</span><b>5</b></li><li><span><i class=\\\"dot\\\" style=\\\"background:#d6a634\\\"></i>Improve next</span><b>13</b></li><li><span><i class=\\\"dot\\\" style=\\\"background:#5885a0\\\"></i>Tidy up</span><b>4</b></li></ul></div><p class=\\\"note\\\">These are priorities, not a website score or an estimate of lost sales.</p></article><article class=\\\"panel\\\"><h3>What is already working</h3><ul class=\\\"success\\\"><li>Secure website address and consistent main domain</li><li>Useful category pages for different auction items</li><li>Visible contact details and two Ontario locations</li><li>Mobile menu opened in the tested view</li><li>Clear routes toward auctions and direct-sale listings</li></ul><div class=\\\"status\\\">A focused improvement plan can build on this foundation.</div></article></div></section>\\n<section class=\\\"section\\\"><div class=\\\"heading\\\"><div><h2>Start with these three outcomes</h2><p>Simple changes with a clear purpose.</p></div></div><div class=\\\"focus\\\"><article class=\\\"focus-card\\\"><span class=\\\"number\\\">01 / KEEP SHOPPERS MOVING</span><h3>Make every promotion lead somewhere useful</h3><p>Fix the two missing product destinations and remove outdated links from banners and menus.</p><a href=\\\"#F01\\\" data-open=\\\"F01\\\">See the finding →</a></article><article class=\\\"focus-card\\\"><span class=\\\"number\\\">02 / BUILD CONFIDENCE</span><h3>Finish the pages people can discover</h3><p>Replace sample text on Schedule and Rentals. Review seven public old or draft-named pages.</p><a href=\\\"#F21\\\" data-open=\\\"F21\\\">See the finding →</a></article><article class=\\\"focus-card\\\"><span class=\\\"number\\\">03 / CLARIFY EACH AUCTION</span><h3>Show which event, where and when</h3><p>Give each monthly auction its own search title and short description so events are easier to distinguish.</p><a href=\\\"#F03\\\" data-open=\\\"F03\\\">See the finding →</a></article></div></section>\\n<section class=\\\"section grid2\\\"><article class=\\\"panel\\\"><h3>What is “metadata”?</h3><p>It is the title, short description and image attached to a page. It helps explain that page in search results and shared links.</p><div class=\\\"preview-tabs\\\" role=\\\"group\\\" aria-label=\\\"Compare search description examples\\\"><button type=\\\"button\\\" data-preview=\\\"current\\\" aria-pressed=\\\"true\\\">Observed title</button><button type=\\\"button\\\" data-preview=\\\"proposed\\\" aria-pressed=\\\"false\\\">Suggested title</button></div><div class=\\\"search-box\\\" aria-live=\\\"polite\\\"><div class=\\\"search-domain\\\">bryansauction.com › auction</div><div class=\\\"search-title\\\" id=\\\"preview-title\\\">Trenton Auction - Bryan’s Auction Services</div><div class=\\\"search-description\\\" id=\\\"preview-desc\\\">The same title is used for different monthly Trenton auction pages. The month and year are missing from this title.</div></div><p class=\\\"note\\\" id=\\\"preview-note\\\">Illustration based on the audit. This is not a screenshot of a Google result.</p></article><article class=\\\"panel\\\"><h3>Where page presentation needs attention</h3><p>Each bar uses the 120 reviewed pages as its base.</p><div class=\\\"bar-row\\\"><div class=\\\"bar-title\\\"><span>No main heading</span><b>34 / 120</b></div><div class=\\\"track\\\"><div class=\\\"fill\\\" style=\\\"width:28.333%\\\"></div></div><small>A clear heading helps people understand the page.</small></div><div class=\\\"bar-row\\\"><div class=\\\"bar-title\\\"><span>No chosen social-preview image</span><b>28 / 120</b></div><div class=\\\"track\\\"><div class=\\\"fill\\\" style=\\\"width:23.333%;background:#d6a634\\\"></div></div><small>Choose the image shown when a page is shared.</small></div><div class=\\\"bar-row\\\"><div class=\\\"bar-title\\\"><span>No search description to review</span><b>5 / 120</b></div><div class=\\\"track\\\"><div class=\\\"fill\\\" style=\\\"width:4.167%;background:#5885a0\\\"></div></div><small>Five pages allowing search inclusion lack descriptions. Two additional account/cart pages also lack descriptions but deliberately request search exclusion.</small></div><p class=\\\"note\\\">These groups can overlap. They are not totals of broken pages.</p></article></section>\\n<section class=\\\"section\\\" id=\\\"findings\\\"><div class=\\\"heading\\\"><div><h2>The findings, without the jargon</h2><p>Choose a priority and open a card for the reason and next step.</p></div><button class=\\\"button all-btn\\\" id=\\\"expand\\\">Expand visible cards</button></div><div class=\\\"tools\\\"><div class=\\\"filters\\\" aria-label=\\\"Filter findings by priority\\\"><button class=\\\"filter\\\" data-filter=\\\"All\\\" aria-pressed=\\\"true\\\">All findings · 22</button><button class=\\\"filter\\\" data-filter=\\\"Fix first\\\" aria-pressed=\\\"false\\\">Fix first · 5</button><button class=\\\"filter\\\" data-filter=\\\"Improve next\\\" aria-pressed=\\\"false\\\">Improve next · 13</button><button class=\\\"filter\\\" data-filter=\\\"Tidy up\\\" aria-pressed=\\\"false\\\">Tidy up · 4</button></div><label><span class=\\\"visually-hidden\\\">Search findings</span><input id=\\\"search\\\" type=\\\"search\\\" placeholder=\\\"Search a topic, e.g. mobile\\\" autocomplete=\\\"off\\\"></label></div><p class=\\\"results\\\" id=\\\"results\\\" role=\\\"status\\\" aria-live=\\\"polite\\\"></p><div class=\\\"issue-grid\\\" id=\\\"issue-grid\\\"></div><noscript><div class=\\\"soft\\\">Interactive cards need JavaScript. Key priorities: fix two broken product links, review seven old or draft pages, replace sample text on Schedule and Rentals, improve auction search descriptions and fix the phone field. The full PDF contains all 22 findings.</div></noscript></section>\\n<section class=\\\"section\\\"><div class=\\\"heading\\\"><div><h2>A practical first-month plan</h2><p>Suggested sequence. Timing depends on access and the team’s review.</p></div></div><div class=\\\"timeline\\\"><article class=\\\"step\\\"><div class=\\\"when\\\">First 1–2 working days</div><h3>Repair and finish</h3><p>Fix stale product links, decide what to do with draft pages, replace sample text and improve the phone field.</p></article><article class=\\\"step\\\"><div class=\\\"when\\\">Days 3–5</div><h3>Improve page previews</h3><p>Update auction titles, short descriptions, sharing images and important page headings.</p></article><article class=\\\"step\\\"><div class=\\\"when\\\">Week 2</div><h3>Make browsing easier</h3><p>Improve mobile chat, link labels, item information and the consistency of business details.</p></article><article class=\\\"step\\\"><div class=\\\"when\\\">Weeks 3–4</div><h3>Measure the difference</h3><p>Check loading speed, enquiries, subscriptions and the steps into HiBid with the appropriate account access.</p></article></div></section>\\n<section class=\\\"section\\\"><div class=\\\"soft\\\"><strong>What success looks like:</strong> promotions open the right item, public pages contain finished information, each auction is clearly identified, enquiries are easier to complete, and the team can measure the actions that matter.</div></section>\\n<section class=\\\"section\\\"><div class=\\\"footer-panel\\\"><div><h2>Need the evidence behind the summary?</h2><p>The full audit includes exact page details, supporting observations, suggested wording and checks for the website team.</p></div><a class=\\\"button\\\" href=\\\"reports/Bryans_Auction_Website_Audit_2026-11-26.pdf\\\" target=\\\"_blank\\\">Open full audit PDF ↗</a></div><p class=\\\"limits\\\"><strong>About this review:</strong> findings reflect the public website on 26 November 2026. No website repairs were made. Actual Google rankings, completed bids, message delivery and private account settings were not verified. The speed test was rate-limited, so no speed score is claimed. Independent application sample prepared by Mohammedrais Shaikh (Ray).</p></section>\\n<footer class=\\\"foot\\\"><span>Bryan’s Auction · Plain-language audit summary</span><span>Based on the 20-page public website audit · 26 Nov 2026</span></footer></main>\\n<script>\\nconst findings=[{\\\"id\\\": \\\"F01\\\", \\\"priority\\\": \\\"Fix first\\\", \\\"category\\\": \\\"Customer journey\\\", \\\"title\\\": \\\"Promoted products lead to missing pages\\\", \\\"found\\\": \\\"Two product links on the home page opened a page-not-found message.\\\", \\\"why\\\": \\\"Shoppers can lose their place before they reach the item they wanted.\\\", \\\"action\\\": \\\"Remove outdated promotions or point them to the correct item.\\\", \\\"owner\\\": \\\"Content team + website developer\\\"}, {\\\"id\\\": \\\"F02\\\", \\\"priority\\\": \\\"Fix first\\\", \\\"category\\\": \\\"Content\\\", \\\"title\\\": \\\"Old and draft pages are open to search engines\\\", \\\"found\\\": \\\"Seven old or draft-named pages are public and allow search engines to include them. Actual Google listings were not checked.\\\", \\\"why\\\": \\\"People may find the wrong version of a service page.\\\", \\\"action\\\": \\\"Choose the page to keep, then retire or redirect the older versions.\\\", \\\"owner\\\": \\\"Content team + website developer\\\"}, {\\\"id\\\": \\\"F03\\\", \\\"priority\\\": \\\"Fix first\\\", \\\"category\\\": \\\"Search appearance\\\", \\\"title\\\": \\\"Different auctions look the same in search\\\", \\\"found\\\": \\\"Monthly auction pages reuse the same search titles and descriptions.\\\", \\\"why\\\": \\\"Visitors may struggle to tell which auction is current.\\\", \\\"action\\\": \\\"Give each auction its own month, year, location and clear description.\\\", \\\"owner\\\": \\\"Auction team + marketing\\\"}, {\\\"id\\\": \\\"F04\\\", \\\"priority\\\": \\\"Fix first\\\", \\\"category\\\": \\\"Customer journey\\\", \\\"title\\\": \\\"The phone field needs a better setup\\\", \\\"found\\\": \\\"The contact form treats a phone number like a calculation instead of contact information.\\\", \\\"why\\\": \\\"Spaces, plus signs or extensions may be difficult to enter.\\\", \\\"action\\\": \\\"Allow normal phone-number formats and test an approved enquiry.\\\", \\\"owner\\\": \\\"Website developer\\\"}, {\\\"id\\\": \\\"F21\\\", \\\"priority\\\": \\\"Fix first\\\", \\\"category\\\": \\\"Content\\\", \\\"title\\\": \\\"Two public pages still have sample text\\\", \\\"found\\\": \\\"The Schedule and Rentals pages contain unfinished sample wording, including their search descriptions.\\\", \\\"why\\\": \\\"This can make an otherwise established business look unfinished.\\\", \\\"action\\\": \\\"Replace the wording with useful information or remove the unfinished pages from search discovery.\\\", \\\"owner\\\": \\\"Content team\\\"}, {\\\"id\\\": \\\"F05\\\", \\\"priority\\\": \\\"Improve next\\\", \\\"category\\\": \\\"Accessibility\\\", \\\"title\\\": \\\"Page headings need a consistent structure\\\", \\\"found\\\": \\\"34 pages have no main heading and 17 have more than one. The home page has no main heading.\\\", \\\"why\\\": \\\"Clear headings help visitors scan a page and help people who use reading tools.\\\", \\\"action\\\": \\\"Give each page a clear main heading and sensible section headings. This finding does not prove a search penalty.\\\", \\\"owner\\\": \\\"Content team + website developer\\\"}, {\\\"id\\\": \\\"F06\\\", \\\"priority\\\": \\\"Improve next\\\", \\\"category\\\": \\\"Search appearance\\\", \\\"title\\\": \\\"Shared links need a chosen image\\\", \\\"found\\\": \\\"28 pages have no explicit image set for social link previews, including the home page.\\\", \\\"why\\\": \\\"A shared link may show an unexpected image or no intended image.\\\", \\\"action\\\": \\\"Set a branded default preview image and suitable images for important pages.\\\", \\\"owner\\\": \\\"Marketing\\\"}, {\\\"id\\\": \\\"F07\\\", \\\"priority\\\": \\\"Improve next\\\", \\\"category\\\": \\\"Search appearance\\\", \\\"title\\\": \\\"Some pages describe themselves as articles\\\", \\\"found\\\": \\\"The home, contact and privacy pages send behind-the-scenes information that labels them as articles.\\\", \\\"why\\\": \\\"Search engines get a less accurate description of what the page is for.\\\", \\\"action\\\": \\\"Match the page information to its purpose, such as business, contact or article.\\\", \\\"owner\\\": \\\"Website developer + marketing\\\"}, {\\\"id\\\": \\\"F08\\\", \\\"priority\\\": \\\"Improve next\\\", \\\"category\\\": \\\"Content\\\", \\\"title\\\": \\\"Check product condition and categories\\\", \\\"found\\\": \\\"One truck listing tells search engines its condition is new. That needs confirmation from the inventory team. Some items use a general Uncategorized label.\\\", \\\"why\\\": \\\"Buyers need the item details to be accurate wherever they see them.\\\", \\\"action\\\": \\\"Confirm the condition, choose a useful category and keep price and availability aligned.\\\", \\\"owner\\\": \\\"Inventory team\\\"}, {\\\"id\\\": \\\"F09\\\", \\\"priority\\\": \\\"Improve next\\\", \\\"category\\\": \\\"Accessibility\\\", \\\"title\\\": \\\"Some buttons and links need spoken labels\\\", \\\"found\\\": \\\"The home-page logo link, some image links and map links have no useful name for reading tools.\\\", \\\"why\\\": \\\"A visitor using a screen reader may not know what the link does.\\\", \\\"action\\\": \\\"Add clear labels and check that the important controls work with a keyboard.\\\", \\\"owner\\\": \\\"Website developer\\\"}, {\\\"id\\\": \\\"F10\\\", \\\"priority\\\": \\\"Improve next\\\", \\\"category\\\": \\\"Customer journey\\\", \\\"title\\\": \\\"Chat overlaps a button on a phone\\\", \\\"found\\\": \\\"At the tested phone size, the chat greeting covered part of Learn More.\\\", \\\"why\\\": \\\"A floating message can get in the way of a visitor\\\\u2019s next step.\\\", \\\"action\\\": \\\"Make the greeting smaller or delay it, and keep buttons clear.\\\", \\\"owner\\\": \\\"Marketing + website developer\\\"}, {\\\"id\\\": \\\"F11\\\", \\\"priority\\\": \\\"Improve next\\\", \\\"category\\\": \\\"Measurement\\\", \\\"title\\\": \\\"Measure speed before making changes\\\", \\\"found\\\": \\\"The home page has a large amount of page code and many listed supporting files. The speed test was rate-limited.\\\", \\\"why\\\": \\\"There is a reason to investigate loading speed, but no measured speed score is available.\\\", \\\"action\\\": \\\"Run a fresh speed test, reduce unnecessary page elements and compare before and after.\\\", \\\"owner\\\": \\\"Website developer\\\"}, {\\\"id\\\": \\\"F12\\\", \\\"priority\\\": \\\"Improve next\\\", \\\"category\\\": \\\"Search appearance\\\", \\\"title\\\": \\\"Make location information more complete\\\", \\\"found\\\": \\\"The business locations are visible, but the behind-the-scenes business description is limited.\\\", \\\"why\\\": \\\"Consistent location details help people and search services understand the business.\\\", \\\"action\\\": \\\"Align addresses, phone numbers, opening hours and business profile details.\\\", \\\"owner\\\": \\\"Marketing + operations\\\"}, {\\\"id\\\": \\\"F13\\\", \\\"priority\\\": \\\"Improve next\\\", \\\"category\\\": \\\"Search appearance\\\", \\\"title\\\": \\\"Some search descriptions need better copy\\\", \\\"found\\\": \\\"Several descriptions are very short or read like unfinished extracts. The shop title is simply Shop plus the business name.\\\", \\\"why\\\": \\\"Search previews can miss the reason someone should visit the page.\\\", \\\"action\\\": \\\"Write clear, accurate titles and short descriptions for the most useful pages.\\\", \\\"owner\\\": \\\"Marketing\\\"}, {\\\"id\\\": \\\"F16\\\", \\\"priority\\\": \\\"Improve next\\\", \\\"category\\\": \\\"Measurement\\\", \\\"title\\\": \\\"Track the journey into HiBid\\\", \\\"found\\\": \\\"Bidding links send visitors to HiBid. Completed registrations and bids were not verified in analytics.\\\", \\\"why\\\": \\\"A click toward an auction is different from a completed registration or bid.\\\", \\\"action\\\": \\\"Agree which steps HiBid can report and measure enquiries, subscriptions and completed actions separately.\\\", \\\"owner\\\": \\\"Marketing + HiBid support\\\"}, {\\\"id\\\": \\\"F17\\\", \\\"priority\\\": \\\"Improve next\\\", \\\"category\\\": \\\"Search appearance\\\", \\\"title\\\": \\\"Give auction dates a clear structure\\\", \\\"found\\\": \\\"The sampled auction page has limited behind-the-scenes information about the auction itself.\\\", \\\"why\\\": \\\"Search services receive less useful event context.\\\", \\\"action\\\": \\\"Keep dates, times, locations and status consistent. Add event information only where the auction qualifies.\\\", \\\"owner\\\": \\\"Auction team + website developer\\\"}, {\\\"id\\\": \\\"F19\\\", \\\"priority\\\": \\\"Improve next\\\", \\\"category\\\": \\\"Search appearance\\\", \\\"title\\\": \\\"Keep account and cart pages out of the search list\\\", \\\"found\\\": \\\"The website\\\\u2019s list of pages for search engines includes account, cart and checkout links. Cart and account already request exclusion from search.\\\", \\\"why\\\": \\\"These utility pages do not need to be promoted as search landing pages.\\\", \\\"action\\\": \\\"Remove them from that list while keeping shopping and account features working.\\\", \\\"owner\\\": \\\"Website developer\\\"}, {\\\"id\\\": \\\"F22\\\", \\\"priority\\\": \\\"Improve next\\\", \\\"category\\\": \\\"Content\\\", \\\"title\\\": \\\"Make job pages specific to each role\\\", \\\"found\\\": \\\"Some job-page search descriptions repeat a company introduction or say only Who We Are. Current vacancy status was not verified.\\\", \\\"why\\\": \\\"Applicants get less useful information before opening the job.\\\", \\\"action\\\": \\\"Confirm openings with HR and show the role, location, contract details and how to apply.\\\", \\\"owner\\\": \\\"HR + marketing\\\"}, {\\\"id\\\": \\\"F14\\\", \\\"priority\\\": \\\"Tidy up\\\", \\\"category\\\": \\\"Customer journey\\\", \\\"title\\\": \\\"Some links take an extra detour\\\", \\\"found\\\": \\\"The classic-car menu link goes through two redirects before reaching its current page.\\\", \\\"why\\\": \\\"Extra steps make a visitor\\\\u2019s route less direct.\\\", \\\"action\\\": \\\"Update menus and banners to point straight to the final page.\\\", \\\"owner\\\": \\\"Website editor\\\"}, {\\\"id\\\": \\\"F15\\\", \\\"priority\\\": \\\"Tidy up\\\", \\\"category\\\": \\\"Search appearance\\\", \\\"title\\\": \\\"Align the language setting with Canada\\\", \\\"found\\\": \\\"Some page settings say US English although the business serves Ontario.\\\", \\\"why\\\": \\\"This is a small consistency issue, not a reason the site cannot appear in search.\\\", \\\"action\\\": \\\"Use Canadian English settings if that is the intended language.\\\", \\\"owner\\\": \\\"Website administrator\\\"}, {\\\"id\\\": \\\"F18\\\", \\\"priority\\\": \\\"Tidy up\\\", \\\"category\\\": \\\"Accessibility\\\", \\\"title\\\": \\\"Review the descriptions attached to images\\\", \\\"found\\\": \\\"Many image descriptions are empty and some use template-style names. Empty descriptions can be correct for decoration.\\\", \\\"why\\\": \\\"Meaningful product or linked images should have useful descriptions.\\\", \\\"action\\\": \\\"Describe informative images and leave purely decorative ones silent.\\\", \\\"owner\\\": \\\"Content team\\\"}, {\\\"id\\\": \\\"F20\\\", \\\"priority\\\": \\\"Tidy up\\\", \\\"category\\\": \\\"Measurement\\\", \\\"title\\\": \\\"Ask the administrator to review protection and backups\\\", \\\"found\\\": \\\"Public checks alone cannot confirm the full security setup, updates or backup quality. No security breach was established.\\\", \\\"why\\\": \\\"The administrator needs to verify protections that are invisible to public visitors.\\\", \\\"action\\\": \\\"Review updates, sign-in protection, backups and browser safeguards using administrator access.\\\", \\\"owner\\\": \\\"Website administrator\\\"}];let active='All';let expanded=false;const grid=document.querySelector('#issue-grid');const search=document.querySelector('#search');const escape=s=>s.replace(/[&<>\\\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',\\\"'\\\":'&#39;'}[c]));\\nfunction render(){const q=search.value.toLowerCase().trim();const visible=findings.filter(f=>(active==='All'||f.priority===active)&&Object.values(f).join(' ').toLowerCase().includes(q));grid.innerHTML=visible.map(f=>`<details class=\\\"issue\\\" id=\\\"${f.id}\\\" ${expanded?'open':''}><summary><span class=\\\"badge ${f.priority==='Fix first'?'first':f.priority==='Improve next'?'next':'later'}\\\">${f.priority}</span><span class=\\\"category\\\">${f.category} · ${f.id}</span><h3>${escape(f.title)}</h3></summary><div class=\\\"issue-body\\\"><h4>What we found</h4><p>${escape(f.found)}</p><h4>Why it matters</h4><p>${escape(f.why)}</p><h4>What to do</h4><p>${escape(f.action)}</p><div class=\\\"owner\\\">Suggested owner: ${escape(f.owner)}</div></div></details>`).join('')||'<div class=\\\"empty\\\">No matching findings. Try a different word or choose All findings.</div>';document.querySelector('#results').textContent=`Showing ${visible.length} of 22 findings`;document.querySelector('#expand').textContent=expanded?'Collapse visible cards':'Expand visible cards';}\\ndocument.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));search.addEventListener('input',render);document.querySelector('#expand').addEventListener('click',()=>{expanded=!expanded;render()});document.querySelectorAll('[data-open]').forEach(a=>a.addEventListener('click',()=>{active='All';search.value='';document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.filter==='All')));render();const el=document.getElementById(a.dataset.open);el.open=true;el.scrollIntoView({block:'start'});}));\\ndocument.querySelectorAll('[data-preview]').forEach(b=>b.addEventListener('click',()=>{const proposed=b.dataset.preview==='proposed';document.querySelectorAll('[data-preview]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#preview-title').textContent=proposed?'Trenton Auction December 2026 | Bryan’s Auction':'Trenton Auction - Bryan’s Auction Services';document.querySelector('#preview-desc').textContent=proposed?'View Bryan’s December 2026 Trenton auction details. Check the schedule, preview and pickup information, then follow the link to the catalogue.':'The same title is used for different monthly Trenton auction pages. The month and year are missing from this title.';document.querySelector('#preview-note').textContent=proposed?'Suggested wording for owner review. Not published. Search engines may show different wording.':'Illustration based on the audit. This is not a screenshot of a Google result.';}));\\nlet printState=null;window.addEventListener('beforeprint',()=>{printState={active,query:search.value,expanded,open:[...document.querySelectorAll('details[open]')].map(d=>d.id)};active='All';search.value='';expanded=true;render()});window.addEventListener('afterprint',()=>{if(!printState)return;active=printState.active;search.value=printState.query;expanded=printState.expanded;render();printState.open.forEach(id=>{const d=document.getElementById(id);if(d)d.open=true});printState=null});document.querySelector('#print').addEventListener('click',()=>window.print());render();\\n</script></body></html>\"")
          review=review.replace('</head>',"<link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23102e40%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2247%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2245%22%20font-weight%3D%22700%22%20fill%3D%22%23efc75c%22%3ER%3C%2Ftext%3E%3C%2Fsvg%3E\">"+'</head>')
          (root/'review.html').write_text(review)
          reports=root/'reports';reports.mkdir()
          for name,data in json.loads((source/'reports.json').read_text()).items():
            body=base64.b64decode(data);assert body.startswith(b'%PDF')
            (reports/name).write_bytes(body)
          assert len(list(reports.glob('*.pdf')))==2
          html=(root/'index.html').read_text()
          assert 'sample-email' in html and 'April 2021' in html
          (root/'_headers').write_text('/*\n  X-Robots-Tag: noindex, nofollow\n')
      - name: Create separate Pages project using Cloudflare API
        shell: python
        run: |
          import os,json,urllib.request,urllib.error
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/pages/projects'
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'}
          def call(url,data=None):
            req=urllib.request.Request(url,data=None if data is None else json.dumps(data).encode(),headers=headers)
            with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          try: result=call(base+'/ray-bryans-auction')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise RuntimeError('Cloudflare lookup HTTP '+str(e.code)) from None
            result=call(base,{'name':'ray-bryans-auction','production_branch':'main'})
          assert result.get('success')
          assert not result['result'].get('source'),'Unexpected git-integrated project'
          print('Project ready:',result['result']['subdomain'])
      - name: Publish sample
        run: npx --yes wrangler@3.90.0 pages deploy sample --project-name=ray-bryans-auction --branch=main
      - name: Verify live sample
        shell: python
        run: |
          import urllib.request,time
          url='https://ray-bryans-auction.pages.dev'
          def read(path):
            return subprocess.check_output(['curl','--fail','--silent','--show-error','--max-time','25',url+path])
          for attempt in range(12):
            try:
              html=read('/').decode()
              assert 'My experience, at a glance.' in html and 'sample-email' in html
              for name in ['Bryans_Auction_Visual_Summary.pdf','Bryans_Auction_Website_Audit_2026-11-26.pdf']:
                assert read('/reports/'+name)==pathlib.Path('sample/reports',name).read_bytes()
              assert b'const findings=' in read('/review.html')
              break
            except Exception:
              if attempt==11:raise
              time.sleep(5)
          print('Verified live URL:',url)
