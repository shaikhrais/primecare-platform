name: Deploy Web - primecare-governance

on:
  push:
    branches: [main]
    paths:
      - 'apps/primecare_governance/**'
      - 'packages/flutter_core/**'
      - 'packages/primecare_ui/**'
      - '.github/workflows/deploy-web-governance.yml'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-web.yml
    with:
      app: primecare_governance
      project: primecare-governance
    secrets: inherit
