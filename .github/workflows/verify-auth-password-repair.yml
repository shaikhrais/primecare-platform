name: Production-bound password change repair execution
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-auth-password-repair.yml]
permissions:
  contents: read
  actions: write
jobs:
  password:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: primecare
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: login_browser
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U primecare -d login_browser" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Cancel superseded PR executions only
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            try{await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:39416623754});}catch(error){if(![409,422].includes(error.status))throw error;}
            for(const status of ['queued','in_progress']){
              const {data}=await github.rest.actions.listWorkflowRunsForRepo({owner,repo,event:'pull_request',status,per_page:100});
              for(const run of data.workflow_runs)if(run.head_sha==='5f7dbe5c8e992fa8b712076e8995295ecbf4a201')await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:run.id});
            }
      - uses: actions/checkout@v4
        with:
          ref: 656b7bbc543f6154ed8c54d10bb26483837341ab
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix /tmp/password-tools --ignore-scripts --no-audit --no-fund esbuild@0.27.2 playwright@1.60.0 pg@8.16.3 bcryptjs@3 typescript@5.9.3
          ln -s /tmp/password-tools/node_modules node_modules
          node_modules/.bin/playwright install --with-deps chromium
      - name: Export exact live auth definitions and theme
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
        run: |
          python -u - <<'PY'
          import sys,json,pathlib
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          with ProductionWorkflowStore() as db:
           keys=[c['name'] for c in db.tables['virtual_workflow_definitions']['columns']]
           flows=[dict(zip(keys,r)) for r in db.execute("SELECT * FROM virtual_workflow_definitions WHERE flow_kind='business_process' AND flow_id LIKE ?",('auth.%',))]
           theme=dict(db.execute("SELECT css_variable_name,token_value FROM theme_design_tokens WHERE theme_id=1 AND active=1").fetchall())
           policy={'flows':flows,'theme':theme,'authority':'pinned-production-postgresql'}
           for directory in ['auth-password','auth-password-baseline']:
            p=pathlib.Path('test-results')/directory;p.mkdir(parents=True,exist_ok=True);(p/'governance.json').write_text(json.dumps(policy,indent=2))
           print('CURRENT_AUTHORITY_BOUND '+str(len(flows)))
          PY
      - name: Replay original malformed-success failure
        env:
          LOGIN_BROWSER_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/login_browser
          AUTH_PASSWORD_BASELINE: '1'
        run: |
          cp websites/typescript/src/account.ts /tmp/candidate-account.ts
          git show 95099c874ca879d724a9414dfeffca0c57d4f059:websites/typescript/src/account.ts > websites/typescript/src/account.ts
          node scripts/test-auth-password-workflow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        id: baseline
        with:
          name: password-change-original-failure
          path: test-results/auth-password-baseline
          retention-days: 90
      - name: Record original failure before restoring candidate source
        if: steps.baseline.outcome == 'success'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          EVIDENCE_URL: ${{ steps.baseline.outputs.artifact-url }}
          ATTEMPT_MODE: baseline
          CANDIDATE_SHA: 656b7bbc543f6154ed8c54d10bb26483837341ab
        run: |
          python -u - <<'PY'
          import sys,json,pathlib,hashlib,os
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt
          root=pathlib.Path.cwd();baseline=os.environ['ATTEMPT_MODE']=='baseline';directory='auth-password-baseline' if baseline else 'auth-password'
          path='test-results/'+directory+'/results.json';p=root/path
          if not p.is_file():raise SystemExit('Executed receipt missing; no passing attempt can be recorded')
          r=json.loads(p.read_text())
          evidence=[{'kind':'browser','path':path,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']}]
          for v in sorted((root/'test-results'/directory).glob('*.webm')):evidence.append({'kind':'video','path':str(v.relative_to(root)),'sha256':hashlib.sha256(v.read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']})
          issues=[]
          if baseline and r.get('failures'):
           f=r['failures'][0];issues=[{k:f[k] for k in ['criterion_id','reproduction','expected','actual','affected_sources']}]
          elif not r.get('passed'):
           issues=[{'criterion_id':'execution.password-browser','reproduction':'Execute scripts/test-auth-password-workflow.mjs with isolated native PostgreSQL and current production definition.','expected':'All declared targeted password browser checks pass.','actual':r.get('error','No successful execution result.'),'affected_sources':['scripts/test-auth-password-workflow.mjs']}]
          result={'status':'implemented-unverified','test_status':'failed' if issues else 'scoped_pass','scope':'scoped','source_bindings':r['source_bindings'],'evidence':evidence,'issues':issues,'blockers':r['limitations'],'next_action':'Finish remaining registered actor/API/UI acceptance and reconcile current specification/source bindings; independent reviews and applicable release/PWA gates remain pending. Complete PR216 CI, merge and branch cleanup.'}
          with ProductionWorkflowStore() as db:
           if not baseline and r.get('passed'):
            found=db.execute("SELECT i.issue_id FROM virtual_workflow_issues i JOIN virtual_workflow_attempts a ON a.attempt_id=i.attempt_id WHERE a.flow_id=? AND i.criterion_id=? ORDER BY i.issue_id DESC LIMIT 1",('auth.change-password','ui.password-change-confirmation')).fetchone()
            if found:
             issue=found[0];result.update(resolves_issue_ids=[issue],resolution_note='Replayed malformed HTTP200 in EN/FR/ES; the registered confirmation is now required, sessions remain available for retry, and native database state is unchanged.',issue_resolution_results={str(issue):{'criterion_id':'ui.password-change-confirmation','result':'passed','reproduction_verified':True,'evidence_path':path}})
           saved=record_attempt(db,'auth.change-password',result,root)
           checkpoint={'workflow_id':'auth.change-password','attempt':saved,'candidate_sha':os.environ['CANDIDATE_SHA'],'main_sha':os.environ['GITHUB_SHA'],'active_branch':'work/auth-completion-20261020','pr':216,'merge_state':'pending CI and merge','evidence':os.environ['EVIDENCE_URL'],'test_result':result['test_status'],'exact_remaining_gates':r['limitations'],'synthetic_cleanup':r['cleanup'],'next_action':result['next_action']}
           db.execute('INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP',('auth-completion-current',json.dumps(checkpoint)))
          print('AUTH_PASSWORD_ATTEMPT_COMMITTED '+json.dumps(saved))
          PY
      - name: Restore candidate and run browser/native password acceptance
        if: always()
        env:
          LOGIN_BROWSER_DATABASE_URL: postgres://primecare:fixture-only@127.0.0.1:5432/login_browser
        run: |
          git checkout 656b7bbc543f6154ed8c54d10bb26483837341ab -- websites/typescript/src/account.ts
          node --test scripts/test-account-client.mjs scripts/test-auth-client.mjs scripts/test-session-signout-client.mjs
          node scripts/test-auth-password-workflow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        id: candidate
        with:
          name: password-change-candidate-browser-native
          path: test-results/auth-password
          retention-days: 90
      - name: Record exact current rerun and checkpoint
        if: always() && steps.candidate.outcome == 'success'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GOVERNANCE_WORKFLOW_WRITES: '1'
          EVIDENCE_URL: ${{ steps.candidate.outputs.artifact-url }}
          ATTEMPT_MODE: candidate
          CANDIDATE_SHA: 656b7bbc543f6154ed8c54d10bb26483837341ab
        run: |
          python -u - <<'PY'
          import sys,json,pathlib,hashlib,os
          sys.path.insert(0,'tools/workflow-verification')
          from production_store import ProductionWorkflowStore
          from execution import record_attempt
          root=pathlib.Path.cwd();baseline=os.environ['ATTEMPT_MODE']=='baseline';directory='auth-password-baseline' if baseline else 'auth-password'
          path='test-results/'+directory+'/results.json';p=root/path
          if not p.is_file():raise SystemExit('Executed receipt missing; no passing attempt can be recorded')
          r=json.loads(p.read_text())
          evidence=[{'kind':'browser','path':path,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']}]
          for v in sorted((root/'test-results'/directory).glob('*.webm')):evidence.append({'kind':'video','path':str(v.relative_to(root)),'sha256':hashlib.sha256(v.read_bytes()).hexdigest(),'url':os.environ['EVIDENCE_URL']})
          issues=[]
          if baseline and r.get('failures'):
           f=r['failures'][0];issues=[{k:f[k] for k in ['criterion_id','reproduction','expected','actual','affected_sources']}]
          elif not r.get('passed'):
           issues=[{'criterion_id':'execution.password-browser','reproduction':'Execute scripts/test-auth-password-workflow.mjs with isolated native PostgreSQL and current production definition.','expected':'All declared targeted password browser checks pass.','actual':r.get('error','No successful execution result.'),'affected_sources':['scripts/test-auth-password-workflow.mjs']}]
          result={'status':'implemented-unverified','test_status':'failed' if issues else 'scoped_pass','scope':'scoped','source_bindings':r['source_bindings'],'evidence':evidence,'issues':issues,'blockers':r['limitations'],'next_action':'Finish remaining registered actor/API/UI acceptance and reconcile current specification/source bindings; independent reviews and applicable release/PWA gates remain pending. Complete PR216 CI, merge and branch cleanup.'}
          with ProductionWorkflowStore() as db:
           if not baseline and r.get('passed'):
            found=db.execute("SELECT i.issue_id FROM virtual_workflow_issues i JOIN virtual_workflow_attempts a ON a.attempt_id=i.attempt_id WHERE a.flow_id=? AND i.criterion_id=? ORDER BY i.issue_id DESC LIMIT 1",('auth.change-password','ui.password-change-confirmation')).fetchone()
            if found:
             issue=found[0];result.update(resolves_issue_ids=[issue],resolution_note='Replayed malformed HTTP200 in EN/FR/ES; the registered confirmation is now required, sessions remain available for retry, and native database state is unchanged.',issue_resolution_results={str(issue):{'criterion_id':'ui.password-change-confirmation','result':'passed','reproduction_verified':True,'evidence_path':path}})
           saved=record_attempt(db,'auth.change-password',result,root)
           checkpoint={'workflow_id':'auth.change-password','attempt':saved,'candidate_sha':os.environ['CANDIDATE_SHA'],'main_sha':os.environ['GITHUB_SHA'],'active_branch':'work/auth-completion-20261020','pr':216,'merge_state':'pending CI and merge','evidence':os.environ['EVIDENCE_URL'],'test_result':result['test_status'],'exact_remaining_gates':r['limitations'],'synthetic_cleanup':r['cleanup'],'next_action':result['next_action']}
           db.execute('INSERT INTO virtual_flow_catalog_snapshots VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(name) DO UPDATE SET summary_json=excluded.summary_json,updated_at=CURRENT_TIMESTAMP',('auth-completion-current',json.dumps(checkpoint)))
          print('AUTH_PASSWORD_ATTEMPT_COMMITTED '+json.dumps(saved))
          PY
