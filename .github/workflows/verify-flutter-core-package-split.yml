name: Verify PrimeCare routing, theme, startup and communications migration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-flutter-core-package-split.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PC_SHA: 52edc3bae2b1c4f643a94016afd43eb70c9b28e4
  PC_TREE: aee8dd1dcf5f7f858ebce21a4de75a93c7a8b626
  PC_PARENT: eada65a896b614d164ddad70317739d4783bb6e0
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.PC_SHA }}', persist-credentials: false}
      - name: Assert exact candidate and package ownership
        run: |
          test "$(git rev-parse HEAD)" = "$PC_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PC_TREE"
          test "$(git cat-file commit HEAD | awk 'NF==0{exit} $1=="parent"{print $2}')" = "$PC_PARENT"
          python3 -m pip install PyYAML==6.0.3
          python3 tools/package_master/catalog.py --check
          node --test packages/primecare_package_base/test/registry.test.mjs
          for package in primecare_auth primecare_app_runtime primecare_navigation primecare_api_client primecare_preferences primecare_communications; do
            test -s "packages/$package/pubspec.yaml"
            if git grep -n 'package:flutter_core/\|\.\./flutter_core' -- "packages/$package/lib" "packages/$package/pubspec.yaml"; then
              echo "Unexpected legacy dependency in $package"
              exit 1
            fi
          done
  focused-packages:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        path: [primecare_auth, primecare_app_runtime, primecare_navigation, primecare_api_client, primecare_preferences, primecare_communications]
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.PC_SHA }}', persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - name: Analyze and test the package
        working-directory: packages/${{ matrix.path }}
        run: |
          test "$(git rev-parse HEAD)" = "$PC_SHA"
          if grep -q 'sdk: flutter' pubspec.yaml; then
            flutter pub get
            flutter analyze --no-pub lib test
            flutter test --no-pub
          else
            dart pub get
            dart analyze lib test
            dart test
          fi
  legacy-consumer:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.PC_SHA }}', persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - name: Verify legacy imports and auth regression suites
        working-directory: packages/flutter_core
        run: |
          test "$(git rev-parse HEAD)" = "$PC_SHA"
          flutter pub get
          flutter test --no-pub test/app_runtime_provider_ttl_compatibility_test.dart test/primecare_auth_compatibility_test.dart test/auth_interceptor_test.dart test/auth_mfa_test.dart test/auth_mfa_management_test.dart test/auth_privileged_access_test.dart test/auth_route_guard_test.dart test/auth_session_test.dart test/auth_transport_test.dart test/theme_center_settings_file_test.dart test/dio_communication_transport_test.dart test/communication_workspace_controller_test.dart
      - name: Compile the shared Flutter preview consumer
        working-directory: examples/kitchen_sink_flutter
        run: |
          flutter pub get
          flutter build web --no-pub --release --no-tree-shake-icons
          test -s build/web/main.dart.js
  app-build:
    needs: inventory
    name: Flutter web build (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        app: [primecare_business_development, primecare_client, primecare_clinic, primecare_corporate, primecare_enterprise_blueprint, primecare_franchise, primecare_governance, primecare_marketing, primecare_support]
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.PC_SHA }}', persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - name: Resolve exact app package graph
        working-directory: apps/${{ matrix.app }}
        run: |
          test "$(git rev-parse HEAD)" = "$PC_SHA"
          flutter pub get
      - if: matrix.app == 'primecare_enterprise_blueprint'
        name: Verify Blueprint theme and UI compatibility
        working-directory: apps/primecare_enterprise_blueprint
        run: |
          flutter test --no-pub test/widget_test.dart
      - if: matrix.app == 'primecare_client'
        name: Verify Client routing with the master navigation facade
        working-directory: apps/primecare_client
        run: |
          flutter test --no-pub test/auth_routing_test.dart
      - name: Compile the Flutter app; no deployment
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter build web --no-pub --release --no-tree-shake-icons --dart-define=API_BASE_URL=https://fixture.invalid
          test -s build/web/main.dart.js
          sha256sum build/web/main.dart.js
  detached-tooling:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.PC_SHA }}', persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.5', channel: stable, cache: true}
      - name: Prove the gallery and master do not resolve flutter_core
        run: |
          test "$(git rev-parse HEAD)" = "$PC_SHA"
          for p in packages/primecare_kitchen_sink packages/primecare_master; do
            (
              cd "$p"
              flutter pub get
              flutter pub deps --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert not any(x["name"]=="flutter_core" for x in d["packages"])'
            )
          done
          cd packages/primecare_kitchen_sink
          flutter test --no-pub
      - name: Analyze and compile the independent screenshot helper
        working-directory: tools/screenshots
        run: |
          dart pub get
          dart pub deps --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert not any(x["name"] in {"flutter", "flutter_core"} for x in d["packages"])'
          dart analyze regenerate_screenshots.dart
          dart compile kernel regenerate_screenshots.dart -o "$RUNNER_TEMP/regenerate-screenshots.dill"
