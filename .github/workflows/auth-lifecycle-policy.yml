name: Register pending auth lifecycle requirements
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auth-lifecycle-policy.yml
      - tools/governance-production/auth-lifecycle-policy.json
      - tools/governance-production/auth_lifecycle_policy.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auth-lifecycle-policy
  cancel-in-progress: false
jobs:
  register:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      GOVERNANCE_WORKFLOW_WRITES: '1'
      GOVERNANCE_AUTH_LIFECYCLE_POLICY_WRITES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install -r tools/governance-production/requirements.txt
          npm install --prefix "$RUNNER_TEMP/lifecycle-policy" --ignore-scripts pg@8.16.3
          ln -s "$RUNNER_TEMP/lifecycle-policy/node_modules" node_modules
          python tools/governance-production/auth_lifecycle_policy.py --dry-run
          python tools/governance-production/auth_lifecycle_policy.py --apply
